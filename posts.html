<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf7df"><title>みんなの防災投稿｜そなYELL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#eef8e9;color:#36563b}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid #d9ead4;padding:12px 14px;display:flex;align-items:center;gap:10px}.back{border:0;background:#edf7e9;color:#347341;border-radius:12px;padding:9px 12px;font-weight:800}.title{font-size:19px;font-weight:900;color:#26733d}.yell{margin-left:auto;background:#fff1a6;color:#725b20;border-radius:999px;padding:7px 10px;font-weight:900;font-size:13px}.wrap{max-width:720px;margin:0 auto;padding:16px 14px 34px}.hero{background:linear-gradient(135deg,#dff5d8,#fff3b8);border-radius:24px;padding:18px;margin-bottom:14px}.hero h1{font-size:22px;margin:0 0 7px;color:#26733d}.hero p{margin:0;font-size:13px;line-height:1.7}.form{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 14px #315c3720;margin-bottom:16px}.form input,.form textarea{width:100%;border:2px solid #dfebda;border-radius:14px;padding:12px;background:#fbfff9;outline:0}.form textarea{margin-top:8px;min-height:110px;resize:vertical}.mediaRow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.mediaBtn{display:inline-block;background:#edf7e9;color:#397a44;border-radius:13px;padding:10px 12px;font-weight:800;cursor:pointer}.mediaBtn input{display:none}.mediaName{font-size:12px;color:#68806b;flex:1}.postBtn{width:100%;border:0;border-radius:15px;margin-top:11px;padding:13px;background:#4e9956;color:#fff;font-weight:900}.postBtn:disabled{opacity:.55}.hint{font-size:11px;color:#718473;line-height:1.55;margin-top:8px}.list{display:grid;gap:12px}.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 3px 12px #315c3718}.meta{font-size:11px;color:#78907a}.card h2{font-size:16px;margin:7px 0;color:#397a44}.body{white-space:pre-wrap;font-size:14px;line-height:1.7}.media{margin-top:10px;border-radius:15px;overflow:hidden;background:#f2f5ef}.media img,.media video{display:block;width:100%;max-height:430px;object-fit:contain;background:#0000}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:0;border-radius:12px;padding:10px;background:#edf7e9;color:#4b7651;font-weight:800}.actions button.on{background:#fff1a6;color:#755c20}.empty{background:#fff;border-radius:18px;padding:24px;text-align:center;color:#68806b}.status{text-align:center;font-size:12px;color:#68806b;margin:8px 0 14px}</style></head><body><header class="top"><button class="back" onclick="location.href='./home.html?v=15'">← ホーム</button><div class="title">📣 みんなの防災投稿</div><div class="yell">YELL 🌟 <span id="yell">0</span></div></header><main class="wrap"><section class="hero"><h1>みんなの工夫が、だれかの備えになる。</h1><p>やってみたこと、気づいたこと、小さな工夫。写真や動画も添えて共有できるよ。</p></section><section class="form"><input id="title" maxlength="80" placeholder="タイトル（例：水の置き場所を変えました）"><textarea id="text" maxlength="500" placeholder="防災でやってみたこと・気づいたことを書いてね"></textarea><div class="mediaRow"><label class="mediaBtn">📷 写真・動画を選ぶ<input id="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></label><div id="mediaName" class="mediaName">添付なし</div></div><div class="hint">試作品では添付は1ファイル・30MBまで。写真/動画添付は登録ユーザーで利用できます。</div><button id="submit" class="postBtn">投稿する</button></section><div id="status" class="status">投稿を読み込み中…</div><section id="list" class="list"></section></main><script>
const U='https://illnptsvaieyacjajlfm.supabase.co';const K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';let token=localStorage.getItem('sonayell_access_token')||'';let guest=localStorage.getItem('sonayell_guest_token')||'';if(!guest){guest=crypto.randomUUID();localStorage.setItem('sonayell_guest_token',guest)}const $=id=>document.getElementById(id);function headers(){const h={apikey:K,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h}async function rpc(name,body={}){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}function localYell(){try{return Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0}catch(e){return 0}}function setYell(y){let s={};try{s=JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){}s.yell=Number(y)||0;localStorage.setItem('sonayell_v2',JSON.stringify(s));$('yell').textContent=s.yell}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}function date(s){try{return new Date(s).toLocaleDateString('ja-JP')}catch(e){return''}}function publicUrl(path){return U+'/storage/v1/object/public/sonayell-posts/'+String(path).split('/').map(encodeURIComponent).join('/')}async function load(){try{const [posts,media]=await Promise.all([rpc('sona_list_posts_v2',{p_guest_token:guest,p_limit:100}),rpc('sona_list_post_media',{})]);const mm={};(media||[]).forEach(x=>mm[x.id]=x);$('status').textContent=(posts||[]).length+'件の投稿';$('list').innerHTML=(posts||[]).length?(posts||[]).map(p=>{const m=mm[p.id];const mediaHtml=!m?'':m.media_type==='video'?`<div class="media"><video controls preload="metadata" src="${publicUrl(m.media_path)}"></video></div>`:`<div class="media"><img loading="lazy" src="${publicUrl(m.media_path)}" alt="投稿画像"></div>`;return `<article class="card"><div class="meta">${esc(p.avatar||'🌱')} ${esc(p.name||'ゲスト')}　${date(p.created_at)}</div><h2>${esc(p.title||'防災の工夫')}</h2><div class="body">${esc(p.text)}</div>${mediaHtml}<div class="actions"><button class="${p.liked?'on':''}" data-like="${p.id}">👍 いいね ${p.likes||0}</button><button class="${p.saved?'on':''}" data-save="${p.id}">🔖 保存 ${p.saves||0}</button></div></article>`}).join(''):'<div class="empty">🌱 まだ投稿はないよ。最初のひとつを投稿してみよう。</div>';bind()}catch(e){$('status').textContent='投稿を読み込めませんでした'}}function bind(){$('[x]');document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('sona_toggle_reaction_v2',{p_post_id:Number(b.dataset.like),p_guest_token:guest,p_kind:'like'});await load()}finally{b.disabled=false}});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('sona_toggle_reaction_v2',{p_post_id:Number(b.dataset.save),p_guest_token:guest,p_kind:'save'});await load()}finally{b.disabled=false}})}$('media').onchange=()=>{$('mediaName').textContent=$('media').files[0]?.name||'添付なし'};async function upload(file,postId){if(!token)throw Error('写真・動画は登録ユーザーで使えます');if(file.size>30*1024*1024)throw Error('30MBを超えています');const type=file.type.startsWith('video/')?'video':'image';const ext=(file.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'');const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;const r=await fetch(U+'/storage/v1/object/sonayell-posts/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!r.ok)throw Error(await r.text());await rpc('sona_attach_media_to_my_post',{p_post_id:postId,p_media_path:path,p_media_type:type})}$('submit').onclick=async()=>{const text=$('text').value.trim(),title=$('title').value.trim()||'防災の工夫',file=$('media').files[0];if(!text){alert('本文を書いてね');return}const btn=$('submit');btn.disabled=true;btn.textContent='投稿中…';try{let postId=null;if(token){const rows=await rpc('sona_create_my_post',{p_title:title,p_text:text});if(rows&&rows[0]){postId=rows[0].post_id;setYell(rows[0].yell)}}else{await rpc('sona_create_guest_post',{p_guest_token:guest,p_title:title,p_text:text,p_name:'ゲスト',p_avatar:'🌱'});setYell(localYell()+1)}if(file){if(!postId)throw Error('ゲスト投稿では添付できません');btn.textContent='画像・動画を送信中…';await upload(file,postId)}$('title').value='';$('text').value='';$('media').value='';$('mediaName').textContent='添付なし';await load();alert('🌱 投稿したよ！ みんなの投稿に反映しました。')}catch(e){alert('投稿できませんでした：'+e.message)}finally{btn.disabled=false;btn.textContent='投稿する'}};setYell(localYell());load();
</script></body></html>
