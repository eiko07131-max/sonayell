<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>みんなの防災投稿｜そなYELL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#eef8e9;color:#36563b}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid #d9ead4;padding:11px 13px;display:flex;align-items:center;gap:9px}.back{border:0;background:#edf7e9;color:#347341;border-radius:12px;padding:9px 11px;font-weight:900}.title{font-size:18px;font-weight:900;color:#26733d}.yell{margin-left:auto;background:#fff1a6;border-radius:999px;padding:7px 9px;font-weight:900;font-size:12px}.wrap{max-width:720px;margin:auto;padding:14px 13px 34px}.hero{background:#fff;border-radius:22px;padding:13px 14px;margin-bottom:12px;box-shadow:0 4px 13px #315c3714;display:flex;gap:10px;align-items:center}.hero img{width:60px;height:78px;object-fit:cover;object-position:center 12%;border-radius:14px}.hero h1{font-size:18px;margin:0 0 4px;color:#26733d}.hero p{margin:0;font-size:12px;line-height:1.55}.form{background:#fff;border-radius:22px;padding:15px;box-shadow:0 4px 14px #315c3720;margin-bottom:14px}.form input,.form textarea{width:100%;border:2px solid #dfebda;border-radius:14px;padding:11px;background:#fbfff9;outline:0}.form textarea{margin-top:8px;min-height:100px;resize:vertical}.mediaRow{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}.mediaBtn{display:inline-block;background:#edf7e9;color:#397a44;border-radius:13px;padding:9px 11px;font-weight:800}.mediaBtn input{display:none}.mediaName{font-size:11px;color:#68806b;flex:1}.postBtn{width:100%;border:0;border-radius:15px;margin-top:10px;padding:12px;background:#4e9956;color:#fff;font-weight:900}.hint{font-size:10.5px;color:#718473;line-height:1.5;margin-top:7px}.sort{display:flex;gap:7px;margin:3px 0 12px}.sort button{flex:1;border:1px solid #bcd5b7;background:#fff;border-radius:999px;padding:9px;color:#4b7651;font-weight:900}.sort button.on{background:#4e9956;color:#fff}.status{text-align:center;font-size:11px;color:#68806b;margin:7px 0 11px}.list{display:grid;gap:11px}.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 3px 12px #315c3718}.meta{font-size:11px;color:#78907a}.card h2{font-size:16px;margin:6px 0;color:#397a44}.body{white-space:pre-wrap;font-size:14px;line-height:1.65}.media{margin-top:9px;border-radius:15px;overflow:hidden;background:#f2f5ef}.media img,.media video{display:block;width:100%;max-height:430px;object-fit:contain}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;border:0;border-radius:12px;padding:9px;background:#edf7e9;color:#4b7651;font-weight:800}.actions button.on{background:#fff1a6;color:#755c20}.empty{background:#fff;border-radius:18px;padding:24px;text-align:center;color:#68806b}.leaf{position:fixed;top:-40px;z-index:99;pointer-events:none;font-size:27px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:.1}}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=83'">← ホーム</button><div class="title">📣 みんなの防災投稿</div><div class="yell">YELL ✨ <span id="yell">0</span></div></header><main class="wrap"><section class="hero"><img id="sona" alt="そなピー"><div><h1>みんなの工夫が、だれかの備えになる。</h1><p>📣 写真や動画も添えて、あなたの防災アイデアをシェアしよう！</p></div></section><section class="form"><input id="title" maxlength="80" placeholder="タイトル（例：水の置き場所を変えました）"><textarea id="text" maxlength="500" placeholder="防災でやってみたこと・気づいたことを書いてね"></textarea><div class="mediaRow"><label class="mediaBtn">📷 写真・動画を選ぶ<input id="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></label><div id="mediaName" class="mediaName">添付なし</div></div><div class="hint">添付は1ファイル・50MBまで。写真・動画の添付は登録ユーザーで利用できます。</div><button id="submit" class="postBtn">投稿する</button></section><div class="sort"><button id="newBtn" class="on">新着順</button><button id="recBtn">おすすめ順</button></div><div id="status" class="status">みんなの投稿を読み込み中…</div><section id="list" class="list"></section></main><script>fetch('assets/sonapi-official-b64.txt?v=1').then(r=>r.text()).then(x=>sona.src='data:image/webp;base64,'+x.trim()).catch(()=>{});const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';let token=localStorage.getItem('sonayell_access_token')||'',guest=localStorage.getItem('sonayell_guest_token')||'',sort='new';const trial=localStorage.getItem('sonayell_trial_mode')==='1';if(!guest){guest=crypto.randomUUID();localStorage.setItem('sonayell_guest_token',guest)}const $=id=>document.getElementById(id);function headers(withToken=true){const h={apikey:K,'Content-Type':'application/json'};if(withToken&&token)h.Authorization='Bearer '+token;return h}async function rpc(name,body={}){const url=U+'/rest/v1/rpc/'+name,opts=use=>({method:'POST',headers:headers(use),body:JSON.stringify(body),cache:'no-store'});let r=await fetch(url,opts(true));if(r.status===401&&token){token='';localStorage.removeItem('sonayell_access_token');localStorage.removeItem('sonayell_refresh_token');r=await fetch(url,opts(false))}if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function setYell(y){let s=app();s.yell=Number(y)||0;localStorage.setItem('sonayell_v2',JSON.stringify(s));$('yell').textContent=s.yell}function addLocalYell(n=1){let s=app();s.yell=(Number(s.yell)||0)+n;s.leaves=(Number(s.leaves)||0)+n;s.tree_growth=(Number(s.tree_growth)||0)+n;localStorage.setItem('sonayell_v2',JSON.stringify(s));$('yell').textContent=s.yell}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function date(s){try{return new Date(s).toLocaleDateString('ja-JP')}catch(e){return''}}function publicUrl(path){return U+'/storage/v1/object/public/sonayell-posts/'+String(path).split('/').map(encodeURIComponent).join('/')}async function load(){$('status').textContent='みんなの投稿を読み込み中…';try{const posts=await rpc('sona_list_posts_public_v3',{p_guest_token:guest,p_limit:100,p_sort:sort==='recommended'?'recommended':'new'});let media=[];try{media=await rpc('sona_list_post_media',{})||[]}catch(e){}const mm={};media.forEach(x=>mm[x.id]=x);$('status').textContent=(posts||[]).length+'件の投稿を表示中';$('list').innerHTML=(posts||[]).length?(posts||[]).map(p=>{const m=mm[p.id],mh=!m?'':m.media_type==='video'?'<div class="media"><video controls preload="metadata" src="'+publicUrl(m.media_path)+'"></video></div>':'<div class="media"><img loading="lazy" src="'+publicUrl(m.media_path)+'" alt="投稿画像"></div>';return '<article class="card"><div class="meta">'+esc(p.avatar||'🌱')+' '+esc(p.name||'ゲスト')+'　'+date(p.created_at)+'</div><h2>'+esc(p.title||'防災の工夫')+'</h2><div class="body">'+esc(p.text)+'</div>'+mh+'<div class="actions"><button class="'+(p.liked?'on':'')+'" data-like="'+p.id+'">👍 いいね '+(p.likes||0)+'</button><button class="'+(p.saved?'on':'')+'" data-save="'+p.id+'">🔖 保存 '+(p.saves||0)+'</button></div></article>'}).join(''):'<div class="empty">🌱 まだ投稿はないよ。最初のひとつを投稿してみよう。</div>';bind()}catch(e){$('status').textContent='投稿の読み込みに失敗しました。再読み込みしてね。';$('list').innerHTML='<div class="empty">通信を確認して、もう一度開いてみてね。</div>'}}function bind(){document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('sona_toggle_reaction_v2',{p_post_id:Number(b.dataset.like),p_guest_token:guest,p_kind:'like'});await load()}finally{b.disabled=false}});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('sona_toggle_reaction_v2',{p_post_id:Number(b.dataset.save),p_guest_token:guest,p_kind:'save'});await load()}finally{b.disabled=false}})}$('newBtn').onclick=()=>{sort='new';newBtn.classList.add('on');recBtn.classList.remove('on');load()};$('recBtn').onclick=()=>{sort='recommended';recBtn.classList.add('on');newBtn.classList.remove('on');load()};$('media').onchange=()=>mediaName.textContent=media.files[0]?.name||'添付なし';function jwtSub(){try{const part=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const obj=JSON.parse(atob(part));return obj.sub||''}catch(e){return''}}async function upload(file,postId){if(!token)throw Error('写真・動画は登録ユーザーで使えます');if(file.size>50*1024*1024)throw Error('50MBを超えています');const uid=jwtSub();if(!uid)throw Error('ログイン情報を確認できません。いったんログインし直してね');const type=file.type.startsWith('video/')?'video':'image',ext=(file.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,''),path=uid+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const r=await fetch(U+'/storage/v1/object/sonayell-posts/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!r.ok)throw Error(await r.text());await rpc('sona_attach_media_to_my_post',{p_post_id:postId,p_media_path:path,p_media_type:type})}$('submit').onclick=async()=>{const body=$('text').value.trim(),ttl=$('title').value.trim()||'防災の工夫',file=$('media').files[0];if(!body){alert('本文を書いてね');return}submit.disabled=true;submit.textContent='投稿中…';try{let postId=null;if(token){const rows=await rpc('sona_create_my_post',{p_title:ttl,p_text:body});if(rows&&rows[0]){postId=rows[0].post_id;if(trial)addLocalYell(1);else setYell(rows[0].yell)}}else{await rpc('sona_create_guest_post',{p_guest_token:guest,p_title:ttl,p_text:body,p_name:'ゲスト',p_avatar:'🌱'});addLocalYell(1)}if(file){if(!postId)throw Error('ゲスト投稿では添付できません');await upload(file,postId)}$('title').value='';$('text').value='';$('media').value='';mediaName.textContent='添付なし';for(let i=0;i<12;i++){let e=document.createElement('i');e.className='leaf';e.textContent='🍃';e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}await load();alert('🌱 投稿したよ！ ＋1 YELL')}catch(e){alert('投稿できませんでした：'+e.message)}finally{submit.disabled=false;submit.textContent='投稿する'}};setYell(app().yell||0);addEventListener('pageshow',()=>setYell(app().yell||0));load()</script></body></html>
