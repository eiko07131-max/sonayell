).disabled=true;try{const path=mode==='signup'?'/auth/v1/signup?redirect_to='+encodeURIComponent(RETURN_URL):'/auth/v1/token?grant_type=password';const r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),data=await r.json();if(!r.ok)throw Error(data.msg||data.error_description||data.message||'処理できませんでした');if(mode==='signup'){if(data.access_token)await claimAndEnter(data.access_token,data.refresh_token||'');else showMsg('確認メールを送りました。メールのリンクを押してね')}else await claimAndEnter(data.access_token,data.refresh_token||'')}catch(e){showMsg('うまく処理できませんでした：'+e.message,'err')}finally{$('submit').disabled=false}};setMode('signup');handleReturn();</script></body></html>
