<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dff6ea">
<title>そなYELL 登録・ログイン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#dff6ea}.stage{min-height:100svh;display:grid;place-items:center;padding:10px;background:linear-gradient(#d6f4f3,#edf9dd)}.poster{position:relative;width:min(100vw - 20px,75svh);aspect-ratio:3/4;background:#e7f7ee;overflow:hidden;box-shadow:0 12px 40px rgba(25,90,55,.18)}.posterImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.ctl{position:absolute;z-index:3;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:18px}.ctl:focus-visible{outline:4px solid #ffd85a;outline-offset:2px}.google{left:10.3%;top:36.3%;width:79.4%;height:7.6%}.signupTab{left:10.3%;top:55.0%;width:38.8%;height:7.1%}.loginTab{left:51%;top:55.0%;width:38.8%;height:7.1%}.submit{left:10.3%;top:85.2%;width:79.4%;height:7.4%}.field{position:absolute;z-index:4;left:10.3%;width:79.4%;height:6.3%;border:0;background:rgba(255,255,255,.02);outline:none;padding:0 20px;font:600 clamp(13px,2.1vw,19px)/1.2 inherit;color:#33453a;border-radius:16px}.field:focus{box-shadow:inset 0 0 0 3px rgba(15,139,69,.5);background:rgba(255,255,255,.18)}#email{top:66.1%}#password{top:76.9%;padding-right:86px}.pwToggle{position:absolute;z-index:5;right:10.5%;top:77.1%;height:5.9%;width:18%;border:0;background:transparent;color:transparent;cursor:pointer}.modeBadge{position:absolute;z-index:5;top:55%;height:7.1%;border:3px solid rgba(255,255,255,.0);pointer-events:none;border-radius:16px}.msg{position:absolute;z-index:8;left:8%;right:8%;bottom:1.2%;display:none;padding:8px 12px;border-radius:14px;text-align:center;font-weight:800;font-size:12px;background:#fff}.msg.on{display:block}.loading{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#e4f7eb;color:#0b6d38;font-weight:900}.back{position:fixed;left:12px;top:12px;z-index:20;border:0;border-radius:999px;background:rgba(255,255,255,.9);color:#17663a;padding:9px 14px;font-weight:900;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.12)}
@media(max-width:650px){.stage{padding:0}.poster{width:100vw;min-height:100svh;aspect-ratio:3/4;max-height:none}.back{top:max(8px,env(safe-area-inset-top));left:8px}}
</style>
</head>
<body>
<button class="back" id="backBtn">← 戻る</button>
<main class="stage"><section class="poster" aria-label="そなYELL 登録・ログイン画面">
<img id="posterImg" class="posterImg" alt="そなYELL 登録・ログイン">
<button id="googleLogin" class="ctl google" aria-label="Googleで続ける">Googleで続ける</button>
<button id="signupTab" class="ctl signupTab" aria-label="新規登録">新規登録</button>
<button id="loginTab" class="ctl loginTab" aria-label="ログイン">ログイン</button>
<input id="email" class="field" type="email" autocomplete="email" aria-label="メールアドレス">
<input id="password" class="field" type="password" minlength="6" autocomplete="current-password" aria-label="パスワード">
<button id="passwordToggle" class="pwToggle" aria-label="パスワードを表示">表示</button>
<button id="submit" class="ctl submit" aria-label="登録する">登録する</button>
<div id="msg" class="msg"></div><div id="loading" class="loading">そなYELLを準備中…</div>
</section></main>
<script>
const U='https://illnptsvaieyacjajlfm.supabase.co';
const K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';
const RETURN_URL='https://eiko07131-max.github.io/sonayell/login.html?from=email';
const GOOGLE_RETURN_URL='https://eiko07131-max.github.io/sonayell/enter.html';
const APP_URL='./enter.html?after_login=1&v=8';
let mode='signup'; const $=id=>document.getElementById(id);
(async()=>{try{const r=await fetch('./assets/login-approved-small-b64.txt?v=1',{cache:'no-store'});if(!r.ok)throw new Error(r.status);const b=(await r.text()).trim();const img=$('posterImg');img.onload=()=>{$('loading').style.display='none'};img.onerror=()=>{$('loading').textContent='ログイン画像の表示に失敗しました'};img.src='data:image/webp;base64,'+b}catch(e){$('loading').textContent='ログイン画像の読み込みに失敗しました'}})();
function showMsg(t,type='ok'){const m=$('msg');m.textContent=t;m.className='msg on';m.style.color=type==='err'?'#9b2c2c':'#215c35'}
function setMode(m){mode=m;$('submit').setAttribute('aria-label',m==='signup'?'登録する':'ログインする');$('signupTab').style.boxShadow=m==='signup'?'inset 0 0 0 4px rgba(255,255,255,.9)':'none';$('loginTab').style.boxShadow=m==='login'?'inset 0 0 0 4px rgba(16,137,67,.55)':'none';}
$('signupTab').onclick=()=>setMode('signup');$('loginTab').onclick=()=>setMode('login');$('backBtn').onclick=()=>location.href='./trial.html?v=5';
$('passwordToggle').onclick=()=>{const p=$('password');const show=p.type==='password';p.type=show?'text':'password';$('passwordToggle').setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示')};
$('googleLogin').onclick=()=>{window.top.location.href=U+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(GOOGLE_RETURN_URL)};
async function claimAndEnter(accessToken,refreshToken=''){if(!accessToken){showMsg('ログイン情報を受け取れませんでした','err');return}localStorage.setItem('sonayell_access_token',accessToken);if(refreshToken)localStorage.setItem('sonayell_refresh_token',refreshToken);localStorage.setItem('sonayell_registered','1');const gt=localStorage.getItem('sonayell_guest_token');let s={};try{s=JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){}try{await fetch(U+'/rest/v1/rpc/sona_claim_guest_data',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({p_guest_token:gt||null,p_guest_yell:s.yell||0})})}catch(e){}location.replace(APP_URL)}
async function handleReturn(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const access=h.get('access_token'),refresh=h.get('refresh_token')||'',err=h.get('error_description')||h.get('error');if(err){showMsg('メール確認でエラーが出ました','err');return}if(access){history.replaceState(null,'',location.pathname+'?from=email');await claimAndEnter(access,refresh)}}
$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){showMsg('メールアドレスと6文字以上のパスワードを入力してね','err');return}localStorage.setItem('sonayell_last_email',email);try{const path=mode==='signup'?'/auth/v1/signup?redirect_to='+encodeURIComponent(RETURN_URL):'/auth/v1/token?grant_type=password';const r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'処理できませんでした');if(mode==='signup'){if(data.access_token)await claimAndEnter(data.access_token,data.refresh_token||'');else showMsg('確認メールを送りました。メールのリンクを押してね')}else await claimAndEnter(data.access_token,data.refresh_token||'')}catch(e){showMsg('うまく処理できませんでした：'+e.message,'err')}};
const last=localStorage.getItem('sonayell_last_email');if(last)$('email').value=last;setMode('signup');handleReturn();
</script>
</body>
</html>
