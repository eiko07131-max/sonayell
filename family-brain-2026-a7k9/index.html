<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家族用 脳トレ</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(#eef8e8,#fff8e8);min-height:100vh;display:grid;place-items:center}.card{width:min(420px,90vw);background:white;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 12px 35px #0002}h1{font-size:1.55rem}input,button{box-sizing:border-box;width:100%;font-size:1.35rem;padding:14px;border-radius:16px}input{border:2px solid #d9d1c8;text-align:center;letter-spacing:.25em}button{margin-top:12px;border:0;background:#78b985;color:white;font-weight:900}#err{color:#c65353;font-weight:800;min-height:1.6em;margin-top:10px}</style></head><body><div class="card"><div style="font-size:52px">🧠💚</div><h1>家族用 脳トレ</h1><p>暗証番号を入力してください</p><input id="pin" inputmode="numeric" maxlength="4"><button id="go">開く</button><div id="err"></div></div><script>
const SALT='6iOoWw7kuprcxSzf/T83/Q==',IV='m+Q6uFDzavC1Mjrr',FILES=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt','payload-09.txt','payload-10.txt','payload-11.txt','payload-12.txt','payload-13.txt','payload-14.txt','payload-15.txt'];
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function b64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return b64(s)}
async function openApp(){try{const pin=document.getElementById('pin').value,m=location.hash.match(/(?:^#|&)k=([^&]+)/);if(!m)throw 0;document.getElementById('err').textContent='読み込み中…';const secret=b64url(m[1]),p=new TextEncoder().encode(pin),mat=new Uint8Array(p.length+secret.length);mat.set(p);mat.set(secret,p.length);const base=await crypto.subtle.importKey('raw',mat,'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);let all='';for(const f of FILES)all+=await (await fetch(f,{cache:'no-store'})).text();const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(all));const ds=new DecompressionStream('gzip'),html=await new Response(new Blob([gz]).stream().pipeThrough(ds)).text();sessionStorage.setItem('brainFamilyUnlockedV1','1');document.open();document.write(html);document.close();}catch(e){document.getElementById('err').textContent=(document.getElementById('pin').value==='2026'?'開けませんでした。家族用リンクを確認してください':'暗証番号が違います');}}
go.onclick=openApp;pin.onkeydown=e=>{if(e.key==='Enter')openApp()};</script></body></html>
