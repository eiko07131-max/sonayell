</style></head><body><main class="app"><header class="top"><button class="back" onclick="history.back()">‹</button><div class="title">イマココ 地図テスト</div><div class="mode">🧪 TEST OPEN</div></header><section class="hero"><div class="query"><span style="font-size:23px">🔎</span><div><b>近くのガソリンスタンド</b><div class="sub">行政区をまたいで、現在地周辺から探します。</div></div></div><div class="controls"><button id="locate" class="locbtn">📍 現在地から探す</button><select id="radius" class="radius"><option value="3000">3km</option><option value="5000" selected>5km</option><option value="8000">8km</option></select></div><div class="privacy">🔒 現在地は周辺検索にだけ使い、そなYELLには保存しません。</div></section><section class="mapwrap"><div id="mapstatus" class="mapstatus">地図を準備しています…</div><div id="map"></div><div class="legend"><div class="leg"><span class="dot" style="background:#2e78d2"></span>情報あり</div><div class="leg"><span class="dot" style="background:#e6a713"></span>状況変更あり</div><div class="leg"><span class="dot" style="background:#8a8f8b"></span>情報なし</div><div class="leg"><span class="dot" style="background:#d7443f"></span>危険</div></div></section><div class="help"><b>ピンを1回タップ</b>すると店名と状況だけ表示。<b>「詳細を見る」</b>で住所とイマココ情報を開きます。</div></main><div id="sheetback" class="sheetback"><section id="sheet" class="sheet"><div class="sheethead"><div id="stationicon" class="stationicon">⛽</div><div class="stationtitle"><b id="stationname">ガソリンスタンド</b><small id="stationmeta"></small></div><button id="closeSheet" class="close">×</button></div><div id="statecard" class="statecard"></div><div class="sectiontitle">💬 この場所のイマココ情報</div><div id="postlist"></div><div class="sectiontitle">✏️ この場所の今を投稿する</div><div class="postform"><label class="field">あなたの表示名（ニックネーム）<input id="postname" class="input" maxlength="30" placeholder="例：えーさん"></label><div class="quick"><button class="chip" data-text="営業中で、給油できました。">営業中・給油可</button><button class="chip" data-text="今は少し並んでいます。">少し並んでいる</button><button class="chip" data-text="かなり並んでいます。">かなり混雑</button><button class="chip" data-text="今は給油できないようです。">給油できない</button></div><label class="field">今の状況<textarea id="postmsg" class="textarea" maxlength="280" placeholder="例：10:30時点で給油できます。10台くらい並んでいます。"></textarea></label><button id="postbtn" class="postbtn">この内容で投稿する</button><div class="smallnote">⚠️ 地域投稿・未確認として表示。ガソリン情報は4時間で自動終了。</div></div></section></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',REGION='saitama-map-test';let token=localStorage.getItem('imakoko_test_guest');if(!token){token=crypto.randomUUID();localStorage.setItem('imakoko_test_guest',token)}const $=id=>document.getElementById(id);let center=[35.871,139.683],stations=[],posts=[],replies=[],selected=null,markers=[],userMarker=null,openThreads=new Set();const map=L.map('map').setView(center,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function rpc(n,b){const r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(b||{}),cache:'no-store'});const t=await r.text();if(!r.ok)throw Error(t||r.status);return t?JSON.parse(t):null}function jpTime(iso){const d=new Date(iso),p=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),g=t=>p.find(x=>x.type===t)?.value||'';return `${Number(g('month'))}月${Number(g('day'))}日 ${g('hour')}時${g('minute')}分`}function remain(iso){const m=Math.max(0,Math.ceil((new Date(iso)-Date.now())/60000));return m<60?`あと約${m}分`:`あと約${Math.ceil(m/60)}時間`}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}function status(m,h=false){$('mapstatus').textContent=m;$('mapstatus').classList.toggle('hide',h)}function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,d1=r(c-a),d2=r(d-b),s=Math.sin(d1/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(s))}function stationPosts(s){return posts.filter(p=>p.category==='gas'&&p.place_key===s.key)}function dangerNear(s){return posts.some(p=>p.category==='road'&&dist(s.lat,s.lon,p.latitude,p.longitude)<=150)}function stateOf(s){const ps=stationPosts(s);if(dangerNear(s))return{key:'danger',label:'危険',color:'#d7443f',emoji:'🔴'};if(ps.some(p=>Number(p.change_count)>0))return{key:'changed',label:'状況変更あり',color:'#e6a713',emoji:'🟡'};if(ps.length)return{key:'info',label:'情報あり',color:'#2e78d2',emoji:'🔵'};return{key:'none',label:'情報なし',color:'#8a8f8b',emoji:'⚪'}}function pinIcon(st){return L.divIcon({className:'',iconSize:[42,42],iconAnchor:[20,40],html:`<div class="fuelpin" style="background:${st.color}"><span>⛽</span></div>`})}async function loadData(){try{[posts,replies]=await Promise.all([rpc('imakoko_test_list_map_posts',{p_region_key:REGION,p_guest_token:token}),rpc('imakoko_test_list_replies_v2',{p_region_key:REGION,p_guest_token:token})]);posts=posts||[];replies=replies||[]}catch(e){posts=[];replies=[]}}async function overpass(lat,lon,radius){const q=`[out:json][timeout:20];(node["amenity"="fuel"](around:${radius},${lat},${lon});way["amenity"="fuel"](around:${radius},${lat},${lon});relation["amenity"="fuel"](around:${radius},${lat},${lon}););out center tags;`;for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});if(r.ok)return await r.json()}catch(e){}}throw Error('OVERPASS')}function parseStations(data){return (data.elements||[]).map(e=>{const t=e.tags||{},lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;if(lat==null||lon==null)return null;const name=t.name||t.brand||t.operator||'ガソリンスタンド';const address=t['addr:full']||[t['addr:postcode'],t['addr:province'],t['addr:city'],t['addr:ward'],t['addr:suburb'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ');return{key:`osm:${e.type}/${e.id}`,name,brand:t.brand||'',lat,lon,address:address||'住所情報なし（地図上の位置を確認）'}}).filter(Boolean).slice(0,100)}function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[]}function miniPopup(s){const st=stateOf(s),node=document.createElement('div');node.className='mini';node.innerHTML=`<b>${esc(s.name)}</b><div class="ministate">${st.emoji} ${st.label}</div><button class="detailbtn">詳細を見る ＞</button>`;node.querySelector('button').onclick=()=>openStation(s);return node}function drawMarkers(){clearMarkers();stations.forEach(s=>{const st=stateOf(s),m=L.marker([s.lat,s.lon],{icon:pinIcon(st)}).addTo(map);m.on('click',()=>L.popup({closeButton:true,offset:[0,-28]}).setLatLng([s.lat,s.lon]).setContent(miniPopup(s)).openOn(map));markers.push(m)})}async function searchAround(lat,lon){center=[lat,lon];map.setView(center,13);status('周辺のガソリンスタンドを探しています…');try{await loadData();stations=parseStations(await overpass(lat,lon,Number($('radius').value)));drawMarkers();if(stations.length)map.fitBounds(L.latLngBounds(stations.map(s=>[s.lat,s.lon])).pad(.08),{maxZoom:14});status(`${stations.length}件を表示しています`);setTimeout(()=>status('',true),2200)}catch(e){status('周辺情報を取得できませんでした。')}}function showUser(lat,lon){if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([lat,lon],{icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:'<div class="userdot"></div>'})}).addTo(map)}$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{showUser(p.coords.latitude,p.coords.longitude);searchAround(p.coords.latitude,p.coords.longitude)},()=>searchAround(center[0],center[1]),{enableHighAccuracy:true,timeout:9000}):toast('現在地機能に対応していません');$('radius').onchange=()=>searchAround(center[0],center[1]);function repliesFor(id){return replies.filter(r=>r.post_id===id)}function renderState(){const st=stateOf(selected),ps=stationPosts(selected);$('stationicon').style.background=st.color;$('stationname').textContent=selected.name;$('stationmeta').textContent='📍 '+selected.address;$('statecard').innerHTML=`<span class="statebadge ${st.key}">${st.emoji} ${st.label}</span><div style="margin-top:8px;font-size:11px;color:#66766b">${ps.length?`公開中の投稿 ${ps.length}件。投稿時刻と確認人数も見て判断してください。`:'この場所には、まだ公開中のイマココ投稿がありません。'}</div>`}function replyHtml(p){const rs=repliesFor(p.id),open=openThreads.has(p.id);return `<button class="replytoggle" data-thread="${p.id}">💬 返信を見る・書く（${rs.length}件）</button><div class="thread ${open?'open':''}"><div class="replies">${rs.length?rs.map(r=>`<div class="rrow ${r.owned_by_me?'mine':'other'}"><div class="rmeta"><b>${esc(r.nickname)}</b>${r.owned_by_me?'<span class="you">あなた</span>':''}　${jpTime(r.created_at)}</div><div class="bubble">${esc(r.message)}</div></div>`).join(''):'<div class="empty">まだ返信はありません。</div>'}</div><div class="replyform"><h4>✏️ この投稿に返信する</h4><label class="field">あなたの表示名<input id="rn-${p.id}" class="input" value="${esc(localStorage.getItem('imakoko_test_nickname')||'')}"></label><label class="field">返信内容<textarea id="rm-${p.id}" class="textarea"></textarea></label><button class="send" data-reply="${p.id}">この内容で返信する</button></div></div>`}function renderPosts(){const ps=stationPosts(selected).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(!ps.length){$('postlist').innerHTML='<div class="empty">まだ投稿はありません。</div>';return}$('postlist').innerHTML=ps.map(p=>`<article class="post"><div class="postmsg">${esc(p.message)}</div><div class="postmeta">🕒 ${jpTime(p.created_at)}　投稿者：${esc(p.nickname)}<br>⌛ ${remain(p.expires_at)}で自動終了</div><div class="counts"><span class="count">👥 現地確認 ${Number(p.confirm_count)||0}人</span>${Number(p.change_count)?`<span class="count warn">🔄 状況変更 ${Number(p.change_count)}人</span>`:''}</div><div class="postactions"><button class="act" data-confirm="${p.id}" ${p.confirmed_by_me?'disabled':''}>${p.confirmed_by_me?'✓ 確認済み':'👍 まだ同じ状況'}</button><button class="act changed" data-change="${p.id}" ${p.changed_by_me?'disabled':''}>${p.changed_by_me?'✓ 変更連絡済み':'🔄 状況が変わった'}</button></div>${replyHtml(p)}</article>`).join('');bindDetail()}function renderSheet(){renderState();renderPosts();$('postname').value=localStorage.getItem('imakoko_test_nickname')||'';$('postmsg').value=''}function openStation(s){selected=s;map.closePopup();renderSheet();$('sheetback').classList.add('show');requestAnimationFrame(()=>{$('sheet').scrollTop=0})}$('closeSheet').onclick=()=>$('sheetback').classList.remove('show');$('sheetback').onclick=e=>{if(e.target===$('sheetback'))$('sheetback').classList.remove('show')};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('postmsg').value=b.dataset.text});function bindDetail(){document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{const id=b.dataset.thread;openThreads.has(id)?openThreads.delete(id):openThreads.add(id);renderPosts()});document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=async()=>{await rpc('imakoko_test_confirm_post',{p_post_id:b.dataset.confirm,p_guest_token:token});toast('✅ 現地確認に反映しました');await refreshAll()});document.querySelectorAll('[data-change]').forEach(b=>b.onclick=async()=>{await rpc('imakoko_test_change_post',{p_post_id:b.dataset.change,p_guest_token:token});toast('🔄 状況変更に反映しました');await refreshAll()});document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>sendReply(b.dataset.reply))}async function refreshAll(){await loadData();drawMarkers();if(selected)renderSheet()}async function sendReply(id){const n=$('rn-'+id).value.trim(),m=$('rm-'+id).value.trim();if(!n||!m)return toast('表示名と返信内容を入力してね');await rpc('imakoko_test_add_reply',{p_post_id:id,p_guest_token:token,p_nickname:n,p_message:m});localStorage.setItem('imakoko_test_nickname',n);openThreads.add(id);toast('✅ 返信しました！');await refreshAll()}$('postbtn').onclick=async()=>{if(!selected)return;const n=$('postname').value.trim(),m=$('postmsg').value.trim();if(!n||!m)return toast('表示名と今の状況を入力してね');await rpc('imakoko_test_add_map_post',{p_guest_token:token,p_nickname:n,p_category:'gas',p_place:selected.name,p_message:m,p_place_key:selected.key,p_latitude:selected.lat,p_longitude:selected.lon,p_region_key:REGION});localStorage.setItem('imakoko_test_nickname',n);toast('✅ 投稿しました！');await refreshAll();$('postmsg').value=''};(async()=>{await searchAround(center[0],center[1])})();
