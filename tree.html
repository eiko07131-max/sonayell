remain=shown===50?0:50-shown;document.getElementById('next').innerHTML='次の大樹になるまで　<strong>あと '+remain+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=35?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}loadArt();render();addEventListener('storage',render)</script></body></html>
