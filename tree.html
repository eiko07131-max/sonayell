gn:center;padding:13px 0 2px;font-weight:800}.grown strong{font-size:28px;color:#07813a}.sonaBubble{display:flex;gap:14px;align-items:center;margin:16px 16px 0;padding:12px 14px;background:#fff;border:1px solid #f0dfc4;border-radius:24px}.sonaBubble img{width:92px;height:112px;object-fit:cover;object-position:center 12%;border-radius:18px;background:#e8f8df}.sonaBubble b{font-size:18px;color:#245a35}.sonaBubble span{font-size:16px;line-height:1.7;color:#273c2d}.tip{margin:14px 16px 0;padding:11px 14px;border-radius:999px;background:#f2f8e9;text-align:center;color:#397248;font-weight:800;font-size:13px}@media(max-width:390px){.treeArt{width:44%;bottom:13%}.sonaBubble img{width:78px;height:98px}.sonaBubble b{font-size:16px}.sonaBubble span{font-size:14px}}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=71'">‹ 戻る</button><div class="title">私のYELLの木</div><div class="help">?</div></header><main class="wrap"><section class="world"><img id="forestBg" class="forestBg" alt="森の仲間たち"><div id="treeArt" class="treeArt"></div><div id="stage" class="stage"></div></section><section class="panel"><h2>成長中のYELLの木</h2><div class="meter"><span id="bar"></span></div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数　<strong id="grown">0</strong>本</div></section><div class="sonaBubble"><img id="sona" alt="そなピー"><div><b>そなピーからYELL！</b><br><span id="cheer"></span></div></div><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div></main><script>Promise.all([fetch('assets/forest-friends-b64.txt?v=71',{cache:'no-store'}).then(r=>r.text()),fetch('assets/sonapi-official-b64.txt?v=1',{cache:'no-store'}).then(r=>r.text())]).then(([bg,sp])=>{forestBg.src='data:image/webp;base64,'+bg.trim();sona.src='data:image/webp;base64,'+sp.trim()});function read(){try{return Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0}catch(e){return 0}}function level(n){if(n>=50)return[7,'大樹に成長したよ！ 🌳'];if(n>=45)return[6,'立派な大樹が見えてきた！ 🌿'];if(n>=35)return[5,'もうすぐ大樹になりそう！ 🌳'];if(n>=28)return[4,'ぐんぐん成長しているよ！ 🍃'];if(n>=13)return[3,'小さな木になったよ！ 🌱'];if(n>=7)return[2,'葉っぱが増えてきたよ！ 🍃'];if(n>=5)return[1,'少しずつ育ってきたよ！ 🌱'];if(n>=3)return[0,'小さな芽が出たよ！ 🌱'];return[0,'もう少しで芽が出るよ 🌱']}function svgTree(st,flower,fruit){let cfg=[['#86c63f',2,1],['#82c53d',4,.78],['#77bd3b',7,.86],['#68b238',12,.96],['#57a339',18,1.06],['#4c9637',24,1.14],['#408a35',30,1.22],['#367f33',36,1.28]][st]||['#57a339',18,1];let count=cfg[1],scale=cfg[2],leaf=[];for(let i=0;i<count;i++){let a=i*2.399,r=20+((i*17)%62),x=110+Math.cos(a)*r*.76,y=107+Math.sin(a)*r*.52-((i%4)*4),rx=17+((i*5)%12),ry=12+((i*3)%8),cols=['#b7df58','#99cf48','#78bd3c','#5aa63a','#3f8f35'];leaf.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx}" ry="${ry}" fill="${cols[i%5]}" transform="rotate(${(i*29)%180} ${x} ${y})"/>`)}let blooms=flower?'<g font-size="18"><text x="74" y="83">🌼</text><text x="124" y="68">🌸</text><text x="151" y="111">🌼</text><text x="96" y="128">🌸</text></g>':'';let fruits=fruit?'<g font-size="18"><text x="70" y="112">🍎</text><text x="132" y="92">🍊</text><text x="149" y="134">🍎</text><text x="105" y="72">🍊</text></g>':'';if(st===0)return `<svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg" style="transform:scale(${scale});transform-origin:50% 100%"><ellipse cx="110" cy="236" rx="43" ry="10" fill="#477a2d" opacity=".16"/><path d="M110 227 C109 205 109 185 110 164" stroke="#7b5a2e" stroke-width="7" stroke-linecap="round"/><ellipse cx="91" cy="166" rx="33" ry="16" fill="#9bd246" transform="rotate(25 91 166)"/><ellipse cx="132" cy="145" rx="35" ry="17" fill="#69b63a" transform="rotate(-28 132 145)"/></svg>`;return `<svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg" style="transform:scale(${scale});transform-origin:50% 100%"><ellipse cx="110" cy="235" rx="67" ry="12" fill="#477a2d" opacity=".16"/><path d="M98 230 C102 198 102 166 100 136 C90 158 79 174 61 184" fill="none" stroke="#71451f" stroke-width="17" stroke-linecap="round"/><path d="M111 231 C112 195 113 156 112 116" fill="none" stroke="#9a622f" stroke-width="26" stroke-linecap="round"/><path d="M112 165 C130 149 147 137 162 120" fill="none" stroke="#805027" stroke-width="14" stroke-linecap="round"/>${leaf.join('')}<path d="M103 225 C106 193 106 159 104 128" stroke="#d49a4f" stroke-width="5" opacity=".6" stroke-linecap="round"/>${blooms}${fruits}</svg>`}function render(){let y=Math.max(0,read()),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,[st,label]=level(shown);document.getElementById('grown').textContent=grown;bar.style.width=(shown/50*100)+'%';stage.textContent=label;let likes=Number(localStorage.getItem('sonayell_like_count')||0),saves=Number(localStorage.getItem('sonayell_save_count')||0);treeArt.innerHTML=svgTree(st,shown>=45&&saves>=10,shown>=45&&likes>=20);let remain=shown===50?0:50-shown;next.innerHTML='次の大樹になるまで　<strong>あと '+remain+'YELL！</strong>';cheer.textContent=shown>=35?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}render();window.addEventListener('storage',render)</script></body></html>
