.getElementById('grown').textContent=grown;bar.style.width=p+'%';document.querySelectorAll('.treeStage').forEach(g=>g.classList.remove('on'));const [key,label]=stageKey(shown);document.getElementById(key).classList.add('on');stage.textContent=label;const left=shown===50?50:50-shown;remain.innerHTML='次の大樹まで、あと <strong>'+left+'</strong> YELL';cheer.textContent=shown>=35?'もうすぐ大樹！その調子でコツコツYELLを続けよう！':'今日の一歩も、ちゃんと木の力になってるよ。';const treeArea=document.getElementById('treeArea');treeArea.classList.remove('showFlowers','showFruit');special.classList.remove('show');special.textContent='';if(shown>=45&&shown<50&&token){try{const rows=await rpc('sona_my_tree_special_counts',{}),r=Array.isArray(rows)?rows[0]:rows,likes=Number(r?.likes_count||0),saves=Number(r?.saves_count||0);if(saves>=10)treeArea.classList.add('showFlowers');if(likes>=20)treeArea.classList.add('showFruit');if(saves>=10||likes>=20){special.classList.add('show');special.textContent=saves>=10&&likes>=20?'🌸🍊 保存10・いいね20達成！ 花と実がついた特別なYELLの木！':saves>=10?'🌸 保存10達成！ お花が咲いたよ！':'🍊 いいね20達成！ 実がなったよ！'}}catch(e){}}}render();addEventListener('pageshow',render);addEventListener('storage',render)</script></body></html>
