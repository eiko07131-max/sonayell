er-radius:50%;background:#ffd34c;box-shadow:0 0 0 10px #ffd34c20;display:grid;place-items:center;font-size:25px}.sun:after{content:"☀";color:#ffb51f;font-size:66px;position:absolute;inset:-7px}.hills{position:absolute;left:-8%;right:-8%;bottom:80px;height:145px;background:radial-gradient(ellipse at 18% 100%,#a8d67b 0 47%,transparent 49%),radial-gradient(ellipse at 52% 100%,#c7e794 0 49%,transparent 51%),radial-gradient(ellipse at 88% 100%,#9fd371 0 48%,transparent 50%)}.flowers{position:absolute;left:0;right:0;bottom:60px;height:95px;background-image:radial-gradient(circle,#fff 0 3px,transparent 4px),radial-gradient(circle,#ffd65a 0 3px,transparent 4px),radial-gradient(circle,#ff9fb4 0 3px,transparent 4px);background-size:55px 48px,73px 57px,91px 62px;background-position:5px 5px,20px 16px,42px 3px;opacity:.9}.treeWrap{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);width:250px;height:270px;transform-origin:50% 100%;transition:.45s}.trunk{position:absolute;left:50%;bottom:0;width:56px;height:125px;transform:translateX(-50%);background:linear-gradient(90deg,#8c552d,#b6783d 50%,#86502b);border-radius:25px 25px 12px 12px;box-shadow:inset -7px 0 #75442630}.branch{position:absolute;bottom:84px;width:75px;height:18px;background:#92582f;border-radius:20px;transform-origin:0 50%}.branch.l{left:113px;transform:rotate(205deg)}.branch.r{left:132px;transform:rotate(-25deg)}.crown{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:212px;height:165px}.leafBlob{position:absolute;border-radius:50%;background:linear-gradient(145deg,#99d443,#58a63f);box-shadow:inset -8px -8px #3f8a3430}.b1{width:118px;height:112px;left:47px;top:5px}.b2{width:95px;height:92px;left:5px;top:52px}.b3{width:100px;height:96px;right:3px;top:48px}.b4{width:100px;height:90px;left:55px;bottom:0}.treeSpark{position:absolute;inset:0;pointer-events:none}.treeSpark span{position:absolute;display:none}.treeWrap.flowersOn .flower,.treeWrap.fruitOn .fruit{display:block}.flower{font-size:22px}.fruit{font-size:23px}.f1{left:48px;top:76px}.f2{right:49px;top:54px}.f3{left:95px;top:23px}.f4{right:82px;top:100px}.r1{left:62px;top:62px}.r2{right:55px;top:82px}.r3{left:109px;top:36px}.r4{right:94px;top:112px}.friends{position:absolute;left:12px;right:12px;bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;z-index:5;pointer-events:none}.friend{filter:drop-shadow(0 3px 2px #315c3730);line-height:1}.bear{font-size:56px}.hedgehog{font-size:43px}.squirrel{font-size:44px}.rabbit{font-size:49px}.bird{font-size:39px}.deer{font-size:50px}.mushroom{font-size:28px;margin-right:-2px}.stage{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;z-index:7;min-width:245px;max-width:82%;background:#ffffffea;border-radius:999px;padding:9px 16px;font-weight:900;color:#287b43;font-size:16px;box-shadow:0 4px 12px #315c3715}.sonaBubble{display:flex;gap:11px;align-items:center;text-align:left;background:linear-gradient(135deg,#eff9e9,#fbfff8);border-radius:20px;padding:11px 13px;margin-top:13px}.sonaIcon{width:62px;height:72px;flex:0 0 62px;border-radius:18px;background:#e7f7df;position:relative;overflow:hidden}.sonaHead{position:absolute;left:10px;top:12px;width:42px;height:42px;border-radius:50%;background:white;border:4px solid #2e9b4f}.sonaHead:before,.sonaHead:after{content:"";position:absolute;top:-18px;width:23px;height:14px;background:#64ad42;border:3px solid #237e38;border-radius:100% 0 100% 0}.sonaHead:before{left:5px;transform:rotate(35deg)}.sonaHead:after{right:4px;transform:scaleX(-1) rotate(35deg)}.sonaFace{position:absolute;inset:7px 0 0;font-size:15px;text-align:center}.sonaBody{position:absolute;left:12px;right:12px;bottom:4px;height:26px;border-radius:14px 14px 8px 8px;background:#169548}.megaphone{position:absolute;right:1px;bottom:17px;font-size:23px;transform:rotate(-14deg)}.sonaBubble b{color:#218044;font-size:14px}.sonaBubble span{font-size:14px;line-height:1.65;color:#526a57}.meter{height:12px;background:#e4efdf;border-radius:99px;overflow:hidden;margin-top:15px}.meter span{display:block;height:100%;background:linear-gradient(90deg,#52b95f,#8fd15c);transition:width .5s}.numbers{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;font-weight:800;color:#647b68}.remain{margin-top:14px;padding:14px;border-radius:18px;background:#f5faef;font-size:14px}.remain strong{font-size:26px;color:#ef8b37}.grown{margin-top:12px;font-weight:900;color:#397a44}.note{margin-top:13px;background:#fff5bd;border-radius:17px;padding:13px;font-size:12px;line-height:1.7;color:#705f2e}.homeBtn{display:block;width:100%;border:0;border-radius:18px;padding:14px;margin-top:16px;background:#4e9956;color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 #37763f}@media(max-width:390px){.title{font-size:17px}.badge{font-size:13px;padding:8px 10px}.world{height:405px}.friend{transform:scale(.9)}.stage{font-size:15px;min-width:225px}}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=63'">← ホーム</button><div class="title">🌳 私のYELLの木</div><div class="badge">YELL ✨ <span id="topYell">0</span></div></header><main class="wrap"><section class="hero"><h1>今日のYELLの木</h1><p class="lead">小さな備えが積み重なるたび、あなたの木も少しずつ育つよ。</p><div class="world"><div class="cloud c1"></div><div class="cloud c2"></div><div class="sun"></div><div class="hills"></div><div class="flowers"></div><div id="treeWrap" class="treeWrap"><div class="trunk"></div><div class="branch l"></div><div class="branch r"></div><div class="crown"><i class="leafBlob b1"></i><i class="leafBlob b2"></i><i class="leafBlob b3"></i><i class="leafBlob b4"></i><div class="treeSpark"><span class="flower f1">🌼</span><span class="flower f2">🌸</span><span class="flower f3">🌼</span><span class="flower f4">🌸</span><span class="fruit r1">🍊</span><span class="fruit r2">🍎</span><span class="fruit r3">🍊</span><span class="fruit r4">🍎</span></div></div></div><div class="friends"><span class="friend bear">🧸</span><span class="friend hedgehog">🦔</span><span class="friend squirrel">🐿️</span><span class="friend rabbit">🐰</span><span class="friend bird">🐦</span><span class="friend deer">🦌</span><span class="friend mushroom">🍄</span></div><div id="stage" class="stage"></div></div><div class="sonaBubble"><div class="sonaIcon"><div class="sonaHead"><div class="sonaFace">•‿•</div></div><div class="sonaBody"></div><div class="megaphone">📣</div></div><div><b>📣 そなピーからYELL！</b><br><span id="cheer">今日の一歩も、ちゃんと木の力になってるよ。</span></div></div><div class="meter"><span id="bar"></span></div><div class="numbers"><span>次の大樹への成長 <span id="progress">0</span> / 50</span><span>累計 <span id="yell">0</span> YELL</span></div><div id="remain" class="remain"></div><div class="grown">🌳 育てた大樹 <span id="grown">0</span>本</div><div class="note">🌼 50YELLごとに大樹が1本育ち、その次の木の成長が始まります。特別な条件を達成すると、花や実がつくこともあるよ✨</div></section><button class="homeBtn" onclick="location.href='./home-v30.html?v=63'">ホームへ戻る</button></main><script>function read(){try{return Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0}catch(e){return 0}}function stageFor(n){if(n>=50)return['大樹に成長したよ！おめでとう！ 🌳',1];if(n>=45)return['立派な大樹が見えてきた！ 🌿',.97];if(n>=35)return['もうすぐ大樹になりそう！ 🌳',.92];if(n>=28)return['ぐんぐん成長しているよ！ 🍃',.86];if(n>=13)return['小さな木になったよ！ 🌱',.75];if(n>=7)return['葉っぱが増えてきたよ！ 🍃',.62];if(n>=5)return['少しずつ育ってきたよ！ 🌱',.5];if(n>=3)return['小さな芽が出たよ！ 🌱',.4];return['これから一緒に育てよう 🌱',.34]}function render(){const y=Math.max(0,read()),grown=Math.floor(y/50),current=y%50,shown=(current===0&&y>0)?50:current,p=shown/50*100;topYell.textContent=y;yell.textContent=y;progress.textContent=shown;document.getElementById('grown').textContent=grown;bar.style.width=p+'%';const [name,scale]=stageFor(shown);stage.textContent=name;treeWrap.style.transform='translateX(-50%) scale('+scale+')';const left=shown===50?50:50-shown;remain.innerHTML='次の大樹まで、あと <strong>'+left+'</strong> YELL';cheer.textContent=shown>=35?'もうすぐ大樹！今日の一歩も力になってるよ。':'今日の一歩も、ちゃんと木の力になってるよ。';treeWrap.classList.toggle('flowersOn',localStorage.getItem('sonayell_tree_flowers')==='1');treeWrap.classList.toggle('fruitOn',localStorage.getItem('sonayell_tree_fruit')==='1')}render();addEventListener('pageshow',render);addEventListener('storage',render)</script></body></html>
