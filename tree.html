60" xmlns="http://www.w3.org/2000/svg"><ellipse cx="110" cy="236" rx="44" ry="11" fill="#7cbf46" opacity=".35"/><path d="M110 227 C108 201 109 183 110 162" stroke="#7b5a2e" stroke-width="7" stroke-linecap="round"/><ellipse cx="90" cy="166" rx="34" ry="17" fill="#8bcf43" transform="rotate(25 90 166)"/><ellipse cx="132" cy="145" rx="36" ry="18" fill="#69b63a" transform="rotate(-28 132 145)"/></svg>`;let scale=[1,.78,.88,.96,1.06,1.14,1.22,1.28][stage]||1;let leaves=stage<3?8:stage<4?13:stage<5?18:stage<6?24:stage<7?29:34;let pts=[];for(let i=0;i<leaves;i++){let a=(i/leaves)*Math.PI*2*2.3;let r=22+((i*17)%58);let x=110+Math.cos(a)*r*.78;let y=105+Math.sin(a)*r*.55-((i%3)*8);let rx=18+((i*7)%11),ry=12+((i*5)%7);let c=['#a9dc54','#8fca43','#72b83a','#5aa43a','#3f8f35'][i%5];pts.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx}" ry="${ry}" fill="${c}" transform="rotate(${(i*31)%180} ${x} ${y})"/>`)}let blooms=flower?'<g font-size="18"><text x="72" y="83">🌼</text><text x="125" y="62">🌸</text><text x="146" y="110">🌼</text><text x="93" y="128">🌸</text></g>':'';let fruits=fruit?'<g font-size="18"><text x="73" y="112">🍎</text><text x="132" y="92">🍊</text><text x="149" y="133">🍎</text><text x="104" y="70">🍊</text></g>':'';return `<svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg" style="transform:scale(${scale});transform-origin:50% 100%"><ellipse cx="110" cy="235" rx="68" ry="12" fill="#477a2d" opacity=".18"/><path d="M98 230 C102 198 102 166 99 135 C90 158 79 173 60 185" fill="none" stroke="#7b4b24" stroke-width="17" stroke-linecap="round"/><path d="M111 231 C112 196 113 157 112 116" fill="none" stroke="#9a622f" stroke-width="26" stroke-linecap="round"/><path d="M112 165 C130 150 146 138 162 120" fill="none" stroke="#805027" stroke-width="14" stroke-linecap="round"/>${pts.join('')}<path d="M102 226 C106 194 106 158 104 127" stroke="#d49a4f" stroke-width="5" opacity=".65" stroke-linecap="round"/>${blooms}${fruits}</svg>`}function level(n){if(n>=50)return[7,'大樹に成長したよ！ 🌳'];if(n>=45)return[6,'立派な大樹が見えてきた！ 🌿'];if(n>=35)return[5,'もうすぐ大樹になりそう！ 🌳'];if(n>=28)return[4,'ぐんぐん成長しているよ！ 🍃'];if(n>=13)return[3,'小さな木になったよ！ 🌱'];if(n>=7)return[2,'葉っぱが増えてきたよ！ 🍃'];if(n>=5)return[1,'少しずつ育ってきたよ！ 🌱'];if(n>=3)return[0,'小さな芽が出たよ！ 🌱'];return[0,'もう少しで芽が出るよ 🌱']}function render(){let y=Math.max(0,read()),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,[st,label]=level(shown);grownEl=document.getElementById('grown');grownEl.textContent=grown;bar.style.width=(shown/50*100)+'%';stage.textContent=label;let likes=Number(localStorage.getItem('sonayell_like_count')||0),saves=Number(localStorage.getItem('sonayell_save_count')||0);treeArt.innerHTML=svgTree(st,shown>=45&&saves>=10,shown>=45&&likes>=20);let remain=shown===50?0:50-shown;next.innerHTML='次の大樹になるまで　<strong>あと '+remain+'YELL！</strong>';cheer.textContent=shown>=35?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}render();window.addEventListener('storage',render)</script></body></html>
