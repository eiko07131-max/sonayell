[.88,'もうすぐ大樹になりそう！ 🌳'];if(n>=28)return[.78,'ぐんぐん成長しているよ！ 🍃'];if(n>=13)return[.63,'小さな木になったよ！ 🌱'];if(n>=7)return[.72,'葉っぱが増えてきたよ！ 🍃'];if(n>=5)return[.58,'少しずつ育ってきたよ！ 🌱'];if(n>=3)return[.46,'小さな芽が出たよ！ 🌱'];return[.34,'もう少しで芽が出るよ 🌱']}function render(){let y=Math.max(0,read()),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,[scale,label]=level(shown);topYell.textContent=y;document.getElementById('yell').textContent=y;progress.textContent=shown;document.getElementById('grown').textContent=grown;bar.style.width=(shown/50*100)+'%';stage.textContent=label;treeWrap.style.transform='translateX(-50%) scale('+scale+')';treeWrap.style.transformOrigin='50% 100%';if(shown<13){adult.style.display='none';sprout.style.display='block'}else{adult.style.display='block';sprout.style.display='none'}remain.innerHTML='次の大樹まで、あと <strong>'+(shown===50?0:50-shown)+'</strong> YELL';cheer.textContent=shown>=35?'もうすぐ大樹！その調子でコツコツYELLを続けよう！':'今日の一歩も、ちゃんと木の力になってるよ。';let likes=Number(localStorage.getItem('sonayell_like_count')||0),saves=Number(localStorage.getItem('sonayell_save_count')||0);flowers.style.display=shown>=45&&saves>=10?'block':'none';fruits.style.display=shown>=45&&likes>=20?'block':'none'}render();window.addEventListener('storage',render)</script></body></html>
