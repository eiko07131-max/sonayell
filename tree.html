<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087332"><title>私のYELLの木｜そなYELL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#fffdf8;color:#234d31}.top{position:sticky;top:0;z-index:20;height:58px;background:linear-gradient(90deg,#07662b,#087c3b);color:#fff;display:flex;align-items:center;padding:0 14px}.back{border:0;background:none;color:#fff;font-weight:900;font-size:17px;padding:8px}.title{position:absolute;left:50%;transform:translateX(-50%);font-weight:900;font-size:21px;white-space:nowrap}.help{margin-left:auto;border:2px solid #fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:900}.wrap{max-width:620px;margin:auto;padding-bottom:28px}.world{position:relative;aspect-ratio:320/235;overflow:hidden;background:#dff3d7;isolation:isolate}.forestBg{position:absolute;inset:-1%;width:102%;height:102%;object-fit:cover;z-index:0}.treeHolder{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:4;display:flex;align-items:flex-end;justify-content:center;transition:width .45s cubic-bezier(.2,.8,.2,1);mix-blend-mode:multiply}.treeImg{display:block;width:100%;height:auto;mix-blend-mode:multiply;filter:saturate(.9) contrast(.96) drop-shadow(0 5px 5px rgba(54,73,38,.12))}.stage{display:none}.panel{position:relative;z-index:8;margin:-2px 16px 0;background:#fff;border-radius:0 0 26px 26px;padding:20px 18px 18px;box-shadow:0 7px 22px #315c3715}.panel h2{margin:0 0 14px;font-size:23px;color:#176c39}.meter{height:15px;background:#f6ecd8;border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#0e8c3d,#65b95d);transition:width .35s}.next{text-align:center;padding:16px 0 12px;border-bottom:1px solid #eee2d5;font-weight:800}.next strong{color:#07813a;font-size:20px}.grown{text-align:center;padding:13px 0 2px;font-weight:800}.grown strong{font-size:28px;color:#07813a}.sonaBubble{display:flex;gap:14px;align-items:center;margin:16px 16px 0;padding:12px 14px;background:#fff;border:1px solid #f0dfc4;border-radius:24px}.sonaBubble img{width:92px;height:112px;object-fit:cover;object-position:center 12%;border-radius:18px;background:#e8f8df}.sonaBubble b{font-size:18px;color:#245a35}.sonaBubble span{font-size:16px;line-height:1.7;color:#273c2d}.tip{margin:14px 16px 0;padding:11px 14px;border-radius:999px;background:#f2f8e9;text-align:center;color:#397248;font-weight:800;font-size:13px}@media(max-width:390px){.sonaBubble img{width:78px;height:98px}.sonaBubble b{font-size:16px}.sonaBubble span{font-size:14px}}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=77'">‹ 戻る</button><div class="title">私のYELLの木</div><div class="help">?</div></header><main class="wrap"><section class="world"><img id="forestBg" class="forestBg" alt="森の仲間たち"><div id="treeHolder" class="treeHolder"><img id="treeImg" class="treeImg" alt="YELLの木"></div><div id="stage" class="stage"></div></section><section class="panel"><h2>成長中のYELLの木</h2><div class="meter"><span id="bar"></span></div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数　<strong id="grown">0</strong>本</div></section><div class="sonaBubble"><img id="sona" alt="そなピー"><div><b>そなピーからYELL！</b><br><span id="cheer"></span></div></div><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div></main><script>async function txt(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(u);return(await r.text()).replace(/\s+/g,'')}async function loadArt(){try{const[bg,tr,sp]=await Promise.all([txt('assets/tree-forest-v74.txt?v=77'),txt('assets/yell-tree-cute-b64.txt?v=77'),txt('assets/sonapi-official-b64.txt?v=77')]);forestBg.src='data:image/jpeg;base64,'+bg;treeImg.src='data:image/webp;base64,'+tr;sona.src='data:image/webp;base64,'+sp}catch(e){console.error(e)}}function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}const steps=[3,5,7,13,28,35,45,50];const widths=[13,17,21,28,36,43,49,55];function stageFor(n){let i=0;while(i<steps.length-1&&n>=steps[i])i++;return widths[i]}function render(){const s=state(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur;grownEl.textContent=grown;bar.style.width=(shown/50*100)+'%';treeHolder.style.width=stageFor(shown)+'%';const remain=shown===50?0:50-shown;next.innerHTML='次の大樹になるまで　<strong>あと '+remain+'YELL！</strong>';cheer.textContent=shown>=35?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';const saves=Number(s.savedCount||s.saveCount||0),likes=Number(s.likeCount||s.likes||0);treeImg.style.filter='saturate(.9) contrast(.96) drop-shadow(0 5px 5px rgba(54,73,38,.12))'+(shown>=45&&saves>=10&&likes>=20?' drop-shadow(0 0 9px rgba(255,190,60,.3))':'')}const grownEl=document.getElementById('grown'),bar=document.getElementById('bar'),treeHolder=document.getElementById('treeHolder'),next=document.getElementById('next'),cheer=document.getElementById('cheer');loadArt();render();window.addEventListener('storage',render)</script></body></html>
