g;treeImg.src='data:image/webp;base64,'+tr;sonaImg.src='data:image/webp;base64,'+sp}catch(e){console.error(e)}}function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function level(n){if(n>=50)return[58,'大樹に成長したよ！ 🌳'];if(n>=45)return[55,'立派な大樹が見えてきた！ 🌿'];if(n>=35)return[51,'もうすぐ大樹になりそう！ 🌳'];if(n>=28)return[47,'ぐんぐん成長しているよ！ 🍃'];if(n>=13)return[42,'小さな木になったよ！ 🌱'];if(n>=7)return[31,'葉っぱが増えてきたよ！ 🍃'];if(n>=5)return[24,'少しずつ育ってきたよ！ 🌱'];if(n>=3)return[18,'小さな芽が出たよ！ 🌱'];return[13,'もう少しで芽が出るよ 🌱']}function render(){const s=state(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,[size,label]=level(shown);document.getElementById('grown').textContent=grown;document.getElementById('current').textContent=shown;document.getElementById('bar').style.width=(shown/50*100)+'%';document.getElementById('stage').textContent=label;document.getElementById('treeHolder').style.width=size+'%';const remain=shown===50?0:50-shown;document.getElementById('next').innerHTML='次の大樹になるまで <strong>あと '+remain+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}loadArt();render();addEventListener('storage',render);addEventListener('pageshow',render);addEventListener('focus',render)</script></body></html>
