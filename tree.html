<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf7df"><title>私のYELLの木｜そなYELL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#e7f7df,#fff9df);color:#36563b;min-height:100vh}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #d9ead4;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:10}.back{border:0;background:#edf7e9;color:#347341;border-radius:12px;padding:9px 12px;font-weight:800}.title{font-size:19px;font-weight:900;color:#26733d}.badge{margin-left:auto;background:#fff1a6;color:#725b20;border-radius:999px;padding:7px 10px;font-weight:900;font-size:13px}.wrap{max-width:620px;margin:auto;padding:18px 14px 36px}.hero{background:#fff;border-radius:26px;padding:20px;box-shadow:0 5px 18px #315c3718;text-align:center}.hero h1{margin:0;color:#26733d;font-size:24px}.lead{font-size:13px;line-height:1.7;color:#66806a;margin:7px 0 0}.sky{position:relative;margin-top:16px;min-height:340px;border-radius:24px;overflow:hidden;background:linear-gradient(#ccecff 0 58%,#d8edb5 58% 78%,#a8d17d 78%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:38px}.sun{position:absolute;width:62px;height:62px;border-radius:50%;background:#fff1a0;right:28px;top:25px}.cloud{position:absolute;font-size:48px;opacity:.85;left:25px;top:35px}.tree{font-size:155px;line-height:1;filter:drop-shadow(0 6px 3px #55753b33);z-index:2}.ground{position:absolute;bottom:0;width:100%;height:48px;background:#78ad5d}.stage{margin-top:14px;font-weight:900;color:#397a44;font-size:18px}.meter{height:12px;background:#e4efdf;border-radius:99px;overflow:hidden;margin-top:12px}.meter span{display:block;height:100%;background:#5ba65f;border-radius:99px;transition:width .5s}.numbers{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;font-weight:800;color:#6a806c}.remain{margin-top:13px;padding:12px;border-radius:16px;background:#f5faef;font-size:14px;line-height:1.6}.remain strong{font-size:22px;color:#e48b51}.note{margin-top:14px;background:#fff7c9;border-radius:17px;padding:13px;font-size:12px;line-height:1.7;color:#6c633e}.homeBtn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin-top:16px;background:#4e9956;color:#fff;font-weight:900;font-size:16px}</style></head><body><header class="top"><button class="back" onclick="location.href='./home.html?v=17'">← ホーム</button><div class="title">🌳 私のYELLの木</div><div class="badge">YELL 🌟 <span id="topYell">0</span></div></header><main class="wrap"><section class="hero"><h1>あなたの備えが、木を育てる。</h1><p class="lead">価値ある防災行動でもらったYELLが、少しずつあなたの木を成長させるよ。</p><div class="sky"><div class="sun"></div><div class="cloud">☁️</div><div id="tree" class="tree">🌱</div><div class="ground"></div></div><div id="stage" class="stage">芽が出たよ</div><div class="meter"><span id="bar"></span></div><div class="numbers"><span><span id="yell">0</span> YELL</span><span>100 YELLで大樹 🌳</span></div><div id="remain" class="remain"></div><div class="note">🌼 木が育つと、ときどき花や実が現れる構想も本番版で育てていくよ。試作品ではまず、YELLと木の成長が正しく連動することを確認します。</div></section><button class="homeBtn" onclick="location.href='./home.html?v=17'">ホームへ戻る</button></main><script>function read(){try{return Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0}catch(e){return 0}}function render(){const y=Math.max(0,read()),p=Math.min(100,y);let icon='🌱',name='芽が出たよ';if(y>=10){icon='🌿';name='若芽が育ってきたよ'}if(y>=30){icon='🪴';name='小さな木へ成長中'}if(y>=60){icon='🌲';name='しっかりした木になってきたよ'}if(y>=100){icon='🌳';name='大樹に育ったよ！'}document.getElementById('topYell').textContent=y;document.getElementById('yell').textContent=y;document.getElementById('tree').textContent=icon;document.getElementById('stage').textContent=name;document.getElementById('bar').style.width=p+'%';const r=document.getElementById('remain');r.innerHTML=y>=100?'🎉 <strong>大樹完成！</strong><br>ここから次の成長へ。':'大樹まで、あと <strong>'+Math.max(0,100-y)+'</strong> YELL';}render();window.addEventListener('pageshow',render);window.addEventListener('storage',render);</script></body></html>
