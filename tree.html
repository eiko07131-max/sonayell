13px}.sonaBubble img{width:60px;height:76px;object-fit:cover;object-position:center 12%;border-radius:16px;background:#e7f7df}.sonaBubble b{color:#218044;font-size:14px}.sonaBubble span{font-size:14px;line-height:1.65;color:#526a57}.meter{height:12px;background:#e4efdf;border-radius:99px;overflow:hidden;margin-top:15px}.meter span{display:block;height:100%;background:linear-gradient(90deg,#52b95f,#8fd15c);transition:width .5s}.numbers{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;font-weight:800;color:#647b68}.remain{margin-top:14px;padding:14px;border-radius:18px;background:#f5faef;font-size:14px}.remain strong{font-size:26px;color:#ef8b37}.grown{margin-top:12px;font-weight:900;color:#397a44}.note{margin-top:13px;background:#fff5bd;border-radius:17px;padding:13px;font-size:12px;line-height:1.7;color:#705f2e}.homeBtn{display:block;width:100%;border:0;border-radius:18px;padding:14px;margin-top:16px;background:#4e9956;color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 #37763f}@media(max-width:390px){.title{font-size:17px}.badge{font-size:13px;padding:8px 10px}.world{height:430px}.friend{transform:scale(.92)}.stage{font-size:15px;min-width:225px}}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=64'">← ホーム</button><div class="title">🌳 私のYELLの木</div><div class="badge">YELL ✨ <span id="topYell">0</span></div></header><main class="wrap"><section class="hero"><h1>今日のYELLの木</h1><p class="lead">小さな備えが積み重なるたび、あなたの木も少しずつ育つよ。</p><div class="world"><div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="flowers"></div><svg id="treeSvg" class="treeSvg" viewBox="0 0 400 330" aria-label="成長中のYELLの木"><defs><linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7e85c"/><stop offset=".5" stop-color="#76c94a"/><stop offset="1" stop-color="#3f9c3d"/></linearGradient><linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#855027"/><stop offset=".5" stop-color="#b97939"/><stop offset="1" stop-color="#7a431f"/></linearGradient></defs><g id="sprout"><ellipse cx="200" cy="295" rx="48" ry="14" fill="#79b84e" opacity=".45"/><path id="stem" d="M200 292 C200 270 200 252 200 232" fill="none" stroke="#4c8d37" stroke-width="8" stroke-linecap="round"/><ellipse id="leafL" class="leafSmall" cx="181" cy="248" rx="22" ry="11" transform="rotate(28 181 248)"/><ellipse id="leafR" class="leafSmall" cx="220" cy="239" rx="23" ry="11" transform="rotate(-28 220 239)"/></g><g id="tree" opacity="0"><path class="trunkPath" d="M174 300 C181 259 184 222 179 178 C176 150 189 131 201 130 C215 130 228 148 225 176 C220 220 223 260 231 300 Z"/><path class="branchPath" d="M197 190 C173 175 154 161 137 143"/><path class="branchPath" d="M207 186 C231 170 250 155 267 137"/><path class="branchPath" d="M198 160 C183 145 176 128 170 112"/><path class="branchPath" d="M210 158 C224 140 233 124 238 108"/><path id="canopy" class="canopy" d="M92 142 C73 118 79 86 106 75 C106 45 137 26 164 39 C179 14 221 12 236 40 C268 29 299 49 297 80 C326 91 333 127 311 148 C316 179 286 201 257 194 C236 219 194 219 174 196 C144 207 114 190 115 162 C103 158 96 151 92 142 Z"/><g id="flowersG"><text class="flowerDot" x="120" y="104">🌼</text><text class="flowerDot" x="176" y="73">🌸</text><text class="flowerDot" x="244" y="92">🌼</text><text class="flowerDot" x="275" y="136">🌸</text><text class="flowerDot" x="154" y="150">🌼</text></g><g id="fruitG"><text class="fruitDot" x="136" y="119">🍎</text><text class="fruitDot" x="196" y="95">🍊</text><text class="fruitDot" x="249" y="118">🍎</text><text class="fruitDot" x="221" y="157">🍊</text><text class="fruitDot" x="166" y="166">🍎</text></g></g></svg><div class="friends"><span class="friend bear">🧸</span><span class="friend hedgehog">🦔</span><span class="friend squirrel">🐿️</span><span class="friend rabbit">🐰</span><span class="friend bird">🐦</span><span class="friend deer">🦌</span></div><div id="stage" class="stage"></div></div><div id="special" class="special"></div><div class="sonaBubble"><img id="sona" alt="そなピー"><div><b>📣 そなピーからYELL！</b><br><span id="cheer">今日の一歩も、ちゃんと木の力になってるよ。</span></div></div><div class="meter"><span id="bar"></span></div><div class="numbers"><span>次の大樹への成長 <span id="progress">0</span> / 50</span><span>累計 <span id="yell">0</span> YELL</span></div><div id="remain" class="remain"></div><div class="grown">🌳 育てた大樹 <span id="grown">0</span>本</div><div class="note">🌼 成長段階は 3・5・7・13・28・35・45・50YELL。45YELLで、保存10なら花、いいね20なら実、両方達成なら花と実がつく特別なYELLの木になるよ✨</div></section><button class="homeBtn" onclick="location.href='./home-v30.html?v=64'">ホームへ戻る</button></main><script>const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',token=localStorage.getItem('sonayell_access_token')||'';fetch('assets/sonapi-official-b64.txt?v=1').then(r=>r.text()).then(x=>sona.src='data:image/webp;base64,'+x.trim()).catch(()=>{});function read(){try{return Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0}catch(e){return 0}}function stageInfo(n){if(n>=50)return{label:'大樹に成長したよ！おめでとう！ 🌳',s:1,tree:1};if(n>=45)return{label:'立派な大樹が見えてきた！ 🌿',s:.96,tree:1};if(n>=35)return{label:'もうすぐ大樹になりそう！ 🌳',s:.88,tree:1};if(n>=28)return{label:'ぐんぐん成長しているよ！ 🍃',s:.78,tree:1};if(n>=13)return{label:'小さな木になったよ！ 🌱',s:.63,tree:1};if(n>=7)return{label:'葉っぱが増えてきたよ！ 🍃',s:1.05,tree:0,stem:1.35,leaves:1};if(n>=5)return{label:'少しずつ育ってきたよ！ 🌱',s:.95,tree:0,stem:1.15,leaves:1};if(n>=3)return{label:'小さな芽が出たよ！ 🌱',s:.82,tree:0,stem:.95,leaves:1};return{label:'もう少しで芽が出るよ 🌱',s:.68,tree:0,stem:.8,leaves:.7}}function baseRender(){const y=Math.max(0,read()),grown=Math.floor(y/50),current=y%50,shown=(current===0&&y>0)?50:current,p=shown/50*100,st=stageInfo(shown);topYell.textContent=y;yell.textContent=y;progress.textContent=shown;document.getElementById('grown').textContent=grown;bar.style.width=p+'%';stage.textContent=st.label;const sprout=document.getElementById('sprout'),tree=document.getElementById('tree');if(st.tree){sprout.style.opacity=0;tree.style.opacity=1;tree.style.transform='translate(200px,300px) scale('+st.s+') translate(-200px,-300px)'}else{tree.style.opacity=0;sprout.style.opacity=1;sprout.style.transform='translate(200px,300px) scale('+st.s+') translate(-200px,-300px)'}const left=shown===50?50:50-shown;remain.innerHTML='次の大樹まで、あと <strong>'+left+'</strong> YELL';cheer.textContent=shown>=35?'もうすぐ大樹！その調子でコツコツYELLを続けよう！':'今日の一歩も、ちゃんと木の力になってるよ。';return{shown}}async function loadSpecial(shown){document.querySelectorAll('.flowerDot,.fruitDot').forEach(x=>x.style.display='none');special.classList.remove('show');if(shown<45||shown>=50)return;let likes=Number(localStorage.getItem('sonayell_tree_likes')||0),saves=Number(localStorage.getItem('sonayell_tree_saves')||0);if(token){try{const h={apikey:K,'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch(U+'/rest/v1/rpc/sona_my_tree_special_counts',{method:'POST',headers:h,body:'{}',cache:'no-store'});if(r.ok){const rows=await r.json();if(rows&&rows[0]){likes=Number(rows[0].likes_count)||0;saves=Number(rows[0].saves_count)||0;localStorage.setItem('sonayell_tree_likes',likes);localStorage.setItem('sonayell_tree_saves',saves)}}}catch(e){}}const flowers=saves>=10,fruits=likes>=20;if(flowers)document.querySelectorAll('.flowerDot').forEach(x=>x.style.display='block');if(fruits)document.querySelectorAll('.fruitDot').forEach(x=>x.style.display='block');special.classList.add('show');special.innerHTML=flowers&&fruits?'🌸🍎 保存10＋いいね20達成！ 花と実が両方ついた特別なYELLの木✨':flowers?'🌸 保存10達成！ お花が咲いたよ✨':fruits?'🍎 いいね20達成！ 実がなったよ✨':'🌱 45YELL到達！ 保存10で花、いいね20で実がつくよ。'}function render(){const x=baseRender();loadSpecial(x.shown)}render();addEventListener('pageshow',render);addEventListener('storage',render)</script></body></html>
