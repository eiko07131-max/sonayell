<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>私のYELLの木｜そなYELL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#dff6ff,#fff8d8);color:#36563b}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #d9ead4;padding:12px 14px;display:flex;align-items:center;gap:10px}.back{border:0;background:#edf7e9;color:#347341;border-radius:14px;padding:10px 12px;font-weight:900}.title{font-size:19px;font-weight:900;color:#26733d}.badge{margin-left:auto;background:#fff1a6;border-radius:999px;padding:8px 11px;font-weight:900}.wrap{max-width:620px;margin:auto;padding:16px 14px 36px}.hero{background:#fff;border-radius:28px;padding:16px;box-shadow:0 7px 22px #315c371c;text-align:center}.hero h1{margin:0;color:#26733d;font-size:23px}.lead{font-size:12px;line-height:1.7;color:#67816c;margin:6px 0 0}.world{position:relative;margin-top:13px;height:390px;border-radius:27px;overflow:hidden;background:linear-gradient(#bcecff 0 55%,#dff2a8 55% 76%,#81bc5c 76%);box-shadow:inset 0 0 0 1px #cce7c0}.world:before{content:"☁️";position:absolute;left:28px;top:28px;font-size:52px;opacity:.7}.world:after{content:"☀️";position:absolute;right:25px;top:26px;font-size:52px}.hills{position:absolute;left:-10%;right:-10%;bottom:68px;height:110px;background:radial-gradient(ellipse at 20% 100%,#a9d77b 0 48%,transparent 50%),radial-gradient(ellipse at 55% 100%,#bfe38f 0 49%,transparent 51%),radial-gradient(ellipse at 85% 100%,#9ed06e 0 48%,transparent 50%)}.treePic{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:138px;max-height:160px;object-fit:contain;filter:drop-shadow(0 8px 5px #365b2630);transition:.45s}.friends{position:absolute;left:0;right:0;bottom:0;width:100%;height:92px;object-fit:cover;object-position:center bottom;mix-blend-mode:multiply}.stage{position:absolute;left:14px;right:14px;bottom:74px;background:#ffffffe8;border-radius:999px;padding:7px 10px;font-weight:900;color:#397a44;font-size:15px}.sonaBubble{display:flex;gap:9px;align-items:center;text-align:left;background:#f1fae9;border-radius:18px;padding:9px 11px;margin-top:12px}.sonaBubble img{width:58px;height:74px;object-fit:cover;object-position:center 12%;border-radius:15px}.sonaBubble b{color:#218044;font-size:13px}.meter{height:12px;background:#e4efdf;border-radius:99px;overflow:hidden;margin-top:13px}.meter span{display:block;height:100%;background:linear-gradient(90deg,#5aa65d,#8dcb5f);transition:width .5s}.numbers{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:800;color:#6a806c}.remain{margin-top:13px;padding:12px;border-radius:16px;background:#f5faef;font-size:14px}.remain strong{font-size:23px;color:#e48b51}.grown{margin-top:11px;font-weight:900;color:#397a44}.note{margin-top:13px;background:#fff5bd;border-radius:17px;padding:13px;font-size:12px;line-height:1.7}.homeBtn{display:block;width:100%;border:0;border-radius:17px;padding:14px;margin-top:16px;background:#4e9956;color:#fff;font-weight:900;font-size:16px}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=42'">← ホーム</button><div class="title">🌳 私のYELLの木</div><div class="badge">YELL ✨ <span id="topYell">0</span></div></header><main class="wrap"><section class="hero"><h1>今日のYELLの木</h1><p class="lead">小さな備えが積み重なるたび、あなたの木も少しずつ育つよ。</p><div class="world"><div class="hills"></div><img id="treePic" class="treePic" alt="YELLの木"><img id="friends" class="friends" alt="森の仲間たち"><div id="stage" class="stage"></div></div><div class="sonaBubble"><img id="sona" alt="そなピー"><div><b>📣 そなピーからYELL！</b><br><span id="cheer">今日の一歩も、ちゃんと木の力になってるよ。</span></div></div><div class="meter"><span id="bar"></span></div><div class="numbers"><span>次の大樹への成長 <span id="progress">0</span> / 50</span><span>累計 <span id="yell">0</span> YELL</span></div><div id="remain" class="remain"></div><div class="grown">🌳 育てた大樹 <span id="grown">0</span>本</div><div class="note">🌼 50YELLごとに大樹が1本育ち、その次の木の物語が始まります。</div></section><button class="homeBtn" onclick="location.href='./home-v30.html?v=42'">ホームへ戻る</button></main><script>const asset=(p,id)=>fetch(p).then(r=>r.text()).then(x=>document.getElementById(id).src='data:image/webp;base64,'+x.trim());asset('assets/yell-tree-cute-b64.txt?v=1','treePic');asset('assets/forest-friends-b64.txt?v=1','friends');asset('assets/sonapi-official-b64.txt?v=1','sona');function read(){try{return Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0}catch(e){return 0}}function render(){const y=Math.max(0,read()),grown=Math.floor(y/50),current=y%50,p=current/50*100;topYell.textContent=y;yell.textContent=y;progress.textContent=current;document.getElementById('grown').textContent=grown;bar.style.width=p+'%';const scale=.72+Math.min(current,49)/49*.28;treePic.style.transform='translateX(-50%) scale('+scale+')';treePic.style.opacity=.76+Math.min(current,49)/49*.24;let name='小さな芽から、物語が始まったよ 🌱';if(current>=5)name='葉っぱが増えてきたよ 🍃';if(current>=15)name='小さな木へ成長中 🌿';if(current>=30)name='大樹まであと少し！ 🌳';if(current===0&&y>0)name='大樹が育ったよ！ おめでとう 🎉';stage.textContent=name;const left=current===0&&y>0?50:50-current;remain.innerHTML='次の大樹まで、あと <strong>'+left+'</strong> YELL';cheer.textContent=current>=30?'もうすぐ大樹！一緒に育てよう！':'今日の一歩も、ちゃんと木の力になってるよ。'}render();addEventListener('pageshow',render);addEventListener('storage',render)</script></body></html>
