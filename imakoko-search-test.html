<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16853f">
<title>イマココ｜検索テスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f4f8f3;color:#24382a}button,input{font:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;background:#fff;padding-bottom:28px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #e4ece1}.back{width:42px;height:42px;border:0;border-radius:50%;background:#eef6eb;font-size:24px;color:#22663a}.title{font-size:20px;font-weight:900;color:#194d2e}.hero{padding:14px 16px 8px}.note{background:#fff6d9;border:1px solid #e6ca77;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.55}.searchbox{margin:10px 16px 6px;background:#f3f8f1;border:1px solid #d6e3d2;border-radius:18px;padding:12px}.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px}.searchinput{width:100%;border:2px solid #bfd4bb;border-radius:14px;padding:13px;background:#fff;outline:0;font-size:16px}.searchbtn,.clearbtn{border:0;border-radius:14px;padding:0 15px;font-weight:900}.searchbtn{background:#1f8046;color:#fff}.clearbtn{margin-top:8px;width:100%;padding:9px;background:#eaf3e7;color:#2b6d40}.examples{font-size:11px;color:#6f7d73;margin-top:7px;line-height:1.5}.summary{padding:10px 16px 8px;font-weight:900;color:#1c6037}.list{display:grid;gap:10px;padding:0 16px}.card{border:1px solid #dce5d9;border-radius:17px;padding:13px;background:#fff;box-shadow:0 5px 14px #234d2b10}.cat{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf5e9;color:#2a6b3e;font-size:11px;font-weight:900}.place{margin-top:8px;font-weight:900;font-size:17px}.msg{margin-top:6px;line-height:1.55;font-size:14px;white-space:pre-wrap}.time{margin-top:10px;border-left:4px solid #6ea958;background:#f3f9ef;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:900;color:#235d35}.meta{margin-top:6px;color:#6f7d73;font-size:11px;line-height:1.5}.hit{margin-top:8px;border-radius:10px;padding:7px 9px;background:#eef6ff;color:#245f91;font-size:11px;font-weight:900}.replymatch{margin-top:8px;border:1px solid #cfe0ee;background:#f5faff;border-radius:12px;padding:9px}.replyname{font-size:11px;font-weight:900;color:#2b628b}.replymsg{margin-top:4px;font-size:13px;line-height:1.45;white-space:pre-wrap}.threadbtn{width:100%;margin-top:10px;border:1px solid #bed6bd;border-radius:13px;background:#f2faf0;color:#20643a;padding:11px;font-weight:900}.thread{display:none;margin-top:8px;border-top:1px dashed #cdd9cb;padding-top:5px}.thread.open{display:block}.reply{margin-top:7px;border:1px solid #e0e8dd;background:#f9fbf8;border-radius:12px;padding:9px}.empty{text-align:center;padding:28px 12px;border-radius:16px;background:#f7faf6;color:#7b887f}.resolved{margin-top:8px;background:#e8f7f4;border:1px solid #8ec9bd;color:#167260;border-radius:12px;padding:8px;text-align:center;font-weight:900}.searching{opacity:.65}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="title">🔍 イマココ内を検索</div></header>
<section class="hero"><div class="note">🧪 検索機能の実用テストです。現在公開中の投稿と、その返信内容まで検索します。</div></section>
<section class="searchbox">
<div class="searchrow"><input id="q" class="searchinput" placeholder="例：スマホ充電、三室給水"><button id="search" class="searchbtn">検索</button></div>
<div class="examples">場所・投稿本文・表示名・返信内容が検索対象です。スペースあり／なしの両方を拾いやすくしています。</div>
<button id="clear" class="clearbtn">検索を解除して全部見る</button>
</section>
<div id="summary" class="summary">読み込み中…</div>
<section id="list" class="list"><div class="empty">読み込み中…</div></section>
</main>
<script>
const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',REGION='saitama-midori';
const DEF={water:['🚰','水'],food:['🍙','食料・物資'],gas:['⛽','ガソリン'],road:['🚧','道路・危険箇所'],life:['🛟','生活支援'],other:['💬','聞きたい・伝えたい']};
let token=localStorage.getItem('imakoko_test_guest');if(!token){token=crypto.randomUUID();localStorage.setItem('imakoko_test_guest',token)}
let posts=[],replies=[],query='';const openThreads=new Set();const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function rpc(name,body){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body||{}),cache:'no-store'});const t=await r.text();if(!r.ok)throw Error(t||r.status);return t?JSON.parse(t):null}
function jpTime(iso,suffix='投稿'){const d=new Date(iso),p=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),g=t=>p.find(x=>x.type===t)?.value||'';return `${Number(g('month'))}月${Number(g('day'))}日 ${g('hour')}時${g('minute')}分 ${suffix}`}
function remain(iso){const m=Math.max(0,Math.ceil((new Date(iso)-Date.now())/60000));if(m<=1)return'まもなく自動終了';if(m<60)return`あと約${m}分`;return`あと約${Math.ceil(m/60)}時間`}
function norm(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[\s　・,，.。!！?？:：;；「」『』【】()（）\-_/／]/g,'')}
function grams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a}
function fuzzyMatch(text,q){const T=norm(text),Q=norm(q);if(!Q)return true;if(T.includes(Q))return true;const words=String(q).trim().split(/[\s　]+/).map(norm).filter(Boolean);if(words.length>1&&words.every(w=>T.includes(w)))return true;if(Q.length<4)return false;const gs=grams(Q);if(!gs.length)return false;const hits=gs.filter(g=>T.includes(g)).length;return hits>=Math.max(2,Math.ceil(gs.length*.6))}
function replyRows(p){return replies.filter(r=>r.post_id===p.id)}
function mainText(p){const d=DEF[p.category]||DEF.other;return [d[1],p.place,p.message,p.nickname].join(' ')}
function matchedReply(p,q){return replyRows(p).find(r=>fuzzyMatch([r.nickname,r.message].join(' '),q))}
function isMatch(p,q){if(!q)return true;return fuzzyMatch(mainText(p),q)||!!matchedReply(p,q)}
function render(){const a=posts.filter(p=>isMatch(p,query));$('summary').textContent=query?`「${query}」の検索結果：${a.length}件`:`現在公開中の情報：${a.length}件`;
if(!a.length){$('list').innerHTML='<div class="empty">該当する公開中の情報は見つかりませんでした。<br>言葉を短くしてもう一度試してみてね。</div>';return}
$('list').innerHTML=a.map(p=>{const d=DEF[p.category]||DEF.other,rs=replyRows(p),mr=query?matchedReply(p,query):null,open=openThreads.has(p.id);return `<article class="card"><span class="cat">${d[0]} ${d[1]}</span><div class="place">${esc(p.place)}</div><div class="msg">${esc(p.message)}</div><div class="time">🕒 ${jpTime(p.created_at)}</div><div class="meta">投稿者：${esc(p.nickname)}　⌛ ${remain(p.expires_at)}で自動終了</div>${p.resolved_at?'<div class="resolved">✅ 解決済み</div>':''}${mr?`<div class="hit">🔎 返信の中にも一致しました</div><div class="replymatch"><div class="replyname">${esc(mr.nickname)} ・ ${jpTime(mr.created_at,'返信')}</div><div class="replymsg">${esc(mr.message)}</div></div>`:''}${rs.length?`<button class="threadbtn" data-id="${p.id}">💬 この投稿の返信を見る（${rs.length}件）</button><div class="thread ${open?'open':''}" id="t-${p.id}">${rs.map(r=>`<div class="reply"><div class="replyname">${esc(r.nickname)} ・ ${jpTime(r.created_at,'返信')}</div><div class="replymsg">${esc(r.message)}</div></div>`).join('')}</div>`:''}</article>`}).join('');
document.querySelectorAll('.threadbtn').forEach(b=>b.onclick=()=>{const id=b.dataset.id;openThreads.has(id)?openThreads.delete(id):openThreads.add(id);render()})}
async function load(){try{$('summary').textContent='最新情報を読み込み中…';[posts,replies]=await Promise.all([rpc('imakoko_test_list_posts_v4',{p_region_key:REGION,p_category:null,p_guest_token:token}),rpc('imakoko_test_list_replies',{p_region_key:REGION})]);posts=posts||[];replies=replies||[];render()}catch(e){$('summary').textContent='読み込みに失敗しました';$('list').innerHTML='<div class="empty">少し待って、もう一度開いてね。</div>'}}
function doSearch(){query=$('q').value.trim();render()}
$('search').onclick=doSearch;$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch()}});$('clear').onclick=()=>{$('q').value='';query='';render()};
load();
</script>
</body></html>
