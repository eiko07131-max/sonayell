<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08743a">
<title>私のYELLの木｜ブラッシュアップTEST</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f6f7f1;color:#294632;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
button{font:inherit}
.app{width:min(100%,620px);margin:auto;min-height:100dvh;background:linear-gradient(#f8fbf5,#fffdf8);overflow:hidden;padding-bottom:28px}
.top{height:66px;padding:0 15px;display:grid;grid-template-columns:76px 1fr 52px;align-items:center;background:linear-gradient(90deg,#08692f,#0a8140);color:white;position:relative;z-index:20}
.back{border:0;background:transparent;color:white;font-weight:900;font-size:17px;text-align:left;padding:10px 0;cursor:pointer}.title{text-align:center;font-size:23px;font-weight:900;white-space:nowrap}.help{width:43px;height:43px;border:2.5px solid #fff;border-radius:50%;background:transparent;color:white;font-weight:900;font-size:22px;cursor:pointer}
.world{position:relative;aspect-ratio:430/306;overflow:hidden;background:#d7efd2;isolation:isolate}.forest{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:saturate(1.07) contrast(1.03)}.sunwash{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 12%,rgba(255,255,215,.52),transparent 40%),linear-gradient(180deg,rgba(255,255,255,.02),rgba(2,78,34,.08));pointer-events:none}.spark{position:absolute;z-index:2;width:5px;height:5px;border-radius:50%;background:#fffad1;box-shadow:0 0 10px #fff8a8;opacity:.75;animation:tw 2.8s ease-in-out infinite}.spark.s1{left:15%;top:25%;animation-delay:.3s}.spark.s2{left:76%;top:34%;animation-delay:1.2s}.spark.s3{left:67%;top:16%;animation-delay:2s}.spark.s4{left:29%;top:48%;animation-delay:1.6s}@keyframes tw{50%{opacity:.2;transform:scale(.5)}}
.treeHolder{position:absolute;left:50%;bottom:10.5%;transform:translateX(-50%);z-index:5;display:flex;align-items:flex-end;justify-content:center;transition:width .45s ease}.treeImg{display:block;width:100%;height:auto;mix-blend-mode:multiply;filter:saturate(1.03) contrast(1.03) drop-shadow(0 8px 8px rgba(33,64,30,.16));transform-origin:50% 100%;transition:transform .35s ease}.groundGlow{position:absolute;z-index:3;left:50%;bottom:7%;transform:translateX(-50%);width:48%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(246,255,178,.58),rgba(255,255,255,0) 70%)}
.stage{position:absolute;left:50%;bottom:2.7%;transform:translateX(-50%);z-index:10;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-radius:999px;padding:8px 18px;color:#08773c;font-weight:900;font-size:15px;white-space:nowrap;box-shadow:0 5px 16px rgba(24,75,42,.16);backdrop-filter:blur(4px)}
.summary{margin:-1px 12px 0;background:#fff;border:1px solid #ecebe2;border-radius:0 0 26px 26px;padding:19px 18px 18px;box-shadow:0 10px 25px rgba(45,71,40,.09);position:relative;z-index:12}.summaryTop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.summary h2{margin:0;color:#08753a;font-size:21px}.treeCount{font-size:12px;color:#5f7162;font-weight:800;white-space:nowrap}.treeCount strong{font-size:23px;color:#07803c;margin:0 3px}.rule{text-align:center;margin:12px 0 9px;padding:8px 10px;border-radius:13px;background:#eef7e8;color:#48644c;font-weight:900;font-size:12px}.meter{height:15px;border-radius:99px;background:#eee6d6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(75,70,45,.08)}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#07833c,#69bc5d);border-radius:99px;transition:width .4s ease}.numbers{display:flex;align-items:baseline;justify-content:center;margin-top:8px;color:#08783b;font-weight:900}.numbers strong{font-size:31px}.numbers span{font-size:16px;margin-left:5px}.remaining{text-align:center;margin-top:5px;font-size:14px;font-weight:800;color:#445449}.remaining strong{color:#07823d;font-size:20px;margin-left:6px}.milestones{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:14px;position:relative}.milestones:before{content:"";position:absolute;left:10%;right:10%;top:11px;height:3px;background:#e2eadc;border-radius:99px}.mark{position:relative;z-index:1;text-align:center;font-size:9px;color:#7b8b7d;font-weight:800}.dot{width:22px;height:22px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;background:#e7eee3;border:2px solid #fff;box-shadow:0 0 0 1px #d8e1d4;color:#7b8e7b;font-size:10px}.mark.on .dot{background:#2d9a4d;color:#fff;box-shadow:0 0 0 2px #d7efd8}.mark.now .dot{background:#fff4b9;color:#477546;box-shadow:0 0 0 2px #cfe6c9}
.sonaRow{display:flex;align-items:flex-end;gap:4px;margin:14px 14px 0}.sonaWrap{flex:0 0 116px;width:116px;height:140px;display:flex;align-items:flex-end;justify-content:center}.sonaImg{display:block;max-width:114px;max-height:136px;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(26,78,43,.12))}.speech{position:relative;flex:1;margin-bottom:8px;background:#fffdf9;border:1.5px solid #e7d9bb;border-radius:23px;padding:14px 15px;box-shadow:0 5px 15px rgba(56,78,47,.06)}.speech:before{content:"";position:absolute;left:-12px;bottom:28px;width:21px;height:21px;background:#fffdf9;border-left:1.5px solid #e7d9bb;border-bottom:1.5px solid #e7d9bb;transform:rotate(45deg)}.speech b{position:relative;z-index:1;color:#166b38;font-size:16px}.speech p{position:relative;z-index:1;margin:5px 0 0;font-size:13px;line-height:1.65;color:#364a39}.tip{margin:8px 16px 0;padding:10px 13px;border-radius:16px;background:#edf6df;border:1px solid #d7e7c4;color:#466a48;text-align:center;font-size:12px;font-weight:800;line-height:1.5}
.modalBack{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#15382772}.modalBack.show{display:flex}.modal{width:min(100%,620px);background:#fff;border-radius:26px 26px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 28px rgba(14,57,29,.2)}.modal h3{margin:0 0 9px;color:#08763a;font-size:20px}.modal p{font-size:13px;line-height:1.75;color:#425448}.close{width:100%;border:0;border-radius:15px;padding:13px;background:#0a7d3e;color:white;font-weight:900;margin-top:8px}
@media(max-width:390px){.top{grid-template-columns:68px 1fr 46px;height:62px}.title{font-size:20px}.help{width:40px;height:40px}.stage{font-size:13px;padding:7px 15px}.summary{margin-left:10px;margin-right:10px;padding:17px 15px}.summary h2{font-size:19px}.numbers strong{font-size:28px}.sonaWrap{flex-basis:96px;width:96px;height:122px}.sonaImg{max-width:94px;max-height:118px}.speech{padding:12px 13px}.speech b{font-size:14px}.speech p{font-size:12px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="history.back()">‹ 戻る</button><div class="title">私のYELLの木</div><button id="help" class="help" aria-label="YELLの木の説明">?</button></header>
<section class="world"><img id="forest" class="forest" alt="森"><div class="sunwash"></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><div class="groundGlow"></div><div id="treeHolder" class="treeHolder"><img id="treeImg" class="treeImg" alt="成長中のYELLの木"></div><div id="stage" class="stage">成長を読み込み中…</div></section>
<section class="summary"><div class="summaryTop"><h2>🌳 成長中のYELLの木</h2><div class="treeCount">大樹 <strong id="grown">0</strong>本</div></div><div class="rule">50YELLたまると、大樹が1本育ちます</div><div class="meter"><span id="bar"></span></div><div class="numbers"><strong id="current">0</strong><span>/ 50 YELL</span></div><div class="remaining">次の大樹まで <strong id="remain">あと50YELL</strong></div><div id="milestones" class="milestones"></div></section>
<section class="sonaRow"><div class="sonaWrap"><img id="sonaImg" class="sonaImg" alt="そなピー"></div><div class="speech"><b>そなピーからYELL！</b><p id="cheer">今日の一歩も、ちゃんと木の力になってるよ。</p></div></section>
<div class="tip">🌱 小さな備えや学びの積み重ねが、YELLの木を育てます。</div>
</main>
<div id="modalBack" class="modalBack"><section class="modal"><h3>🌳 YELLの木って？</h3><p>そなYELLの中で備えたり、学んだりした一歩がYELLになります。50YELLたまると大樹が1本育ち、YELLは次の木へ向けてまた積み重なっていきます。</p><button id="close" class="close">閉じる</button></section></div>
<script src="./yell-cycle.js?v=1"></script>
<script>
const $=id=>document.getElementById(id);
async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}
function makeMascotTransparent(src){return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);const im=ctx.getImageData(0,0,w,h),d=im.data,n=w*h,cand=new Uint8Array(n),seen=new Uint8Array(n),q=new Int32Array(n);for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mn>205&&mx-mn<52)cand[i]=1}let qh=0,qt=0;const push=i=>{if(i>=0&&i<n&&cand[i]&&!seen[i]){seen[i]=1;q[qt++]=i}};for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}while(qh<qt){const i=q[qh++],x=i%w,y=(i/w)|0;if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}for(let i=0;i<n;i++)if(seen[i])d[i*4+3]=0;const labels=new Int32Array(n),sizes=[0];let comp=0,best=0,bestSize=0;for(let s=0;s<n;s++){if(d[s*4+3]<=24||labels[s])continue;comp++;sizes[comp]=0;qh=0;qt=0;labels[s]=comp;q[qt++]=s;while(qh<qt){const i=q[qh++];sizes[comp]++;const x=i%w,y=(i/w)|0;const nn=[x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1];for(const j of nn){if(j>=0&&d[j*4+3]>24&&!labels[j]){labels[j]=comp;q[qt++]=j}}}if(sizes[comp]>bestSize){bestSize=sizes[comp];best=comp}}let minX=w,minY=h,maxX=-1,maxY=-1;for(let i=0;i<n;i++){if(labels[i]!==best)d[i*4+3]=0;if(d[i*4+3]>20){const x=i%w,y=(i/w)|0;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}ctx.putImageData(im,0,0);if(maxX<minX||maxY<minY)return resolve(src);const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(w,maxX+1+pad),y1=Math.min(h,maxY+1+pad),cw=x1-x0,ch=y1-y0,c2=document.createElement('canvas');c2.width=cw;c2.height=ch;c2.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);resolve(c2.toDataURL('image/png'))}catch(e){resolve(src)}};img.onerror=()=>resolve(src);img.src=src})}
async function loadArt(){try{const[bg,tr,sp]=await Promise.all([txt('./assets/tree-forest-v74.txt?v=20260831p'),txt('./assets/yell-tree-cute-b64.txt?v=20260831p'),txt('./assets/sonapi-official-b64.txt?v=20260831p')]);$('forest').src='data:image/jpeg;base64,'+bg;$('treeImg').src='data:image/webp;base64,'+tr;const clean=await makeMascotTransparent('data:image/webp;base64,'+sp);$('sonaImg').src=clean}catch(e){console.error(e)}}
function level(n){if(n>=45)return[57,'🌳 もうすぐ大樹！'];if(n>=35)return[53,'🌿 立派な木になってきた！'];if(n>=25)return[48,'🍃 ぐんぐん成長中！'];if(n>=15)return[41,'🌱 小さな木に育ったよ！'];if(n>=7)return[31,'🍃 葉っぱが増えてきた！'];if(n>=3)return[20,'🌱 小さな芽が出たよ！'];return[14,'🌱 小さな芽からスタート']}
function cheerFor(n){if(n>=45)return'あと少し！ここまで育てた一歩一歩が、もう大樹の力になってるよ✨';if(n>=35)return'すごく育ってきたね！焦らず、今日できる一歩を続けていこう😊';if(n>=20)return'いい感じに育ってるよ！備えも学びも、ちゃんと積み重なってる🌿';if(n>=7)return'葉っぱが増えてきたよ！小さな一歩が目に見えるって嬉しいね😊';return'今日の一歩も、ちゃんと木の力になってるよ。まずは小さく始めよう🌱'}
function renderMilestones(cur){const vals=[0,10,20,35,50],labels=['芽','若葉','小さな木','大きな木','大樹'];$('milestones').innerHTML=vals.map((v,i)=>{const on=cur>=v,now=i<vals.length-1&&cur>=v&&cur<vals[i+1];return`<div class="mark ${on?'on':''} ${now?'now':''}"><div class="dot">${on?'✓':''}</div>${labels[i]}</div>`}).join('')}
function render(){const s=window.SonaYellCycle?SonaYellCycle.get():{yell:0,greatTrees:0};const cur=Math.max(0,Math.min(49,Number(s.yell)||0)),grown=Math.max(0,Number(s.greatTrees)||0),[size,label]=level(cur);$('grown').textContent=grown;$('current').textContent=cur;$('remain').textContent='あと '+(50-cur)+'YELL';$('bar').style.width=(cur/50*100)+'%';$('stage').textContent=label;$('treeHolder').style.width=size+'%';$('cheer').textContent=cheerFor(cur);renderMilestones(cur)}
$('help').onclick=()=>$('modalBack').classList.add('show');$('close').onclick=()=>$('modalBack').classList.remove('show');$('modalBack').onclick=e=>{if(e.target===$('modalBack'))$('modalBack').classList.remove('show')};
loadArt();render();addEventListener('storage',render);addEventListener('pageshow',render);addEventListener('focus',render);
</script>
</body>
</html>
