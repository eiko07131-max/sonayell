<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我が家の備え｜そなYELL</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f8f7ec;color:#3f4d36}.top{position:sticky;top:0;z-index:9;background:#fffdf5;border-bottom:1px solid #e7e1c9;padding:11px 12px;display:flex;align-items:center}.back{border:1px solid #c9dfb8;background:#fff;border-radius:50%;width:36px;height:36px;color:#23833e;font-size:19px;font-weight:900}.top b{margin-left:9px;font-size:18px;color:#5a4523}.y{margin-left:auto;background:#fff0a8;border-radius:99px;padding:7px 9px;font-weight:900}.wrap{max-width:620px;margin:auto;padding:14px 12px 34px}.hero{text-align:center}.hero h1{font-size:24px;margin:4px 0;color:#5c4522}.hero p{font-size:14px;line-height:1.7}.summary,.progressCard{background:#fff;border:1px solid #eee1bc;border-radius:18px;padding:13px;margin-bottom:13px}.sumrow{display:flex;justify-content:space-between;font-weight:900}.bar{height:10px;background:#e9eee2;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:#25a45c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{border:1px solid #eadfbd;background:#fff;border-radius:19px;padding:14px 11px;min-height:125px;text-align:left;box-shadow:0 3px 10px #654b1b0c}.cat .ico{font-size:34px}.cat strong{display:block;color:#356f38;font-size:16px;margin-top:5px}.cat small{display:block;margin-top:5px;color:#7b806f}.cat .n{margin-top:8px;font-weight:900;color:#2b9b52;font-size:12px}.detail{display:none}.detail.show{display:block}.hide{display:none!important}.crumb{text-align:center;font-weight:900;color:#7b5a24;margin:2px 0 12px;font-size:19px}.progressCard{display:flex;align-items:center;gap:12px}.big{font-size:23px;font-weight:900;color:#21763d}.items{display:grid;gap:8px}.item{background:#fff;border:1px solid #eadfbd;border-radius:16px;padding:11px;display:grid;grid-template-columns:31px 1fr auto;gap:9px;align-items:center}.item input{width:23px;height:23px;accent-color:#10a857}.item strong{display:block;font-size:14px}.item small{display:block;font-size:11px;line-height:1.45;color:#777;margin-top:3px}.ok{font-size:10px;background:#dff5d7;color:#25863e;border-radius:99px;padding:5px 7px;font-weight:900;visibility:hidden}.item:has(input:checked) .ok{visibility:visible}.tip{margin-top:10px;background:#fff5c9;border-radius:15px;padding:11px;font-size:12px;line-height:1.6}.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:13px;padding:12px;font-weight:900}.green{background:#299c49;color:#fff;flex:1}.light{background:#edf5e8;color:#327341}.review{margin-top:10px;background:#fff;border:1px solid #eadfbd;border-radius:15px;padding:11px}.review input{padding:9px;border:1px solid #ccd9c3;border-radius:9px}.toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:120;background:#fff4ad;border:3px solid #3ca65b;border-radius:22px;padding:18px 24px;text-align:center;font-weight:900;font-size:19px;box-shadow:0 10px 35px #0003;display:none}.toast.show{display:block}.leaf{position:fixed;top:-50px;font-size:31px;z-index:110;pointer-events:none;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(520deg);opacity:.1}}@media(max-width:420px){.grid{grid-template-columns:1fr}.cat{min-height:105px}}</style></head><body><header class="top"><button class="back" onclick="back()">←</button><b>🧺 我が家の備え</b><span class="y">🌟 <span id="yell">0</span></span></header><main class="wrap"><section id="hero" class="hero"><h1>我が家の備え</h1><p>下のカテゴリーから気になる備えを選んでね。<br>一つずつチェックしながら、我が家の備えを進めていこう！✨</p></section><section id="summary" class="summary"><div class="sumrow"><span>📋 全体の備え</span><span id="allCount">0 / 60</span></div><div class="bar"><span id="allBar"></span></div></section><section id="cats" class="grid"></section><section id="detail" class="detail"><div id="crumb" class="crumb"></div><div class="progressCard"><div style="font-size:35px">📋</div><div><div id="catCount" class="big"></div><small>チェック済み</small></div><div style="margin-left:auto;font-size:34px">🌱</div></div><div id="items" class="items"></div><div class="tip">💡 一気に全部じゃなくて大丈夫。できるところから少しずつ備えよう！</div><div class="review">📅 次の振り返り日　<input id="reviewDate" type="date" onchange="saveReview(this.value)"><div id="reviewMsg" style="margin-top:7px;font-size:12px;color:#278244"></div></div><div class="actions"><button class="btn light" onclick="showCats()">← カテゴリーへ</button><button class="btn green" onclick="saveReview(document.getElementById('reviewDate').value,true)">振り返り日を保存</button></div></section></main><div id="toast" class="toast"></div><script>const I=(a)=>a.map(x=>Array.isArray(x)?x:[x,'家族に合った備えになっているか確認しよう']);const defs=[{id:'water',ico:'💧',name:'水の備え',items:I([['飲料水を人数分備える','1人1日3Lを目安に、最低3日・できれば7日分'],['調理用の水も含めて考える','飲む分だけでなく調理に使う水も忘れずに'],['生活用水を確保する','手洗いや清掃などに使う水も考えよう'],'給水袋・給水容器を用意する','水の保管場所を家族で確認する','賞味期限・保存期限を確認する','持ち出し用の水を準備する','断水時の水の使い方を家族で話す','ペット用の水を備える','複数の場所に分けて保管する','空の清潔な容器を準備する','ローリングストックで定期的に入れ替える'])},{id:'food',ico:'🍱',name:'食料の備え',items:I([['食料を最低3日・できれば7日分備える','普段食べる食品を少し多めに持つ方法でもOK'],'家族が食べ慣れた食品を備える','ローリングストックをしている','カセットコンロを備える','ガスボンベを十分に備える','缶切り・キッチンばさみを用意する','ラップ・アルミホイル・保存袋を備える','紙皿・紙コップ・割り箸を備える','加熱せず食べられる食品を備える','乳幼児・高齢者・アレルギー等の食事を確認する','ペットの食料を備える','食品の期限を定期的に確認する'])},{id:'toilet',ico:'🚽',name:'トイレ・衛生の備え',items:I([['携帯・簡易トイレを備える','目安は1人1日5回×7日＝35回分'],'家族人数に合う回数分を確認する','携帯トイレの使い方を一度確認する','トイレットペーパーを備える','大きめのゴミ袋を備える','防臭袋・消臭用品を備える','ウェットティッシュを備える','手指消毒用品を備える','生理用品を備える','おむつ・介護用品を確認する','歯みがき・口腔ケア用品を備える','保管場所と廃棄方法を家族で確認する'])},{id:'power',ico:'🔋',name:'電源・情報の備え',items:I(['モバイルバッテリーを備える','モバイルバッテリーを定期的に充電する','充電ケーブルをまとめておく','乾電池を備える','懐中電灯・ランタンを備える','携帯ラジオを備える','家族の連絡方法を決める','災害用伝言ダイヤル171を知る','重要な連絡先を紙にも控える','スマホの省電力設定を確認する','車など別の充電方法を確認する','地域の防災情報を受け取る方法を確認する'])},{id:'safety',ico:'🏠',name:'家具・家の安全',items:I(['背の高い家具を固定する','テレビ・家電の転倒防止をする','家具の上に重い物を置かない','寝る場所に家具が倒れない配置にする','出入口を家具でふさがない配置にする','ガラスの飛散防止対策をする','寝室に靴・スリッパを置く','寝室にライトを置く','消火器の場所と期限を確認する','感震ブレーカーを検討・確認する','家の中の避難経路を家族で確認する','非常持ち出し袋をすぐ取れる場所に置く'])}];const KEY='sonayell_prepare_v21';let st={checked:{},awardedCats:{},review:{}};try{st={...st,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}st.checked=st.checked||{};st.awardedCats=st.awardedCats||{};st.review=st.review||{};let current=null;function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function saveApp(s){localStorage.setItem('sonayell_v2',JSON.stringify(s))}function persist(){localStorage.setItem(KEY,JSON.stringify(st))}function count(d){return d.items.filter((_,i)=>st.checked[d.id+'-'+i]).length}function leaves(){for(let i=0;i<28;i++){let e=document.createElement('span');e.className='leaf';e.textContent='🍃';e.style.left=Math.random()*96+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}}function award(d){if(st.awardedCats[d.id])return;st.awardedCats[d.id]=true;persist();let s=app();s.yell=(+s.yell||0)+10;s.leaves=(+s.leaves||0)+10;s.tree_growth=(+s.tree_growth||0)+10;saveApp(s);leaves();toast('🎉 '+d.name+' コンプリート！<br>＋10 YELL 🌳');renderTop()}function toast(x){let t=document.getElementById('toast');t.innerHTML=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function renderTop(){let s=app();document.getElementById('yell').textContent=+s.yell||0;let n=defs.reduce((a,d)=>a+count(d),0),total=60;document.getElementById('allCount').textContent=n+' / '+total;document.getElementById('allBar').style.width=(n/total*100)+'%'}function renderCats(){let b=document.getElementById('cats');b.innerHTML='';defs.forEach(d=>{let x=document.createElement('button');x.className='cat';x.innerHTML='<span class="ico">'+d.ico+'</span><strong>'+d.name+'</strong><small>タップして備えをチェック</small><div class="n">'+count(d)+' / 12 チェック済み'+(st.awardedCats[d.id]?'　🎉達成済み':'')+'</div>';x.onclick=()=>openCat(d.id);b.appendChild(x)});renderTop()}function openCat(id){current=defs.find(d=>d.id===id);hero.classList.add('hide');summary.classList.add('hide');cats.classList.add('hide');detail.classList.add('show');crumb.textContent=current.ico+' '+current.name;reviewDate.value=st.review[current.id]||'';reviewMsg.textContent=st.review[current.id]?'次回：'+st.review[current.id]:'';renderItems();scrollTo(0,0)}function renderItems(){items.innerHTML='';current.items.forEach((it,i)=>{let k=current.id+'-'+i,l=document.createElement('label');l.className='item';l.innerHTML='<input type="checkbox" '+(st.checked[k]?'checked':'')+'><div><strong>'+it[0]+'</strong><small>'+it[1]+'</small></div><span class="ok">できています！</span>';l.querySelector('input').onchange=e=>{let before=count(current);st.checked[k]=e.target.checked;persist();let after=count(current);renderItems();renderTop();if(before<12&&after===12)award(current)};items.appendChild(l)});catCount.textContent=count(current)+' / 12'}function saveReview(v,notice){if(!current)return;if(!v){if(notice)toast('📅 日付を選んでね');return}st.review[current.id]=v;persist();reviewMsg.textContent='次回：'+v;if(notice)toast('📅 振り返り日を保存したよ！')}function showCats(){current=null;detail.classList.remove('show');hero.classList.remove('hide');summary.classList.remove('hide');cats.classList.remove('hide');renderCats();scrollTo(0,0)}function back(){if(current)showCats();else location.href='./home.html?v=21'}renderCats();</script></body></html>
