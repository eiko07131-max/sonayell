<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我が家の備え｜そなYELL</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f8f7ec;color:#3f4d36}.top{position:sticky;top:0;z-index:9;background:#fffdf5;border-bottom:1px solid #e7e1c9;padding:11px 12px;display:flex;align-items:center}.back{border:1px solid #c9dfb8;background:#fff;border-radius:50%;width:36px;height:36px;color:#23833e;font-size:19px;font-weight:900}.top b{margin-left:9px;font-size:19px;color:#5a4523}.y{margin-left:auto;background:#fff0a8;border-radius:99px;padding:7px 9px;font-weight:900}.wrap{max-width:620px;margin:auto;padding:14px 12px 34px}.hero{text-align:center}.hero h1{font-size:23px;margin:4px 0;color:#5c4522}.hero p{font-size:14px;line-height:1.7;margin:7px 0 16px}.summary{background:#fff;border:1px solid #eee1bc;border-radius:18px;padding:13px;margin-bottom:13px}.sumrow{display:flex;justify-content:space-between;font-weight:900}.bar{height:10px;background:#e9eee2;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:#25a45c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{border:1px solid #eadfbd;background:#fff;border-radius:19px;padding:14px 11px;min-height:128px;text-align:left;box-shadow:0 3px 10px #654b1b0c;cursor:pointer}.cat .ico{font-size:34px}.cat strong{display:block;color:#356f38;font-size:16px;margin-top:5px}.cat small{display:block;margin-top:5px;color:#7b806f;line-height:1.45}.cat .n{margin-top:8px;font-weight:900;color:#2b9b52;font-size:12px}.detail{display:none}.detail.show{display:block}.cats.hide,.hero.hide,.summary.hide{display:none}.crumb{text-align:center;font-weight:900;color:#7b5a24;margin:2px 0 12px;font-size:18px}.progressCard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #eadfbd;border-radius:17px;padding:11px;margin-bottom:9px}.clip{font-size:35px}.big{font-size:23px;font-weight:900;color:#21763d}.items{display:grid;gap:8px}.item{background:#fff;border:1px solid #eadfbd;border-radius:16px;padding:10px;display:grid;grid-template-columns:31px 1fr auto;gap:9px;align-items:center}.item input{width:23px;height:23px;accent-color:#10a857}.item strong{display:block;font-size:14px;color:#3e432f}.item small{display:block;font-size:10px;line-height:1.45;color:#777;margin-top:3px}.ok{font-size:10px;background:#dff5d7;color:#25863e;border-radius:99px;padding:5px 7px;font-weight:900;visibility:hidden}.item:has(input:checked) .ok{visibility:visible}.tip{margin-top:10px;background:#fff5c9;border-radius:15px;padding:11px;font-size:11px;line-height:1.6}.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:13px;padding:12px;font-weight:900}.green{background:#299c49;color:#fff;flex:1}.light{background:#edf5e8;color:#327341}.toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:120;background:#fff4ad;border:3px solid #3ca65b;border-radius:22px;padding:18px 24px;text-align:center;font-weight:900;font-size:20px;box-shadow:0 10px 35px #0003;display:none}.toast.show{display:block;animation:pop .35s ease-out}@keyframes pop{from{transform:translateX(-50%) scale(.65);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}.leaf{position:fixed;top:-50px;font-size:31px;z-index:110;pointer-events:none;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(520deg);opacity:.1}}@media(max-width:420px){.grid{grid-template-columns:1fr}.cat{min-height:105px}}</style></head><body><header class="top"><button class="back" onclick="back()">←</button><b>🧺 我が家の備えチェック 🏡</b><span class="y">🌟 <span id="yell">0</span></span></header><main class="wrap"><section id="hero" class="hero"><h1>我が家の備え</h1><p>下のカテゴリーから気になる備えを選んでね。<br>一つずつチェックしながら、我が家の備えを進めていこう！✨</p></section><section id="summary" class="summary"><div class="sumrow"><span>📋 全体の備え</span><span id="allCount">0 / 72</span></div><div class="bar"><span id="allBar"></span></div></section><section id="cats" class="cats grid"></section><section id="detail" class="detail"><div id="crumb" class="crumb"></div><div class="progressCard"><div class="clip">📋</div><div><div id="catCount" class="big"></div><small>チェック済み</small></div><div style="margin-left:auto;font-size:34px">🌱</div></div><div id="items" class="items"></div><div class="tip">💡 カテゴリーごとにチェックして、家族みんなの安心につなげましょう！</div><div class="actions"><button class="btn light" onclick="showCats()">← カテゴリーへ</button><button class="btn green" onclick="alert('振り返り日の設定は試作品では準備中です')">📅 振り返り日を設定する</button></div></section></main><div id="toast" class="toast">🎉 カテゴリーコンプリート！<br>＋10 YELL 🌳</div><script>const defs=[{id:'food',ico:'🍱',name:'食料・調理の備え',items:[['非常食を3日分以上用意する','家族の人数×3日分を目安に備えましょう'],['カセットコンロ・ガスボンベを備える','停電時でも温かい食事がとれます'],['非常食を家族の好みに合わせて用意する','食べ慣れたものがあると安心です'],['ラップ・アルミホイル・ジッパー袋を備える','食器がなくても、食材を清潔に保存できます'],['調味料を常備する','塩・しょうゆ・みそなどがあると食事の幅が広がります'],['保冷バッグを用意する','夏場の食中毒対策にも有効です'],['飲料水を調理分も含めて備える','飲む水とは別に調理用も意識しましょう'],['缶切り・キッチンばさみを用意する','電気がなくても使える道具を'],['紙皿・紙コップ・割り箸を備える','断水時の洗い物を減らせます'],['ローリングストックをしている','普段使いながら買い足しましょう'],['乳幼児・高齢者用の食事を確認する','家族に合わせた食事を忘れずに'],['ペットの食料も備える','家族の一員の分も忘れずに']]},{id:'water',ico:'💧',name:'水の備え',items:mk(['飲料水を人数分備える','生活用水を確保する','給水袋を用意する','水の保管場所を確認する','賞味期限を確認する','持ち出し用の水を準備する','浄水手段を知る','断水時の使い方を家族で話す','ペット用の水を備える','調理用の水を考える','予備容器を準備する','定期的に入れ替える'])},{id:'toilet',ico:'🚽',name:'トイレ・衛生の備え',items:mk(['携帯トイレを備える','家族人数分の回数を考える','トイレットペーパーを備える','ゴミ袋を備える','防臭袋を備える','ウェットティッシュを備える','手指消毒を備える','生理用品を備える','おむつ等を確認する','簡易トイレの使い方を知る','保管場所を決める','定期的に見直す'])},{id:'light',ico:'🔦',name:'明かり・安全の備え',items:mk(['懐中電灯を備える','ランタンを備える','予備電池を備える','寝室にライトを置く','玄関にライトを置く','笛を備える','軍手を備える','スリッパを備える','家具転倒対策を確認する','ガラス飛散対策を確認する','消火器を確認する','夜間の避難経路を確認する'])},{id:'power',ico:'🔋',name:'停電・電源・情報',items:mk(['モバイルバッテリーを備える','充電ケーブルをまとめる','乾電池を備える','ラジオを備える','家族の連絡方法を決める','災害用伝言サービスを知る','重要な連絡先を紙にも控える','スマホの省電力設定を知る','車での充電方法を確認する','予備電源を検討する','地域の情報入手方法を知る','定期的に充電状態を確認する'])},{id:'medical',ico:'🩹',name:'救急・健康の備え',items:mk(['救急セットを備える','常用薬を確認する','お薬手帳を準備する','マスクを備える','体温計を備える','消毒用品を備える','持病情報をまとめる','眼鏡・コンタクト用品を備える','歯みがき用品を備える','タオルを備える','家族のアレルギーを共有する','定期的に期限を確認する'])}];function mk(a){return a.map(x=>[x,'家族に合った備えを確認しておきましょう'])}const KEY='sonayell_prepare_v20';let st={checked:{},awardedCats:{}};try{st={...st,...JSON.parse(localStorage.getItem(KEY)||'{}')};st.awardedCats=st.awardedCats||{}}catch(e){}let current=null;function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function saveApp(s){localStorage.setItem('sonayell_v2',JSON.stringify(s))}function persist(){localStorage.setItem(KEY,JSON.stringify(st))}function countDef(d){return d.items.filter((_,i)=>st.checked[d.id+'-'+i]).length}function allCount(){return defs.reduce((n,d)=>n+countDef(d),0)}function leaves(){for(let i=0;i<28;i++){let e=document.createElement('span');e.className='leaf';e.textContent='🍃';e.style.left=Math.random()*96+'vw';e.style.animationDelay=Math.random()*.8+'s';e.style.fontSize=(22+Math.random()*20)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}}function awardCategory(d){if(st.awardedCats[d.id])return;st.awardedCats[d.id]=true;persist();let s=app();s.yell=(Number(s.yell)||0)+10;s.leaves=(Number(s.leaves)||0)+10;s.tree_growth=(Number(s.tree_growth)||0)+10;saveApp(s);document.getElementById('yell').textContent=s.yell;leaves();let t=document.getElementById('toast');t.innerHTML='🎉 '+d.name+'<br>コンプリート！ ＋10 YELL 🌳';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function renderTop(){document.getElementById('yell').textContent=Number(app().yell)||0;let n=allCount(),t=defs.reduce((a,d)=>a+d.items.length,0);document.getElementById('allCount').textContent=n+' / '+t;document.getElementById('allBar').style.width=(n/t*100)+'%'}function renderCats(){let b=document.getElementById('cats');b.innerHTML='';defs.forEach(d=>{let n=countDef(d),x=document.createElement('button');x.className='cat';x.innerHTML='<span class="ico">'+d.ico+'</span><strong>'+d.name+'</strong><small>タップして備えをチェック</small><div class="n">'+n+' / '+d.items.length+' チェック済み'+(st.awardedCats[d.id]?'　🎉＋10YELL済み':'')+'</div>';x.onclick=()=>openCat(d.id);b.appendChild(x)});renderTop()}function openCat(id){current=defs.find(d=>d.id===id);document.getElementById('hero').classList.add('hide');document.getElementById('summary').classList.add('hide');document.getElementById('cats').classList.add('hide');document.getElementById('detail').classList.add('show');document.getElementById('crumb').textContent=current.ico+' '+current.name;renderItems();scrollTo(0,0)}function renderItems(){let b=document.getElementById('items');b.innerHTML='';current.items.forEach((it,i)=>{let k=current.id+'-'+i,l=document.createElement('label');l.className='item';l.innerHTML='<input type="checkbox" '+(st.checked[k]?'checked':'')+'><div><strong>'+it[0]+'</strong><small>'+it[1]+'</small></div><span class="ok">できています！</span>';l.querySelector('input').onchange=e=>{let before=countDef(current);st.checked[k]=e.target.checked;persist();let after=countDef(current);renderItems();renderTop();if(before<current.items.length&&after===current.items.length)awardCategory(current)};b.appendChild(l)});document.getElementById('catCount').textContent=countDef(current)+' / '+current.items.length}function showCats(){current=null;document.getElementById('detail').classList.remove('show');document.getElementById('hero').classList.remove('hide');document.getElementById('summary').classList.remove('hide');document.getElementById('cats').classList.remove('hide');renderCats();scrollTo(0,0)}function back(){if(current)showCats();else location.href='./home.html?v=20'}renderCats();</script></body></html>
