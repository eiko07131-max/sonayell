<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我が家の備え｜そなYELL</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f5faef;color:#36563b}.top{position:sticky;top:0;z-index:5;background:#fff;padding:13px 14px;display:flex;align-items:center;border-bottom:1px solid #dbe9d8}.top button{border:0;background:#edf7e9;border-radius:12px;padding:9px 11px;color:#397a44;font-weight:800}.top b{margin-left:10px;font-size:19px;color:#397a44}.y{margin-left:auto;background:#fff1a6;border-radius:99px;padding:7px 10px;font-weight:900;color:#755c20}.wrap{max-width:650px;margin:auto;padding:18px 14px 35px}.hero{background:linear-gradient(135deg,#dff5d8,#fff4b8);padding:18px;border-radius:22px}.hero h1{margin:0 0 7px;font-size:23px}.hero p{margin:0;line-height:1.7;font-size:14px}.progress{margin:15px 0;background:#fff;padding:14px;border-radius:17px}.row{display:flex;justify-content:space-between;font-weight:800;font-size:13px}.bar{height:10px;background:#e3efdf;border-radius:99px;margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;background:#4e9956;width:0}.cat{background:#fff;border-radius:20px;margin:10px 0;padding:15px;box-shadow:0 3px 12px #315c3714}.cat h2{font-size:17px;margin:0 0 10px;color:#397a44}.item{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px solid #edf2e9;font-size:14px;line-height:1.5}.item input{width:22px;height:22px;accent-color:#4e9956;flex:0 0 auto}.done{display:none;background:#fff1a6;border-radius:20px;padding:20px;text-align:center;font-weight:900;line-height:1.8;margin-top:16px}.done.show{display:block}.home{width:100%;border:0;background:#4e9956;color:#fff;border-radius:15px;padding:14px;font-weight:900;font-size:16px;margin-top:16px}.leaf{position:fixed;top:-40px;font-size:28px;z-index:99;pointer-events:none;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(420deg);opacity:.2}}</style></head><body><header class="top"><button onclick="location.href='./home.html?v=18'">← ホーム</button><b>🏠 我が家の備え</b><span class="y">YELL 🌟 <span id="yell">0</span></span></header><main class="wrap"><section class="hero"><h1>我が家の備えチェック</h1><p>下のカテゴリーから気になる備えを選んでね。<br>一つずつチェックしながら、我が家の備えを進めていこう！✨</p></section><div class="progress"><div class="row"><span>備えの進み具合</span><span id="count">0 / 18</span></div><div class="bar"><span id="bar"></span></div></div><div id="cats"></div><div id="done" class="done">🎉 我が家の備え、コンプリート！<br><strong>10 YELL ボン！</strong><br>あなたのYELLの木にも反映されたよ 🌳</div><button class="home" onclick="location.href='./home.html?v=18'">ホームへ戻る</button></main><script>const groups=[['💧 水',['飲料水を家族分備えている','生活用水も意識して備えている','水の保管場所を家族で確認している']],['🍚 食料',['すぐ食べられる食品がある','主食になる備蓄がある','普段食べる物を少し多めに備えている']],['🚽 トイレ',['携帯・簡易トイレを備えている','トイレットペーパーを備えている','ゴミ袋・防臭対策を準備している']],['🔦 ライト',['懐中電灯やランタンがある','予備の電池がある','夜でも取り出せる場所に置いている']],['🔋 通信・電源',['モバイルバッテリーがある','充電ケーブルをまとめている','家族の連絡方法を決めている']],['🩹 救急',['救急セットがある','常用薬を確認している','衛生用品を備えている']]];const KEY='sonayell_prepare_v18';let data={checked:{},awarded:false};try{data={...data,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function saveState(s){localStorage.setItem('sonayell_v2',JSON.stringify(s))}function currentYell(){return Number(state().yell)||0}function leaves(){for(let i=0;i<18;i++){const e=document.createElement('span');e.className='leaf';e.textContent='🍃';e.style.left=(Math.random()*95)+'vw';e.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}}function add10(){const s=state();s.yell=(Number(s.yell)||0)+10;s.leaves=(Number(s.leaves)||0)+10;s.tree_growth=(Number(s.tree_growth)||0)+10;saveState(s);document.getElementById('yell').textContent=s.yell;leaves()}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){const box=document.getElementById('cats');box.innerHTML='';let n=0,total=groups.reduce((a,g)=>a+g[1].length,0);groups.forEach((g,gi)=>{const d=document.createElement('section');d.className='cat';d.innerHTML='<h2>'+g[0]+'</h2>';g[1].forEach((t,ii)=>{const k=gi+'-'+ii;if(data.checked[k])n++;const l=document.createElement('label');l.className='item';l.innerHTML='<input type="checkbox" '+(data.checked[k]?'checked':'')+'><span>'+t+'</span>';l.querySelector('input').onchange=e=>{data.checked[k]=e.target.checked;persist();render();};d.appendChild(l)});box.appendChild(d)});document.getElementById('count').textContent=n+' / '+total;document.getElementById('bar').style.width=(n/total*100)+'%';document.getElementById('yell').textContent=currentYell();if(n===total){if(!data.awarded){data.awarded=true;persist();add10()}document.getElementById('done').classList.add('show')}else document.getElementById('done').classList.remove('show')}render();</script></body></html>
