<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>マイページ｜そなYELL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f5faef;color:#36563b}button,input{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #dce9d8}.back{border:0;border-radius:999px;background:#edf7e9;color:#2d7441;padding:10px 13px;font-weight:900}.title{font-size:20px;font-weight:900;color:#26733d}.yell{margin-left:auto;background:#fff1a6;border-radius:999px;padding:8px 11px;font-weight:900;color:#755c20}.wrap{max-width:620px;margin:auto;padding:16px 14px 40px}.summary{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#e8f8df,#fff7c8);border-radius:24px;padding:17px;margin-bottom:14px;box-shadow:0 5px 16px #315c3714}.avatarBig{font-size:50px}.summary strong{display:block;font-size:21px;color:#26733d}.summary span{display:block;margin-top:4px;color:#6b806d}.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 16px #315c3714}.card h2{margin:0 0 6px;color:#26733d}.lead{font-size:13px;line-height:1.6;color:#66786a}.label{display:block;margin:15px 0 6px;font-size:13px;font-weight:900;color:#4b7651}.input{width:100%;border:2px solid #dce9d8;border-radius:15px;padding:13px 14px;background:#fbfff9;outline:0}.input:focus{border-color:#66a66c}.privacy{font-size:11px;line-height:1.55;background:#f1f8ed;border-radius:13px;padding:10px;margin-top:8px}.avatars{display:flex;gap:8px;flex-wrap:wrap}.avatar{width:50px;height:50px;border:2px solid transparent;border-radius:15px;background:#edf7e9;font-size:26px}.avatar.on{border-color:#4e9956;background:#fff2b7}.save{width:100%;border:0;border-radius:16px;margin-top:17px;padding:14px;background:#4e9956;color:#fff;font-weight:900}.status{text-align:center;font-size:12px;min-height:20px;margin-top:10px;color:#59715d}.logout{width:100%;border:2px solid #f0d6d2;border-radius:16px;margin-top:10px;padding:12px;background:#fff;color:#98544d;font-weight:900}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=82'">← ホーム</button><div class="title">👤 マイページ</div><div class="yell">YELL ✨ <span id="yell">0</span></div></header><main class="wrap"><section class="summary"><div id="avatarBig" class="avatarBig">🌱</div><div><strong id="nameSummary">ゲスト</strong><span id="regionSummary">地域は未登録</span></div></section><section class="card"><h2>わたしのプロフィール</h2><div class="lead">投稿に表示するニックネームなどを設定できます。</div><label class="label" for="nickname">ニックネーム</label><input id="nickname" class="input" maxlength="30" placeholder="例：えいこ"><label class="label" for="region">居住地域</label><input id="region" class="input" maxlength="60" placeholder="例：さいたま市緑区"><div class="privacy">🔒 正確な住所や自宅位置は登録しません。市区町村・区くらいまでにしてね。</div><span class="label">投稿アイコン</span><div class="avatars" id="avatars"><button class="avatar" data-a="🌱">🌱</button><button class="avatar" data-a="😊">😊</button><button class="avatar" data-a="🙂">🙂</button><button class="avatar" data-a="😎">😎</button><button class="avatar" data-a="🐶">🐶</button><button class="avatar" data-a="🌼">🌼</button></div><button id="save" class="save">保存する</button><div id="status" class="status"></div><button id="logout" class="logout">🚪 ログアウト</button></section></main><script>const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';let token=localStorage.getItem('sonayell_access_token')||'',guest=localStorage.getItem('sonayell_guest_token')||'',selected='🌱';if(!guest){guest=crypto.randomUUID();localStorage.setItem('sonayell_guest_token',guest)}const $=id=>document.getElementById(id);function localYell(){try{return Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0}catch(e){return 0}}function paintYell(){$('yell').textContent=localYell()}function headers(){const h={apikey:K,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h}async function rpc(name,body={}){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(body),cache:'no-store'});if(r.status===401&&token){token='';localStorage.removeItem('sonayell_access_token');localStorage.removeItem('sonayell_refresh_token');return rpc(name,body)}if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}function paint(n='ゲスト',r='',a='🌱'){selected=a||'🌱';$('nickname').value=n==='ゲスト'?'':n;$('region').value=r||'';$('avatarBig').textContent=selected;$('nameSummary').textContent=n||'ゲスト';$('regionSummary').textContent=r||'地域は未登録';document.querySelectorAll('.avatar').forEach(b=>b.classList.toggle('on',b.dataset.a===selected))}document.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{selected=b.dataset.a;paint($('nickname').value.trim()||'ゲスト',$('region').value.trim(),selected)});async function load(){paintYell();try{if(token){const x=await rpc('sona_get_my_account',{});if(x&&x[0])paint(x[0].nickname||'そなYELLユーザー',x[0].region_key||'',x[0].avatar_key||'🌱');else paint()}else{const x=await rpc('sona_get_guest_profile',{p_guest_token:guest});if(x&&x[0])paint(x[0].nickname||'ゲスト',x[0].region||'',x[0].avatar||'🌱');else paint()}}catch(e){paint();$('status').textContent='プロフィールは端末内の状態で表示しています。'}}$('save').onclick=async()=>{const n=$('nickname').value.trim()||'ゲスト',r=$('region').value.trim();$('save').disabled=true;$('status').textContent='保存中…';try{if(token)await rpc('sona_update_my_profile',{p_nickname:n,p_avatar:selected,p_region:r});else await rpc('sona_upsert_guest_profile',{p_guest_token:guest,p_nickname:n,p_avatar:selected,p_region:r});paint(n,r,selected);$('status').textContent='保存したよ 🌱'}catch(e){$('status').textContent='保存できませんでした。通信を確認してね。'}finally{$('save').disabled=false}};$('logout').onclick=()=>{localStorage.removeItem('sonayell_access_token');localStorage.removeItem('sonayell_refresh_token');localStorage.removeItem('sonayell_registered');location.href='./trial.html?v=82'};addEventListener('pageshow',paintYell);addEventListener('focus',paintYell);load();</script></body></html>
