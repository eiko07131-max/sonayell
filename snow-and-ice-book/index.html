<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#182e64" />
    <meta name="description" content="ハカセとこねことあなたのものがたり　ゆきとこおりのまちへ" />
    <title>ハカセとこねことあなたのものがたり　ゆきとこおりのまちへ</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icons/snow-flower-192.png" />
    <link rel="apple-touch-icon" href="icons/snow-flower-192.png" />
    <link rel="manifest" href="manifest.webmanifest?v=1" />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <main class="book" aria-label="ハカセとこねことあなたのものがたり　ゆきとこおりのまちへ">
      <section id="reader" class="reader" aria-live="polite">
        <div id="backdrop" class="backdrop" aria-hidden="true"></div>
        <figure class="page-frame">
          <img id="page-image" class="page-image" src="pages/01-cover.png" alt="表紙：ハカセとこねことあなたのものがたり　ゆきとこおりのまちへ" draggable="false" />
        </figure>
      </section>

      <button id="previous" class="turn previous" type="button" aria-label="前のページへ">‹</button>
      <button id="next" class="turn next" type="button" aria-label="次のページへ">›</button>
      <button id="fullscreen" class="fullscreen" type="button" aria-label="全画面で読む">⛶ <span>全画面</span></button>
      <p id="counter" class="counter" aria-live="off">1 / 11</p>
      <p class="hint">左右にスワイプ ／ 2本指で拡大・縮小</p>
    </main>
    <script src="reader.js?v=1"></script>
  </body>
</html>
