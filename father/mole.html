<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>モグラ叩き</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fffaf3;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#4e4036}button{font:inherit}main{height:100%;max-width:650px;margin:auto;padding:7px 9px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:8px;min-height:42px}.back{border:2px solid #eadfd3;background:#fff;border-radius:12px;padding:8px 11px;font-weight:1000}.title{flex:1;text-align:center;font-size:22px;font-weight:1000}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}.lv{border:2px solid #eadfd3;background:#fff;border-radius:12px;padding:7px 4px;font-weight:1000}.lv.on{background:#fff0df;border-color:#ffb675}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:3px 0}.stat{background:#fff;border:2px solid #eadfd3;border-radius:12px;padding:4px;text-align:center}.stat b{display:block;font-size:20px;line-height:1}.stat span{font-size:10px;font-weight:900;color:#7c6c61}.start{border:0;border-radius:14px;padding:9px;font-size:18px;font-weight:1000;background:linear-gradient(#ffb36f,#ff9850);color:#fff;box-shadow:0 3px 0 #d97532;margin:3px 0}.board{width:min(94vw,calc(100vh - 190px),390px);height:min(94vw,calc(100vh - 190px),390px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:5px auto 2px}.hole{position:relative;border:0;background:transparent;padding:0;touch-action:manipulation}.hole:before{content:"";position:absolute;left:5%;right:5%;bottom:10%;height:31%;border-radius:50%;background:#6f4b38;box-shadow:inset 0 6px 0 #0002}.mole{position:absolute;left:13%;right:13%;bottom:18%;height:67%;border-radius:48% 48% 42% 42%;background:#9a653e;transform:translateY(74%);opacity:0;transition:.09s;box-shadow:inset 0 -9px #0001}.mole.show{transform:translateY(0);opacity:1}.face{position:absolute;inset:18% 0 auto;text-align:center;font-size:clamp(27px,9vw,48px)}.plus{position:absolute;z-index:3;left:50%;top:8%;transform:translate(-50%,0);font-size:28px;font-weight:1000;color:#2f9234;opacity:0}.plus.go{animation:p .45s}@keyframes p{0%{opacity:0;transform:translate(-50%,20%) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.2)}}.ring{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;z-index:9}.ring.go{animation:r .38s}.ring span{font-size:68px;background:#fff;border:5px solid #7bc777;border-radius:50%;width:116px;height:116px;display:grid;place-items:center;box-shadow:0 12px 35px #0002}@keyframes r{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}.note{text-align:center;color:#7c6c61;font-weight:800;font-size:11px;line-height:1.1;margin-top:2px}@media(max-height:570px){.top{display:none}.board{width:min(88vw,calc(100vh - 145px),320px);height:min(88vw,calc(100vh - 145px),320px)}.note{display:none}}</style></head><body><main><div class="top"><button class="back" onclick="stop();location.href='./'">← 目次</button><div class="title">🔨 モグラ叩き</div><span style="width:64px"></span></div><div class="levels"><button class="lv on" data-l="easy" onclick="setL('easy')">初級</button><button class="lv" data-l="mid" onclick="setL('mid')">中級</button><button class="lv" data-l="hard" onclick="setL('hard')">上級</button></div><div class="info"><div class="stat"><b id="score">0</b><span>スコア</span></div><div class="stat"><b id="time">30</b><span>のこり秒</span></div><div class="stat"><b id="best">0</b><span>ベスト</span></div></div><button class="start" id="start" onclick="start()">スタート！</button><div class="board" id="board"></div><div class="note" id="note">初級：ゆっくり。まずはここを基本に。</div></main><div class="ring" id="ring"><span>⭕</span></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],CFG={easy:{sec:30,stay:1250,gap:260,text:'初級：ゆっくり。まずはここを基本に。'},mid:{sec:30,stay:850,gap:190,text:'中級：少し速め。これで十分いいトレーニング。'},hard:{sec:25,stay:560,gap:130,text:'上級：チャレンジ用。無理にやらなくてOK。'}};let lv='easy',run=false,sc=0,tm=30,last=-1,ti=null,tp=null,AC=null;for(let i=0;i<9;i++){let b=document.createElement('button');b.className='hole';b.innerHTML='<div class="mole"><div class="face">🐹</div></div><div class="plus">+1</div>';b.addEventListener('pointerdown',e=>{e.preventDefault();hit(b)});$('#board').appendChild(b)}function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}function pin(){try{audio();let n=AC.currentTime;[[760,0],[980,.055]].forEach(([f,d])=>{let o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.12,n+d);g.gain.exponentialRampToValueAtTime(.001,n+d+.09);o.start(n+d);o.stop(n+d+.1)})}catch(e){}}function ring(){let r=$('#ring');r.classList.remove('go');void r.offsetWidth;r.classList.add('go')}function setL(x){stop();lv=x;sc=0;tm=CFG[x].sec;$('#score').textContent=0;$('#time').textContent=tm;$('#note').textContent=CFG[x].text;$$('.lv').forEach(b=>b.classList.toggle('on',b.dataset.l===x));best()}function best(){$('#best').textContent=localStorage.getItem('mole2_'+lv)||0}best();function start(){audio();stop();run=true;sc=0;tm=CFG[lv].sec;$('#score').textContent=0;$('#time').textContent=tm;$('#start').textContent='プレイ中！';ti=setInterval(()=>{tm--;$('#time').textContent=tm;if(tm<=0)finish()},1000);next(150)}function next(wait){clearTimeout(tp);tp=setTimeout(()=>{if(!run)return;$$('.mole').forEach(m=>{m.classList.remove('show');m.dataset.hit='0'});let i;do{i=Math.floor(Math.random()*9)}while(i===last);last=i;let m=$$('.mole')[i];m.classList.add('show');tp=setTimeout(()=>{m.classList.remove('show');if(run)next(CFG[lv].gap)},CFG[lv].stay)},wait)}function hit(b){let m=b.querySelector('.mole');if(!run||!m.classList.contains('show')||m.dataset.hit==='1')return;m.dataset.hit='1';m.classList.remove('show');sc++;$('#score').textContent=sc;let p=b.querySelector('.plus');p.classList.remove('go');void p.offsetWidth;p.classList.add('go');ring();pin();if(navigator.vibrate)navigator.vibrate(25)}function finish(){stop();let k='mole2_'+lv,b=+(localStorage.getItem(k)||0);if(sc>b)localStorage.setItem(k,sc);best();$('#start').textContent='もう一回！';ring()}function stop(){run=false;clearInterval(ti);clearTimeout(tp);$$('.mole').forEach(m=>m.classList.remove('show'));$('#start').textContent='スタート！'}</script></body></html>
