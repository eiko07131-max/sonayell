<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いつもの脳トレ</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7fbff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#3f5364}.box{text-align:center;padding:32px 20px}.big{font-size:42px}.msg{font-size:20px;font-weight:900;line-height:1.8}.sub{font-size:14px;color:#73889a;margin-top:10px}</style></head><body><div class="box"><div class="big">🧠✨</div><div class="msg" id="msg">脳トレを<br>読み込んでいます…</div><div class="sub">最初だけ少し時間がかかることがあります</div></div><script>(async()=>{const RAW='https://raw.githubusercontent.com/eiko07131-max/sonayell/main/';const DB='anohi_memory_quiz_db_father_editable_v1',STORE='questions',MARK='father_seeded_editable_v1';function openDB(){return new Promise((ok,ng)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}function get(db,k){return new Promise((ok,ng)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}function put2(db,a,b){return new Promise((ok,ng)=>{const t=db.transaction(STORE,'readwrite'),s=t.objectStore(STORE);s.put(a,'all');s.put(true,b);t.oncomplete=ok;t.onerror=()=>ng(t.error)})}function loadImg(src){return new Promise((ok,ng)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=ng;im.src=src})}async function joinPics(srcs){if(srcs.length<2)return srcs[0]||'';try{const ims=await Promise.all(srcs.map(loadImg)),H=420,gap=8,ws=ims.map(im=>Math.max(1,Math.round(im.width*H/im.height))),c=document.createElement('canvas');c.width=ws.reduce((a,b)=>a+b,0)+gap*(ims.length-1);c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);let left=0;ims.forEach((im,i)=>{x.drawImage(im,left,0,ws[i],H);left+=ws[i]+gap});return c.toDataURL('image/jpeg',.82)}catch(e){return srcs[0]||''}}async function seed(){const db=await openDB();if(await get(db,MARK))return;const mod=await fetch(RAW+'brain-training-mother-data/mother_module.html?x='+Date.now()).then(r=>{if(!r.ok)throw Error('module');return r.text()});const qm=mod.match(/const Q=(\[.*?\]);let order=/s);if(!qm)throw Error('questions');const q=JSON.parse(qm[1]);const parts=await Promise.all([0,1,2].map(i=>fetch(RAW+'mother-assets/chunk'+String(i).padStart(2,'0')+'.txt?x='+Date.now()).then(r=>{if(!r.ok)throw Error('photo'+i);return r.text()})));const imgs=JSON.parse(parts.join(''));const out=[];for(const z of q){const srcs=(z.imgs||[]).map(k=>imgs[k]||'').filter(Boolean);out.push({img:await joinPics(srcs),q:z.q,a:z.a,o:z.o})}await put2(db,out,MARK)}try{await seed();let html=await fetch('../brain-training/index.html?father='+Date.now()).then(r=>{if(!r.ok)throw Error('base');return r.text()});html=html.replace(/const ANOHI_MASTER_KEY="[^"]*";/,'const ANOHI_MASTER_KEY="anohi_master_questions_father_editable_v1";').replace(/const ANOHI_DB_NAME="[^"]*";/,'const ANOHI_DB_NAME="'+DB+'";');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('msg').innerHTML='読み込みに失敗しました。<br>通信を確認して、もう一度タップしてね。'}})();</script></body></html>
