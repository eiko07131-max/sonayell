<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>都道府県クイズ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2ea;color:#26231f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}#app{max-width:700px;margin:auto;padding:8px 8px 110px;min-height:100vh}h1{text-align:center;font-size:34px;margin:12px 0 6px}.sub{text-align:center;color:#6f675f;font-size:19px;margin-bottom:14px}.menuBack{display:block;margin:0 auto 12px;border:0;background:#e9e3da;border-radius:12px;padding:9px 15px;font-weight:1000}.regions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.regions button{border:2px solid #ded6ca;background:#fff;border-radius:18px;min-height:78px;padding:12px 8px;font-size:20px;font-weight:1000}.game{display:none;padding-bottom:30px}.head{background:#fff4d9;border:4px solid #f1a044;border-radius:22px;text-align:center;padding:8px;margin-bottom:6px}.head b{display:block;font-size:27px;margin-bottom:3px}.instruction{color:#d60000;background:#fff4f4;border:2px solid #e02b2b;border-radius:10px;font-size:14px;font-weight:1000;line-height:1.18;padding:5px 7px;margin:4px 0}.mapbox{background:#eaf4f7;border:2px solid #c4d8dd;border-radius:22px;overflow:visible;margin:4px auto 6px}.mapbox svg{display:block;width:100%;height:auto}.pref{fill:#fff;stroke:#444;stroke-width:2.2;vector-effect:non-scaling-stroke}.pref.done{fill:#e2f2e6}.num{cursor:pointer}.num text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-weight:1000;text-anchor:middle;dominant-baseline:central;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:6;stroke-linejoin:round;pointer-events:none}.num .hit{fill:transparent;stroke:transparent}.num.selected .hit{fill:#fff0d8;stroke:#ef9c3d;stroke-width:3}.num.done text{fill:#4b7c55}.callout{stroke:#222;stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none}.answers{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0}.answer{border:2px solid #dcd4c8;background:#fff;border-radius:10px;min-height:44px;padding:8px 6px;font-weight:1000;font-size:18px;line-height:1.1}.answer:disabled{opacity:.28}.msg{text-align:center;font-size:16px;font-weight:1000;min-height:22px;padding:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}.actions button{border-radius:14px;padding:10px 6px;font-weight:1000;font-size:15px}.back{border:0;background:#e9e3da}.give{border:2px solid #e3be83;background:#fff0d4;color:#735325}.loading,.error{text-align:center;padding:70px 10px;font-weight:1000}.overlay{position:fixed;inset:0;z-index:9999;background:rgba(255,250,242,.97);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.overlay .big{font-size:clamp(50px,15vw,78px);font-weight:1000;color:#4e8257}.overlay .name{font-size:29px;font-weight:1000;margin-top:10px}.overlay .small{font-size:21px;font-weight:900;margin:10px 18px 22px;color:#665c52}.overlay.oops .big{color:#e5943c}.retry{border:0;background:#ef9444;color:#fff;border-radius:18px;min-width:220px;min-height:60px;padding:12px 22px;font-size:18px;font-weight:1000}@media(max-width:380px){h1{font-size:31px}.regions button{font-size:18px}.answer{font-size:16px}}</style></head><body><div id="app"><section id="home"><h1>都道府県クイズ</h1><div class="sub">地域を選んでね</div><button class="menuBack" onclick="location.href='./'">← メニューへ</button><div class="regions" id="regions"></div></section><section class="game" id="game"><div class="head"><b id="regionTitle"></b><div class="instruction">🔴 まず地図の ①②③… の番号を押してください<br>そのあと、答えの都道府県名を押してね</div></div><div class="mapbox" id="mapbox"><div class="loading">地図を準備しています…</div></div><div class="answers" id="answers"></div><div class="msg" id="msg"></div><div class="actions"><button class="back" id="back">地域選択へ</button><button class="give" id="give">お手上げ</button></div></section></div><div id="stash" style="position:absolute;left:-10000px;top:-10000px;visibility:hidden"></div><script>const R={'北海道・東北':[1,2,5,3,6,4,7],'関東':[8,9,10,11,12,13,14],'中部・北陸':[15,16,17,18,20,21,19,22,23],'近畿':[26,28,25,27,29,24,30],'中国・四国':[31,32,33,34,35,36,37,38,39],'九州・沖縄':[40,41,42,44,43,45,46,47]},N=['','北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'],C=['⓪','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'],CALL={13:[-235,105],27:[-50,22],37:[12,-42],41:[-42,8]},URL='https://raw.githubusercontent.com/lalamalink/japan-map-svg/main/svg/deformed-japan-prefecture-map.svg';let src=null,region='',sel=null,E=[],done=new Set();const $=x=>document.getElementById(x);Object.keys(R).forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>start(x);$('regions').appendChild(b)});async function load(){if(src)return src;let r=await fetch(URL,{cache:'force-cache'});if(!r.ok)throw Error('map');let d=new DOMParser().parseFromString(await r.text(),'image/svg+xml');src=d.querySelector('svg');if(!src)throw Error('svg');return src}function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function point(p){let b=p.getBBox(),L=p.getTotalLength(),bd=[],nn=Math.max(80,Math.min(220,Math.round(L/5)));for(let i=0;i<nn;i++)bd.push(p.getPointAtLength(L*i/nn));function inside(x,y){try{return p.isPointInFill(new DOMPoint(x,y))}catch(e){return false}}function score(x,y){let m=1e20;for(let q of bd){let dx=x-q.x,dy=y-q.y,d=dx*dx+dy*dy;if(d<m)m=d}return Math.sqrt(m)}let best={x:b.x+b.width/2,y:b.y+b.height/2},bs=-1;for(let iy=1;iy<18;iy++)for(let ix=1;ix<18;ix++){let x=b.x+b.width*ix/18,y=b.y+b.height*iy/18;if(inside(x,y)){let s=score(x,y);if(s>bs){bs=s;best={x,y}}}}return {...best,r:Math.max(4,bs)}}async function map(rg){await load();const ns='http://www.w3.org/2000/svg',o=document.createElementNS(ns,'svg'),g=document.createElementNS(ns,'g');o.appendChild(g);E=[];$('stash').innerHTML='';$('stash').appendChild(o);R[rg].forEach((code,i)=>{let q=src.querySelector('#area_'+String(code).padStart(3,'0'));if(!q)throw Error('pref');let p=q.cloneNode(true);p.removeAttribute('fill');p.removeAttribute('stroke');p.classList.add('pref');g.appendChild(p);let pt=point(p);E.push({code,name:N[code],number:i+1,path:p,point:pt})});let bb=g.getBBox(),f=Math.max(26,Math.min(43,Math.min(bb.width,bb.height)*.065));E.forEach(e=>{let z=document.createElementNS(ns,'g');z.classList.add('num');let x=e.point.x,y=e.point.y,c=CALL[e.code];if(c){x+=c[0];y+=c[1];let l=document.createElementNS(ns,'line');l.classList.add('callout');l.setAttribute('x1',e.point.x);l.setAttribute('y1',e.point.y);l.setAttribute('x2',x);l.setAttribute('y2',y);g.appendChild(l)}let h=document.createElementNS(ns,'circle');h.classList.add('hit');h.setAttribute('cx',x);h.setAttribute('cy',y);h.setAttribute('r',Math.max(24,f*.75));let t=document.createElementNS(ns,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('font-size',c?f:Math.max(20,Math.min(f,e.point.r*1.25)));t.textContent=C[e.number]||String(e.number);z.append(h,t);z.onclick=()=>select(e);g.appendChild(z);e.group=z});bb=g.getBBox();let pad=Math.max(bb.width,bb.height)*.05;o.setAttribute('viewBox',`${bb.x-pad} ${bb.y-pad} ${bb.width+pad*2} ${bb.height+pad*2}`);o.setAttribute('aria-label',rg+'の都道府県地図');$('mapbox').innerHTML='';$('mapbox').appendChild(o)}function answers(){$('answers').innerHTML='';sh(E.map(e=>e.name)).forEach(n=>{let b=document.createElement('button');b.className='answer';b.textContent=n;b.disabled=done.has(n);b.onclick=()=>answer(n);$('answers').appendChild(b)})}async function start(rg){region=rg;sel=null;done=new Set;$('home').style.display='none';$('game').style.display='block';$('regionTitle').textContent=rg;$('mapbox').innerHTML='<div class="loading">地図を準備しています…</div>';$('answers').innerHTML='';$('msg').textContent='';try{await map(rg);answers();$('msg').textContent='まず地図の番号を押してね'}catch(e){console.error(e);$('mapbox').innerHTML='<div class="error">地図を読み込めませんでした。<br>通信を確認して、もう一度開いてね。</div>'}}function select(e){if(done.has(e.name))return;E.forEach(x=>x.group.classList.remove('selected'));e.group.classList.add('selected');sel=e;$('msg').textContent='番号 '+e.number+' はどの都道府県かな？'}function answer(n){if(!sel){$('msg').textContent='先に地図の番号を押してね';return}if(n===sel.name)complete(false);else oops()}function oops(){let d=document.createElement('div');d.className='overlay oops';d.innerHTML='<div class="big">おしい✨️</div><div class="small">もう一度やってみよう！</div><button class="retry">もう一度</button>';document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove()}function sparkle(){try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),n=c.currentTime;[[880,0,.10],[1175,.09,.11],[1568,.18,.12],[2093,.28,.24]].forEach(([f,d,l])=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,n+d);g.gain.exponentialRampToValueAtTime(.14,n+d+.015);g.gain.exponentialRampToValueAtTime(.001,n+d+l);o.start(n+d);o.stop(n+d+l+.02)})}catch(e){}}function complete(give){let e=sel;done.add(e.name);e.group.classList.remove('selected');e.group.classList.add('done');e.path.classList.add('done');sel=null;answers();if(!give)sparkle();overlay(give?'答え':'正解！',e.name,give?'覚えたらOK！':'')}function overlay(t,n,s){let d=document.createElement('div');d.className='overlay';d.innerHTML='<div class="big">'+t+'</div><div class="name">'+n+'</div>'+(s?'<div class="small">'+s+'</div>':'');document.body.appendChild(d);setTimeout(()=>{d.remove();$('msg').textContent=done.size===E.length?'全問できたよ✨️':'次の番号を押してね'},850)}$('give').onclick=()=>{if(!sel){$('msg').textContent='先に地図の番号を押してね';return}complete(true)};$('back').onclick=()=>{$('game').style.display='none';$('home').style.display='block';window.scrollTo(0,0)};</script></body></html>
