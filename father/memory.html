<!doctype html>
<html lang="ja">
<head>

<title>記憶クイズ 4つ覚えてね</title>
<style>
:root{--bg:#f8f4ec;--card:#fff;--ink:#282722;--muted:#6d695f;--line:#e8e0d5;--accent:#ef9444;--ok:#61ad6a;--soft:#fff2c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:680px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;min-height:92vh;box-shadow:0 8px 26px #0000000b}.top{display:flex;align-items:center;gap:9px}.title{font-size:1.3rem;font-weight:1000}.badge{margin-left:auto;background:#e7f5df;color:#398c39;border-radius:999px;padding:7px 10px;font-weight:950}.progress{text-align:center;color:var(--muted);font-weight:900;margin:16px 0 4px}.guide{background:var(--soft);border-radius:17px;padding:14px;text-align:center;font-size:1.15rem;font-weight:950;line-height:1.5;margin-top:12px}.countdown{text-align:center;margin:16px 0 4px;font-weight:950;color:#df7f34;font-size:1.3rem}.memory{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px auto;max-width:420px}.memory .item{background:#f7f5f1;border:2px solid var(--line);border-radius:20px;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:4.2rem}.ready{width:100%;border:0;background:var(--accent);color:white;border-radius:18px;min-height:62px;font-size:1.15rem;font-weight:1000;margin-top:15px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.choice{position:relative;border:2px solid var(--line);background:#fff;border-radius:18px;min-height:95px;font-size:3.2rem;font-weight:900}.choice.correct{background:#eff9ef;border-color:#74bd7b}.choice.correct::after{content:"⭕";position:absolute;right:-4px;top:-10px;font-size:2.2rem;filter:drop-shadow(0 2px 1px #0002)}.choice.wrong{animation:shake .25s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.msg{margin-top:10px;background:#f7f5f1;border-radius:15px;padding:13px;text-align:center;font-weight:900;line-height:1.5;min-height:54px}.next{display:none;width:100%;border:0;background:var(--accent);color:#fff;border-radius:18px;min-height:60px;font-size:1.1rem;font-weight:1000;margin-top:12px}.overlay{position:fixed;inset:0;background:#fffaf2f4;z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.overlay .huge{font-size:clamp(3rem,15vw,7rem);font-weight:1000}.overlay .spark{font-size:3rem;margin-top:8px}.overlay.oops .huge{color:#e5943c}.overlay.oops .oopsSub{font-size:1.25rem;font-weight:950;margin:12px 18px 22px;color:#5f574f}.overlay.oops .retry{border:0;background:#ef9444;color:#fff;border-radius:18px;min-width:220px;min-height:60px;padding:12px 22px;font-size:1.15rem;font-weight:1000}.finish{text-align:center;padding:25px 0}.finish h2{font-size:2rem}.finish .emoji{font-size:4rem}@media(max-width:420px){.memory .item{min-height:105px;font-size:3.7rem}.choice{min-height:85px;font-size:2.9rem}}@media(max-width:599px){html,body{height:100%;overflow:hidden!important}body{padding-bottom:78px!important}.app{height:100%;padding:7px!important;overflow:hidden!important}.card{height:calc(100vh - 86px)!important;min-height:0!important;padding:9px!important;overflow:hidden!important}.progress{margin:5px 0 2px!important}.guide{padding:9px!important;margin-top:5px!important;font-size:1rem!important;line-height:1.35!important}.choices{gap:6px!important;margin-top:7px!important}.choice{min-height:61px!important;font-size:2.25rem!important;border-radius:14px!important}.msg{margin-top:6px!important;padding:7px!important;min-height:42px!important;font-size:.9rem!important;line-height:1.35!important}.next{min-height:48px!important;margin-top:6px!important;margin-bottom:14px!important}}html,body{padding-bottom:72px!important}#fatherNavV6{position:fixed;left:8px;right:8px;bottom:7px;z-index:8000;display:flex;gap:7px;justify-content:center}#fatherNavV6 button{flex:1;max-width:260px;border:2px solid #d9c9b7;background:#fffdf8;color:#453b32;border-radius:15px;padding:10px 8px;font-size:14px;font-weight:1000;box-shadow:0 4px 14px #0002}#fatherNavV6 .homev6{background:#fff2df;border-color:#efad72}
</style><script src="./correct-sound.js?v=20260829-6"></script></head><body><div class="app"><section class="card"><div class="top"><div class="title">🧠 記憶クイズ</div><div class="badge">やさしい</div></div><div id="screen"></div></section></div><script>
const rounds=[{target:["🍊","🚙","📱","💰"],pool:["🍊","🚙","📱","💰","🍎","🐶","🌷","🏠","☂️","🍙"]},{target:["🍌","🐟","🔑","🚌"],pool:["🍌","🐟","🔑","🚌","🍓","👓","🌻","🏀","🍵","🧤"]},{target:["🐶","🍎","⌚","🌂"],pool:["🐶","🍎","⌚","🌂","🐱","🚲","🥕","🎁","🥛","🧢"]},{target:["🚗","🍙","🌸","📺"],pool:["🚗","🍙","🌸","📺","🍞","🧦","🐰","✏️","☎️","🍇"]},{target:["🧤","🥛","🐱","🔔"],pool:["🧤","🥛","🐱","🔔","🍋","🍵","🎈","🚌","👒","🍚"]},{target:["🌻","✏️","🐟","🍓"],pool:["🌻","✏️","🐟","🍓","🚙","🥚","☂️","👟","🎂","🪥"]},{target:["☎️","🍇","👓","🎁"],pool:["☎️","🍇","👓","🎁","🐶","🍎","🚲","🍞","🧢","🌷"]},{target:["🥕","🧦","🏀","🍵"],pool:["🥕","🧦","🏀","🍵","🐱","🍙","🔑","🌸","🚗","🎈"]},{target:["👒","🍞","🚲","🎂"],pool:["👒","🍞","🚲","🎂","📱","🌻","🐟","🧤","🍓","⌚"]},{target:["🪥","🥚","👟","🎈"],pool:["🪥","🥚","👟","🎈","🍇","🐰","📺","☎️","🍌","🌂"]}];let round=0,found=new Set(),countdownId=null;const screen=document.getElementById("screen");function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function showMemory(){found=new Set();const r=rounds[round];screen.innerHTML=`<div class="progress">第 ${round+1} 問 / 10</div><div class="guide">この4つを覚えてね〜😊<br><span style="font-size:.9rem;font-weight:800">8秒あります</span></div><div class="countdown">あと <span id="sec">8</span> 秒</div><div class="memory">${r.target.map(x=>`<div class="item">${x}</div>`).join("")}</div><button class="ready" onclick="showChoices()">覚えた！すぐ挑戦する</button>`;let sec=8;clearInterval(countdownId);countdownId=setInterval(()=>{sec--;const s=document.getElementById("sec");if(s)s.textContent=sec;if(sec<=0){clearInterval(countdownId);showChoices()}},1000)}function showChoices(){clearInterval(countdownId);const r=rounds[round],opts=shuffle(r.pool);screen.innerHTML=`<div class="progress">第 ${round+1} 問 / 10</div><div class="guide">さっき覚えた4つを<br>10個の中から選んでね✨️</div><div class="choices">${opts.map(x=>`<button class="choice" data-v="${x}" onclick="pick('${x}',this)">${x}</button>`).join("")}</div><div class="msg" id="msg">1つずつ選んでみてね😊<br>正解した⭕はそのまま残るよ。</div><button class="next" id="next" onclick="nextRound()">次の問題へ →</button>`}function pick(v,b){const r=rounds[round];if(found.has(v))return;if(r.target.includes(v)){found.add(v);b.classList.add("correct");b.disabled=true;playUnifiedCorrectSound();document.getElementById("msg").textContent="正解✨️";if(4-found.size===0)setTimeout(celebrate,300)}else{b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),260);showOops()}}function showOops(){const o=document.createElement("div");o.className="overlay oops";o.innerHTML='<div class="huge">おしい✨️</div><div class="oopsSub">もう一度やってみよう！</div><button class="retry" type="button">もう一度</button>';document.body.appendChild(o);o.querySelector(".retry").onclick=()=>o.remove()}function celebrate(){const o=document.createElement("div");o.className="overlay";o.innerHTML='<div class="huge">正解〜！！</div><div class="spark">🎉✨👏✨🎉</div>';document.body.appendChild(o);setTimeout(()=>{o.remove();document.getElementById("next").style.display="block";document.getElementById("next").textContent=round===9?"10問クリア！ →":"次の問題へ →"},900)}function nextRound(){if(round<9){round++;showMemory();scrollTo(0,0)}else{screen.innerHTML=`<div class="finish"><div class="emoji">🧠✨</div><h2>10問クリア！</h2><div class="guide">おつかれさま😊<br>今日もたくさん思い出せました✨️</div><button class="ready" onclick="round=0;showMemory()">もう一度やってみる</button></div>`}}showMemory();
</script><div id="fatherNavV6"><button onclick="location.href='./all.html?v=20260829-6'">🧠 脳トレ目次</button><button class="homev6" onclick="location.href='./?v=20260829-6'">🏠 最初のメニュー</button></div></body></html>
