<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毎日 頭のトレーニング｜家族お試し版</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ea;color:#40382f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{text-align:center;padding:18px 8px 10px}.hero h1{margin:4px 0;font-size:clamp(25px,7vw,38px)}.hero p{margin:6px;color:#766c62}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:2px solid #e8dfd4;background:#fff;border-radius:22px;padding:18px 10px;min-height:130px;font:inherit;color:inherit;text-align:center;box-shadow:0 4px 14px #0000000c}.ico{font-size:36px;display:block;margin-bottom:7px}.card strong{font-size:18px;display:block}.card small{display:block;margin-top:6px;color:#766c62;line-height:1.4}.note{text-align:center;margin:18px 0;color:#786e64;font-weight:700}.runner{display:none;position:fixed;inset:0;background:#fff;z-index:10}.bar{height:58px;display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #ddd;background:#fff}.back{border:0;border-radius:12px;padding:10px 14px;background:#ede7df;font-weight:900;font-size:16px}.title{font-weight:900;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}iframe{width:100%;height:calc(100% - 58px);border:0}@media(max-width:420px){.wrap{padding:12px}.grid{gap:9px}.card{min-height:122px;padding:15px 8px}.card strong{font-size:16px}.card small{font-size:12px}}</style></head><body><main class="wrap"><div class="hero"><div style="font-size:46px">🧠✨</div><h1>毎日 頭のトレーニング</h1><p>家族お試し・ゲーム版</p></div><div class="grid" id="games"></div><div class="note">全部やらなくてもOK。好きなゲームを楽しんでね😊</div></main><div class="runner" id="runner"><div class="bar"><button class="back" id="back">← 目次</button><div class="title" id="ttl"></div></div><iframe id="frame" title="脳トレゲーム"></iframe></div><script>const G=[['math','🔢','数字問題','15問のタイムアタック'],['ball','🔴','カラーボール','色を見つけてタップ'],['reaction','⚡','反応チャレンジ','初級・中級・上級に挑戦'],['mole','🔨🐹','モグラ叩き','終了合図・級別ベスト記録つき'],['classification','🍎','分類チャレンジ','同じ仲間を全部見つけよう'],['prefecture','🗾','都道府県クイズ','地図を見ながら答えよう'],['memory','🧠','記憶クイズ','4つ覚えて10個から探そう']];const grid=document.getElementById('games'),runner=document.getElementById('runner'),frame=document.getElementById('frame'),ttl=document.getElementById('ttl');G.forEach(([id,ico,name,sub])=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="ico">${ico}</span><strong>${name}</strong><small>${sub}</small>`;b.onclick=()=>openGame(id,name);grid.appendChild(b)});function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}async function openGame(id,name){ttl.textContent=name;runner.style.display='block';document.body.style.overflow='hidden';frame.srcdoc='<p style="font-family:sans-serif;text-align:center;padding:40px">読み込み中…</p>';try{const t=await (await fetch(id+'.txt')).text();const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([b64(t)]).stream().pipeThrough(ds)).text();frame.srcdoc=html}catch(e){frame.srcdoc='<p style="font-family:sans-serif;text-align:center;padding:40px">読み込みに失敗しました。通信を確認して、もう一度お試しください。</p>'}}document.getElementById('back').onclick=()=>{frame.srcdoc='';runner.style.display='none';document.body.style.overflow=''};</script></body></html>
