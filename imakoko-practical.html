<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16853f"><title>イマココ｜そなYELL 実用テスト版</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f6faf4;color:#233c2b}button,input,textarea,select{font:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;background:#fff;padding-bottom:96px}.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #e4eee1}.back{border:0;background:#eef7eb;border-radius:999px;width:42px;height:42px;font-size:24px;color:#17683a}.title{text-align:center;font-size:23px;font-weight:900;color:#174b2e}.mode{font-size:10px;font-weight:900;padding:7px 9px;border-radius:999px;background:#e8f8e6;color:#18833e;white-space:nowrap}.mode.closed{background:#f1f1f1;color:#777}.hero{padding:14px 16px 4px}.region{display:inline-flex;align-items:center;gap:6px;border:2px solid #9cc66f;border-radius:999px;padding:7px 12px;font-weight:900;color:#24733e;background:#fbfff7}.lead{margin:10px 0 7px;font-size:18px;font-weight:900}.testnote{font-size:11px;line-height:1.5;color:#6d786f;background:#fff8dd;border:1px solid #ead28a;border-radius:14px;padding:8px 10px}.official{margin:10px 16px 8px;border:2px solid #efb0a9;border-radius:16px;padding:9px;background:#fffafa}.official h2{font-size:13px;margin:0 0 8px;text-align:center;color:#d32f2f}.officialgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.offbtn{display:block;text-decoration:none;border-radius:12px;padding:10px 8px;font-weight:900;font-size:12px;line-height:1.35;text-align:center}.city{background:#eef8e9;color:#21733e;border:1px solid #a9cf93}.kiki{background:#eef7ff;color:#185d9b;border:1px solid #a9cbea}.warn{margin:8px 16px 10px;background:#fff8df;border:1px solid #e6c766;border-radius:14px;padding:9px 10px;font-size:11px;line-height:1.5}.warn b{color:#a55a00}.cats{padding:2px 16px;display:grid;gap:8px}.cat{width:100%;border:1px solid #dce7d9;border-radius:16px;padding:11px 12px;background:#fff;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:9px;text-align:left;box-shadow:0 4px 10px #2348260d}.cat .ico{font-size:29px}.cat b{font-size:17px;display:block}.cat small{color:#6f7b72;font-size:11px}.cat .num{min-width:50px;text-align:center;border-radius:999px;padding:6px 8px;background:#eef5e9;font-weight:900;font-size:12px}.cat.on{outline:3px solid #81bd6b}.water{background:#f3f9ff}.food{background:#fbfff0}.gas{background:#fff4f4}.road{background:#fff8ee}.life{background:#faf5ff}.other{background:#fffaf1}.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}.sectionhead h2{margin:0;font-size:18px;color:#185f35}.refresh{border:0;background:#edf7e9;color:#27703e;border-radius:999px;padding:8px 11px;font-weight:900}.posts{padding:0 16px;display:grid;gap:10px}.post{border:1px solid #dfe7dc;border-radius:17px;padding:12px;background:#fff;box-shadow:0 5px 14px #224c2910}.posttop{display:flex;gap:8px;align-items:flex-start}.pico{font-size:25px}.postbody{flex:1;min-width:0}.place{font-weight:900;font-size:16px}.msg{margin-top:5px;line-height:1.5;font-size:14px;white-space:pre-wrap}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;color:#708076;font-size:11px}.badge{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:5px 8px;font-weight:900}.community{background:#fff0d8;color:#9a5a05}.officialbadge{background:#e8f8e8;color:#237840}.confirmcount{font-weight:900;color:#276f3e}.actions{display:flex;gap:7px;margin-top:10px}.act{flex:1;border:1px solid #cfe0cc;background:#f8fff6;color:#327342;border-radius:12px;padding:10px 6px;font-size:12px;font-weight:900;transition:.12s}.act:active{transform:scale(.98)}.act.done{background:#dff5df;border-color:#7fbd82;color:#176b32}.act.done:before{content:"✓ ";font-weight:900}.act:disabled{opacity:1}.report{flex:0 0 auto;color:#91615d;background:#fff8f6;border-color:#ead1cd}.empty{text-align:center;padding:30px 12px;color:#819085;background:#f8fbf7;border-radius:18px}.fab{position:fixed;z-index:40;left:50%;bottom:18px;transform:translateX(-50%);width:min(calc(100% - 32px),488px);border:0;border-radius:18px;padding:15px;background:#188443;color:#fff;font-weight:900;font-size:17px;box-shadow:0 8px 20px #145c303b}.fab:disabled{background:#aaa}.modal{position:fixed;inset:0;z-index:60;background:#163522a8;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,520px);max-height:92vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:18px 16px 28px}.sheet h2{margin:0 0 6px;color:#1d6338}.x{float:right;border:0;background:#eef5eb;width:38px;height:38px;border-radius:50%;font-size:23px}.field{display:block;margin-top:12px;font-size:12px;font-weight:900;color:#46644d}.input,.textarea,.select{width:100%;margin-top:5px;border:2px solid #d8e6d4;border-radius:14px;padding:12px;background:#fbfff9;outline:0}.textarea{min-height:100px;resize:vertical}.ttl{font-size:11px;color:#718075;margin-top:5px}.submit{width:100%;margin-top:15px;border:0;border-radius:15px;padding:14px;background:#168443;color:#fff;font-weight:900}.status{text-align:center;min-height:20px;margin-top:9px;font-size:12px;color:#5f7464}.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-12px);z-index:100;background:#1f7b3d;color:#fff;border-radius:999px;padding:11px 16px;font-weight:900;font-size:13px;box-shadow:0 7px 22px #1238;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.pulse{animation:pulse .5s ease}@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}</style></head><body><main class="app"><header class="top"><button class="back" onclick="history.back()" aria-label="戻る">‹</button><div class="title">イマココ</div><div id="mode" class="mode">読込中</div></header><section class="hero"><div id="region" class="region">📍 さいたま市緑区</div><div class="lead">地域の今を、必要な情報に絞って共有</div><div class="testnote">🧪 現在は実用テスト版です。実際の災害情報ではありません。</div></section><section class="official"><h2>⚠ 命に関わる情報は必ず公式情報を確認してください</h2><div class="officialgrid"><a class="offbtn city" target="_blank" rel="noopener" href="https://www.city.saitama.lg.jp/001/011/015/009/001/p087020.html">🏙️ さいたま市防災アプリ</a><a class="offbtn kiki" target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/risk/">🌧️ 気象庁 キキクル</a></div></section><div class="warn">⚠️ 一般投稿は<b>「地域投稿・未確認」</b>です。投稿時刻と現地確認人数を見て判断してね。</div><section id="cats" class="cats"></section><div class="sectionhead"><h2 id="listTitle">最新の共有</h2><button class="refresh" id="refresh">↻ 更新</button></div><section id="posts" class="posts"><div class="empty">読み込み中…</div></section></main><button id="fab" class="fab">✏️ 今の情報を投稿する</button><div id="modal" class="modal"><div class="sheet"><button id="close" class="x">×</button><h2>イマココに投稿</h2><div class="testnote">投稿は「地域投稿・未確認」として表示され、カテゴリーごとに一定時間で一覧から外れます。</div><label class="field">カテゴリー<select id="category" class="select"><option value="water">🚰 水</option><option value="food">🍙 食料・物資</option><option value="gas">⛽ ガソリン</option><option value="road">🚧 道路・危険箇所</option><option value="life">🛟 生活支援</option><option value="other">💬 聞きたい・伝えたい</option></select></label><div id="ttl" class="ttl"></div><label class="field">場所<input id="place" class="input" maxlength="80" placeholder="例：東浦和○○アンダーパス"></label><label class="field">今の状況<textarea id="message" class="textarea" maxlength="280" placeholder="例：冠水し始めています。車は通らない方がよさそうです。"></textarea></label><label class="field">表示名<input id="nickname" class="input" maxlength="30" placeholder="例：えいこ"></label><button id="submit" class="submit">この内容で共有する</button><div id="status" class="status"></div></div></div><div id="toast" class="toast"></div><script>const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',REGION='saitama-midori';const DEF={water:['🚰','水','給水車・給水所・生活用水','6時間'],food:['🍙','食料・物資','スーパー・配給・物資','6時間'],gas:['⛽','ガソリン','営業中・給油可・混雑','4時間'],road:['🚧','道路・危険箇所','冠水・倒木・通行困難','2時間'],life:['🛟','生活支援','トイレ・入浴・充電・洗濯','6時間'],other:['💬','聞きたい・伝えたい','その他の質問・共有','3時間']};let token=localStorage.getItem('imakoko_test_guest');if(!token){token=crypto.randomUUID();localStorage.setItem('imakoko_test_guest',token)}let active='',all=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function rpc(name,body){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body||{}),cache:'no-store'});const t=await r.text();if(!r.ok)throw Error(t||r.status);return t?JSON.parse(t):null}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}function ago(iso){const m=Math.max(0,Math.floor((Date.now()-new Date(iso))/60000));if(m<1)return'たった今';if(m<60)return m+'分前';const h=Math.floor(m/60);return h<24?h+'時間前':Math.floor(h/24)+'日前'}function remain(iso){const m=Math.max(0,Math.ceil((new Date(iso)-Date.now())/60000));if(m<60)return'あと約'+m+'分';return'あと約'+Math.ceil(m/60)+'時間'}function renderCats(){const counts={};Object.keys(DEF).forEach(k=>counts[k]=all.filter(p=>p.category===k).length);$('cats').innerHTML=Object.entries(DEF).map(([k,v])=>`<button class="cat ${k} ${active===k?'on':''}" data-k="${k}"><span class="ico">${v[0]}</span><span><b>${v[1]}</b><small>${v[2]}</small></span><span class="num">${counts[k]}件</span></button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=active===b.dataset.k?'':b.dataset.k;renderCats();renderPosts()})}function renderPosts(){const a=active?all.filter(p=>p.category===active):all;$('listTitle').textContent=active?DEF[active][1]+'の共有':'最新の共有';if(!a.length){$('posts').innerHTML='<div class="empty">まだ共有はありません。<br>最初の情報を投稿してみよう。</div>';return}$('posts').innerHTML=a.map(p=>{const d=DEF[p.category]||DEF.other,off=p.source_type==='official',done=!!p.confirmed_by_me;return`<article class="post" data-post="${p.id}"><div class="posttop"><div class="pico">${d[0]}</div><div class="postbody"><div class="place">${esc(p.place)}</div><div class="msg">${esc(p.message)}</div><div class="meta"><span>${esc(p.nickname)}</span><span>${ago(p.created_at)}</span><span>${remain(p.expires_at)}</span></div><div class="meta"><span class="badge ${off?'officialbadge':'community'}">${off?'✅ 公式情報':'⚠️ 地域投稿・未確認'}</span>${!off?`<span class="confirmcount">👥 現地確認 ${Number(p.confirm_count)||0}人</span>`:''}</div>${!off?`<div class="actions"><button class="act confirm ${done?'done':''}" data-id="${p.id}" ${done?'disabled':''}>${done?'確認済み':'👍 まだ同じ状況'}</button><button class="act report" data-id="${p.id}">⚑ 通報</button></div>`:''}</div></div></article>`}).join('');document.querySelectorAll('.confirm').forEach(b=>b.onclick=()=>confirmPost(b.dataset.id));document.querySelectorAll('.report').forEach(b=>b.onclick=()=>reportPost(b.dataset.id))}async function load(){try{const st=await rpc('imakoko_test_get_state',{p_region_key:REGION}),s=st&&st[0];$('region').textContent='📍 '+(s?.region_label||'さいたま市緑区');$('mode').textContent=s?.is_open?(s.mode==='test'?'🧪 テストOPEN':'((●)) 発災時OPEN'):'CLOSE';$('mode').classList.toggle('closed',!s?.is_open);$('fab').disabled=!s?.is_open;all=await rpc('imakoko_test_list_posts_v2',{p_region_key:REGION,p_category:null,p_guest_token:token})||[];renderCats();renderPosts()}catch(e){$('posts').innerHTML='<div class="empty">読み込みに失敗しました。<br>少し待って更新してね。</div>'}}async function confirmPost(id){const p=all.find(x=>x.id===id);if(!p||p.confirmed_by_me)return;p.confirmed_by_me=true;p.confirm_count=Number(p.confirm_count||0)+1;renderPosts();const card=document.querySelector(`[data-post="${id}"]`);if(card)card.classList.add('pulse');toast('✅ 確認ありがとう！ 現地確認に反映したよ');try{await rpc('imakoko_test_confirm_post',{p_post_id:id,p_guest_token:token});await load()}catch(e){p.confirmed_by_me=false;p.confirm_count=Math.max(0,Number(p.confirm_count||1)-1);renderPosts();toast('確認を反映できませんでした')}}async function reportPost(id){if(!confirm('この投稿を「誤情報・古い情報・不適切」として通報しますか？'))return;try{await rpc('imakoko_test_report_post',{p_post_id:id,p_guest_token:token});toast('⚑ 通報を受け付けました');await load()}catch(e){toast('通報できませんでした')}}function ttlPaint(){$('ttl').textContent='このカテゴリーは原則 '+DEF[$('category').value][3]+' で一覧から自動的に外れます。'}$('category').onchange=ttlPaint;ttlPaint();$('fab').onclick=()=>{$('modal').classList.add('show');$('nickname').value=localStorage.getItem('imakoko_test_nickname')||''};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('refresh').onclick=load;$('submit').onclick=async()=>{const n=$('nickname').value.trim(),p=$('place').value.trim(),m=$('message').value.trim(),c=$('category').value;if(!n||!p||!m){$('status').textContent='表示名・場所・状況を入力してね。';return}$('submit').disabled=true;$('status').textContent='共有中…';try{await rpc('imakoko_test_add_post',{p_guest_token:token,p_nickname:n,p_category:c,p_place:p,p_message:m,p_region_key:REGION});localStorage.setItem('imakoko_test_nickname',n);$('place').value='';$('message').value='';$('status').textContent='共有しました ✓';toast('✅ イマココに共有しました');setTimeout(()=>{$('modal').classList.remove('show');$('status').textContent=''},650);await load()}catch(e){$('status').textContent=String(e).includes('IMAKOKO_CLOSED')?'現在イマココは閉じています。':'投稿できませんでした。'}finally{$('submit').disabled=false}};load();setInterval(()=>renderPosts(),60000);setInterval(load,180000);</script></body></html>
