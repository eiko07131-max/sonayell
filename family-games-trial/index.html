<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>毎日 頭のトレーニング｜家族お試し版</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ea;color:#40382f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:14px}.hero{text-align:center;padding:14px}.hero h1{margin:5px 0;font-size:clamp(26px,7vw,38px)}.hero p{margin:4px;color:#766d63}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.btn{border:2px solid #e5dbcf;background:#fff;border-radius:20px;padding:15px 9px;font:inherit;color:inherit;font-weight:900}.card{min-height:122px}.ico{display:block;font-size:34px;margin-bottom:5px}.card small{display:block;font-size:12px;color:#776d63;margin-top:5px;font-weight:700}.screen{display:none}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{border:0;background:#e9e1d7;border-radius:13px;padding:10px 13px;font-weight:900}.title{font-size:21px;font-weight:1000}.panel{background:#fff;border:2px solid #e5dbcf;border-radius:22px;padding:16px;margin-bottom:12px;text-align:center}.big{font-size:clamp(34px,11vw,64px);font-weight:1000;margin:12px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.answer{min-height:58px;border:2px solid #dcd3c8;border-radius:16px;background:#fff;font-size:20px;font-weight:900}.status{min-height:30px;margin:10px;font-weight:1000;font-size:18px}.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.level{border:2px solid #cfc5ba;background:#fff;border-radius:14px;padding:9px 13px;font-weight:900}.level.on{background:#dff0df;border-color:#7eb47e}.best{margin:10px auto;background:#fff8dd;border-radius:14px;padding:10px;font-weight:1000}.small{font-size:13px;color:#766d63}.danger{border:0;background:#eee7df;border-radius:10px;padding:7px 10px;font-weight:800}.molefield{position:relative;height:330px;background:#dff1cf;border-radius:24px;overflow:hidden;border:3px solid #b8d2a9;margin-top:10px}.hole{position:absolute;width:82px;height:42px;background:#7b573e;border-radius:50%;transform:translate(-50%,-50%)}.mole{position:absolute;width:74px;height:74px;border:0;border-radius:50%;background:#a86f43;font-size:42px;transform:translate(-50%,-65%);z-index:2}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#ffffffea;z-index:5;text-align:center;padding:20px}.overlay.show{display:flex}.finish{font-size:34px;font-weight:1000}.ballarea{height:300px;position:relative;background:#fff;border-radius:22px;border:2px solid #e5dbcf;overflow:hidden}.ball{position:absolute;width:72px;height:72px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0003}.target{font-size:22px;font-weight:1000;margin:10px}.memory-items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px}.mem{font-size:36px;background:#fff;border:2px solid #ddd;border-radius:15px;padding:10px}.classitems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.classitem{font-size:20px;padding:14px 5px;border:2px solid #ddd;background:#fff;border-radius:15px}.selected{background:#dff0df;border-color:#7eb47e}.footer{text-align:center;color:#776d63;font-weight:800;padding:18px}@media(max-width:390px){.app{padding:10px}.card{min-height:112px}.molefield{height:300px}}</style></head><body><main class="app"><section id="home"><div class="hero"><div style="font-size:46px">🧠✨</div><h1>毎日 頭のトレーニング</h1><p>家族お試し・スマホ版</p></div><div class="grid" id="menu"></div><div class="footer">好きなゲームを好きなだけ😊</div></section><section class="screen" id="game"><div class="top"><button class="back" id="back">← 目次</button><div class="title" id="gameTitle"></div></div><div id="body"></div></section></main><script>
const menuData=[['math','🔢','数字問題','15問タイムアタック'],['ball','🔴','カラーボール','色を見つけてタップ'],['reaction','⚡','反応チャレンジ','級別ベストタイム'],['mole','🔨🐹','モグラ叩き','終了合図・級別ベスト'],['classify','🍎','分類チャレンジ','同じ仲間を探そう'],['pref','🗾','都道府県クイズ','4択で楽しく'],['memory','🧠','記憶クイズ','4つ覚えて10個から探す']];
const home=document.getElementById('home'),game=document.getElementById('game'),body=document.getElementById('body'),title=document.getElementById('gameTitle');let cleanup=()=>{};
menuData.forEach(x=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<span class=ico>${x[1]}</span>${x[2]}<small>${x[3]}</small>`;b.onclick=()=>open(x[0],x[2]);menu.appendChild(b)});back.onclick=()=>{cleanup();cleanup=()=>{};game.style.display='none';home.style.display='block';body.innerHTML=''};
function open(id,t){cleanup();home.style.display='none';game.style.display='block';title.textContent=t;({math,ball,reaction,mole,classify,pref,memory}[id])()}
const rnd=n=>Math.floor(Math.random()*n),shuffle=a=>[...a].sort(()=>Math.random()-.5),key=k=>'brainTrial_'+k;
function math(){let q=0,start=Date.now();body.innerHTML='<div class=panel><div class=small>15問。できるだけ早く答えよう！</div><div class=big id=q></div><div class=answers id=a></div><div class=status id=s></div></div>';function next(){if(q>=15){let sec=((Date.now()-start)/1000).toFixed(1),old=+localStorage.getItem(key('math'))||9999;if(+sec<old)localStorage.setItem(key('math'),sec);body.innerHTML=`<div class=panel><div class=finish>🎉 完成！</div><div class=big>${sec}秒</div><div>🏆 ベスト ${localStorage.getItem(key('math'))||sec}秒</div><button class=btn onclick="math()">もう一度</button></div>`;return}let x=1+rnd(9),y=1+rnd(9),op=Math.random()<.5?'+':'−',ans=op==='+'?x+y:x-y;if(op==='−'&&ans<0){[x,y]=[y,x];ans=x-y}document.getElementById('q').textContent=`${x} ${op} ${y} = ?`;let vals=shuffle([ans,ans+1,ans-1,ans+2].filter((v,i,a)=>v>=0&&a.indexOf(v)===i));while(vals.length<4)vals.push(ans+vals.length+3);a.innerHTML='';vals.slice(0,4).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>{if(v===ans){s.textContent='⭕ 正解！';q++;setTimeout(next,300)}else s.textContent='もう一度😊'};a.appendChild(b)})}next()}
function ball(){let score=0,time=20,timer;body.innerHTML='<div class=target id=tar></div><div class=ballarea id=ba></div><div class=status id=bs></div><button class=btn id=start>スタート</button>';let colors=[['赤','#e85050'],['青','#4386df'],['緑','#5aa05a'],['黄','#e5c33d']];start.onclick=()=>{score=0;time=20;start.disabled=true;spawn();timer=setInterval(()=>{time--;bs.textContent=`${time}秒　正解 ${score}`;if(time<=0){clearInterval(timer);ba.innerHTML='';start.disabled=false;bs.textContent=`終了〜！ 正解 ${score}個`}},1000)};function spawn(){ba.innerHTML='';let target=colors[rnd(colors.length)];tar.textContent=`「${target[0]}」をタップ！`;for(let i=0;i<6;i++){let c=colors[rnd(colors.length)],b=document.createElement('button');b.className='ball';b.style.background=c[1];b.style.left=(12+rnd(76))+'%';b.style.top=(15+rnd(70))+'%';b.onclick=()=>{if(c[0]===target[0]){score++;spawn()}else bs.textContent='違う色だよ😊'};ba.appendChild(b)}}cleanup=()=>clearInterval(timer)}
function reaction(){let lev='easy',cfg={easy:[900,'初級'],mid:[650,'中級'],hard:[450,'上級']},n=0,startT,tmo,waiting=false;body.innerHTML='<div class=panel><div class=levels id=lv></div><div class=best id=rb></div><div id=react style="margin:18px auto;width:220px;height:180px;border-radius:24px;background:#ddd;display:grid;place-items:center;font-size:26px;font-weight:1000">スタートを押してね</div><button class=btn id=rs>スタート</button></div>';function drawLv(){lv.innerHTML='';Object.entries(cfg).forEach(([k,v])=>{let b=document.createElement('button');b.className='level '+(k===lev?'on':'');b.textContent=v[1];b.onclick=()=>{lev=k;drawLv();best()};lv.appendChild(b)})}function best(){rb.textContent=`🏆 ${cfg[lev][1]} ベスト ${localStorage.getItem(key('react_'+lev))||'--'}秒`}rs.onclick=()=>{n=0;rs.disabled=true;next()};function next(){react.style.background='#ddd';react.textContent='待って…';waiting=false;tmo=setTimeout(()=>{waiting=true;react.style.background='#8ed38e';react.textContent='今！タップ！';startT=performance.now()},500+rnd(cfg[lev][0]))}react.onclick=()=>{if(!rs.disabled)return;if(!waiting){react.textContent='まだだよ😊';return}n++;if(n>=10){let sec=((performance.now()-startT)/1000).toFixed(3);let total=+sessionStorage.getItem('reactsum')||0;total+=+sec;sessionStorage.setItem('reactsum',total);let result=total.toFixed(3),old=+localStorage.getItem(key('react_'+lev))||999;if(+result<old)localStorage.setItem(key('react_'+lev),result);sessionStorage.removeItem('reactsum');react.textContent=`終了！ ${result}秒`;rs.disabled=false;best()}else{let total=+sessionStorage.getItem('reactsum')||0;total+=(performance.now()-startT)/1000;sessionStorage.setItem('reactsum',total);next()}};drawLv();best();cleanup=()=>{clearTimeout(tmo);sessionStorage.removeItem('reactsum')}}
function mole(){let lev='easy',cfg={easy:{sec:30,stay:1250,gap:260,name:'初級'},mid:{sec:30,stay:850,gap:190,name:'中級'},hard:{sec:25,stay:560,gap:130,name:'上級'}},score=0,left=30,int,pop,to;body.innerHTML='<div class=panel><div class=levels id=mlv></div><div class=best id=mb></div><button class=danger id=mc>🗑 ベスト記録を消す</button><div class=molefield id=mf><div class=overlay id=ov><div><div class=finish>終了〜！</div><div class=big id=res></div><button class=btn id=again>もう一度</button></div></div></div><div class=status id=ms></div><button class=btn id=mstart>スタート</button></div>';let holes=[[20,25],[50,25],[80,25],[20,55],[50,55],[80,55],[35,82],[65,82]];holes.forEach(([x,y])=>{let h=document.createElement('div');h.className='hole';h.style.left=x+'%';h.style.top=y+'%';mf.appendChild(h)});function lvdraw(){mlv.innerHTML='';Object.keys(cfg).forEach(k=>{let b=document.createElement('button');b.className='level '+(k===lev?'on':'');b.textContent=cfg[k].name;b.onclick=()=>{if(!mstart.disabled){lev=k;lvdraw();best()}};mlv.appendChild(b)})}function best(){mb.textContent=`🏆 ${cfg[lev].name} ベスト記録 ${localStorage.getItem(key('mole_'+lev))||0}匹／30匹`}mc.onclick=()=>{if(confirm(cfg[lev].name+'のベスト記録を消しますか？')){localStorage.removeItem(key('mole_'+lev));best()}};function show(){mf.querySelectorAll('.mole').forEach(x=>x.remove());if(left<=0)return;let [x,y]=holes[rnd(holes.length)],b=document.createElement('button');b.className='mole';b.textContent='🐹';b.style.left=x+'%';b.style.top=y+'%';b.onclick=()=>{score++;b.remove()};mf.appendChild(b);to=setTimeout(()=>{b.remove();pop=setTimeout(show,cfg[lev].gap)},cfg[lev].stay)}function start(){clearInterval(int);clearTimeout(pop);clearTimeout(to);score=0;left=cfg[lev].sec;ov.classList.remove('show');mstart.disabled=true;ms.textContent='スタート！';setTimeout(()=>{show();int=setInterval(()=>{left--;ms.textContent=`あと ${left}秒　🐹 ${score}匹`;if(left<=0)finish()},1000)},2000)}function finish(){clearInterval(int);clearTimeout(pop);clearTimeout(to);mf.querySelectorAll('.mole').forEach(x=>x.remove());let old=+localStorage.getItem(key('mole_'+lev))||0;if(score>old)localStorage.setItem(key('mole_'+lev),score);res.textContent=`🐹 モグラ ${score}匹 ／ 30匹中`;ov.classList.add('show');mstart.disabled=false;best()}mstart.onclick=start;again.onclick=start;lvdraw();best();cleanup=()=>{clearInterval(int);clearTimeout(pop);clearTimeout(to)}}
function classify(){let sets=[{ask:'くだものを全部選んでね',ok:['りんご','みかん','バナナ','ぶどう'],all:['りんご','犬','みかん','電車','バナナ','椅子','ぶどう','靴']},{ask:'動物を全部選んでね',ok:['犬','猫','うさぎ','ぞう'],all:['犬','鉛筆','猫','帽子','うさぎ','時計','ぞう','皿']}],idx=0,startT=Date.now();function draw(){let x=sets[idx];body.innerHTML=`<div class=panel><div class=big style="font-size:25px">${x.ask}</div><div class=classitems id=ci></div><div class=status id=cs>0 / 4</div></div>`;shuffle(x.all).forEach(v=>{let b=document.createElement('button');b.className='classitem';b.textContent=v;b.onclick=()=>{if(x.ok.includes(v)){b.classList.add('selected');b.disabled=true;let n=ci.querySelectorAll('.selected').length;cs.textContent=n+' / 4';if(n===4)setTimeout(()=>{idx++;if(idx<sets.length)draw();else{let sec=((Date.now()-startT)/1000).toFixed(1);body.innerHTML=`<div class=panel><div class=finish>🎉 全問クリア！</div><div class=big>${sec}秒</div><button class=btn onclick="classify()">もう一度</button></div>`}},400)}else cs.textContent='これは違う仲間だよ😊'};ci.appendChild(b)})}draw()}
function pref(){const qs=[['北海道','札幌市'],['埼玉県','さいたま市'],['東京都','新宿区'],['神奈川県','横浜市'],['千葉県','千葉市'],['大阪府','大阪市'],['京都府','京都市'],['愛知県','名古屋市'],['福岡県','福岡市'],['沖縄県','那覇市']];let i=0,score=0,order=shuffle(qs);function next(){if(i>=10){body.innerHTML=`<div class=panel><div class=finish>終了〜！</div><div class=big>${score} / 10</div><button class=btn onclick="pref()">もう一度</button></div>`;return}let [p,c]=order[i],opts=shuffle([c,...shuffle(qs.filter(x=>x[1]!==c).map(x=>x[1])).slice(0,3)]);body.innerHTML=`<div class=panel><div class=small>${i+1} / 10</div><div class=big style="font-size:30px">${p}の県庁所在地は？</div><div class=answers id=pa></div><div class=status id=ps></div></div>`;opts.forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>{if(v===c){score++;ps.textContent='⭕ 正解！';i++;setTimeout(next,350)}else ps.textContent='もう一度😊'};pa.appendChild(b)})}next()}
function memory(){const pool=['🍎','🐶','🚗','🌸','🍌','🐱','⚽','☕','🚲','🌞'];let target=shuffle(pool).slice(0,4),selected=0;body.innerHTML='<div class=panel><div class=small>この4つを8秒覚えてね</div><div class=memory-items id=mi></div><div class=status id=mt>覚えてね😊</div></div>';target.forEach(v=>{let d=document.createElement('div');d.className='mem';d.textContent=v;mi.appendChild(d)});let t=setTimeout(()=>{mi.innerHTML='';shuffle(pool).forEach(v=>{let b=document.createElement('button');b.className='mem';b.textContent=v;b.onclick=()=>{if(target.includes(v)){if(!b.disabled){b.disabled=true;b.classList.add('selected');selected++;mt.textContent=`⭕ ${selected} / 4`;if(selected===4)mt.textContent='🎉 全部正解！'}}else mt.textContent='もう一度😊'};mi.appendChild(b)});mt.textContent='覚えていた4つを選んでね'},8000);cleanup=()=>clearTimeout(t)}
</script></body></html>
