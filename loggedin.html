<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outerApp" src="./app.html?v=action13" title="そなYELL"></iframe><script>
const outer=document.getElementById('outerApp'),shouldEnterHome=sessionStorage.getItem('sonayell_enter_home_once')==='1';if(shouldEnterHome)sessionStorage.removeItem('sonayell_enter_home_once');
function getInnerFrame(){try{const x=outer.contentDocument;return x?x.getElementById('appFrame'):null}catch(e){return null}}
function installPrepareV2(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('prepareV2Logic'))return true;const logic=()=>{if(d.getElementById('prepareV2Logic'))return;const s=d.createElement('script');s.id='prepareV2Logic';s.src='./prepare-v2.js?v=4';d.body.appendChild(s)};if(d.getElementById('prepareV2Data')){logic();return true}const s=d.createElement('script');s.id='prepareV2Data';s.src='./prepare-v2-data.js?v=3';s.onload=logic;d.body.appendChild(s);return true}catch(e){return false}}
function installSearchEmphasis(d){if(d.getElementById('actionSearchEmphasis'))return;const p=d.createElement('script');p.id='actionSearchEmphasis';p.src='./action-search-emphasis.js?v=2';d.body.appendChild(p)}
function installAction(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('actionLogic')){installSearchEmphasis(d);return true}const files=['action-earthquake-a.js','action-earthquake-b.js','action-tsunami.js','action-storm-a.js','action-storm-b.js','action-landslide.js','action-other-a.js','action-other-b.js'];let i=0;const next=()=>{if(i>=files.length){if(d.getElementById('actionLogic')){installSearchEmphasis(d);return}const s=d.createElement('script');s.id='actionLogic';s.src='./disaster-action.js?v=5';s.onload=()=>installSearchEmphasis(d);d.body.appendChild(s);return}const id='actionData'+i;if(d.getElementById(id)){i++;next();return}const s=d.createElement('script');s.id=id;s.src='./'+files[i]+'?v=5';s.onload=()=>{i++;next()};d.body.appendChild(s)};next();return true}catch(e){return false}}
function latestYell(){try{return Math.max(0,Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0)}catch(e){return 0}}
function treeCycle(y){if(y<=0)return{step:0,trees:0};const rem=y%50;return{step:rem===0?50:rem,trees:Math.floor(y/50)}}
function installTreeCoreOverride(){try{const inner=getInnerFrame();if(!inner||!inner.contentWindow)return false;const w=inner.contentWindow;if(w.__sonayellTreeCycleV3)return true;w.eval(`window.renderMyTree=function(){const n=Number(state.yell)||0,max=50,rem=n%50,step=n>0&&rem===0?50:rem,grown=Math.floor(n/50),icon=step>=50?'🌳':step>=25?'🌿':'🌱';const e=document.getElementById('myTreeEmoji');if(e)e.textContent=icon;const p=document.getElementById('treeProgressText');if(p)p.textContent=step+' / '+max;const leaves=document.getElementById('treeLeaves');if(leaves){leaves.innerHTML='';for(let i=0;i<max;i++){const s=document.createElement('span');s.className='treeLeaf'+(i<step?' on':'');s.textContent='🍃';leaves.appendChild(s)}}const r=document.getElementById('treeRemain');if(r){const left=max-step;if(step===50){r.innerHTML='🎉 大樹になったよ！<br><small>次の一歩から、新しい木を育てよう。</small>'}else{r.innerHTML=(grown>0?'<small>🌳 育てた大樹 '+grown+'本</small><br>':'')+'次の大樹まであと <strong>'+left+'</strong> YELL！<br><small>一歩ずつ、木を育てよう。</small>'}}};window.__sonayellTreeCycleV3=true;if(typeof renderHome==='function')renderHome();`);return true}catch(e){console.warn('tree override',e);return false}}
function hideTotalYell(d){try{d.querySelectorAll('.yellCount').forEach(x=>{const box=x.closest('.yellPill,.yell-pill,.yellBadge,.yell-badge');if(box)box.style.display='none';else{const parent=x.parentElement;if(parent&&/YELL/i.test(parent.textContent||''))parent.style.display='none';else x.style.display='none'}});const fy=d.getElementById('forestYell');if(fy){const p=fy.parentElement;if(p&&/YELL/i.test(p.textContent||''))p.style.display='none';else fy.style.display='none'}}catch(e){}}
function syncInnerYell(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument,y=latestYell(),max=50,cy=treeCycle(y),step=cy.step;hideTotalYell(d);const emoji=d.getElementById('myTreeEmoji');if(emoji)emoji.textContent=step>=50?'🌳':step>=25?'🌿':'🌱';const progress=d.getElementById('treeProgressText');if(progress)progress.textContent=step+' / '+max;const leaves=d.getElementById('treeLeaves');if(leaves){const on=leaves.querySelectorAll('.treeLeaf.on').length,tot=leaves.querySelectorAll('.treeLeaf').length;if(on!==step||tot!==max){leaves.innerHTML='';for(let i=0;i<max;i++){const s=d.createElement('span');s.className='treeLeaf'+(i<step?' on':'');s.textContent='🍃';leaves.appendChild(s)}}}const remain=d.getElementById('treeRemain');if(remain){const n=Math.max(max-step,0);if(step===50){remain.innerHTML='🎉 大樹になったよ！<br><small>次の一歩から、新しい木を育てよう。</small>'}else{const grown=Math.floor(y/50);remain.innerHTML=(grown>0?'<small>🌳 育てた大樹 '+grown+'本</small><br>':'')+'次の大樹まであと <strong>'+n+'</strong> YELL！<br><small>一歩ずつ、木を育てよう。</small>'}}const testButton=d.getElementById('treeTest50Button');if(testButton)testButton.remove();const testBanner=d.getElementById('treeTestBanner');if(testBanner)testBanner.remove();return true}catch(e){return false}}
function installAll(){installPrepareV2();installAction();installTreeCoreOverride();syncInnerYell()}
function enterHome(){if(!shouldEnterHome)return false;try{const inner=getInnerFrame();if(!inner)return false;const go=()=>{try{const w=inner.contentWindow;if(w&&typeof w.showScreen==='function'){w.showScreen('homeScreen');installAll();return true}const d=inner.contentDocument;if(d){d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const h=d.getElementById('homeScreen');if(h){h.classList.add('active');installAll();return true}}}catch(e){}return false};inner.addEventListener('load',()=>{setTimeout(go,80);setTimeout(go,350)},{once:true});return go()}catch(e){}return false}
window.addEventListener('storage',e=>{if(e.key==='sonayell_v2'){setTimeout(()=>{installTreeCoreOverride();syncInnerYell()},0);setTimeout(()=>{installTreeCoreOverride();syncInnerYell()},80);setTimeout(()=>{installTreeCoreOverride();syncInnerYell()},250)}});outer.addEventListener('load',()=>{const inner=getInnerFrame();if(inner)inner.addEventListener('load',()=>{setTimeout(installAll,40);setTimeout(installAll,250)},{once:true});setTimeout(installAll,200);setTimeout(installAll,700);if(shouldEnterHome){setTimeout(enterHome,100);setTimeout(enterHome,500);setTimeout(enterHome,1200)}});setInterval(()=>{installTreeCoreOverride();syncInnerYell()},250);if(shouldEnterHome)setTimeout(enterHome,900);
</script></body></html>
