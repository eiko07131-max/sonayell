<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outerApp" src="./app.html?v=treefix4" title="そなYELL"></iframe><script>
const outer=document.getElementById('outerApp');
const shouldEnterHome=sessionStorage.getItem('sonayell_enter_home_once')==='1';
if(shouldEnterHome)sessionStorage.removeItem('sonayell_enter_home_once');
function getIndexFrame(){try{const appDoc=outer.contentDocument;return appDoc?appDoc.getElementById('appFrame'):null}catch(e){return null}}
function getIndexWindow(){const f=getIndexFrame();try{return f&&f.contentWindow?f.contentWindow:null}catch(e){return null}}
function getIndexDocument(){const w=getIndexWindow();try{return w&&w.document?w.document:null}catch(e){return null}}
function installTreeAuthority(){
  try{
    const d=getIndexDocument();if(!d||!d.body)return false;
    let style=d.getElementById('registeredTreeAuthorityStyle');
    if(!style){style=d.createElement('style');style.id='registeredTreeAuthorityStyle';style.textContent='.yellBadge,.treeYell{display:none!important}';d.head.appendChild(style)}
    if(d.getElementById('registeredTreeAuthorityLogic'))return true;
    const s=d.createElement('script');s.id='registeredTreeAuthorityLogic';
    s.textContent=`(function(){
      function treeCycle(total){total=Math.max(0,Number(total)||0);if(total===0)return{step:0,grown:0};var rem=total%50;return{step:rem===0?50:rem,grown:Math.floor((total-1)/50)}}
      function drawCurrentTree(){
        var total=Math.max(0,Number(state&&state.yell)||0),t=treeCycle(total),step=t.step,max=50;
        document.querySelectorAll('.yellBadge,.treeYell').forEach(function(x){x.style.setProperty('display','none','important')});
        var emoji=document.getElementById('myTreeEmoji');if(emoji)emoji.textContent=step>=50?'🌳':step>=25?'🌿':'🌱';
        var progress=document.getElementById('treeProgressText');if(progress)progress.textContent=step+' / '+max;
        var leaves=document.getElementById('treeLeaves');if(leaves){leaves.innerHTML='';for(var i=0;i<max;i++){var leaf=document.createElement('span');leaf.className='treeLeaf'+(i<step?' on':'');leaf.textContent='🍃';leaves.appendChild(leaf)}}
        var remain=document.getElementById('treeRemain');if(remain){if(step===50){remain.innerHTML='🎉 大樹になったよ！<br><small>次の一歩から、新しい木を育てよう。</small>'}else{remain.innerHTML=(t.grown>0?'<small>🌳 育てた大樹 '+t.grown+'本</small><br>':'')+'次の大樹まであと <strong>'+(max-step)+'</strong> YELL！<br><small>一歩ずつ、木を育てよう。</small>'}}
      }
      window.renderMyTree=drawCurrentTree;
      if(typeof update==='function'&&!window.__treeCycleUpdateWrapped){var oldUpdate=update;window.update=function(){var r=oldUpdate.apply(this,arguments);drawCurrentTree();setTimeout(drawCurrentTree,0);return r};window.__treeCycleUpdateWrapped=true}
      drawCurrentTree();setTimeout(drawCurrentTree,50);setTimeout(drawCurrentTree,300);
    })();`;
    d.body.appendChild(s);return true;
  }catch(e){console.warn('tree authority install failed',e);return false}
}
function installPrepareV2(){try{const d=getIndexDocument();if(!d)return false;if(d.getElementById('prepareV2Logic'))return true;const logic=()=>{if(d.getElementById('prepareV2Logic'))return;const s=d.createElement('script');s.id='prepareV2Logic';s.src='./prepare-v2.js?v=4';d.body.appendChild(s)};if(d.getElementById('prepareV2Data')){logic();return true}const s=d.createElement('script');s.id='prepareV2Data';s.src='./prepare-v2-data.js?v=3';s.onload=logic;d.body.appendChild(s);return true}catch(e){return false}}
function installSearchEmphasis(d){if(d.getElementById('actionSearchEmphasis'))return;const p=d.createElement('script');p.id='actionSearchEmphasis';p.src='./action-search-emphasis.js?v=2';d.body.appendChild(p)}
function installAction(){try{const d=getIndexDocument();if(!d)return false;if(d.getElementById('actionLogic')){installSearchEmphasis(d);return true}const files=['action-earthquake-a.js','action-earthquake-b.js','action-tsunami.js','action-storm-a.js','action-storm-b.js','action-landslide.js','action-other-a.js','action-other-b.js'];let i=0;const next=()=>{if(i>=files.length){if(d.getElementById('actionLogic')){installSearchEmphasis(d);return}const s=d.createElement('script');s.id='actionLogic';s.src='./disaster-action.js?v=5';s.onload=()=>installSearchEmphasis(d);d.body.appendChild(s);return}const id='actionData'+i;if(d.getElementById(id)){i++;next();return}const s=d.createElement('script');s.id=id;s.src='./'+files[i]+'?v=5';s.onload=()=>{i++;next()};d.body.appendChild(s)};next();return true}catch(e){return false}}
function installAll(){installTreeAuthority();installPrepareV2();installAction()}
function enterHome(){if(!shouldEnterHome)return false;const w=getIndexWindow(),d=getIndexDocument();if(!w||!d)return false;try{if(typeof w.showScreen==='function'){w.showScreen('homeScreen');installAll();return true}d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const h=d.getElementById('homeScreen');if(h){h.classList.add('active');installAll();return true}}catch(e){}return false}
function boot(){const frame=getIndexFrame();if(frame)frame.addEventListener('load',()=>{[0,50,150,400,900].forEach(t=>setTimeout(installAll,t));if(shouldEnterHome)[50,250,700].forEach(t=>setTimeout(enterHome,t))},{once:true});[100,250,500,900,1500,2500].forEach(t=>setTimeout(installAll,t));if(shouldEnterHome)[150,500,1200].forEach(t=>setTimeout(enterHome,t))}
outer.addEventListener('load',boot);if(outer.contentDocument&&outer.contentDocument.readyState==='complete')boot();
setInterval(installAll,1000);
</script></body></html>
