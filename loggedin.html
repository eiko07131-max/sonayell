<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outerApp" src="./app.html?v=action8" title="そなYELL"></iframe><script>
const outer=document.getElementById('outerApp'),shouldEnterHome=sessionStorage.getItem('sonayell_enter_home_once')==='1';if(shouldEnterHome)sessionStorage.removeItem('sonayell_enter_home_once');let treePreviewActive=false;
function getInnerFrame(){try{const x=outer.contentDocument;return x?x.getElementById('appFrame'):null}catch(e){return null}}
function installPrepareV2(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('prepareV2Logic'))return true;const logic=()=>{if(d.getElementById('prepareV2Logic'))return;const s=d.createElement('script');s.id='prepareV2Logic';s.src='./prepare-v2.js?v=4';d.body.appendChild(s)};if(d.getElementById('prepareV2Data')){logic();return true}const s=d.createElement('script');s.id='prepareV2Data';s.src='./prepare-v2-data.js?v=3';s.onload=logic;d.body.appendChild(s);return true}catch(e){return false}}
function installSearchEmphasis(d){if(d.getElementById('actionSearchEmphasis'))return;const p=d.createElement('script');p.id='actionSearchEmphasis';p.src='./action-search-emphasis.js?v=2';d.body.appendChild(p)}
function installAction(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('actionLogic')){installSearchEmphasis(d);return true}const files=['action-earthquake-a.js','action-earthquake-b.js','action-tsunami.js','action-storm-a.js','action-storm-b.js','action-landslide.js','action-other-a.js','action-other-b.js'];let i=0;const next=()=>{if(i>=files.length){if(d.getElementById('actionLogic')){installSearchEmphasis(d);return}const s=d.createElement('script');s.id='actionLogic';s.src='./disaster-action.js?v=5';s.onload=()=>installSearchEmphasis(d);d.body.appendChild(s);return}const id='actionData'+i;if(d.getElementById(id)){i++;next();return}const s=d.createElement('script');s.id=id;s.src='./'+files[i]+'?v=5';s.onload=()=>{i++;next()};d.body.appendChild(s)};next();return true}catch(e){return false}}
function latestYell(){try{return Math.max(0,Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0)}catch(e){return 0}}
function paintTree(y,preview){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument,max=50;d.querySelectorAll('.yellCount').forEach(x=>x.textContent=latestYell());const fy=d.getElementById('forestYell');if(fy)fy.textContent=latestYell();const emoji=d.getElementById('myTreeEmoji');if(emoji)emoji.textContent=y>=50?'🌳':y>=25?'🌿':'🌱';const progress=d.getElementById('treeProgressText');if(progress)progress.textContent=Math.min(y,max)+' / '+max;const leaves=d.getElementById('treeLeaves');if(leaves){leaves.innerHTML='';for(let i=0;i<max;i++){const s=d.createElement('span');s.className='treeLeaf'+(i<y?' on':'');s.textContent='🍃';leaves.appendChild(s)}}const remain=d.getElementById('treeRemain');if(remain){const n=Math.max(max-y,0);remain.innerHTML=n===0?'🎉 大樹になったよ！<br><small>ここからさらに育てていこう。</small>':'大樹まであと <strong>'+n+'</strong> YELL！<br><small>一歩ずつ、木を育てよう。</small>'}let note=d.getElementById('treeTestBanner');if(preview){if(!note){note=d.createElement('div');note.id='treeTestBanner';note.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:99999;padding:10px 14px;border:2px solid #d48b18;border-radius:14px;background:#fff4cf;color:#8a5b00;font-weight:bold;box-shadow:0 4px 16px #0002';d.body.appendChild(note)}note.textContent='🔍 TEST中：50 YELL到達時（実際は '+latestYell()+' YELLのまま）'}else if(note)note.remove();return true}catch(e){return false}}
function syncInnerYell(){if(treePreviewActive)return true;return paintTree(latestYell(),false)}
window.sonayellTreeTest50=function(){treePreviewActive=true;paintTree(50,true)};window.sonayellTreeTestReset=function(){treePreviewActive=false;paintTree(latestYell(),false)};
function installTreeTestButton(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;let b=d.getElementById('treeTest50Button');if(!b){b=d.createElement('button');b.id='treeTest50Button';b.style.cssText='position:fixed;right:18px;bottom:18px;z-index:100000;padding:12px 15px;border:2px dashed #d48b18;border-radius:14px;background:#fff8df;color:#7b5400;font-weight:bold;box-shadow:0 4px 16px #0003;cursor:pointer';d.body.appendChild(b)}b.textContent=treePreviewActive?'↩ TEST解除':'🔍 50 YELL到達 TEST';b.onclick=()=>{if(treePreviewActive)window.sonayellTreeTestReset();else window.sonayellTreeTest50();installTreeTestButton()};return true}catch(e){return false}}
function installAll(){installPrepareV2();installAction();syncInnerYell();installTreeTestButton()}
function enterHome(){if(!shouldEnterHome)return false;try{const inner=getInnerFrame();if(!inner)return false;const go=()=>{try{const w=inner.contentWindow;if(w&&typeof w.showScreen==='function'){w.showScreen('homeScreen');installAll();return true}const d=inner.contentDocument;if(d){d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const h=d.getElementById('homeScreen');if(h){h.classList.add('active');installAll();return true}}}catch(e){}return false};inner.addEventListener('load',()=>{setTimeout(go,80);setTimeout(go,350)},{once:true});return go()}catch(e){}return false}
window.addEventListener('storage',e=>{if(e.key==='sonayell_v2'&&!treePreviewActive){setTimeout(syncInnerYell,0);setTimeout(syncInnerYell,80);setTimeout(syncInnerYell,250)}});outer.addEventListener('load',()=>{const inner=getInnerFrame();if(inner)inner.addEventListener('load',()=>{setTimeout(installAll,40);setTimeout(installAll,250)},{once:true});setTimeout(installAll,200);setTimeout(installAll,700);if(shouldEnterHome){setTimeout(enterHome,100);setTimeout(enterHome,500);setTimeout(enterHome,1200)}});setInterval(()=>{if(!treePreviewActive)syncInnerYell();installTreeTestButton()},250);if(shouldEnterHome)setTimeout(enterHome,900);
</script></body></html>
