<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outerApp" src="./app.html?v=treefix2" title="そなYELL"></iframe><script>
const outer=document.getElementById('outerApp'),shouldEnterHome=sessionStorage.getItem('sonayell_enter_home_once')==='1';if(shouldEnterHome)sessionStorage.removeItem('sonayell_enter_home_once');
function getInnerFrame(){try{const x=outer.contentDocument;return x?x.getElementById('appFrame'):null}catch(e){return null}}
function readYell(){try{return Math.max(0,Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0)}catch(e){return 0}}
function renderCurrentTree(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument,total=readYell(),max=50,rem=total%50,step=total===0?0:(rem===0?50:rem),grown=total===0?0:Math.floor((total-1)/50);let style=d.getElementById('registeredTreeAuthorityStyle');if(!style){style=d.createElement('style');style.id='registeredTreeAuthorityStyle';style.textContent='.yellBadge,.treeYell{display:none!important}';d.head.appendChild(style)}d.querySelectorAll('.yellBadge,.treeYell').forEach(x=>x.style.setProperty('display','none','important'));const emoji=d.getElementById('myTreeEmoji');if(emoji)emoji.textContent=step>=50?'🌳':step>=25?'🌿':'🌱';const progress=d.getElementById('treeProgressText');if(progress)progress.textContent=step+' / '+max;const leaves=d.getElementById('treeLeaves');if(leaves){const active=leaves.querySelectorAll('.treeLeaf.on').length,totalLeaves=leaves.querySelectorAll('.treeLeaf').length;if(active!==step||totalLeaves!==max){leaves.innerHTML='';for(let i=0;i<max;i++){const leaf=d.createElement('span');leaf.className='treeLeaf'+(i<step?' on':'');leaf.textContent='🍃';leaves.appendChild(leaf)}}}const remain=d.getElementById('treeRemain');if(remain){if(step===50){remain.innerHTML='🎉 大樹になったよ！<br><small>次の一歩から、新しい木を育てよう。</small>'}else{remain.innerHTML=(grown>0?'<small>🌳 育てた大樹 '+grown+'本</small><br>':'')+'次の大樹まであと <strong>'+(max-step)+'</strong> YELL！<br><small>一歩ずつ、木を育てよう。</small>'}}return true}catch(e){return false}}
function installPrepareV2(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('prepareV2Logic'))return true;const logic=()=>{if(d.getElementById('prepareV2Logic'))return;const s=d.createElement('script');s.id='prepareV2Logic';s.src='./prepare-v2.js?v=4';d.body.appendChild(s)};if(d.getElementById('prepareV2Data')){logic();return true}const s=d.createElement('script');s.id='prepareV2Data';s.src='./prepare-v2-data.js?v=3';s.onload=logic;d.body.appendChild(s);return true}catch(e){return false}}
function installSearchEmphasis(d){if(d.getElementById('actionSearchEmphasis'))return;const p=d.createElement('script');p.id='actionSearchEmphasis';p.src='./action-search-emphasis.js?v=2';d.body.appendChild(p)}
function installAction(){try{const inner=getInnerFrame();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('actionLogic')){installSearchEmphasis(d);return true}const files=['action-earthquake-a.js','action-earthquake-b.js','action-tsunami.js','action-storm-a.js','action-storm-b.js','action-landslide.js','action-other-a.js','action-other-b.js'];let i=0;const next=()=>{if(i>=files.length){if(d.getElementById('actionLogic')){installSearchEmphasis(d);return}const s=d.createElement('script');s.id='actionLogic';s.src='./disaster-action.js?v=5';s.onload=()=>installSearchEmphasis(d);d.body.appendChild(s);return}const id='actionData'+i;if(d.getElementById(id)){i++;next();return}const s=d.createElement('script');s.id=id;s.src='./'+files[i]+'?v=5';s.onload=()=>{i++;next()};d.body.appendChild(s)};next();return true}catch(e){return false}}
function installAll(){renderCurrentTree();installPrepareV2();installAction()}
function enterHome(){if(!shouldEnterHome)return false;try{const inner=getInnerFrame();if(!inner)return false;const go=()=>{try{const w=inner.contentWindow;if(w&&typeof w.showScreen==='function'){w.showScreen('homeScreen');installAll();return true}const d=inner.contentDocument;if(d){d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const h=d.getElementById('homeScreen');if(h){h.classList.add('active');installAll();return true}}}catch(e){}return false};inner.addEventListener('load',()=>{setTimeout(go,80);setTimeout(go,350)},{once:true});return go()}catch(e){}return false}
outer.addEventListener('load',()=>{const inner=getInnerFrame();if(inner)inner.addEventListener('load',()=>{[50,250,700,1500].forEach(t=>setTimeout(installAll,t))},{once:true});[200,600,1200,2200].forEach(t=>setTimeout(installAll,t));if(shouldEnterHome){setTimeout(enterHome,100);setTimeout(enterHome,500);setTimeout(enterHome,1200)}});window.addEventListener('storage',e=>{if(e.key==='sonayell_v2'){setTimeout(renderCurrentTree,0);setTimeout(renderCurrentTree,100)}});setInterval(renderCurrentTree,200);if(shouldEnterHome)setTimeout(enterHome,900);
</script></body></html>
