<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>そなYELL 登録・ログイン</title>
<style>
body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f5faef;color:#36563b}.wrap{max-width:520px;margin:0 auto;padding:28px 18px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 5px 18px rgba(50,90,50,.08)}h1{color:#397a44;margin:0 0 8px}p{line-height:1.7;font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.tabs button{padding:13px;border:0;border-radius:14px;background:#edf7e9;color:#397a44;font-weight:bold;font-size:15px;cursor:pointer}.tabs button.on{background:#4e9956;color:#fff}label{display:block;font-size:12px;font-weight:bold;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:13px;border:2px solid #dfebda;border-radius:14px;font:inherit}.go{width:100%;margin-top:16px;padding:15px;border:0;border-radius:15px;background:#4e9956;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.go:disabled{opacity:.55}.sub{width:100%;margin-top:10px;padding:12px;border:0;border-radius:15px;background:#fff4b8;color:#755c20;font-weight:bold;cursor:pointer}.note{font-size:12px;color:#69806b;background:#f5faef;border-radius:12px;padding:12px;margin-top:12px;line-height:1.65}.msg{margin-top:14px;padding:13px;border-radius:14px;background:#edf7e9;display:none;line-height:1.65}.msg.ok{display:block;background:#e7f7df;color:#2f6837}.msg.warn{display:block;background:#fff4c9;color:#6e5b1d}.msg.err{display:block;background:#fff0ee;color:#8a3c35}.steps{margin-top:12px;background:#fffdf3;border:1px solid #f0df9c;border-radius:14px;padding:12px;font-size:12px;line-height:1.8}.small{font-size:11px;color:#788b79;margin-top:10px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🌱 そなYELL</h1>
<p>登録すると、スマホでもパソコンでも同じアカウントで使えるようになります。</p>
<div class="tabs"><button type="button" id="signupTab" class="on">新規登録</button><button type="button" id="loginTab">ログイン</button></div>
<label>メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="example@gmail.com">
<label>パスワード</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="6文字以上">
<button type="button" id="submit" class="go">登録する</button>
<button type="button" id="backApp" class="sub">そなYELLへ戻る</button>
<div class="note" id="guide">登録すると確認メールが届きます。メールの「Confirm email address」を押すと、この画面に戻り、そのままそなYELLへ進みます。</div>
<div id="msg" class="msg"></div>
<div class="steps" id="steps"><b>登録は3ステップだけ</b><br>① メールとパスワードを入力<br>② 届いたメールの「Confirm email address」を押す<br>③ 自動でそなYELLへ戻る</div>
<div class="small">※確認メールが見つからない時は、迷惑メールも確認してね。</div>
</div></div>
<script>
const U='https://illnptsvaieyacjajlfm.supabase.co';
const K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';
const REGISTER_URL='https://eiko07131-max.github.io/sonayell/register.html';
const APP_URL='./loggedin.html';
let mode='signup';
const $=id=>document.getElementById(id);
function showMsg(text,type='ok'){const m=$('msg');m.className='msg '+type;m.textContent=text;}
function setMode(m){mode=m;$('signupTab').classList.toggle('on',m==='signup');$('loginTab').classList.toggle('on',m==='login');$('submit').textContent=m==='signup'?'登録する':'ログインする';$('guide').textContent=m==='signup'?'登録すると確認メールが届きます。メールの「Confirm email address」を押すと、この画面に戻り、そのままそなYELLへ進みます。':'登録済みのメールアドレスとパスワードでログインできます。';$('steps').style.display=m==='signup'?'block':'none';$('msg').className='msg';}
$('signupTab').addEventListener('click',()=>setMode('signup'));
$('loginTab').addEventListener('click',()=>setMode('login'));
$('backApp').addEventListener('click',()=>location.href=(localStorage.getItem('sonayell_registered')==='1'&&localStorage.getItem('sonayell_access_token'))?APP_URL:'./app.html');
async function claimAndEnter(accessToken,refreshToken=''){
  if(!accessToken){showMsg('ログイン情報を受け取れませんでした。もう一度ログインしてね。','err');return;}
  localStorage.setItem('sonayell_access_token',accessToken);
  if(refreshToken)localStorage.setItem('sonayell_refresh_token',refreshToken);
  localStorage.setItem('sonayell_registered','1');
  const gt=localStorage.getItem('sonayell_guest_token');let s={};try{s=JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){}
  try{await fetch(U+'/rest/v1/rpc/sona_claim_guest_data',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({p_guest_token:gt||null,p_guest_yell:s.yell||0})});}catch(e){}
  showMsg('✅ ログイン完了！そなYELLへ入ります。','ok');
  location.replace(APP_URL);
}
async function handleReturnFromEmail(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const access=hash.get('access_token');
  const refresh=hash.get('refresh_token')||'';
  const err=hash.get('error_description')||hash.get('error');
  if(err){showMsg('メール確認でエラーが出ました。もう一度登録画面からやり直してね。','err');return;}
  if(access){history.replaceState(null,'',location.pathname);await claimAndEnter(access,refresh);}
}
$('submit').addEventListener('click',async()=>{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||password.length<6){showMsg('メールアドレスと6文字以上のパスワードを入力してね。','warn');return;}
  localStorage.setItem('sonayell_last_email',email);
  const btn=$('submit');btn.disabled=true;btn.textContent=mode==='signup'?'登録中…':'ログイン中…';
  try{
    const path=mode==='signup'?'/auth/v1/signup?redirect_to='+encodeURIComponent(REGISTER_URL):'/auth/v1/token?grant_type=password';
    const r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'処理できませんでした');
    if(mode==='signup'){
      if(data.access_token){await claimAndEnter(data.access_token,data.refresh_token||'');return;}
      showMsg('📩 確認メールを送りました。Gmailを開いて「Confirm email address」を押してね。押した後は自動でそなYELLに戻ります。','ok');
    }else{
      await claimAndEnter(data.access_token,data.refresh_token||'');return;
    }
  }catch(e){
    const t=String(e.message||e);
    if(/already|registered|exists/i.test(t)){showMsg('このメールは登録済みです。上の「ログイン」を押して同じパスワードで入ってね。','warn');}
    else if(/confirm|verified|email/i.test(t)){showMsg('メール確認がまだの可能性があります。届いた確認メールのリンクを押してね。','warn');}
    else showMsg(t,'err');
  }finally{btn.disabled=false;btn.textContent=mode==='signup'?'登録する':'ログインする';}
});
const last=localStorage.getItem('sonayell_last_email');if(last)$('email').value=last;
handleReturnFromEmail();
if(!location.hash&&localStorage.getItem('sonayell_registered')==='1'&&localStorage.getItem('sonayell_access_token')){
  location.replace(APP_URL);
}
</script>
</body>
</html>
