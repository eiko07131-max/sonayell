<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>そなYELL 登録・ログイン</title><style>body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f5faef;color:#36563b}.wrap{max-width:520px;margin:0 auto;padding:28px 18px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 5px 18px rgba(50,90,50,.08)}h1{color:#397a44;margin:0 0 8px}p{line-height:1.7;font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.tabs button{padding:12px;border:0;border-radius:14px;background:#edf7e9;color:#397a44;font-weight:bold}.tabs button.on{background:#4e9956;color:#fff}label{display:block;font-size:12px;font-weight:bold;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:13px;border:2px solid #dfebda;border-radius:14px;font:inherit}.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:15px;background:#4e9956;color:#fff;font-size:16px;font-weight:bold}.sub{width:100%;margin-top:10px;padding:12px;border:0;border-radius:15px;background:#fff4b8;color:#755c20;font-weight:bold}.note{font-size:11px;color:#69806b;background:#f5faef;border-radius:12px;padding:10px;margin-top:12px}.msg{margin-top:14px;padding:12px;border-radius:14px;background:#edf7e9;display:none}.back{display:inline-block;margin-top:15px;color:#397a44;text-decoration:none;font-weight:bold}</style></head><body><div class="wrap"><div class="card"><h1>🌱 そなYELL</h1><p>登録すると、スマホでもパソコンでも同じアカウントで使えるようになります。</p><div class="tabs"><button id="signupTab" class="on">新規登録</button><button id="loginTab">ログイン</button></div><label>メールアドレス</label><input id="email" type="email" autocomplete="email"><label>パスワード</label><input id="password" type="password" minlength="6" autocomplete="current-password"><button id="submit" class="go">登録する</button><button id="backApp" class="sub">そなYELLへ戻る</button><div class="note">登録確認メールが届いたら、メール内の確認を済ませてからログインしてください。</div><div id="msg" class="msg"></div></div></div><script>const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';let mode='signup';const $=id=>document.getElementById(id),msg=t=>{const m=$('msg');m.style.display='block';m.textContent=t};function setMode(m){mode=m;$('signupTab').classList.toggle('on',m==='signup');$('loginTab').classList.toggle('on',m==='login');$('submit').textContent=m==='signup'?'登録する':'ログインする'}$('signupTab').onclick=()=>setMode('signup');$('loginTab').onclick=()=>setMode('login');$('backApp').onclick=()=>location.href='./app.html';$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){msg('メールアドレスと6文字以上のパスワードを入力してね。');return}$('submit').disabled=true;try{const path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'処理できませんでした');if(mode==='signup'){msg('登録確認メールを送りました。メールを確認したら、この画面で「ログイン」に切り替えて入ってね。')}else{localStorage.setItem('sonayell_access_token',data.access_token);localStorage.setItem('sonayell_refresh_token',data.refresh_token||'');const gt=localStorage.getItem('sonayell_guest_token');let s={};try{s=JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){}await fetch(U+'/rest/v1/rpc/sona_claim_guest_data',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+data.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_guest_token:gt||null,p_guest_yell:s.yell||0})});msg('ログインできました！これまでのゲスト情報も引き継ぎます。そなYELLへ戻ってOK！')}}catch(e){msg(e.message)}finally{$('submit').disabled=false}};</script></body></html>
