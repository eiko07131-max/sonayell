<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf7df">
<title>そなYELL 登録・ログイン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#245b36;background:linear-gradient(#bcecff 0,#eaf8dd 46%,#9bdc78 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 8%,rgba(255,255,255,.85) 0 7%,transparent 7.5%),radial-gradient(circle at 90% 12%,rgba(255,255,255,.72) 0 6%,transparent 6.5%);opacity:.8}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:26px 16px 42px}
.brand{text-align:center;margin:2px 0 18px}.brand h1{font-size:38px;margin:0;color:#087a3e;letter-spacing:.02em;text-shadow:0 2px 0 #fff}.brand p{margin:5px 0 0;font-size:13px;font-weight:700;color:#477a50}
.card{background:rgba(255,255,255,.96);border:2px solid rgba(93,157,79,.18);border-radius:30px;padding:24px 22px;box-shadow:0 10px 28px rgba(41,91,47,.16)}
.welcome{text-align:center;margin-bottom:12px}.welcome .sprout{font-size:42px}.welcome h2{margin:2px 0 5px;font-size:23px;color:#087a3e}.welcome p{margin:0;font-size:13px;line-height:1.7;color:#63806a}
.google{width:100%;margin-top:18px;padding:14px;border:2px solid #d8e9d2;border-radius:16px;background:#fff;color:#333;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}.googleMark{font-size:20px;font-weight:bold;color:#4285f4}.googleNote{text-align:center;font-size:11px;color:#718475;margin-top:7px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0 8px;color:#8a9b8b;font-size:12px}.or:before,.or:after{content:"";height:1px;flex:1;background:#dfe8dc}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tabs button{padding:13px;border:0;border-radius:14px;background:#edf7e9;color:#397a44;font-weight:800;font-size:15px;cursor:pointer}.tabs button.on{background:#159954;color:#fff;box-shadow:inset 0 -3px rgba(0,0,0,.08)}
label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input{width:100%;padding:13px;border:2px solid #dcebd7;border-radius:14px;font:inherit;background:#fbfff9}.passwordWrap{position:relative}.passwordWrap input{padding-right:78px}.passwordToggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#edf7e9;color:#397a44;border-radius:10px;padding:8px 10px;font-weight:bold;cursor:pointer}
.go{width:100%;margin-top:16px;padding:15px;border:0;border-radius:999px;background:#07924b;color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #056d39}.go:disabled{opacity:.55}.sub{width:100%;margin-top:13px;padding:12px;border:2px solid #e7d9a6;border-radius:999px;background:#fffdf3;color:#6d5c25;font-weight:800;cursor:pointer}
.note{font-size:12px;color:#69806b;background:#f3faed;border-radius:12px;padding:12px;margin-top:15px;line-height:1.65}.msg{margin-top:14px;padding:13px;border-radius:14px;background:#edf7e9;display:none;line-height:1.65}.msg.ok{display:block;background:#e7f7df;color:#2f6837}.msg.warn{display:block;background:#fff4c9;color:#6e5b1d}.msg.err{display:block;background:#fff0ee;color:#8a3c35}.steps{margin-top:12px;background:#fffdf3;border:1px solid #f0df9c;border-radius:14px;padding:12px;font-size:12px;line-height:1.8}.small{text-align:center;font-size:11px;color:#788b79;margin-top:10px}.friends{text-align:center;font-size:24px;margin-top:17px;letter-spacing:5px}
@media(max-width:480px){.wrap{padding:18px 12px 30px}.brand h1{font-size:32px}.card{padding:20px 16px;border-radius:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>🌱 そなYELL</h1><p>今日の一歩が、未来の安心につながる。</p></div>
  <div class="card">
    <div class="welcome"><div class="sprout">🌱</div><h2>そなYELLへようこそ</h2><p>登録すると、スマホでもパソコンでも<br>同じアカウントで使えるようになります。</p></div>
    <button type="button" id="googleLogin" class="google"><span class="googleMark">G</span>Googleで続ける</button>
    <div class="googleNote">Googleアカウントを選ぶだけで登録・ログインできます</div>
    <div class="or">またはメールアドレスで</div>
    <div class="tabs"><button type="button" id="signupTab" class="on">新規登録</button><button type="button" id="loginTab">ログイン</button></div>
    <label>メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="example@gmail.com">
    <label>パスワード</label><div class="passwordWrap"><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="6文字以上"><button type="button" id="passwordToggle" class="passwordToggle" aria-label="パスワードを表示">👁 表示</button></div>
    <button type="button" id="submit" class="go">登録する</button>
    <button type="button" id="backApp" class="sub">← 立ち上げ画面へ戻る</button>
    <div class="note" id="guide">メールで登録する場合は確認メールが届きます。メールの確認リンクを押すと、そのままそなYELLへ進みます。</div>
    <div id="msg" class="msg"></div>
    <div class="steps" id="steps"><b>メール登録は3ステップ</b><br>① メールとパスワードを入力<br>② 届いた確認メールのリンクを押す<br>③ 自動でそなYELLへ戻る</div>
    <div class="small">※確認メールが見つからない時は、迷惑メールも確認してね。</div>
    <div class="friends">🐿️ 🐻 🐰 🐦</div>
  </div>
</div>
<script>
const U='https://illnptsvaieyacjajlfm.supabase.co';
const K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';
const REGISTER_URL='https://eiko07131-max.github.io/sonayell/register.html';
const GOOGLE_RETURN_URL='https://eiko07131-max.github.io/sonayell/enter.html';
const APP_URL='./enter.html?after_login=1&v=8';
let mode='signup'; const $=id=>document.getElementById(id);
function showMsg(text,type='ok'){const m=$('msg');m.className='msg '+type;m.textContent=text}
function setMode(m){mode=m;$('signupTab').classList.toggle('on',m==='signup');$('loginTab').classList.toggle('on',m==='login');$('submit').textContent=m==='signup'?'登録する':'ログインする';$('guide').textContent=m==='signup'?'メールで登録する場合は確認メールが届きます。メールの確認リンクを押すと、そのままそなYELLへ進みます。':'登録済みのメールアドレスとパスワードでログインできます。';$('steps').style.display=m==='signup'?'block':'none';$('msg').className='msg'}
$('signupTab').onclick=()=>setMode('signup'); $('loginTab').onclick=()=>setMode('login'); $('backApp').onclick=()=>location.href='./trial.html?v=4';
$('passwordToggle').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';$('passwordToggle').textContent=show?'🙈 隠す':'👁 表示';$('passwordToggle').setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示')};
$('googleLogin').onclick=()=>{const redirect=encodeURIComponent(GOOGLE_RETURN_URL);window.top.location.href=U+'/auth/v1/authorize?provider=google&redirect_to='+redirect};
async function claimAndEnter(accessToken,refreshToken=''){if(!accessToken){showMsg('ログイン情報を受け取れませんでした。もう一度ログインしてね。','err');return}localStorage.setItem('sonayell_access_token',accessToken);if(refreshToken)localStorage.setItem('sonayell_refresh_token',refreshToken);localStorage.setItem('sonayell_registered','1');const gt=localStorage.getItem('sonayell_guest_token');let s={};try{s=JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){}try{await fetch(U+'/rest/v1/rpc/sona_claim_guest_data',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({p_guest_token:gt||null,p_guest_yell:s.yell||0})})}catch(e){}showMsg('✅ ログイン完了！そなYELLへ入ります。','ok');location.replace(APP_URL)}
async function handleReturnFromEmail(){const hash=new URLSearchParams(location.hash.replace(/^#/,''));const access=hash.get('access_token'),refresh=hash.get('refresh_token')||'',err=hash.get('error_description')||hash.get('error');if(err){showMsg('メール確認でエラーが出ました。もう一度登録画面からやり直してね。','err');return}if(access){history.replaceState(null,'',location.pathname);await claimAndEnter(access,refresh)}}
$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){showMsg('メールアドレスと6文字以上のパスワードを入力してね。','warn');return}localStorage.setItem('sonayell_last_email',email);const btn=$('submit');btn.disabled=true;btn.textContent=mode==='signup'?'登録中…':'ログイン中…';try{const path=mode==='signup'?'/auth/v1/signup?redirect_to='+encodeURIComponent(REGISTER_URL):'/auth/v1/token?grant_type=password';const r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'処理できませんでした');if(mode==='signup'){if(data.access_token){await claimAndEnter(data.access_token,data.refresh_token||'')}else{showMsg('📩 確認メールを送りました。メールの中の確認リンクを押してね。','ok')}}else{await claimAndEnter(data.access_token,data.refresh_token||'')}}catch(e){showMsg('うまく処理できませんでした：'+e.message,'err')}finally{btn.disabled=false;btn.textContent=mode==='signup'?'登録する':'ログインする'}};
const last=localStorage.getItem('sonayell_last_email');if(last)$('email').value=last;handleReturnFromEmail();
</script>
</body>
</html>
