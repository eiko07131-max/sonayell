<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8月の防災クイズ｜そなYELL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;color:#28432f;background:linear-gradient(180deg,#dff6ff 0,#f6ffe9 48%,#eaf8d8 100%);min-height:100vh}button{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid #d6e8d1;padding:10px 14px;display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:0;border-radius:50%;background:#eef8e7;color:#24713a;font-size:22px;font-weight:900}.title{font-size:18px;font-weight:900;color:#16793d}.yell{margin-left:auto;background:#fff1aa;border:1px solid #edd978;border-radius:999px;padding:8px 12px;font-weight:900;color:#765e1c}.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fffdf2,#effbe3);border:2px solid #cce5a8;border-radius:26px;padding:18px;box-shadow:0 8px 24px #3d7d4030}.hero:before,.hero:after{content:"🍃";position:absolute;font-size:32px;opacity:.35}.hero:before{right:18px;top:10px;transform:rotate(25deg)}.hero:after{left:16px;bottom:9px;transform:rotate(-20deg)}.profrow{display:flex;align-items:center;gap:14px}.profbadge{width:88px;height:88px;min-width:88px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#70c868,#3ea653);border:5px solid #fff;box-shadow:0 4px 14px #306f3930;position:relative}.profbadge .face{font-size:42px}.profbadge .cap{position:absolute;right:-6px;top:-13px;font-size:34px}.profbadge .sprout{position:absolute;left:28px;top:-24px;font-size:30px}.hero h1{margin:0;color:#16783d;font-size:clamp(21px,4vw,29px)}.hero p{margin:6px 0 0;line-height:1.55}.themes{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.theme{background:#fff;border:1px solid #dce8cd;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:#4c6d51}.progressCard{margin-top:14px;background:#fff;border-radius:22px;padding:15px 17px;box-shadow:0 5px 18px #315f3420;border:1px solid #dcebd7}.progressHead{display:flex;align-items:center;justify-content:space-between;font-weight:900;color:#247a40}.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}.dot{height:12px;border-radius:999px;background:#e2ece0;transition:.25s}.dot.done{background:#62bd67;box-shadow:0 0 0 2px #dff4df inset}.quizCard{margin-top:14px;background:#fff;border-radius:24px;padding:18px;box-shadow:0 8px 24px #315f3423;border:1px solid #dbe9d7}.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.qno{display:inline-block;background:#24994b;color:#fff;border-radius:999px;padding:7px 12px;font-weight:900}.topic{font-size:12px;color:#66806c;background:#f3f7f1;border-radius:999px;padding:6px 10px}.question{font-size:clamp(19px,3.6vw,24px);line-height:1.55;font-weight:900;margin:16px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{border:2px solid #dfe8dc;background:#fff;border-radius:17px;padding:14px;text-align:left;font-weight:800;color:#314936;min-height:64px;cursor:pointer;transition:.18s}.ans:hover{transform:translateY(-1px);border-color:#a9cda8}.ans.sel{border-color:#72aee1;background:#eef7ff}.ans.ok{border-color:#4fb765;background:#effbef}.ans.wrong{border-color:#ef9797;background:#fff3f3}.ans:disabled{color:#314936;cursor:default;transform:none}.explain{display:none;margin-top:14px;background:linear-gradient(135deg,#f5fbe9,#fff9d9);border:1px solid #c9dfa6;border-radius:18px;padding:14px 15px;line-height:1.7}.explain.show{display:block}.reward{width:100%;margin-top:12px;border:0;border-radius:16px;padding:14px;background:#299b4d;color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 10px #27743d25}.reward:disabled{background:#bbc8b9;box-shadow:none}.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1;border:1px solid #9fc3a4;background:#fff;border-radius:14px;padding:12px;color:#2a713f;font-weight:900}.nav button:disabled{opacity:.45}.donebox{display:none;margin-top:15px;background:#fff6bf;border:2px solid #e7cf5a;border-radius:20px;padding:18px;text-align:center}.donebox.show{display:block}.leaf{position:fixed;top:-30px;z-index:99;font-size:25px;animation:fall 2.5s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(520deg);opacity:.15}}@media(max-width:600px){.answers{grid-template-columns:1fr}.profbadge{width:74px;height:74px;min-width:74px}.profbadge .face{font-size:34px}.profbadge .sprout{left:22px}.hero{padding:15px}.quizCard{padding:15px}}</style></head><body><header class="top"><button class="back" onclick="location.href='./home-v30.html?v=31'">←</button><div class="title">8月の防災クイズ</div><div class="yell">🌿 <span id="yell">0</span> YELL</div></header><main class="wrap"><section class="hero"><div class="profrow"><div class="profbadge"><span class="sprout">🌱</span><span class="face">😊</span><span class="cap">🎓</span></div><div><h1>そなピー博士と挑戦！</h1><p>よ〜く考えて、答えのあとは解説まで読んでみよう。</p></div></div><div class="themes"><span class="theme">🌀 台風</span><span class="theme">🌧️ ゲリラ豪雨</span><span class="theme">⚡ 雷</span><span class="theme">🌧️ 線状降水帯</span><span class="theme">🏠 内水氾濫</span></div></section><section class="progressCard"><div class="progressHead"><span>🌱 今月の進み具合</span><span id="pc">0 / 10</span></div><div id="dots" class="dots"></div></section><section class="quizCard"><div class="qhead"><span id="qno" class="qno">第1問 / 全10問</span><span id="topic" class="topic">台風</span></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="explain" class="explain"></div><button id="reward" class="reward" disabled>まず答えを選んでね</button><div class="nav"><button id="prev">← 前の問題</button><button id="next">次の問題 →</button></div><div id="donebox" class="donebox"><h2>🎉 8月の防災クイズ COMPLETE！</h2><p>10問すべての解説まで確認できたよ。<br><b>最大10YELL獲得 🌿</b></p><button class="reward" onclick="location.href='./home-v30.html?v=31'">ホームへ戻る</button></div></section></main><script>const Q=[{t:'台風',q:'台風が近づき、これから風雨が強まる予報。ベランダの植木鉢や物干し竿を片づけるなら？',a:['風雨が強くなる前','暴風警報が出てから','雨が最も強い時','台風が通過している最中'],c:0,e:'飛ばされそうな物の片づけは、風雨が強まる前の安全なうちに行うことが大切です。'},{t:'ゲリラ豪雨',q:'突然の激しい雨で道路が冠水。徒歩で移動するとき最も安全な判断は？',a:['長靴なら冠水路を進む','前の人が歩けたら同じ道を進む','水深が分からない冠水路には入らない','水が膝より下なら必ず進む'],c:2,e:'冠水すると側溝やマンホールが見えなくなります。水深や流れが分からない道には入らないのが基本です。'},{t:'雷',q:'屋外で雷鳴が聞こえた。身を守るために適切なのは？',a:['大きな木のすぐ下へ入る','丈夫な建物や自動車の中へ避難する','開けた場所で雨がやむのを待つ','傘だけ閉じてその場にいる'],c:1,e:'雷が近いときは、丈夫な建物や自動車など安全性の高い場所へ速やかに避難します。'},{t:'線状降水帯',q:'線状降水帯が発生すると、どんな危険が高まりやすい？',a:['雨が短時間で必ず完全に止む','海岸だけで大雨になる','強風だけが発生して大雨にはならない','同じ地域で大雨が続き災害危険度が急激に高まる'],c:3,e:'発達した雨雲が列をなし、ほぼ同じ場所を通過・停滞して強い雨が続くため、災害危険度が急激に高まることがあります。'},{t:'内水氾濫',q:'「内水氾濫」とはどんな現象？',a:['海から津波が押し寄せる','排水しきれない雨水などで市街地が浸水する','川の堤防が決壊した場合だけを指す','強風で屋根が飛ばされる'],c:1,e:'大雨で下水道や排水施設の能力を超えるなどして雨水を排水しきれず、市街地などが浸水する現象です。'},{t:'豪雨と地下空間',q:'大雨のとき地下街や地下室にいる。特に大切な行動は？',a:['浸水する前に地上の安全な場所へ移動する','地下の一番低い場所へ移動する','水が入ってから避難方法を考える','エレベーターだけを避難手段にする'],c:0,e:'地下空間は水が流れ込むと避難が難しくなるため、浸水前の早い段階で安全な場所へ移動することが重要です。'},{t:'夜間の大雨',q:'夜に大雨が強まる予報。避難について基本的に大切なのは？',a:['家の前が浸水するまで待つ','川を見に行ってから決める','必ず深夜になってから避難する','危険が高まる前に早めに判断する'],c:3,e:'暗くなったり道路が冠水したりすると避難が難しくなります。危険が高まる前の早めの判断が重要です。'},{t:'台風と河川',q:'台風のとき川の水位が気になる。最も適切なのは？',a:['橋の上から直接確認する','河原まで行って写真を撮る','公的な河川・防災情報を確認する','近所の人と一緒に見に行く'],c:2,e:'増水した川へ近づかず、自治体や河川管理者などの公的な防災情報で状況を確認します。'},{t:'雷',q:'雷が鳴っているとき、家の中なら何をしても安全？',a:['家の中でも電気設備などへの注意が必要','窓を開けて外を観察するのが最も安全','屋根の上へ移動する','ベランダへ出ればさらに安全'],c:0,e:'建物内は屋外より安全ですが、落雷時には電気設備などを通じた影響にも注意します。'},{t:'内水氾濫',q:'猛烈な雨で自宅周辺の道路がすでに冠水。外へ避難する方が危険な状況なら？',a:['必ず冠水道路を歩いて避難所へ行く','地下室へ荷物を取りに行く','車で冠水路へ入り水深を確かめる','建物内のより高く安全な場所で身を守る'],c:3,e:'屋外移動がかえって危険な場合は、建物内のより高く安全な場所などで命を守る行動をとります。'}];const K='sonayell_quiz_2026_08_v3';let S={rewarded:{},answered:{}};try{S={...S,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}let i=0;const $=id=>document.getElementById(id);function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function save(){localStorage.setItem(K,JSON.stringify(S))}function saveApp(s){localStorage.setItem('sonayell_v2',JSON.stringify(s))}function count(){return Object.values(S.rewarded).filter(Boolean).length}function leaves(){for(let n=0;n<18;n++){const el=document.createElement('i');el.className='leaf';el.textContent=n%4===0?'🍂':'🍃';el.style.left=Math.random()*96+'vw';el.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),3300)}}function renderDots(){const d=$('dots');d.innerHTML='';for(let n=0;n<10;n++){const x=document.createElement('span');x.className='dot'+(S.rewarded[n]?' done':'');d.appendChild(x)}}function progress(){const n=count();$('pc').textContent=n+' / 10';$('yell').textContent=Number(app().yell)||0;$('donebox').classList.toggle('show',n===10);renderDots()}function render(){const selected=S.answered[i]??null;$('qno').textContent='第'+(i+1)+'問 / 全10問';$('topic').textContent=Q[i].t;$('question').textContent=Q[i].q;const box=$('answers');box.innerHTML='';Q[i].a.forEach((txt,j)=>{const b=document.createElement('button');b.className='ans';b.textContent=String.fromCharCode(65+j)+'　'+txt;if(selected!==null){b.disabled=true;if(j===Q[i].c)b.classList.add('ok');if(j===selected&&j!==Q[i].c)b.classList.add('wrong');if(j===selected)b.classList.add('sel')}b.onclick=()=>answer(j);box.appendChild(b)});if(selected!==null){$('explain').classList.add('show');$('explain').innerHTML='<b>'+(selected===Q[i].c?'✨ 正解！':'🌱 おしい！')+'</b><br>'+Q[i].e;$('reward').disabled=!!S.rewarded[i];$('reward').textContent=S.rewarded[i]?'✅ 解説確認済み・1YELL獲得':'解説を確認して ＋1 YELL'}else{$('explain').classList.remove('show');$('explain').innerHTML='';$('reward').disabled=true;$('reward').textContent='まず答えを選んでね'}$('prev').disabled=i===0;$('next').disabled=i===9;progress()}function answer(j){if(S.answered[i]!==undefined)return;S.answered[i]=j;save();render()}$('reward').onclick=()=>{if(S.answered[i]===undefined||S.rewarded[i])return;S.rewarded[i]=true;save();const s=app();s.yell=(Number(s.yell)||0)+1;saveApp(s);leaves();render();setTimeout(()=>{if(i<9){i++;render();window.scrollTo({top:0,behavior:'smooth'})}},700)};$('prev').onclick=()=>{if(i>0){i--;render();scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(i<9){i++;render();scrollTo({top:0,behavior:'smooth'})}};render();</script></body></html>
