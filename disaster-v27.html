<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>災害別!! 防災アクション</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#fffdf6;color:#344434}header{position:sticky;top:0;background:#fff;z-index:5;padding:11px;display:flex;align-items:center;border-bottom:1px solid #ddd}header button{border:0;border-radius:50%;width:38px;height:38px}header b{margin-left:8px;color:#087d45}.y{margin-left:auto;background:#fff0aa;border-radius:30px;padding:7px 10px;font-weight:900}.wrap{max-width:650px;margin:auto;padding:14px}.intro{background:#eff9e9;border-radius:18px;padding:14px;line-height:1.6}.modes{display:flex;gap:8px;margin:12px 0}.mode{flex:1;padding:12px;border-radius:14px;border:2px solid;font-weight:900}.em{border-color:#e85343;background:#fff1ef;color:#c83b2c}.lr{border-color:#40964e;background:#edf8e9;color:#28773a}.active.em{background:#e94a38;color:white}.active.lr{background:#329647;color:white}.search{background:#f1f5f3;border-radius:13px;padding:10px;margin:10px 0}.search input{width:90%;border:0;background:transparent;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid #e4dfcc;background:white;border-radius:16px;padding:12px 4px;min-height:100px;font-weight:900}.card span{display:block;font-size:31px}.card small{display:block;margin-top:6px;font-size:11px;color:#5f765f;font-weight:900}.hide{display:none!important}.scene{width:100%;background:white;border:1px solid #e2dfd2;border-radius:14px;padding:13px;margin:7px 0;text-align:left;font-weight:900}.scene small{display:block;color:#777;margin-top:4px}.box{border-radius:16px;padding:13px;margin:9px 0;line-height:1.6}.do{background:#edf9e9;border:2px solid #55a85c}.dont{background:#fff0ed;border:2px solid #ef7668}.learn{background:#f5fbef;border:1px solid #9bc790}.row{margin:7px 0}.title{text-align:center;color:#087d45}.check,.back{width:100%;padding:13px;border-radius:14px;font-weight:900;margin-top:10px}.check{border:2px solid #2e9346;background:white;color:#21783a}.back{border:1px solid #9ab99d;background:#fff;color:#28733b}.progress{background:white;border-radius:14px;padding:10px;border:1px solid #e2dfd2}.bar{height:8px;background:#e7eee4;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#2f9c50}.leaf{position:fixed;top:-30px;font-size:28px;animation:f 2.4s linear forwards}@keyframes f{to{transform:translateY(110vh) rotate(500deg);opacity:.1}}</style></head><body><header><button id="topBack">←</button><b>災害別!! 防災アクション</b><span class="y">🌿 <span id="yellCount">0</span></span></header><main class="wrap"><section id="menuSec"><div class="intro">🌱 <b>発災時は最短で命を守る行動へ。</b><br>平時は理由までじっくり学んで、防災力を育てよう。</div><div class="modes"><button id="modeEm" class="mode em active">🚨 発災時<br><small>すぐ知りたい</small></button><button id="modeLearn" class="mode lr">🌿 平時<br><small>じっくり学ぶ</small></button></div><div class="search">🔎 <input id="menuSearch" placeholder="避難、車、エレベーター…"></div><b>災害を選ぶ</b><div id="disasterGrid" class="grid"></div></section><section id="sceneSec" class="hide"><h2 id="disasterTitle" class="title"></h2><div id="progressBox" class="progress"></div><div class="search">🔎 <input id="sceneSearch" placeholder="今の場面を検索"></div><div id="sceneList"></div><button id="toMenu" class="back">← 災害一覧へ</button></section><section id="detailSec" class="hide"><h2 id="sceneTitle" class="title"></h2><div class="modes"><button id="detailEm" class="mode em">🚨 発災時</button><button id="detailLearn" class="mode lr">🌿 平時</button></div><div id="detailBody"></div><button id="toScenes" class="back">← 場面一覧へ</button></section></main><script src="./disaster-extra-v25.js?v=2"></script><script src="./yell-cycle.js?v=1"></script><script>const names={earth:['🫨','地震'],tsunami:['🌊','津波'],typhoon:['🌀','台風・大雨'],land:['⛰️','土砂災害'],flood:['🌧️','洪水'],surge:['🌊','高潮'],snow:['⛄','大雪'],fire:['🔥','火災'],volcano:['🌋','火山噴火']};const earth=[['家の中で揺れた！','家 家具',['丈夫な机などの下で頭を守る','家具や窓から離れる','揺れが収まってから出口を確保する'],['慌てて外へ飛び出す','揺れている最中に無理に火を消しに行く'],'家具の固定、寝室の安全、避難経路を平時に確認しましょう。'],['エレベーターの中で揺れた！','エレベーター',['すべての階のボタンを押す','最初に停止した階で降りる','閉じ込められたら非常ボタン等で連絡する'],['扉を無理にこじ開ける','自力で脱出しようとする'],'地震時のエレベーター停止に備え、非常連絡方法を知っておきましょう。'],['外を歩いている時に揺れた！','外 道路',['かばん等で頭を守る','塀・看板・ガラスから離れる','広く安全な場所へ移動する'],['ブロック塀のそばに留まる','切れた電線に近づく'],'普段の道の落下物・倒壊危険箇所を確認しましょう。'],['車を運転中に揺れた！','車 運転',['急操作を避け道路左側に停車する','揺れが収まるまで情報を確認する','警察等の指示に従う'],['急ブレーキ・急ハンドル','緊急車両の妨げになる場所に放置する'],'車にも水・ライト・携帯トイレ等を備えておきましょう。'],['寝ている時に揺れた！','寝室',['布団や枕で頭を守る','家具から離れる','揺れが収まってから履物を履く'],['裸足で歩く','慌てて暗い階段へ走る'],'枕元にライトと履物を用意し、家具を固定しましょう。']];const data={earth};if(window.EXTRA)Object.assign(data,window.EXTRA);if(window.__extra)Object.assign(data,window.__extra);let mode='em',cur=null,idx=null;const KEY='sonayell_disaster_v25';let state={checked:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function renderYell(){$('yellCount').textContent=Number(SonaYellCycle.get().yell)||0}function setMode(m){mode=m;$('modeEm').classList.toggle('active',m==='em');$('modeLearn').classList.toggle('active',m==='lr')}function renderGrid(){const q=$('menuSearch').value.toLowerCase();const box=$('disasterGrid');box.innerHTML='';Object.keys(names).forEach(k=>{const scenes=data[k]||[];const learned=scenes.filter((_,i)=>state.checked[k+'-'+i]).length;const hay=(names[k][1]+' '+scenes.flat(3).join(' ')).toLowerCase();if(q&&!hay.includes(q))return;const b=document.createElement('button');b.className='card';b.innerHTML='<span>'+names[k][0]+'</span>'+names[k][1]+'<small>学習 '+learned+' / '+scenes.length+'</small>';b.onclick=()=>openDisaster(k);box.appendChild(b)})}function openDisaster(k){cur=k;$('menuSec').classList.add('hide');$('detailSec').classList.add('hide');$('sceneSec').classList.remove('hide');$('disasterTitle').textContent=names[k][0]+' '+names[k][1];$('sceneSearch').value='';renderScenes();scrollTo(0,0)}function renderScenes(){const a=data[cur]||[];const n=a.filter((_,i)=>state.checked[cur+'-'+i]).length;$('progressBox').innerHTML='<b>学習 '+n+' / '+a.length+'</b><div class="bar"><i style="width:'+(a.length?n/a.length*100:0)+'%"></i></div>';const q=$('sceneSearch').value.toLowerCase();const box=$('sceneList');box.innerHTML='';a.forEach((v,i)=>{if(q&&!v.flat(3).join(' ').toLowerCase().includes(q))return;const b=document.createElement('button');b.className='scene';b.innerHTML=(state.checked[cur+'-'+i]?'✅ ':'')+v[0]+' ›<small>'+v[1]+'</small>';b.onclick=()=>openScene(i);box.appendChild(b)})}function openScene(i){idx=i;$('sceneSec').classList.add('hide');$('detailSec').classList.remove('hide');$('sceneTitle').textContent=data[cur][i][0];renderDetail(mode);scrollTo(0,0)}function renderDetail(m){mode=m;$('detailEm').classList.toggle('active',m==='em');$('detailLearn').classList.toggle('active',m==='lr');const x=data[cur][idx],box=$('detailBody');if(m==='em'){box.innerHTML='<div class="box do"><b>✅ 今すること</b>'+x[2].map(v=>'<div class="row">☑ '+v+'</div>').join('')+'</div><div class="box dont"><b>❌ しないこと</b>'+x[3].map(v=>'<div class="row">✕ '+v+'</div>').join('')+'</div><button id="learnMore" class="check">🌿 理由まで詳しく学ぶ</button>';$('learnMore').onclick=()=>renderDetail('lr')}else{const done=!!state.checked[cur+'-'+idx];box.innerHTML='<div class="box learn"><h3>🌿 なぜ？どう備える？</h3><p>'+x[4]+'</p><p><b>覚えておこう：</b>場所・時間・周囲の状況で行動は変わります。気象庁・内閣府・消防庁・自治体などの最新情報と避難情報を確認しましょう。</p></div><button id="learnCheck" class="check">'+(done?'✅ 学習済み':'○ 確認しました　＋1 YELL')+'</button>';$('learnCheck').onclick=learn}}function learn(){const k=cur+'-'+idx;if(state.checked[k])return;state.checked[k]=true;save();const result=SonaYellCycle.add(1);renderYell();for(let i=0;i<14;i++){const e=document.createElement('i');e.className='leaf';e.textContent='🍃';e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}if(result.madeTrees>0)alert('🌳 50YELL達成！大樹が1本育ったよ。YELLは0から再スタート！');renderDetail('lr')}function showMenu(){$('sceneSec').classList.add('hide');$('detailSec').classList.add('hide');$('menuSec').classList.remove('hide');renderGrid()}function backScenes(){$('detailSec').classList.add('hide');$('sceneSec').classList.remove('hide');renderScenes()}$('modeEm').onclick=()=>setMode('em');$('modeLearn').onclick=()=>setMode('lr');$('detailEm').onclick=()=>renderDetail('em');$('detailLearn').onclick=()=>renderDetail('lr');$('menuSearch').oninput=renderGrid;$('sceneSearch').oninput=renderScenes;$('toMenu').onclick=showMenu;$('toScenes').onclick=backScenes;$('topBack').onclick=()=>{if(!$('detailSec').classList.contains('hide'))backScenes();else if(!$('sceneSec').classList.contains('hide'))showMenu();else location.href='./home.html?v=26'};renderYell();renderGrid();</script></body></html>
