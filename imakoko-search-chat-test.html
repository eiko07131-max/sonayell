<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16853f">
<title>イマココ｜検索→チャット テスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f4f8f3;color:#24382a}button,input,textarea{font:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;background:#fff;padding-bottom:30px}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #e4ece1}.back{width:42px;height:42px;border:0;border-radius:50%;background:#eef6eb;font-size:24px;color:#22663a}.title{font-size:20px;font-weight:900;color:#194d2e}.note{margin:14px 16px 8px;background:#fff6d9;border:1px solid #e6ca77;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.55}.searchbox{margin:10px 16px;background:#f3f8f1;border:1px solid #d6e3d2;border-radius:18px;padding:12px}.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px}.q{width:100%;border:2px solid #bfd4bb;border-radius:14px;padding:13px;background:#fff;outline:0;font-size:16px}.search{border:0;border-radius:14px;padding:0 15px;background:#1f8046;color:#fff;font-weight:900}.clear{margin-top:8px;width:100%;border:0;border-radius:12px;padding:9px;background:#eaf3e7;color:#2b6d40;font-weight:900}.help{font-size:11px;color:#6f7d73;margin-top:7px;line-height:1.5}.summary{padding:10px 16px 8px;font-weight:900;color:#1c6037}.list{display:grid;gap:10px;padding:0 16px}.card{border:1px solid #dce5d9;border-radius:17px;padding:13px;background:#fff;box-shadow:0 5px 14px #234d2b10}.cat{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf5e9;color:#2a6b3e;font-size:11px;font-weight:900}.place{margin-top:8px;font-weight:900;font-size:17px}.msg{margin-top:6px;line-height:1.55;font-size:14px;white-space:pre-wrap}.time{margin-top:10px;border-left:4px solid #6ea958;background:#f3f9ef;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:900;color:#235d35}.meta{margin-top:6px;color:#6f7d73;font-size:11px;line-height:1.5}.hit{margin-top:8px;border-radius:10px;padding:7px 9px;background:#eef6ff;color:#245f91;font-size:11px;font-weight:900}.openchat{width:100%;margin-top:10px;border:0;border-radius:13px;background:#238048;color:#fff;padding:12px;font-weight:900}.empty{text-align:center;margin:0 16px;padding:28px 12px;border-radius:16px;background:#f7faf6;color:#7b887f}.resolved{margin-top:8px;background:#e8f7f4;border:1px solid #8ec9bd;color:#167260;border-radius:12px;padding:8px;text-align:center;font-weight:900}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:#173522a8}.modal.show{display:flex}.sheet{width:min(100%,520px);max-height:96vh;overflow:auto;background:#f7faf6;border-radius:24px 24px 0 0;padding:0 14px 26px}.sheettop{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;background:#fff;padding:14px 4px 12px;border-bottom:1px solid #e4ece1}.sheettop h2{margin:0;font-size:19px;color:#1c5f36}.x{width:40px;height:40px;border:0;border-radius:50%;background:#eef5eb;font-size:23px}.origin{margin:14px 0 10px;background:#fff4d8;border:2px solid #e6bd57;border-radius:17px;padding:13px}.origintag{display:inline-block;border-radius:999px;padding:5px 10px;background:#f6cf73;color:#704600;font-size:11px;font-weight:900;margin-bottom:8px}.origin b{display:block;font-size:17px;line-height:1.45}.origin p{margin:7px 0 0;font-size:14px;line-height:1.55;white-space:pre-wrap}.originmeta{margin-top:8px;color:#78694a;font-size:11px}.solved{margin:10px 0;background:#e8f7f4;border:2px solid #75bdae;color:#126c5c;border-radius:15px;padding:11px;font-weight:900}.replytitle{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;color:#1d6137;font-size:15px;font-weight:900}.replytitle:before,.replytitle:after{content:"";height:1px;background:#d8e3d4;flex:1}.replytitle span{white-space:nowrap}.replies{display:flex;flex-direction:column;gap:10px;padding:2px 0 6px}.row{display:flex;flex-direction:column;max-width:84%}.row.other{align-self:flex-start}.row.mine{align-self:flex-end;align-items:flex-end}.bubblemeta{font-size:10px;color:#748078;margin:0 5px 4px}.bubblemeta b{font-size:11px;color:#356344}.mine .bubblemeta b{color:#2466a2}.bubble{padding:10px 12px;border-radius:17px;font-size:14px;line-height:1.5;white-space:pre-wrap;box-shadow:0 2px 7px #29472e0b}.other .bubble{background:#fff;border:1px solid #dbe4d8;border-bottom-left-radius:5px}.mine .bubble{background:#e5f2ff;border:1px solid #a8cae8;border-bottom-right-radius:5px;color:#204e77}.you{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;background:#cfe6fa;color:#2466a2;font-size:9px;font-weight:900}.noreply{text-align:center;color:#7d8a81;font-size:12px;padding:14px}.form{margin-top:14px;background:#fff;border:1px solid #dce7d8;border-radius:17px;padding:13px}.formtitle{font-size:15px;font-weight:900;color:#1f6339;margin-bottom:7px}.label{display:block;font-size:13px;font-weight:900;color:#285d39;margin-top:12px}.help2{display:block;margin-top:3px;color:#6f7e73;font-size:11px;line-height:1.4;font-weight:700}.input,.textarea{width:100%;margin-top:7px;border:2px solid #cfdcc9;border-radius:13px;padding:11px;background:#fff;outline:0}.textarea{min-height:92px;resize:vertical}.send{width:100%;margin-top:12px;border:0;border-radius:13px;background:#238048;color:#fff;padding:13px;font-weight:900;font-size:16px}.send:disabled{background:#86b798}.privacy{margin-top:9px;color:#6f7d73;font-size:10px;line-height:1.45}.status{min-height:18px;text-align:center;margin-top:8px;color:#176b32;font-size:13px;font-weight:900}.closedreply{margin-top:14px;background:#f1f2f1;border:1px solid #d5d7d5;border-radius:15px;padding:13px;color:#6b716d;font-weight:900}.resultflash{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:#17352266;padding:24px}.resultflash.show{display:flex}.resultcard{width:min(86vw,380px);background:#fff;border:4px solid #55a66a;border-radius:24px;padding:28px 20px;text-align:center;box-shadow:0 18px 50px #14331f55}.resulticon{font-size:48px}.resulttitle{margin-top:8px;font-size:25px;font-weight:900;color:#176b32}.resultsub{margin-top:7px;font-size:13px;color:#5d7464}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="title">🔍 イマココ検索 → チャット</div></header>
<div class="note">🧪 検索結果から「聞きたい・伝えたい」のやり取りへ直接入るテストです。</div>
<section class="searchbox"><div class="searchrow"><input id="q" class="q" placeholder="例：スマホ充電、三室給水"><button id="search" class="search">検索</button></div><div class="help">場所・本文・表示名・返信内容まで検索。言葉の順番が違っても拾いやすくしています。</div><button id="clear" class="clear">検索を解除</button></section>
<div id="summary" class="summary">読み込み中…</div><section id="list" class="list"><div class="empty">読み込み中…</div></section>
</main>
<div id="chatModal" class="modal"><div class="sheet"><div class="sheettop"><h2>💬 みんなのやり取り</h2><button id="closeChat" class="x">×</button></div><div id="origin" class="origin"></div><div id="solved" class="solved" style="display:none"></div><div class="replytitle"><span>💬 みんなからの返信</span></div><div id="replies" class="replies"></div><div id="replyForm" class="form"><div class="formtitle">✏️ この投稿に返信する</div><label class="label">あなたの表示名（ニックネーム）<span class="help2">本名じゃなくてOK。返信の横に表示される名前です。</span><input id="replyName" class="input" maxlength="30" placeholder="例：えーさん"></label><label class="label">返信内容<span class="help2">相手に伝えたいことを書いてね。</span><textarea id="replyMessage" class="textarea" maxlength="200" placeholder="例：○○公民館でスマホを充電できますよ"></textarea></label><button id="send" class="send">この内容で返信する</button><div class="privacy">※公開返信です。電話番号・自宅の詳しい住所など個人情報は書かないでね。</div><div id="status" class="status"></div></div><div id="closedReply" class="closedreply" style="display:none">🔒 解決済みのため、返信受付は終了しました。</div></div></div>
<div id="resultFlash" class="resultflash"><div class="resultcard"><div class="resulticon">✅</div><div class="resulttitle">返信しました！</div><div class="resultsub">公開返信に反映されました。</div></div></div>
<script>
const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',REGION='saitama-midori';
const DEF={water:['🚰','水'],food:['🍙','食料・物資'],gas:['⛽','ガソリン'],road:['🚧','道路・危険箇所'],life:['🛟','生活支援'],other:['💬','聞きたい・伝えたい']};
let token=localStorage.getItem('imakoko_test_guest');if(!token){token=crypto.randomUUID();localStorage.setItem('imakoko_test_guest',token)}
let posts=[],replyRows=[],query='',current=null;const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function rpc(name,body){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body||{}),cache:'no-store'});const t=await r.text();if(!r.ok)throw Error(t||r.status);return t?JSON.parse(t):null}
function jpTime(iso,suffix='投稿'){const d=new Date(iso),p=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),g=t=>p.find(x=>x.type===t)?.value||'';return `${Number(g('month'))}月${Number(g('day'))}日 ${g('hour')}時${g('minute')}分 ${suffix}`}
function remain(iso){const m=Math.max(0,Math.ceil((new Date(iso)-Date.now())/60000));if(m<=1)return'まもなく終了';if(m<60)return`あと約${m}分`;return`あと約${Math.ceil(m/60)}時間`}
function norm(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[\s　・,，.。!！?？:：;；「」『』【】()（）\-_/／]/g,'')}
function grams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a}
function fuzzy(text,q){const T=norm(text),Q=norm(q);if(!Q)return true;if(T.includes(Q))return true;const words=String(q).trim().split(/[\s　]+/).map(norm).filter(Boolean);if(words.length>1&&words.every(w=>T.includes(w)))return true;if(Q.length<4)return false;const gs=grams(Q),hits=gs.filter(g=>T.includes(g)).length;return hits>=Math.max(2,Math.ceil(gs.length*.6))}
function repliesFor(p){return replyRows.filter(r=>r.post_id===p.id)}
function matchInfo(p){const main=[DEF[p.category]?.[1]||'',p.place,p.message,p.nickname].join(' '),mainHit=fuzzy(main,query),replyHit=repliesFor(p).find(r=>fuzzy([r.nickname,r.message].join(' '),query));return {ok:!query||mainHit||!!replyHit,mainHit,replyHit}}
function render(){const a=posts.filter(p=>matchInfo(p).ok);$('summary').textContent=query?`「${query}」の検索結果：${a.length}件`:`現在公開中の情報：${a.length}件`;if(!a.length){$('list').innerHTML='<div class="empty">該当する公開中の情報は見つかりませんでした。<br>言葉を短くして試してみてね。</div>';return}$('list').innerHTML=a.map(p=>{const d=DEF[p.category]||DEF.other,m=matchInfo(p);return `<article class="card"><span class="cat">${d[0]} ${d[1]}</span><div class="place">${esc(p.place)}</div><div class="msg">${esc(p.message)}</div><div class="time">🕒 ${jpTime(p.created_at)}</div><div class="meta">投稿者：${esc(p.nickname)}　⌛ ${remain(p.expires_at)}で自動終了</div>${p.resolved_at?'<div class="resolved">✅ 解決済み</div>':''}${m.replyHit&&!m.mainHit?`<div class="hit">🔎 返信の中に一致：「${esc(m.replyHit.message)}」</div>`:''}${p.category==='other'?`<button class="openchat" data-id="${p.id}">💬 この質問のやり取りを開く</button>`:''}</article>`}).join('');document.querySelectorAll('.openchat').forEach(b=>b.onclick=()=>openChat(b.dataset.id))}
function renderChatReplies(){const rs=repliesFor(current);$('replies').innerHTML=rs.length?rs.map(r=>`<div class="row ${r.owned_by_me?'mine':'other'}"><div class="bubblemeta"><b>${esc(r.nickname)}</b>${r.owned_by_me?'<span class="you">あなた</span>':''}　${jpTime(r.created_at,'返信')}</div><div class="bubble">${esc(r.message)}</div></div>`).join(''):'<div class="noreply">まだ返信はありません。</div>'}
async function openChat(id){current=posts.find(p=>p.id===id);if(!current)return;$('origin').innerHTML=`<span class="origintag">元の投稿</span><b>${esc(current.place)}</b><p>${esc(current.message)}</p><div class="originmeta">${jpTime(current.created_at)} ・ 投稿者：${esc(current.nickname)}</div>`;$('solved').style.display=current.resolved_at?'block':'none';$('solved').textContent=current.resolved_at?'✅ 解決済み　'+jpTime(current.resolved_at,'解決'):'';$('replyForm').style.display=current.resolved_at?'none':'block';$('closedReply').style.display=current.resolved_at?'block':'none';$('replyName').value=localStorage.getItem('imakoko_test_nickname')||'';$('replyMessage').value=localStorage.getItem('imakoko_reply_draft_'+id)||'';$('status').textContent='';renderChatReplies();$('chatModal').classList.add('show')}
function flash(){const f=$('resultFlash');f.classList.add('show');setTimeout(()=>f.classList.remove('show'),1700)}
async function load(){try{[posts,replyRows]=await Promise.all([rpc('imakoko_test_list_posts_v4',{p_region_key:REGION,p_category:null,p_guest_token:token}),rpc('imakoko_test_list_replies_v2',{p_region_key:REGION,p_guest_token:token})]);posts=posts||[];replyRows=replyRows||[];render()}catch(e){$('summary').textContent='読み込みに失敗しました';$('list').innerHTML='<div class="empty">少し待って、もう一度開いてね。</div>'}}
$('search').onclick=()=>{query=$('q').value.trim();render()};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();query=$('q').value.trim();render()}});$('clear').onclick=()=>{$('q').value='';query='';render()};$('closeChat').onclick=()=>$('chatModal').classList.remove('show');$('chatModal').onclick=e=>{if(e.target===$('chatModal'))$('chatModal').classList.remove('show')};$('replyMessage').addEventListener('input',()=>{if(current)localStorage.setItem('imakoko_reply_draft_'+current.id,$('replyMessage').value)});$('replyName').addEventListener('input',()=>localStorage.setItem('imakoko_test_nickname',$('replyName').value));
$('send').onclick=async()=>{if(!current||current.resolved_at)return;const n=$('replyName').value.trim(),m=$('replyMessage').value.trim();if(!n||!m){$('status').textContent='ニックネームと返信内容を入力してね。';return}$('send').disabled=true;$('send').textContent='送信中…';try{await rpc('imakoko_test_add_reply',{p_post_id:current.id,p_guest_token:token,p_nickname:n,p_message:m});localStorage.setItem('imakoko_test_nickname',n);localStorage.removeItem('imakoko_reply_draft_'+current.id);$('replyMessage').value='';replyRows=await rpc('imakoko_test_list_replies_v2',{p_region_key:REGION,p_guest_token:token})||[];renderChatReplies();$('status').textContent='✅ 返信しました！';flash();const p=posts.find(x=>x.id===current.id);if(p)p.reply_count=Number(p.reply_count||0)+1;render()}catch(e){$('status').textContent='返信できませんでした。もう一度試してね。'}finally{$('send').disabled=false;$('send').textContent='この内容で返信する'}};
load();
</script>
</body></html>
