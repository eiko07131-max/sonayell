<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>災害別!! 防災アクション</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#fffdf6;color:#344434}header{position:sticky;top:0;background:#fff;z-index:5;padding:11px;display:flex;align-items:center;border-bottom:1px solid #ddd}header button{border:0;border-radius:50%;width:38px;height:38px}header b{margin-left:8px;color:#087d45}.y{margin-left:auto;background:#fff0aa;border-radius:30px;padding:7px 10px;font-weight:900}.wrap{max-width:650px;margin:auto;padding:14px}.intro{background:#eff9e9;border-radius:18px;padding:14px;line-height:1.6}.modes{display:flex;gap:8px;margin:12px 0}.mode{flex:1;padding:12px;border-radius:14px;border:2px solid;font-weight:900}.em{border-color:#e85343;background:#fff1ef;color:#c83b2c}.lr{border-color:#40964e;background:#edf8e9;color:#28773a}.active.em{background:#e94a38;color:white}.active.lr{background:#329647;color:white}.search{background:#f1f5f3;border-radius:13px;padding:10px;margin:10px 0}.search input{width:90%;border:0;background:transparent;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid #e4dfcc;background:white;border-radius:16px;padding:12px 4px;min-height:88px;font-weight:900}.card span{display:block;font-size:31px}.hide{display:none!important}.scene{width:100%;background:white;border:1px solid #e2dfd2;border-radius:14px;padding:13px;margin:7px 0;text-align:left;font-weight:900}.scene small{display:block;color:#777;margin-top:4px}.box{border-radius:16px;padding:13px;margin:9px 0;line-height:1.6}.do{background:#edf9e9;border:2px solid #55a85c}.dont{background:#fff0ed;border:2px solid #ef7668}.learn{background:#f5fbef;border:1px solid #9bc790}.row{margin:7px 0}.title{text-align:center;color:#087d45}.check,.back{width:100%;padding:13px;border-radius:14px;font-weight:900;margin-top:10px}.check{border:2px solid #2e9346;background:white;color:#21783a}.back{border:1px solid #9ab99d;background:#fff;color:#28733b}.progress{background:white;border-radius:14px;padding:10px;border:1px solid #e2dfd2}.bar{height:8px;background:#e7eee4;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#2f9c50}.leaf{position:fixed;top:-30px;font-size:28px;animation:f 2.4s linear forwards}@keyframes f{to{transform:translateY(110vh) rotate(500deg);opacity:.1}}@media(max-width:430px){.card{font-size:12px}}</style></head><body><header><button onclick="back()">←</button><b>災害別!! 防災アクション</b><span class="y">🌿 <span id="yell">0</span></span></header><main class="wrap"><section id="menu"><div class="intro">🌱 <b>発災時は最短で命を守る行動へ。</b><br>平時は理由までじっくり学んで、防災力を育てよう。</div><div class="modes"><button id="me" class="mode em active" onclick="setMode('em')">🚨 発災時<br><small>すぐ知りたい</small></button><button id="ml" class="mode lr" onclick="setMode('lr')">🌿 平時<br><small>じっくり学ぶ</small></button></div><div class="search">🔎 <input id="q" placeholder="避難、車、エレベーター…" oninput="grid()"></div><b>災害を選ぶ</b><div id="grid" class="grid"></div></section><section id="sc" class="hide"><h2 id="dt" class="title"></h2><div id="prog" class="progress"></div><div class="search">🔎 <input id="sq" placeholder="今の場面を検索" oninput="scenes()"></div><div id="scenes"></div><button class="back" onclick="menu()">← 災害一覧へ</button></section><section id="det" class="hide"><h2 id="st" class="title"></h2><div class="modes"><button id="de" class="mode em" onclick="detailMode('em')">🚨 発災時</button><button id="dl" class="mode lr" onclick="detailMode('lr')">🌿 平時</button></div><div id="body"></div><button class="back" onclick="backScenes()">← 場面一覧へ</button></section></main><script src="./disaster-extra-v25.js?v=2"></script><script>const names={earth:['🫨','地震'],tsunami:['🌊','津波'],typhoon:['🌀','台風・大雨'],land:['⛰️','土砂災害'],flood:['🌧️','洪水'],surge:['🌊','高潮'],snow:['⛄','大雪'],fire:['🔥','火災'],volcano:['🌋','火山噴火']};const earth=[['家の中で揺れた！','家 家具',['丈夫な机などの下で頭を守る','家具や窓から離れる','揺れが収まってから出口を確保する'],['慌てて外へ飛び出す','揺れている最中に無理に火を消しに行く'],'家具の固定、寝室の安全、避難経路を平時に確認しましょう。'],['エレベーターの中で揺れた！','エレベーター',['すべての階のボタンを押す','最初に停止した階で降りる','閉じ込められたら非常ボタン等で連絡する'],['扉を無理にこじ開ける','自力で脱出しようとする'],'地震時のエレベーター停止に備え、非常連絡方法を知っておきましょう。'],['外を歩いている時に揺れた！','外 道路',['かばん等で頭を守る','塀・看板・ガラスから離れる','広く安全な場所へ移動する'],['ブロック塀のそばに留まる','切れた電線に近づく'],'普段の道の落下物・倒壊危険箇所を確認しましょう。'],['車を運転中に揺れた！','車 運転',['急操作を避け道路左側に停車する','揺れが収まるまで情報を確認する','警察等の指示に従う'],['急ブレーキ・急ハンドル','緊急車両の妨げになる場所に放置する'],'車にも水・ライト・携帯トイレ等を備えておきましょう。'],['寝ている時に揺れた！','寝室',['布団や枕で頭を守る','家具から離れる','揺れが収まってから履物を履く'],['裸足で歩く','慌てて暗い階段へ走る'],'枕元にライトと履物を用意し、家具を固定しましょう。']];let data={earth};if(typeof extra!=='undefined')Object.assign(data,extra);else if(window.EXTRA)Object.assign(data,window.EXTRA);/* 外部データが旧形式でも拾う */
const fallback=window.__extra||{};Object.assign(data,fallback);let mode='em',cur=null,idx=null;const K='sonayell_disaster_v25';let st={checked:{}};try{st={...st,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function saveApp(s){localStorage.setItem('sonayell_v2',JSON.stringify(s))}function save(){localStorage.setItem(K,JSON.stringify(st))}function setMode(m){mode=m;me.classList.toggle('active',m==='em');ml.classList.toggle('active',m==='lr')}function grid(){let x=q.value.toLowerCase();gridEl.innerHTML='';Object.keys(names).forEach(k=>{let hay=(names[k][1]+' '+(data[k]||[]).flat(3).join(' ')).toLowerCase();if(x&&!hay.includes(x))return;let b=document.createElement('button');b.className='card';b.innerHTML='<span>'+names[k][0]+'</span>'+names[k][1];b.onclick=()=>open(k);gridEl.appendChild(b)})}const gridEl=document.getElementById('grid');function open(k){cur=k;menuEl.classList.add('hide');sc.classList.remove('hide');dt.textContent=names[k][0]+' '+names[k][1];sq.value='';scenes();scrollTo(0,0)}const menuEl=document.getElementById('menu');function scenes(){let a=data[cur]||[],n=a.filter((_,i)=>st.checked[cur+'-'+i]).length;prog.innerHTML='<b>学習 '+n+' / '+a.length+'</b><div class="bar"><i style="width:'+(a.length?n/a.length*100:0)+'%"></i></div>';let x=sq.value.toLowerCase();window.scenes.innerHTML='';a.forEach((v,i)=>{if(x&&!v.flat(3).join(' ').toLowerCase().includes(x))return;let b=document.createElement('button');b.className='scene';b.innerHTML=(st.checked[cur+'-'+i]?'✅ ':'')+v[0]+' ›<small>'+v[1]+'</small>';b.onclick=()=>show(i);window.scenes.appendChild(b)})}function show(i){idx=i;sc.classList.add('hide');det.classList.remove('hide');st.textContent=data[cur][i][0];detailMode(mode);scrollTo(0,0)}function detailMode(m){mode=m;de.classList.toggle('active',m==='em');dl.classList.toggle('active',m==='lr');let x=data[cur][idx];if(m==='em')body.innerHTML='<div class="box do"><b>✅ 今すること</b>'+x[2].map(v=>'<div class="row">☑ '+v+'</div>').join('')+'</div><div class="box dont"><b>❌ しないこと</b>'+x[3].map(v=>'<div class="row">✕ '+v+'</div>').join('')+'</div><button class="check" onclick="detailMode(\'lr\')">🌿 理由まで詳しく学ぶ</button>';else{let done=!!st.checked[cur+'-'+idx];body.innerHTML='<div class="box learn"><h3>🌿 なぜ？どう備える？</h3><p>'+x[4]+'</p><p><b>覚えておこう：</b>同じ災害でも場所・時間・周囲の状況で最適な行動は変わります。気象庁・内閣府・消防庁・自治体などの最新情報と避難情報を確認しましょう。</p></div><button class="check" onclick="learn()">'+(done?'✅ 学習済み':'○ 確認しました　＋1 YELL')+'</button>'}}function learn(){let k=cur+'-'+idx;if(st.checked[k])return;st.checked[k]=true;save();let s=app();s.yell=(Number(s.yell)||0)+1;s.leaves=(Number(s.leaves)||0)+1;s.tree_growth=(Number(s.tree_growth)||0)+1;saveApp(s);yell.textContent=s.yell;for(let i=0;i<14;i++){let e=document.createElement('i');e.className='leaf';e.textContent='🍃';e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}detailMode('lr')}function backScenes(){det.classList.add('hide');sc.classList.remove('hide');scenes()}function menu(){sc.classList.add('hide');menuEl.classList.remove('hide');grid()}function back(){if(!det.classList.contains('hide'))backScenes();else if(!sc.classList.contains('hide'))menu();else location.href='./home.html?v=25'}yell.textContent=Number(app().yell)||0;grid();</script></body></html>
