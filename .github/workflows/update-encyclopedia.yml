name: Update encyclopedia

on:
  push:
    paths:
      - 'tools/update_encyclopedia.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update encyclopedia section
        run: python tools/update_encyclopedia.py
      - name: Commit updated index
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build improved disaster prevention encyclopedia'
          git push
