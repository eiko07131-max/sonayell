name: Add home posts section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure home posts are visible on the home screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'homePostsFixV2' in s:
              print('homePostsFixV2 already exists; nothing to do.')
              raise SystemExit(0)

          fix = r'''<script id="homePostsFixV2">
          document.addEventListener('DOMContentLoaded', function(){
            function placePosts(){
              var home = document.getElementById('homeScreen');
              var posts = document.getElementById('homePosts');
              if(!home) return;
              if(!posts){
                posts = document.createElement('div');
                posts.id = 'homePosts';
                posts.className = 'homePosts';
                posts.innerHTML = '<div class="homePostsHead"><h3 class="homePostsTitle">📣 みんなの防災投稿</h3><span class="tag">みんなの工夫</span></div><p class="homePostsLead">あなたの小さな工夫が、誰かの安心につながるかも。</p><div class="homePostList"><article class="homePost"><div class="homePostUser">🌱 そなママ</div><p class="homePostText">100均グッズで非常用トイレセットを作って、玄関に置いています！</p><span class="homePostYell">🌟 YELL 3</span></article><article class="homePost"><div class="homePostUser">🌿 えいこ</div><p class="homePostText">懐中電灯はベッドの近くに。停電してもすぐ手に取れて安心！</p><span class="homePostYell">🌟 YELL 5</span></article><article class="homePost"><div class="homePostUser">💧 そなパパ</div><p class="homePostText">水は一人1日3Lを目安に、ローリングストックしています。</p><span class="homePostYell">🌟 YELL 4</span></article></div>';
              }
              if(posts.parentElement !== home){
                var tree = home.querySelector('.myTreeCard');
                if(tree) home.insertBefore(posts, tree);
                else home.appendChild(posts);
              }
              posts.style.display = 'block';
            }
            placePosts();
            setTimeout(placePosts, 300);
          });
          </script>'''

          if '</body>' in s:
              s = s.replace('</body>', fix + '</body>', 1)
          else:
              s += fix

          p.write_text(s, encoding='utf-8')
          print('home posts visibility fix added')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ensure community posts appear on home"
          git push
