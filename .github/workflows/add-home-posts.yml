name: Add home posts section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add posts section to home
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="homePosts"' in s:
              print('homePosts already exists; nothing to do.')
              raise SystemExit(0)

          css = '''\n.homePosts{margin-top:15px;background:linear-gradient(135deg,#fff8fb,#fffdf4);border:2px solid #f2dfe5;border-radius:23px;padding:18px;box-shadow:0 5px 18px rgba(120,70,80,.07)}.homePostsHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.homePostsTitle{margin:0;color:#397a44;font-size:18px}.homePostsLead{margin:5px 0 12px;font-size:12px;color:#6b826d;line-height:1.5}.homePostList{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.homePost{background:#fff;border:1px solid #f0e4e7;border-radius:17px;padding:13px;min-height:145px}.homePostUser{font-size:11px;font-weight:bold;color:#4b7651;margin-bottom:7px}.homePostText{font-size:12px;line-height:1.65;color:#527056;margin:0}.homePostYell{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:99px;background:#fff4b8;color:#755c20;font-size:10px;font-weight:bold}@media(max-width:760px){.homePostList{grid-template-columns:1fr}}\n'''
          if '</style>' not in s:
              raise SystemExit('style closing tag not found')
          s = s.replace('</style>', css + '</style>', 1)

          html = '''<div id="homePosts" class="homePosts"><div class="homePostsHead"><h3 class="homePostsTitle">📣 みんなの防災投稿</h3><span class="tag">みんなの工夫</span></div><p class="homePostsLead">あなたの小さな工夫が、誰かの安心につながるかも。</p><div class="homePostList"><article class="homePost"><div class="homePostUser">🌱 そなママ</div><p class="homePostText">100均グッズで非常用トイレセットを作って、玄関に置いています！</p><span class="homePostYell">🌟 YELL 3</span></article><article class="homePost"><div class="homePostUser">🌿 えいこ</div><p class="homePostText">懐中電灯はベッドの近くに。停電してもすぐ手に取れて安心！</p><span class="homePostYell">🌟 YELL 5</span></article><article class="homePost"><div class="homePostUser">💧 そなパパ</div><p class="homePostText">水は一人1日3Lを目安に、ローリングストックしています。</p><span class="homePostYell">🌟 YELL 4</span></article></div></div>'''
          marker = '<div id="myTreeCard" class="myTreeCard">'
          if marker not in s:
              raise SystemExit('home tree marker not found')
          s = s.replace(marker, html + marker, 1)
          p.write_text(s, encoding='utf-8')
          print('home posts section added')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add community posts section to home"
          git push
