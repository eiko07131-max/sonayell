name: Publish brain training to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brain-training-pages.yml'
      - 'tools/patch_brain_training.py'
      - 'tools/build_mother_version.py'
      - 'brain-training-mother-data/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brain-training-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brain-training _site/brain-training _site/mother mother
          curl --fail --location --retry 3 \
            'https://rrhazswzmwdyrwfhgxbr.supabase.co/functions/v1/brain-training' \
            -o brain-training/index.html
          python tools/patch_brain_training.py brain-training/index.html
          cp brain-training/index.html _site/brain-training/index.html
          python tools/build_mother_version.py \
            brain-training/index.html \
            brain-training-mother-data \
            _site/mother/index.html
          cp _site/mother/index.html mother/index.html
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毎日トレーニング</title></head><body style="font-family:system-ui;padding:24px;line-height:2"><a href="./brain-training/" style="font-size:24px;font-weight:800">毎日トレーニングを開く</a><br><a href="./mother/" style="font-size:24px;font-weight:800">お母さん用を開く</a></body></html>
          EOF

      - name: Save public game files into repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain-training/index.html mother/index.html
          if git diff --cached --quiet; then
            echo "No repository file change"
          else
            git commit -m "Publish mother game file"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
