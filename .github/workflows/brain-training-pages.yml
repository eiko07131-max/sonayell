name: Publish brain training to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brain-training-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brain-training-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build brain-training site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/brain-training
          curl --fail --location --retry 3 \
            'https://rrhazswzmwdyrwfhgxbr.supabase.co/functions/v1/brain-training' \
            -o _site/brain-training/index.html
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公開ページ</title></head><body><a href="./brain-training/">毎日トレーニングを開く</a></body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
