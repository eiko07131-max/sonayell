<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7bc86a"><title>そなYELL ホーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#dff4d1;font-family:"Yu Gothic",Meiryo,sans-serif}.stage{min-height:100svh;display:flex;justify-content:center;align-items:flex-start}.poster{position:relative;width:min(100vw,56.25svh);aspect-ratio:9/16;overflow:hidden;background:#dff4d1}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.hot{position:absolute;z-index:3;border:0;background:transparent;color:transparent;cursor:pointer}.bell{left:86%;top:5%;width:10%;height:6%}.imakoko{left:57%;top:10.5%;width:39%;height:26%}.tree{left:4%;top:38.5%;width:92%;height:10.5%}.posts{left:4%;top:49.5%;width:46%;height:14.5%}.prepare{left:4%;top:65%;width:92%;height:9.5%}.disaster{left:4%;top:75%;width:92%;height:9.5%}.profile{left:50%;top:94%;width:46%;height:6%}.home{left:4%;top:94%;width:46%;height:6%}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#e5f7df;color:#13753d;font-weight:900}.quizcard{position:absolute;z-index:12;left:50%;top:49.5%;width:46%;height:14.5%;border:2px solid #d8e9bd;border-radius:18px;background:linear-gradient(145deg,#fff8c9,#e8f8df);box-shadow:0 3px 10px #254b2b33;padding:4%;cursor:pointer;color:#1d6839;text-align:left}.quizinner{height:100%;display:flex;flex-direction:column;justify-content:space-between}.quiztop{display:flex;align-items:center;gap:7px}.doctor{font-size:28px;line-height:1}.quiztitle{font-weight:900;font-size:clamp(10px,2.7vw,15px);line-height:1.2}.quizsub{font-size:clamp(7px,1.8vw,10px);color:#607566}.quizprog{background:#fff;border-radius:999px;padding:4px 7px;font-size:clamp(7px,1.8vw,10px);font-weight:900;display:flex;justify-content:space-between}.new{background:#ff7e66;color:#fff;border-radius:999px;padding:2px 5px;font-size:8px}.postsnote{position:absolute;z-index:11;left:7%;top:61.1%;width:40%;text-align:center;font-weight:900;color:#1c7945;font-size:clamp(7px,1.8vw,9px);background:#eff8ea;border-radius:999px;padding:2px 4px}</style></head><body><main class="stage"><section class="poster"><img id="homeImg" alt="そなYELL ホーム画面"><div id="loading" class="loading">ホームを準備中…</div><button class="hot bell" onclick="alert('お知らせ機能は試作品では準備中です')">お知らせ</button><button class="hot imakoko" onclick="alert('イマココは試作品では準備中です')">イマココ</button><button class="hot tree" onclick="location.href='./tree.html?v=28'">私のYELLの木</button><button class="hot posts" onclick="location.href='./posts.html?v=28'">みんなの防災投稿</button><div class="postsnote">新着・おすすめ投稿はこちら</div><button class="quizcard" onclick="location.href='./quiz-2026-08-v2.html?v=2'"><div class="quizinner"><div class="quiztop"><div class="doctor">🌱🎓</div><div><div class="quiztitle">8月の防災クイズ</div><div class="quizsub">台風・豪雨・雷を楽しく学ぼう！</div></div></div><div class="quizprog"><span><span id="quizDone">0</span>/10問</span><span class="new">NEW</span></div></div></button><button class="hot prepare" onclick="location.href='./prepare.html?v=24'">我が家の備えチェック</button><button class="hot disaster" onclick="location.href='./disaster-v26.html?v=27'">災害別 防災アクション</button><button class="hot profile" onclick="go('profileScreen')">マイページ</button><button class="hot home">ホーム</button></section></main><script>function go(t){location.href='./enter.html?target='+encodeURIComponent(t)+'&v=29'}try{const q=JSON.parse(localStorage.getItem('sonayell_quiz_2026_08')||'{}');document.getElementById('quizDone').textContent=Object.values(q.rewarded||{}).filter(Boolean).length}catch(e){};(async()=>{try{const ps=['./assets/home-approved-b64-1.txt?v=1','./assets/home-approved-b64-2.txt?v=1','./assets/home-approved-b64-3.txt?v=1'];const a=await Promise.all(ps.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));const img=
