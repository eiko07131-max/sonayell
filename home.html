<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7bc86a"><title>そなYELL ホーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#dff4d1;font-family:"Yu Gothic",Meiryo,sans-serif}.stage{min-height:100svh;display:flex;justify-content:center;align-items:flex-start;background:#dff4d1}.poster{position:relative;width:min(100vw,56.25svh);aspect-ratio:9/16;overflow:hidden;background:#dff4d1}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.hot{position:absolute;z-index:3;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:18px}.hot:focus-visible{outline:4px solid #ffd85a}.bell{left:86%;top:5%;width:10%;height:6%}.imakoko{left:57%;top:10.5%;width:39%;height:26%}.tree{left:4%;top:38.5%;width:92%;height:10.5%}.posts{left:4%;top:49.5%;width:46%;height:14.5%}.hall{left:50%;top:49.5%;width:46%;height:14.5%}.prepare{left:4%;top:65%;width:92%;height:9.5%}.disaster{left:4%;top:75%;width:92%;height:9.5%}.profile{left:50%;top:94%;width:46%;height:6%}.home{left:4%;top:94%;width:46%;height:6%}.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#e5f7df;color:#13753d;font-weight:900}</style></head><body><main class="stage"><section class="poster" aria-label="そなYELL ホーム"><img id="homeImg" alt="そなYELL ホーム画面"><div id="loading" class="loading">ホームを準備中…</div><button class="hot bell" onclick="alert('お知らせ機能は試作品では準備中です')" aria-label="お知らせ">お知らせ</button><button class="hot imakoko" onclick="alert('イマココは試作品では準備中です')" aria-label="イマココ">イマココ</button><button class="hot tree" onclick="go('forestScreen')" aria-label="私のYELLの木">私のYELLの木</button><button class="hot posts" onclick="go('postsScreen')" aria-label="みんなの防災投稿">みんなの防災投稿</button><button class="hot hall" onclick="go('hallScreen')" aria-label="殿堂入り投稿">殿堂入り投稿</button><button class="hot prepare" onclick="go('prepareScreen')" aria-label="我が家の備えチェック">我が家の備えチェック</button><button class="hot disaster" onclick="go('encyclopediaScreen')" aria-label="災害別 防災アクション">災害別 防災アクション</button><button class="hot profile" onclick="go('profileScreen')" aria-label="マイページ">マイページ</button><button class="hot home" aria-label="ホーム">ホーム</button></section></main><script>function go(target){location.href='./enter.html?target='+encodeURIComponent(target)+'&v=12'};(async()=>{try{const ps=['./assets/home-approved-b64-1.txt?v=1','./assets/home-approved-b64-2.txt?v=1','./assets/home-approved-b64-3.txt?v=1'];const a=await Promise.all(ps.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));const img=document.getElementById('homeImg');img.onload=()=>document.getElementById('loading').style.display='none';img.onerror=()=>document.getElementById('loading').textContent='ホーム画像の表示に失敗しました';img.src='data:image/webp;base64,'+a.join('').replace(/\s/g,'')}catch(e){document.getElementById('loading').textContent='ホーム画像の読み込みに失敗しました'}})();</script></body></html>
