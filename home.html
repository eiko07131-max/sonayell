<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7bc86a"><title>そなYELL ホーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#dff4d1;font-family:"Yu Gothic",Meiryo,sans-serif}.stage{min-height:100svh;display:flex;justify-content:center;align-items:flex-start;background:#dff4d1}.poster{position:relative;width:min(100vw,56.25svh);aspect-ratio:9/16;overflow:hidden;background:#dff4d1}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.hot{position:absolute;z-index:3;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:18px}.hot:focus-visible{outline:4px solid #ffd85a}.bell{left:86%;top:5%;width:10%;height:6%}.imakoko{left:57%;top:10.5%;width:39%;height:26%}.tree{left:4%;top:38.5%;width:92%;height:10.5%}.posts{left:4%;top:49.5%;width:46%;height:14.5%}.prepare{left:4%;top:65%;width:92%;height:9.5%}.disaster{left:4%;top:75%;width:92%;height:9.5%}.profile{left:50%;top:94%;width:46%;height:6%}.home{left:4%;top:94%;width:46%;height:6%}.loading{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:#e5f7df;color:#13753d;font-weight:900}.quizcard{position:absolute;z-index:4;left:50%;top:49.5%;width:46%;height:14.5%;border:0;border-radius:18px;background:linear-gradient(145deg,#fff9d8,#e8f8df);box-shadow:0 2px 7px #254b2b22;display:flex;align-items:center;justify-content:center;padding:3%;cursor:pointer;color:#1d6839;text-align:left}.quizinner{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between}.quiztop{display:flex;align-items:center;gap:6px}.mini{width:34px;height:34px;border-radius:50%;background:#72c455;display:grid;place-items:center;font-size:17px;position:relative}.mini:after{content:'🎓';position:absolute;top:-13px;left:5px;font-size:25px}.quiztitle{font-weight:900;font-size:clamp(10px,2.8vw,15px);line-height:1.2}.quizsub{font-size:clamp(7px,1.9vw,10px);color:#607566;line-height:1.2}.quizprog{background:#fff;border-radius:999px;padding:4px 7px;font-size:clamp(7px,1.9vw,10px);font-weight:900;display:flex;justify-content:space-between;align-items:center}.new{background:#ff7e66;color:white;border-radius:999px;padding:2px 5px;font-size:8px}.postsnote{position:absolute;z-index:4;left:7%;top:61.1%;width:40%;text-align:center;font-weight:900;color:#1c7945;font-size:clamp(7px,1.8vw,9px);pointer-events:none;background:#eff8ea;border-radius:999px;padding:2px 4px}</style></head><body><main class="stage"><section class="poster" aria-label="そなYELL ホーム"><img id="homeImg" alt="そなYELL ホーム画面"><div id="loading" class="loading">ホームを準備中…</div><button class="hot bell" onclick="alert('お知らせ機能は試作品では準備中です')" aria-label="お知らせ">お知らせ</button><button class="hot imakoko" onclick="alert('イマココは試作品では準備中です')" aria-label="イマココ">イマココ</button><button class="hot tree" onclick="location.href='./tree.html?v=28'" aria-label="私のYELLの木">私のYELLの木</button><button class="hot posts" onclick="location.href='./posts.html?v=28'" aria-label="みんなの防災投稿">みんなの防災投稿</button><div class="postsnote">新着・おすすめ投稿はこちら</div><button class="quizcard" onclick="location.href='./quiz-2026-08.html?v=1'" aria-label="8月の防災クイズ"><div class="quizinner"><div class="quiztop"><div class="mini">🌱</div><div><div class="quiztitle">8月の防災クイズ</div><div class="quizsub">台風・豪雨・雷を学ぼう！</div></div></div><div class="quizprog"><span><span id="quizDone">0</span>/10問</span><span class="new">NEW</span></div></div></button><button class="hot prepare" onclick="location.href='./prepare.html?v=24'" aria-label="我が家の備えチェック">我が家の備えチェック</button><button class="hot disaster" onclick="location.href='./disaster-v26.html?v=27'" aria-label="災害別 防災アクション">災害別 防災アクション</button><button class="hot profile" onclick="go('profileScreen')" aria-label="マイページ">マイページ</button><button class="hot home" aria-label="ホーム">ホーム</button></section></main><script>function go(target){location.href='./enter.html?target='+encodeURIComponent(target)+'&v=28'};try{const q=JSON.parse(localStorage.getItem('sonayell_quiz_2026_08')||'{}');const n=Object.values(q.rewarded||{}).filter(Boolean).length;document.getElementById('quizDone').textContent=n}catch(e){};(async()=>{try{const ps=['./assets/home-approved-b64-1.txt?v=1','./assets/home-approved-b64-2.txt?v=1','./assets/home-approved-b64-3.txt?v=1'];const a=await Promise.all(ps.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));const img=document.getElementById('homeImg');img.onload=()=>document.getElementById('loading').style.display='none';img.onerror=()=>document.getElementById('loading').textContent='ホーム画像の表示に失敗しました';img.src='data:image/webp;base64,'+a.join('').replace(/\s/g,'')}catch(e){document.getElementById('loading').textContent='ホーム画像の読み込みに失敗しました'}})();</script></body></html>
