<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#402717">
<meta name="description" content="NINE PATCH ものがたり。ハカセと子猫とあなたが旅する3つの絵本を、一つの本棚からどうぞ。">
<title>NINE PATCHものがたり｜3冊のアンティーク絵本棚</title>
<style>
:root{--ink:#f8edd5;--gold:#d8aa64;--wood:#54301b;--paper:#f5e5c7}*{box-sizing:border-box}
html{min-height:100%;background:#28180f}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;background:radial-gradient(ellipse at 50% 0%,#9c6b42 0%,#603d27 39%,#24160f 90%)}
.wrap{max-width:780px;margin:auto;padding:30px 13px 65px}
.frame{border:7px double #c09657;outline:2px solid #301f12;outline-offset:-15px;border-radius:30px;padding:25px 13px 35px;background:linear-gradient(130deg,#744a2d 0%,#4c2c1a 30%,#6d4123 65%,#3d2418 100%);box-shadow:inset 0 0 0 2px #ddbb81,inset 0 0 45px #1a100b,0 21px 35px #1a0c0888;position:relative}
.frame:before,.frame:after{content:"❦";position:absolute;font-size:30px;color:#e4c588;top:8px}.frame:before{left:21px}.frame:after{right:21px;transform:scaleX(-1)}
.overline{text-align:center;letter-spacing:.24em;color:#e7c78e;font:600 13px Georgia,serif;margin:22px 0 10px}
h1{font-size:clamp(29px,7vw,53px);line-height:1.25;text-align:center;margin:0;color:#fff5d9;font-weight:700;text-shadow:0 3px 2px #1d1007,0 0 20px #e1a95e55}
.lead{margin:15px 0 6px;font-size:clamp(16px,4vw,23px);line-height:1.65;text-align:center;color:#f8e1b2;font-weight:700}
.sentence{text-align:center;margin:0 0 22px;font-size:13px;color:#e6cb9f;line-height:1.65}
.emblem{text-align:center;color:#e6bd72;font-size:24px;letter-spacing:.55em;margin:12px 0}
.bookshelf{padding:17px 9px 3px;background:repeating-linear-gradient(0deg,transparent,transparent 17px,#140b0738 18px),linear-gradient(90deg,#391d0d,#724522 6%,#2c170f 49%,#81522b 94%,#34190d);border:11px ridge #ac7943;border-radius:18px;box-shadow:inset 0 0 32px #130a06,0 9px 18px #140a06b8}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;padding:12px 3px 6px}
.booklink{text-decoration:none;color:inherit;min-width:0;display:block;cursor:pointer}
.book{position:relative;width:100%;aspect-ratio:.66;padding:7px 6px 12px;border-radius:3px 11px 10px 3px;border-left:9px solid #51331e;border-right:3px solid #e3b76f;background:linear-gradient(105deg,#684c31 0%,#775232 8%,#e4b96f 52%,#704125 95%);box-shadow:10px 9px 11px #130904c4,inset 3px 0 #be9657,inset 0 0 0 4px #2b1d1a;transition:transform .2s,box-shadow .2s;transform-origin:center bottom;overflow:hidden}
.booklink:hover .book,.booklink:focus-visible .book{transform:translateY(-9px) rotate(-1deg);box-shadow:12px 18px 18px #130904}
.cover{height:100%;border:2px solid #f4dba0;border-radius:1px 6px 5px 1px;box-shadow:inset 0 0 0 3px #51341e,inset 0 0 0 6px #dfb66a;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:12px 5px 13px;position:relative;overflow:hidden}
.cloud{background:radial-gradient(circle at 60% 22%,#b6d9ed,#739bb1 43%,#2c6570 100%)}
.snow{background:radial-gradient(circle at 60% 24%,#e3faff,#93bed2 51%,#416990 100%)}
.clock{background:radial-gradient(circle at 55% 14%,#ffe9a8,#d99a87 43%,#6d647d 100%)}
.cover:after{content:"";position:absolute;inset:7px;border:1px solid #f9eed5a6;pointer-events:none}
.cover small{font:700 clamp(7px,1.7vw,11px) Georgia,serif;letter-spacing:.09em;color:#fff8e7;text-shadow:0 1px 4px #202122}
.symbol{font-size:clamp(42px,10.8vw,100px);line-height:1.05;filter:drop-shadow(2px 4px 3px #0005)}
.cover strong{display:block;font-size:clamp(12px,2.6vw,22px);line-height:1.45;color:#fff9e7;text-shadow:1px 2px 3px #15120f;font-weight:800}
.cover .decor{font-size:clamp(13px,3vw,26px);color:#ffecb7}
.booktitle{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:clamp(10px,2.7vw,15px);text-align:center;margin:10px 0 0;line-height:1.3;color:#fff0cc;font-weight:700}
.shelf{height:25px;background:linear-gradient(180deg,#e6bb77 0 13%,#a66d33 18%,#643716 53%,#2a160b);border-radius:5px;margin:0 -6px 24px;box-shadow:0 15px 22px #170c08}
.shelf:after{content:"✦　✦　✦";display:block;text-align:center;color:#f3d395;font-size:12px;line-height:20px;letter-spacing:4em;transform:translateX(1.9em)}
.info{text-align:center;background:#f6e7ca;color:#513722;margin:10px 8px 0;padding:19px 14px;border:2px solid #e3bf7b;border-radius:13px;box-shadow:inset 0 0 0 3px #fff7df}
.info strong{font-size:20px}.info p{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:13px;line-height:1.7}
.footer{text-align:center;font-size:12px;color:#e4bb7a;line-height:2;margin-top:27px}
@media(max-width:360px){.books{gap:5px}.cover{padding:8px 2px}.cover strong{font-size:11px}.book{border-left-width:6px}}
@media(prefers-reduced-motion:reduce){.book{transition:none}}
</style></head>
<body><main class="wrap"><div class="frame">
<p class="overline">NINE PATCH ものがたり</p>
<h1>ハカセと子猫と<br>アナタの大冒険の世界へ</h1>

<section class="bookshelf" aria-label="3冊の絵本が並ぶ本棚">
<div class="books">
<a class="booklink" href="https://nine-pachi-kumonomachi.eiko07131.chatgpt.site/" rel="noopener" aria-label="一冊目 くものまちへを読む"><div class="book"><div class="cover cloud"><small>VOLUME I</small><span class="symbol" aria-hidden="true">☁️</span><strong>くもの<br>まちへ</strong><span class="decor">✦</span></div></div><div class="booktitle">① くものまちへ</div></a>
<a class="booklink" href="https://eiko07131-max.github.io/sonayell/yuki-book/" rel="noopener" aria-label="二冊目 ゆきとこおりのまちへを読む"><div class="book"><div class="cover snow"><small>VOLUME II</small><span class="symbol" aria-hidden="true">❄️</span><strong>ゆきと<br>こおりの<br>まちへ</strong><span class="decor">✦</span></div></div><div class="booktitle">② ゆきとこおりのまちへ</div></a>
<a class="booklink" href="https://nine-pachi-tokeinomachi.eiko07131.chatgpt.site/" rel="noopener" aria-label="三冊目 はるをなくしたとけいのまちへを読む"><div class="book"><div class="cover clock"><small>VOLUME III</small><span class="symbol" aria-hidden="true">🕰️</span><strong>はるをなくした<br>とけいの<br>まちへ</strong><span class="decor">✦</span></div></div><div class="booktitle">③ とけいのまちへ</div></a>
</div><div class="shelf" aria-hidden="true"></div>
<div class="info"><strong>読みたい絵本をタップしてね 📖</strong><p>どの物語からでも読めるよ。<br>ハカセと子猫、そしてアナタの冒険がはじまります。</p></div>
</section><div class="footer">NINE PATCH ものがたり<br>今日も、小さな冒険が待っています。</div>
</div></main></body></html>
