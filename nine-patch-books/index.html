<style>
:root{color-scheme:dark;--gold:#d9b574;--cream:#fff4d7;--wood:#51301b}
*{box-sizing:border-box}
html{min-height:100%;background:#28180f}
body{margin:0;min-height:100vh;color:var(--cream);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;background:radial-gradient(ellipse at 50% 0%,#9c6b42 0%,#603d27 39%,#24160f 90%)}
main{width:100%;min-height:100svh;margin:auto;padding:5px;display:flex}
 .frame{position:relative;width:100%;min-height:calc(100svh - 10px);border:5px double #c09657;outline:2px solid #301f12;outline-offset:-12px;border-radius:22px;padding:clamp(15px,2.2vh,24px) 4px 16px;background:linear-gradient(130deg,#744a2d,#4c2c1a 35%,#6d4123 70%,#3d2418);box-shadow:inset 0 0 0 2px #ddbb81,inset 0 0 40px #1a100b,0 18px 34px #1a0c0888;display:flex;flex-direction:column;flex:1;
h1{flex:none;margin:0 0 5px;text-align:center;font-size:clamp(28px,6.5vw,48px);line-height:1.25;color:#fff5d9;text-shadow:0 3px 2px #1d1007,0 0 18px #e1a95e55}
 .lead{flex:none;margin:0 0 clamp(10px,2vh,20px);text-align:center;font-size:clamp(16px,4vw,21px);line-height:1.45;color:#f8e1b2;font-weight:700}
 .bookshelf{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:10px 2px 0;border:5px ridge #ac7943;border-radius:14px;background:repeating-linear-gradient(0deg,transparent,transparent 18px,#140b0738 19px),linear-gradient(90deg,#391d0d,#724522 6%,#2c170f 49%,#81522b 94%,#34190d);box-shadow:inset 0 0 28px #130a06,0 8px 16px #140a06b8}
 .books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2vw,18px);align-items:start;align-content:center;padding:8px 0 0;width:100%}.booklink:first-child{grid-column:1/-1;justify-self:center;width:min(78%,420px)}
.booklink{display:block;min-width:0;text-decoration:none;color:inherit;border-radius:7px;outline-offset:5px;transition:transform .2s}
.booklink:hover,.booklink:focus-visible{transform:translateY(-7px)}
 .cover{display:flex;flex-direction:column;align-items:stretch;gap:5px!important}.cover strong{display:grid;place-items:center;min-height:2.5em;margin:0;padding:6px 2px;text-align:center;font-size:clamp(12px,2.6vw,18px);line-height:1.3;color:#fff5d9;text-shadow:0 1px 2px #271508;background:#52331f;border:1px solid #d7b06d;border-radius:0 0 4px 4px} .book{height:100%;padding:1px;border:2px ridge #d4ad70;border-radius:5px 9px 8px 4px;background:linear-gradient(135deg,#f6e4bd,#b07a3d);box-shadow:5px 7px 10px #130904c4,inset 0 0 0 1px #fff0cb}
 .realcover{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#f5e8cf;border:1px solid #51341e;border-radius:2px}
.shelf{height:22px;margin:0 -7px 18px;border-radius:4px;background:linear-gradient(180deg,#e6bb77 0 14%,#a66d33 19%,#643716 55%,#2a160b);box-shadow:0 13px 19px #170c08}
.shelf:after{content:"✦　✦　✦";display:block;text-align:center;color:#f3d395;font-size:12px;line-height:19px;letter-spacing:2em;transform:translateX(1em)}
@media(max-height:650px){.frame{min-height:620px}} @media(max-width:380px){main{padding:3px}.frame{border-width:4px;padding:12px 2px 12px}.bookshelf{padding:8px 1px 0;border-width:4px}.books{gap:3px}.book{padding:1px}.cover strong{font-size:clamp(11px,3.1vw,14px)}}
@media(prefers-reduced-motion:reduce){.booklink{transition:none}}
</style>
