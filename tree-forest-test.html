<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#eef3e8;color:#243d2d;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
button{font:inherit}
.app{width:min(100%,430px);margin:auto;min-height:100svh;background:#fbfaf5;padding-bottom:84px;overflow:hidden;box-shadow:0 0 30px rgba(34,79,42,.08)}
.top{height:58px;background:linear-gradient(90deg,#08692f,#067d37);color:#fff;display:flex;align-items:center;padding:0 14px;position:relative;z-index:30}
.back,.help{border:0;background:transparent;color:#fff;font-weight:900;cursor:pointer}.back{font-size:17px;padding:10px 3px}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:21px;font-weight:900;white-space:nowrap;letter-spacing:.02em}.help{margin-left:auto;width:41px;height:41px;border:2px solid #fff;border-radius:50%;font-size:22px;line-height:1}
.hero{position:relative;width:100%;aspect-ratio:430/296;overflow:hidden;background:linear-gradient(#58c5ef 0 45%,#80c85d 45% 100%)}

.treeStage{position:absolute;z-index:6;left:50%;bottom:48px;width:150px;height:145px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.treeStage:after{content:"";position:absolute;z-index:0;left:50%;bottom:0;transform:translateX(-50%);width:78px;height:13px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,83,30,.26),rgba(34,83,30,.06) 55%,transparent 74%);filter:blur(1px)}
.treeImg{position:relative;z-index:1;display:block;height:auto;max-height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 3px rgba(21,70,28,.20));transition:width .5s cubic-bezier(.2,.7,.2,1),transform .5s ease;transform-origin:center bottom}
.heroCaption{position:absolute;z-index:9;left:50%;bottom:10px;transform:translateX(-50%);min-width:214px;max-width:82%;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 4px 14px rgba(43,87,41,.12);color:#08753a;text-align:center;font-size:15px;font-weight:900;white-space:nowrap}
.panel{position:relative;z-index:12;margin:9px 13px 0;background:rgba(255,255,255,.98);border:1px solid #f0ece5;border-radius:24px;padding:17px 20px 15px;box-shadow:0 7px 22px rgba(53,83,46,.11)}
.panel h2{margin:0 0 13px;color:#076f36;font-size:21px;font-weight:900}.meter{height:11px;background:linear-gradient(90deg,#e9eadc,#f3dfb8);border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#0b9a48,#55c36a);border-radius:99px;transition:width .45s ease}
.count{text-align:center;color:#08783a;font-weight:900;font-size:17px;margin-top:8px}.count strong{font-size:34px;line-height:1}.next{text-align:center;padding:10px 0 11px;border-bottom:1px solid #eee4d9;font-weight:900;font-size:13px;color:#2d4235}.next strong{color:#08783a;font-size:19px;margin-left:7px}.grown{text-align:center;padding-top:9px;font-size:13px;font-weight:900;color:#2d4235}.grown strong{color:#08783a;font-size:27px;margin:0 5px;vertical-align:-2px}
.sona{display:flex;align-items:flex-end;gap:8px;margin:13px 14px 7px}.sona img{width:84px;height:105px;object-fit:contain;flex:0 0 84px;background:transparent;filter:drop-shadow(0 3px 2px rgba(44,83,39,.10))}.bubble{position:relative;flex:1;background:#fffdf8;border:1.5px solid #ead8b8;border-radius:22px;padding:12px 14px;min-height:92px}.bubble:before{content:"";position:absolute;left:-9px;bottom:23px;width:17px;height:17px;background:#fffdf8;border-left:1.5px solid #ead8b8;border-bottom:1.5px solid #ead8b8;transform:rotate(45deg)}.bubble b{position:relative;color:#086f37;font-size:15px}.bubble p{position:relative;margin:5px 0 0;line-height:1.55;font-size:13px}.tip{margin:4px 15px 16px;border:1px solid #d7e6bd;background:#eff7df;border-radius:999px;padding:8px 11px;text-align:center;color:#46714b;font-size:10.5px;font-weight:900}
.nav{position:fixed;z-index:50;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:76px;padding:5px 2px max(5px,env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #dfe8dc;box-shadow:0 -4px 14px rgba(46,79,43,.08);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:#4f5c52;padding:4px 1px;min-width:0;cursor:pointer}.nav button:active{background:#eef7eb;border-radius:12px}.nav span{display:block;font-size:21px;line-height:1.05}.nav small{display:block;font-size:7.2px;font-weight:900;line-height:1.13;margin-top:3px;white-space:normal}
.modalBack{position:fixed;z-index:90;inset:0;background:rgba(20,47,27,.42);display:none;align-items:center;justify-content:center;padding:22px}.modalBack.on{display:flex}.modal{width:min(100%,360px);background:#fff;border-radius:24px;padding:20px 18px 17px;box-shadow:0 18px 48px rgba(21,53,30,.25)}.modal h3{margin:0 0 10px;color:#08743a;font-size:20px}.modal p{margin:0;color:#34473a;line-height:1.7;font-size:14px}.modal button{display:block;width:100%;margin-top:16px;border:0;border-radius:15px;padding:11px;background:#08783a;color:#fff;font-weight:900}
.testbox{display:none;margin:8px 13px 16px;padding:12px;background:#fff5d9;border:1px dashed #d3a54c;border-radius:16px;font-size:12px}.testbox.on{display:block}.testbox b{display:block;margin-bottom:8px;color:#77530b}.testbuttons{display:flex;gap:7px;flex-wrap:wrap}.testbuttons button{border:0;border-radius:11px;padding:8px 10px;background:#08783a;color:#fff;font-weight:900}.testbuttons button.reset{background:#777}
@media(max-width:390px){.top{height:56px}.title{font-size:20px}.hero{aspect-ratio:390/271}.treeStage{width:140px;height:135px;bottom:46px}.heroCaption{min-width:202px;font-size:14px;padding:8px 14px}.panel{margin-left:10px;margin-right:10px;padding:15px 17px}.panel h2{font-size:20px}.sona img{width:78px;height:98px;flex-basis:78px}.bubble{padding:11px 12px}.bubble p{font-size:12px}.nav small{font-size:6.8px}}
</style>

<body>
<main class="app">
<header class="top">
  <button class="back" aria-label="戻る" onclick="location.href='./dev-home.html?v=20260903'">‹戻る</button>
  <div class="title">私のYELLの木</div>
  <button class="help" id="help" aria-label="YELLの木について">?</button>
</header>

<section class="hero" aria-label="YELLの森">
  <img id="forestScene" class="forestScene" src="./assets/yell-forest-hd.webp?v=20260903a" alt="そなピーと森の仲間たち">
  <div class="heroShade"></div>
  <div id="treeStage" class="treeStage" aria-live="polite"></div>
  <div id="heroCaption" class="heroCaption">小さな芽が育ってきたよ 🌱</div>
</section>

<section class="panel" aria-label="YELLの木の成長状況">
  <h2>成長中のYELLの木</h2>
  <div class="meter" aria-hidden="true"><span id="bar"></span></div>
  <div class="count"><strong id="current">0</strong> / 50 YELL</div>
  <div id="next" class="next"></div>

</section>

<section class="sona">
  <img id="sonaImg" alt="そなピー">
  <div class="bubble"><b>そなピーからYELL！</b><p id="cheer">今日の一歩も、ちゃんと木の力になってるよ。</p></div>
</section>

<div id="testbox" class="testbox">
  <b>🧪 動作確認モード</b>
  <div class="testbuttons">
    <button id="plus1">+1 YELL</button><button id="plus10">+10 YELL</button><button id="set6">6YELL / 大樹1本</button><button class="reset" id="reset">0に戻す</button>
  </div>
</div>
<div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div>
</main>

<nav class="nav" aria-label="共通ナビゲーション">
  <button onclick="location.href='./dev-home.html?v=20260903'"><span>🏠</span><small>ホーム</small></button>
  <button onclick="location.href='./town-sky-feed-test.html?v=20260903'"><span>📍</span><small>今日の私の街</small></button>
  <button onclick="location.href='./posts.html?v=20260903'"><span>📣</span><small>みんなの<br>防災投稿</small></button>
  <button onclick="location.href='./prepare.html?v=20260903'"><span>📋</span><small>我が家の<br>備えチェック</small></button>
  <button onclick="location.href='./disaster-v27.html?v=20260903'"><span>📘</span><small>災害別!!<br>防災アクション</small></button>
</nav>

<div class="modalBack" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal"><h3 id="helpTitle">🌱 YELLの木って？</h3><p>備えや防災につながる行動で集まったYELLが、この木を少しずつ育てます。50YELLで大樹が1本完成し、そのあと新しい木がまた0YELLから育ち始めます。</p><button id="closeHelp">わかった！</button></div>
</div>

<script src="./yell-cycle.js?v=20260903"></script>
<script>
const $=id=>document.getElementById(id);

async function textB64(path){
  const r=await fetch(path,{cache:'no-store'});
  if(!r.ok)throw Error(path);
  return (await r.text()).replace(/\s+/g,'');
}

function clearWhite(src){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');
        c.width=w;c.height=h;
        const x=c.getContext('2d',{willReadFrequently:true});
        x.drawImage(img,0,0,w,h);
        const im=x.getImageData(0,0,w,h),d=im.data,n=w*h,cand=new Uint8Array(n),seen=new Uint8Array(n),q=new Int32Array(n);
        for(let i=0;i<n;i++){
          const r=d[i*4],g=d[i*4+1],b=d[i*4+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
          if(mn>205&&mx-mn<52)cand[i]=1;
        }
        let hq=0,tq=0;
        const push=i=>{if(i>=0&&i<n&&cand[i]&&!seen[i]){seen[i]=1;q[tq++]=i}};
        for(let xx=0;xx<w;xx++){push(xx);push((h-1)*w+xx)}
        for(let yy=0;yy<h;yy++){push(yy*w);push(yy*w+w-1)}
        while(hq<tq){
          const i=q[hq++],xx=i%w,yy=(i/w)|0;
          if(xx>0)push(i-1);if(xx<w-1)push(i+1);if(yy>0)push(i-w);if(yy<h-1)push(i+w);
        }
        for(let i=0;i<n;i++)if(seen[i])d[i*4+3]=0;
        const labels=new Int32Array(n);let comp=0,best=0,bestSize=0;
        for(let s=0;s<n;s++){
          if(d[s*4+3]<=24||labels[s])continue;
          comp++;hq=0;tq=0;let size=0;labels[s]=comp;q[tq++]=s;
          while(hq<tq){
            const i=q[hq++];size++;const xx=i%w,yy=(i/w)|0,nn=[xx>0?i-1:-1,xx<w-1?i+1:-1,yy>0?i-w:-1,yy<h-1?i+w:-1];
            for(const j of nn)if(j>=0&&d[j*4+3]>24&&!labels[j]){labels[j]=comp;q[tq++]=j}
          }
          if(size>bestSize){bestSize=size;best=comp}
        }
        let minX=w,minY=h,maxX=-1,maxY=-1;
        for(let i=0;i<n;i++){
          if(labels[i]!==best)d[i*4+3]=0;
          if(d[i*4+3]>20){const xx=i%w,yy=(i/w)|0;minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,yy);maxY=Math.max(maxY,yy)}
        }
        x.putImageData(im,0,0);
        if(maxX<minX)return resolve(src);
        const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(w,maxX+1+pad),y1=Math.min(h,maxY+1+pad),cw=x1-x0,ch=y1-y0,c2=document.createElement('canvas');
        c2.width=cw;c2.height=ch;c2.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
        resolve(c2.toDataURL('image/png'));
      }catch(e){resolve(src)}
    };
    img.onerror=()=>resolve(src);
    img.src=src;
  });
}

async function loadLegacyForest(){
  try{
    const paths=['yell-forest-real-0.txt','yell-forest-real-1.txt','yell-forest-real-2a.txt','yell-forest-real-2b0.txt','yell-forest-real-2b1.txt','yell-forest-real-2b2.txt','yell-forest-real-3.txt'];
    const p=await Promise.all(paths.map(x=>textB64('assets/'+x+'?v=20260903')));
    $('forestScene').src='data:image/webp;base64,'+p.join('');
  }catch(e){console.error('forest fallback failed',e)}
}

async function loadCharacters(){
  try{
    const[tr,sp]=await Promise.all([
      textB64('assets/yell-tree-cute-b64.txt?v=20260903'),
      textB64('assets/sonapi-official-b64.txt?v=20260903')
    ]);
    const[treeClean,sonaClean]=await Promise.all([
      clearWhite('data:image/webp;base64,'+tr),
      clearWhite('data:image/webp;base64,'+sp)
    ]);
    window.__tree=treeClean;
    $('sonaImg').src=sonaClean;
  }catch(e){console.error('character art load failed',e)}
}

function stage(cur){
  if(cur>=45)return{w:136,msg:'もうすぐ大樹！ 🌳',cheer:'あと少し！ここまでの積み重ねが、ちゃんと大きな木になってるよ！'};
  if(cur>=35)return{w:125,msg:'立派な木になってきたよ 🌿',cheer:'すごいよ！毎日の積み重ねが、こんなに立派な木になったね。'};
  if(cur>=28)return{w:113,msg:'ぐんぐん成長中！ 🍃',cheer:'いいペースだよ！その調子でコツコツYELLを続けていこう！'};
  if(cur>=13)return{w:99,msg:'小さな木になったよ 🌱',cheer:'小さな一歩が重なって、木らしくなってきたよ。'};
  if(cur>=7)return{w:86,msg:'葉っぱが増えてきたよ 🍃',cheer:'いい感じ！YELLがちゃんと葉っぱになって増えてるよ。'};
  if(cur>=3)return{w:72,msg:'小さな芽が育ってきたよ 🌱',cheer:'今日の一歩も、ちゃんと木の力になってるよ。'};
  return{w:0,msg:'小さな芽からスタート 🌱',cheer:'最初の一歩から、YELLの木づくりは始まってるよ。'};
}

function getViewState(){
  const q=new URLSearchParams(location.search),s=SonaYellCycle.get();
  if(q.has('demo')){
    return{
      cur:Math.max(0,Math.min(49,Number(q.get('demo'))||0)),
      trees:Math.max(0,Number(q.get('trees'))||0)
    };
  }
  return{
    cur:Math.max(0,Math.min(49,Number(s.yell)||0)),
    trees:Math.max(0,Number(s.greatTrees)||0)
  };
}

function render(){
  const v=getViewState(),st=stage(v.cur);
  $('grown').textContent=v.trees;
  $('current').textContent=v.cur;
  $('bar').style.width=(v.cur/50*100)+'%';
  $('heroCaption').textContent=st.msg;
  $('next').innerHTML='次の大樹になるまで <strong>あと '+(50-v.cur)+'YELL！</strong>';
  $('cheer').textContent=st.cheer;
  if(v.cur<3){
    $('treeStage').innerHTML='';
  }else if(window.__tree){
    $('treeStage').innerHTML='<img class="treeImg" src="'+window.__tree+'" alt="成長中のYELLの木" style="width:'+st.w+'px">';
  }
}

function setupTestMode(){
  const q=new URLSearchParams(location.search);
  if(!q.has('test'))return;
  $('testbox').classList.add('on');
  const update=(fn)=>{fn();history.replaceState(null,'',location.pathname+'?test=1');render()};
  $('plus1').onclick=()=>update(()=>SonaYellCycle.add(1));
  $('plus10').onclick=()=>update(()=>SonaYellCycle.add(10));
  $('set6').onclick=()=>update(()=>{
    const s=SonaYellCycle.get();s.yell=6;s.greatTrees=1;SonaYellCycle.write(s);
  });
  $('reset').onclick=()=>update(()=>{
    const s=SonaYellCycle.get();s.yell=0;s.greatTrees=0;SonaYellCycle.write(s);
  });
}

async function start(){
  $('forestScene').addEventListener('error',loadLegacyForest,{once:true});
  await loadCharacters();
  setupTestMode();
  render();
}

$('help').onclick=()=>$('helpModal').classList.add('on');
$('closeHelp').onclick=()=>$('helpModal').classList.remove('on');
$('helpModal').onclick=e=>{if(e.target===$('helpModal'))$('helpModal').classList.remove('on')};

start();
addEventListener('pageshow',render);
addEventListener('focus',render);
addEventListener('storage',render);
</script>
</body>
</html>
