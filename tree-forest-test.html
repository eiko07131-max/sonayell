<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta name="theme-color" content="#08783a">
<title>私のYELLの木｜実働テスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f7f8f2;color:#243d2d;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
.app{width:min(100%,430px);margin:auto;min-height:100svh;background:#fffdf8;padding-bottom:94px;overflow:hidden}
.top{height:64px;background:linear-gradient(90deg,#076a31,#087d3b);color:#fff;display:flex;align-items:center;padding:0 15px;position:relative;z-index:20}
.back,.help{border:0;background:transparent;color:#fff;font-weight:900}
.back{font-size:18px;padding:10px 2px}
.title{position:absolute;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap}
.help{margin-left:auto;width:42px;height:42px;border:2px solid #fff;border-radius:50%;font-size:22px}

/* 合格イメージの森を、1枚の背景としてそのまま使う */
.hero{position:relative;width:100%;aspect-ratio:320/243;overflow:hidden;background:#78bb4c}
.forestScene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}

/* 手前の小さな芽の位置だけ、YELL数に応じて成長木を重ねる */
.treeStage{position:absolute;z-index:6;left:50%;bottom:12px;width:180px;height:168px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.treeStage:after{content:"";position:absolute;z-index:0;left:50%;bottom:1px;transform:translateX(-50%);width:92px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,83,30,.27),rgba(34,83,30,.08) 52%,transparent 72%);filter:blur(1px)}
.treeImg{position:relative;z-index:1;display:block;height:auto;max-height:100%;object-fit:contain;object-position:center bottom;transform-origin:50% 100%;filter:drop-shadow(0 5px 4px rgba(21,70,28,.22));transition:width .45s ease,transform .45s ease}

.panel{position:relative;z-index:10;margin:0 13px;background:#fff;border:1px solid #eee7da;border-radius:0 0 24px 24px;padding:17px 18px 15px;box-shadow:0 8px 22px rgba(53,83,46,.11)}
.panel h2{margin:0 0 8px;color:#076f36;font-size:22px}
.stageChip{display:inline-block;margin:0 0 12px;padding:6px 11px;border-radius:999px;background:#eef7e8;color:#08793a;font-size:12px;font-weight:900}
.meter{height:14px;background:linear-gradient(90deg,#ecebdc,#f6e3bd);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,#078a3e,#66bd5e);border-radius:99px;transition:width .4s}
.count{text-align:center;color:#08783a;font-weight:900;font-size:18px;margin-top:8px}.count strong{font-size:29px}
.next{text-align:center;padding:7px 0 11px;border-bottom:1px solid #eee3d7;font-weight:800;font-size:14px}.next strong{color:#08783a;font-size:20px;margin-left:8px}
.grown{text-align:center;padding-top:10px;font-size:14px;font-weight:800}.grown strong{color:#08783a;font-size:28px;margin:0 5px}

.sona{display:flex;align-items:flex-end;gap:9px;margin:14px 14px 10px}
.sona img{width:84px;height:102px;object-fit:contain;flex:0 0 84px;background:transparent;align-self:flex-end}
.bubble{position:relative;flex:1;background:#fffdf8;border:1.5px solid #ead8b8;border-radius:22px;padding:12px 14px;min-height:92px}
.bubble:before{content:"";position:absolute;left:-10px;bottom:22px;width:18px;height:18px;background:#fffdf8;border-left:1.5px solid #ead8b8;border-bottom:1.5px solid #ead8b8;transform:rotate(45deg)}
.bubble b{position:relative;color:#086f37;font-size:15px}.bubble p{position:relative;margin:5px 0 0;line-height:1.5;font-size:13px}
.tip{margin:7px 15px 20px;border:1px solid #d7e6bd;background:#eff7df;border-radius:999px;padding:8px 11px;text-align:center;color:#46714b;font-size:11px;font-weight:900}

.nav{position:fixed;z-index:40;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:76px;padding:5px 2px max(5px,env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #dfe8dc;box-shadow:0 -4px 14px rgba(46,79,43,.08);display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;color:#58635b;padding:4px 1px;font:inherit;min-width:0}.nav span{display:block;font-size:21px;line-height:1.05}.nav small{display:block;font-size:7.4px;font-weight:900;line-height:1.13;margin-top:3px;white-space:normal}.nav button:active{background:#eef7eb;border-radius:12px}
@media(max-width:390px){.treeStage{width:164px;height:154px;bottom:10px}.panel{margin-left:10px;margin-right:10px;padding:15px}.panel h2{font-size:20px}.sona img{width:78px;height:94px;flex-basis:78px}.bubble{padding:11px 12px}.bubble p{font-size:12px}.nav small{font-size:7px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <button class="back" onclick="location.href='./dev-home.html?v=20260831'">‹ 戻る</button>
  <div class="title">私のYELLの木</div>
  <button class="help" id="help">?</button>
</header>

<section class="hero">
  <img class="forestScene" src="./assets/tree-forest-approved.jpg?v=20260831p" alt="YELLの森の仲間たち">
  <div id="treeStage" class="treeStage"></div>
</section>

<section class="panel">
  <h2>成長中のYELLの木</h2>
  <div id="stageMsg" class="stageChip"></div>
  <div class="meter"><span id="bar"></span></div>
  <div class="count"><strong id="current">0</strong> / 50 YELL</div>
  <div id="next" class="next"></div>
  <div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div>
</section>

<section class="sona">
  <img id="sonaImg" alt="そなピー">
  <div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div>
</section>
<div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div>
</main>

<nav class="nav">
  <button onclick="location.href='./dev-home.html?v=20260831'"><span>🏠</span><small>ホーム</small></button>
  <button onclick="location.href='./town-sky-feed-test.html?v=20260831l'"><span>📍</span><small>今日の私の街</small></button>
  <button onclick="location.href='./posts.html?v=20260831'"><span>📣</span><small>みんなの<br>防災投稿</small></button>
  <button onclick="location.href='./prepare.html?v=20260831'"><span>📋</span><small>我が家の<br>備えチェック</small></button>
  <button onclick="location.href='./disaster-v27.html?v=20260831'"><span>📘</span><small>災害別!!<br>防災アクション</small></button>
</nav>

<script src="./yell-cycle.js?v=20260831"></script>
<script>
const $=id=>document.getElementById(id);
async function b64(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path);return(await r.text()).replace(/\s+/g,'')}
function clearWhite(src){return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);const im=ctx.getImageData(0,0,w,h),d=im.data,n=w*h,cand=new Uint8Array(n),seen=new Uint8Array(n),q=new Int32Array(n);for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mn>205&&mx-mn<52)cand[i]=1}let qh=0,qt=0;const push=i=>{if(i>=0&&i<n&&cand[i]&&!seen[i]){seen[i]=1;q[qt++]=i}};for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}while(qh<qt){const i=q[qh++],x=i%w,y=(i/w)|0;if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}for(let i=0;i<n;i++)if(seen[i])d[i*4+3]=0;const labels=new Int32Array(n);let comp=0,best=0,bestSize=0;for(let s=0;s<n;s++){if(d[s*4+3]<=24||labels[s])continue;comp++;qh=0;qt=0;let size=0;labels[s]=comp;q[qt++]=s;while(qh<qt){const i=q[qh++];size++;const x=i%w,y=(i/w)|0,nn=[x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1];for(const j of nn)if(j>=0&&d[j*4+3]>24&&!labels[j]){labels[j]=comp;q[qt++]=j}}if(size>bestSize){bestSize=size;best=comp}}let minX=w,minY=h,maxX=-1,maxY=-1;for(let i=0;i<n;i++){if(labels[i]!==best)d[i*4+3]=0;if(d[i*4+3]>20){const x=i%w,y=(i/w)|0;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}ctx.putImageData(im,0,0);if(maxX<minX)return resolve(src);const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(w,maxX+1+pad),y1=Math.min(h,maxY+1+pad),cw=x1-x0,ch=y1-y0,c2=document.createElement('canvas');c2.width=cw;c2.height=ch;c2.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);resolve(c2.toDataURL('image/png'))}catch(e){resolve(src)}};img.onerror=()=>resolve(src);img.src=src})}

async function loadArt(){try{const[tr,sp]=await Promise.all([b64('assets/yell-tree-cute-b64.txt?v=20260831p'),b64('assets/sonapi-official-b64.txt?v=20260831p')]);const[treeClean,sonaClean]=await Promise.all([clearWhite('data:image/webp;base64,'+tr),clearWhite('data:image/webp;base64,'+sp)]);window.__tree=treeClean;$('sonaImg').src=sonaClean}catch(e){console.error(e)}}

function level(n){
  if(n>=45)return[158,'もうすぐ大樹！ 🌳'];
  if(n>=35)return[142,'立派な木になってきたよ 🌿'];
  if(n>=28)return[126,'ぐんぐん成長中！ 🍃'];
  if(n>=13)return[108,'小さな木になったよ 🌱'];
  if(n>=7)return[88,'葉っぱが増えてきたよ 🍃'];
  if(n>=3)return[72,'小さな芽が育ってきたよ 🌱'];
  return[0,'小さな芽からスタート 🌱'];
}

function render(){
  const q=new URLSearchParams(location.search),s=SonaYellCycle.get(),demo=q.has('demo');
  const cur=Math.max(0,Math.min(49,demo?Number(q.get('demo'))||0:Number(s.yell)||0));
  const trees=Math.max(0,demo?Number(q.get('trees'))||0:Number(s.greatTrees)||0);
  const lv=level(cur);
  $('grown').textContent=trees;$('current').textContent=cur;$('bar').style.width=(cur/50*100)+'%';$('stageMsg').textContent=lv[1];
  $('next').innerHTML='次の大樹になるまで <strong>あと '+(50-cur)+'YELL！</strong>';
  $('cheer').textContent=cur>=35?'あと少し！ここまでの積み重ねが、ちゃんと大きな木になってるよ！':cur>=20?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';
  if(cur<3){$('treeStage').innerHTML='';}
  else if(window.__tree){$('treeStage').innerHTML='<img class="treeImg" src="'+window.__tree+'" alt="成長中のYELLの木" style="width:'+lv[0]+'px">';}
}
async function start(){await loadArt();render()}
$('help').onclick=()=>alert('YELLを50集めると大樹が1本完成します。完成後は次の木を0YELLから育てます。');
start();addEventListener('pageshow',render);addEventListener('focus',render);addEventListener('storage',render);
</script>
</body>
</html>
