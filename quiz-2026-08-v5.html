<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8月の防災クイズ</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#dff7ff,#f2fce5);color:#174d31}button{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fff;padding:10px 14px;border-bottom:1px solid #d9ead5;display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:0;border-radius:50%;background:#eaf7e4;color:#187b40;font-size:22px}.top b{font-size:18px}.yell{margin-left:auto;background:#fff0a7;border-radius:999px;padding:8px 12px;font-weight:900}.wrap{max-width:720px;margin:auto;padding:16px 14px 40px}.hero{background:#fffbea;border:2px solid #b9da83;border-radius:24px;padding:16px;display:flex;gap:14px;align-items:center}.mascot{width:82px;height:82px;min-width:82px;border-radius:50%;border:8px solid #39a958;background:#fff;display:grid;place-items:center;font-size:35px;position:relative}.mascot:before{content:'🌱';position:absolute;top:-29px}.cap{position:absolute;right:-9px;top:-12px;font-size:29px}.hero h1{margin:0;font-size:24px;color:#147c3e}.hero p{margin:5px 0 0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:11px;background:#fff;border:1px solid #d9e7c5;border-radius:999px;padding:5px 8px}.progress{margin-top:12px;background:#fff;border-radius:20px;padding:13px 15px}.phead{display:flex;justify-content:space-between;font-weight:900}.track{height:10px;background:#e4eee0;border-radius:999px;margin-top:9px;overflow:hidden}.bar{height:100%;width:0;background:#42ad5e;transition:.3s}.card{margin-top:12px;background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 18px #174d3118}.meta{display:flex;justify-content:space-between;align-items:center}.qno{background:#15994a;color:#fff;border-radius:999px;padding:6px 11px;font-weight:900}.topic{font-size:12px;background:#f1f7ed;border-radius:999px;padding:6px 10px}.question{font-size:22px;font-weight:900;line-height:1.55;margin:16px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{border:2px solid #dce8d8;background:#fff;border-radius:16px;padding:14px;text-align:left;font-weight:800;min-height:62px}.ans:hover{border-color:#8ec293}.ans.ok{background:#eefbed;border-color:#4caf62}.ans.ng{background:#fff0f0;border-color:#e78383}.ans:disabled{color:#294b34}.explain{display:none;margin-top:13px;background:#fff9d9;border:1px solid #e6d98d;border-radius:17px;padding:13px;line-height:1.65}.explain.show{display:block}.reward{width:100%;border:0;border-radius:15px;padding:13px;margin-top:11px;background:#15994a;color:#fff;font-weight:900}.reward:disabled{background:#b9c6b8}.nav{display:flex;gap:9px;margin-top:10px}.nav button{flex:1;border:1px solid #a8c9aa;background:#fff;border-radius:14px;padding:11px;color:#24733d;font-weight:900}.leaf{position:fixed;top:-30px;font-size:25px;pointer-events:none;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:.1}}@media(max-width:560px){.answers{grid-template-columns:1fr}.hero h1{font-size:20px}.mascot{width:68px;height:68px;min-width:68px;font-size:29px}.question{font-size:19px}.card{padding:15px}}</style></head><body><header class="top"><button class="back" id="back">←</button><b>8月の防災クイズ</b><span class="yell">🌿 <span id="yell">0</span> YELL</span></header><main class="wrap"><section class="hero"><div class="mascot">😊<span class="cap">🎓</span></div><div><h1>そなピー博士と挑戦！</h1><p>答えたあとは、解説まで読んで防災力アップ 🌱</p><div class="chips"><span class="chip">🌀台風</span><span class="chip">🌧️豪雨</span><span class="chip">⚡雷</span><span class="chip">🏠内水氾濫</span></div></div></section><section class="progress"><div class="phead"><span>🌱 今月の進み具合</span><span id="pc">0 / 10</span></div><div class="track"><div class="bar" id="bar"></div></div></section><section class="card"><div class="meta"><span class="qno" id="qno"></span><span class="topic" id="topic"></span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="explain" id="explain"></div><button class="reward" id="reward" disabled>まず答えを選んでね</button><div class="nav"><button id="prev">← 前の問題</button><button id="next">次の問題 →</button></div></section></main><script>const Q=[['台風','台風が近づき、風雨が強まる予報。ベランダの植木鉢などを片づけるなら？',['風雨が強くなる前','暴風警報が出てから','雨が最も強い時','台風が通過中'],0,'飛ばされそうな物は、風雨が強まる前の安全なうちに片づけます。'],['ゲリラ豪雨','突然の激しい雨で道路が冠水。安全な判断は？',['長靴なら進む','前の人が歩けたら進む','水深が分からない冠水路には入らない','膝より下なら必ず進む'],2,'冠水路では側溝やマンホールが見えないことがあります。水深や流れが分からない道には入りません。'],['雷','屋外で雷鳴が聞こえた。適切な行動は？',['大木のすぐ下へ','丈夫な建物や自動車へ避難','開けた場所で待つ','傘を閉じてその場にいる'],1,'雷が近いときは丈夫な建物や自動車など、安全性の高い場所へ速やかに避難します。'],['線状降水帯','線状降水帯で高まりやすい危険は？',['すぐ必ず晴れる','海岸だけで雨が降る','強風だけになる','同じ地域で大雨が続き災害危険度が高まる'],3,'発達した雨雲が同じ場所を通過・停滞し、大雨が続いて災害危険度が高まることがあります。'],['内水氾濫','内水氾濫とは？',['津波による浸水','排水しきれない雨水などで市街地が浸水','堤防決壊だけを指す','強風で屋根が飛ぶ'],1,'大雨で排水能力を超えるなどして、雨水を排水しきれず市街地が浸水する現象です。'],['豪雨','大雨のとき地下街や地下室にいる。大切なのは？',['浸水前に地上の安全な場所へ移動','一番低い場所へ移動','水が入ってから考える','エレベーターだけを使う'],0,'地下空間は水が流れ込むと避難が難しくなるため、早めの移動が重要です。'],['夜間の大雨','夜に大雨が強まる予報。避難で大切なのは？',['浸水まで待つ','川を見に行く','必ず深夜に避難','危険が高まる前に早めに判断'],3,'暗くなったり道路が冠水したりする前に、早めに判断することが大切です。'],['台風と河川','台風時、川の水位が気になる。どう確認する？',['橋から直接見る','河原へ行く','公的な河川・防災情報を見る','近所の人と見に行く'],2,'増水した川には近づかず、公的な河川・防災情報で確認します。'],['雷','雷が鳴っているとき、家の中なら何をしても安全？',['家の中でも電気設備などに注意','窓を開けて観察','屋根へ移動','ベランダへ出る'],0,'建物内は屋外より安全ですが、落雷時には電気設備などを通じた影響にも注意します。'],['内水氾濫','道路がすでに冠水し、外へ避難する方が危険なら？',['必ず冠水路を歩く','地下室へ荷物を取りに行く','車で水深を確認','建物内のより高く安全な場所で身を守る'],3,'屋外移動が危険な場合は、建物内のより高く安全な場所で命を守る行動をとります。']];const K='sonayell_quiz_2026_08_v5';let S={rewarded:{},answered:{}};try{S={...S,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}let i=0;const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(S))}function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function yell(){let a=app();$('yell').textContent=a.yell||0}function progress(){let n=Object.keys(S.rewarded||{}).length;$('pc').textContent=n+' / 10';$('bar').style.width=(n*10)+'%'}function render(){let q=Q[i];$('qno').textContent='第'+(i+1)+'問 / 全10問';$('topic').textContent=q[0];$('question').textContent=q[1];$('answers').innerHTML='';q[2].forEach((x,j)=>{let b=document.createElement('button');b.className='ans';b.textContent='ABCD'[j]+'　'+x;b.addEventListener('click',()=>answer(j));$('answers').appendChild(b)});$('explain').className='explain';$('explain').textContent='';$('reward').disabled=true;$('reward').textContent=S.rewarded[i]?'この問題はYELL獲得済み 🌿':'まず答えを選んでね';$('prev').disabled=i===0;$('next').textContent=i===9?'ホームへ →':'次の問題 →';if(S.answered[i]!=null)show(S.answered[i]);progress()}function answer(j){if(S.answered[i]!=null)return;S.answered[i]=j;save();show(j)}function show(j){let q=Q[i],bs=[...document.querySelectorAll('.ans')];bs.forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add('ok');else if(k===j)b.classList.add('ng')});$('explain').className='explain show';$('explain').innerHTML=(j===q[3]?'🎉 <b>正解！</b>':'💡 <b>ここを覚えよう！</b>')+'<br>'+q[4];if(!S.rewarded[i]){$('reward').disabled=false;$('reward').textContent='解説を読んだ！ ＋1 YELL 🌿'}}function leaves(){for(let n=0;n<12;n++){let l=document.createElement('span');l.className='leaf';l.textContent='🍃';l.style.left=Math.random()*100+'vw';l.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(l);setTimeout(()=>l.remove(),3000)}}$('reward').addEventListener('click',()=>{if(S.rewarded[i])return;S.rewarded[i]=true;save();let a=app();a.yell=(Number(a.yell)||0)+1;localStorage.setItem('sonayell_v2',JSON.stringify(a));yell();progress();leaves();$('reward').disabled=true;$('reward').textContent='＋1 YELL！ できた 🌿'});$('prev').addEventListener('click',()=>{if(i>0){i--;render()}});$('next').addEventListener('click',()=>{if(i<9){i++;render()}else location.href='./home-v31.html?v=31'});$('back').addEventListener('click',()=>location.href='./home-v31.html?v=31');yell();render();</script></body></html>
