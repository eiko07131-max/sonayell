<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4e9956">
<title>そなYELL</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f5faef;
}
iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<iframe
  id="outerApp"
  src="./app.html?from=action8"
  title="そなYELL">
</iframe>

<script>
const U='https://illnptsvaieyacjajlfm.supabase.co';
const K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';

async function receiveGoogleLogin(){

  const hash=
    new URLSearchParams(
      location.hash.replace(/^#/,'')
    );

  const access=
    hash.get('access_token');

  const refresh=
    hash.get('refresh_token')||'';

  const error=
    hash.get('error_description')||
    hash.get('error');

  if(error){

    alert(
      'Googleログインでエラーが出ました。もう一度試してね。'
    );

    history.replaceState(
      null,
      '',
      location.pathname
    );

    return false;
  }

  if(!access)return false;

  localStorage.setItem(
    'sonayell_access_token',
    access
  );

  if(refresh){

    localStorage.setItem(
      'sonayell_refresh_token',
      refresh
    );
  }

  localStorage.setItem(
    'sonayell_registered',
    '1'
  );

  const guestToken=
    localStorage.getItem(
      'sonayell_guest_token'
    );

  let state={};

  try{

    state=
      JSON.parse(
        localStorage.getItem(
          'sonayell_v2'
        )||'{}'
      );

  }catch(e){}

  try{

    await fetch(
      U+
      '/rest/v1/rpc/sona_claim_guest_data',
      {
        method:'POST',
        headers:{
          apikey:K,
          Authorization:
            'Bearer '+access,
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify({
          p_guest_token:
            guestToken||null,
          p_guest_yell:
            state.yell||0
        })
      }
    );

  }catch(e){}

  location.replace(
    './enter.html?after_login=1&v=8'
  );

  return true;
}

receiveGoogleLogin();


const outer=
  document.getElementById(
    'outerApp'
  );

const shouldEnterHome=
  new URLSearchParams(
    location.search
  ).get('after_login')==='1';

let loginFlagConsumed=false;


function consumeLoginFlag(){

  if(
    !shouldEnterHome ||
    loginFlagConsumed
  )return;

  loginFlagConsumed=true;

  try{

    const u=
      new URL(location.href);

    u.searchParams.delete(
      'after_login'
    );

    history.replaceState(
      null,
      '',
      u.pathname+
      u.search+
      u.hash
    );

  }catch(e){}
}


function getInner(){

  try{

    const x=
      outer.contentDocument;

    return x
      ?x.getElementById(
        'appFrame'
      )
      :null;

  }catch(e){

    return null;
  }
}


function installPrepareV2(){

  try{

    const inner=
      getInner();

    if(
      !inner ||
      !inner.contentDocument
    )return false;

    const d=
      inner.contentDocument;

    if(
      d.getElementById(
        'prepareV2Logic'
      )
    )return true;

    const logic=()=>{

      if(
        d.getElementById(
          'prepareV2Logic'
        )
      )return;

      const s=
        d.createElement(
          'script'
        );

      s.id=
        'prepareV2Logic';

      s.src=
        './prepare-v2.js?v=4';

      d.body.appendChild(s);
    };

    if(
      d.getElementById(
        'prepareV2Data'
      )
    ){

      logic();

      return true;
    }

    const s=
      d.createElement(
        'script'
      );

    s.id=
      'prepareV2Data';

    s.src=
      './prepare-v2-data.js?v=3';

    s.onload=logic;

    d.body.appendChild(s);

    return true;

  }catch(e){

    return false;
  }
}


function installSearchEmphasis(d){

  if(
    d.getElementById(
      'actionSearchEmphasis'
    )
  )return;

  const p=
    d.createElement(
      'script'
    );

  p.id=
    'actionSearchEmphasis';

  p.src=
    './action-search-emphasis.js?v=3';

  d.body.appendChild(p);
}


function installProfilePatch(d){

  if(
    d.getElementById(
      'profileSavePatch'
    )
  )return;

  const p=
    d.createElement(
      'script'
    );

  p.id=
    'profileSavePatch';

  p.src=
    './profile-save-patch.js?v=1';

  d.body.appendChild(p);
}


function installIncomingYell(d){

  if(
    d.getElementById(
      'incomingYellSync'
    )
  )return;

  const p=
    d.createElement(
      'script'
    );

  p.id=
    'incomingYellSync';

  p.src=
    './incoming-yell-sync.js?v=1';

  d.body.appendChild(p);
}


function installTreeCore(d,w){

  if(
    w.SonaYellTreeCore &&
    typeof
      w.SonaYellTreeCore.install
      ==='function'
  ){

    w.SonaYellTreeCore.install(w);

    return true;
  }

  if(
    d.getElementById(
      'sonayellTreeCoreLoader'
    )
  )return true;

  const s=
    d.createElement(
      'script'
    );

  s.id=
    'sonayellTreeCoreLoader';

  s.src=
    './tree-core.js?v=8';

  s.onload=()=>{

    try{

      if(
        w.SonaYellTreeCore &&
        typeof
          w.SonaYellTreeCore.install
          ==='function'
      ){

        w.SonaYellTreeCore.install(w);
      }

    }catch(e){}
  };

  d.body.appendChild(s);

  return true;
}


function renderTreeNow(){

  try{

    const inner=
      getInner();

    if(
      !inner ||
      !inner.contentDocument
    )return false;

    const d=
      inner.contentDocument;

    const w=
      inner.contentWindow;

    installTreeCore(d,w);

    if(
      w.SonaYellTreeCore &&
      typeof
        w.SonaYellTreeCore.install
        ==='function'
    ){

      w.SonaYellTreeCore.install(w);
    }

    if(
      typeof
        w.renderMyTree
        ==='function'
    ){

      w.renderMyTree();
    }

    return true;

  }catch(e){

    return false;
  }
}


function installAction(){

  try{

    const inner=
      getInner();

    if(
      !inner ||
      !inner.contentDocument
    )return false;

    const d=
      inner.contentDocument;

    if(
      d.getElementById(
        'actionLogic'
      )
    ){

      installSearchEmphasis(d);

      return true;
    }

    const files=[
      'action-earthquake-a.js',
      'action-earthquake-b.js',
      'action-tsunami.js',
      'action-storm-a.js',
      'action-storm-b.js',
      'action-landslide.js',
      'action-other-a.js',
      'action-other-b.js'
    ];

    let i=0;

    const next=()=>{

      if(
        i>=files.length
      ){

        if(
          d.getElementById(
            'actionLogic'
          )
        ){

          installSearchEmphasis(d);

          return;
        }

        const s=
          d.createElement(
            'script'
          );

        s.id=
          'actionLogic';

        s.src=
          './disaster-action.js?v=5';

        s.onload=
          ()=>installSearchEmphasis(d);

        d.body.appendChild(s);

        return;
      }

      const id=
        'actionData'+i;

      if(
        d.getElementById(id)
      ){

        i++;

        next();

        return;
      }

      const s=
        d.createElement(
          'script'
        );

      s.id=id;

      s.src=
        './'+
        files[i]+
        '?v=5';

      s.onload=()=>{

        i++;

        next();
      };

      d.body.appendChild(s);
    };

    next();

    return true;

  }catch(e){

    return false;
  }
}


function installAll(){

  installPrepareV2();

  installAction();

  try{

    const inner=
      getInner();

    if(
      inner &&
      inner.contentDocument
    ){

      installProfilePatch(
        inner.contentDocument
      );

      installIncomingYell(
        inner.contentDocument
      );

      installTreeCore(
        inner.contentDocument,
        inner.contentWindow
      );
    }

  }catch(e){}

  renderTreeNow();
}


function isHomeVisible(){

  try{

    const inner=
      getInner();

    const d=
      inner &&
      inner.contentDocument;

    const h=
      d &&
      d.getElementById(
        'homeScreen'
      );

    return !!(
      h &&
      h.classList.contains(
        'active'
      )
    );

  }catch(e){

    return false;
  }
}


function enterHomeOnce(){

  if(
    !shouldEnterHome
  )return false;

  try{

    const inner=
      getInner();

    if(
      !inner
    )return false;

    const w=
      inner.contentWindow;

    const d=
      inner.contentDocument;

    if(
      w &&
      typeof
        w.showScreen
        ==='function'
    ){

      w.showScreen(
        'homeScreen'
      );

      installAll();

      renderTreeNow();

      consumeLoginFlag();

      return true;
    }

    if(d){

      d.querySelectorAll(
        '.screen'
      ).forEach(
        x=>
          x.classList.remove(
            'active'
          )
      );

      const h=
        d.getElementById(
          'homeScreen'
        );

      if(h){

        h.classList.add(
          'active'
        );

        installAll();

        renderTreeNow();

        consumeLoginFlag();

        return true;
      }
    }

  }catch(e){}

  return false;
}


outer.addEventListener(
  'load',
  ()=>{

    const inner=
      getInner();

    if(inner){

      inner.addEventListener(
        'load',
        ()=>{

          setTimeout(
            installAll,
            80
          );

          setTimeout(
            renderTreeNow,
            250
          );

          setTimeout(
            renderTreeNow,
            600
          );

          if(
            shouldEnterHome
          ){

            setTimeout(
              enterHomeOnce,
              80
            );

            setTimeout(
              enterHomeOnce,
              350
            );

            setTimeout(
              enterHomeOnce,
              900
            );
          }
        },
        {once:true}
      );
    }

    setTimeout(
      installAll,
      250
    );

    setTimeout(
      installAll,
      800
    );

    setTimeout(
      renderTreeNow,
      1200
    );

    if(
      shouldEnterHome
    ){

      setTimeout(
        enterHomeOnce,
        250
      );

      setTimeout(
        enterHomeOnce,
        700
      );

      setTimeout(
        enterHomeOnce,
        1400
      );
    }
  }
);


window.addEventListener(
  'storage',
  e=>{

    if(
      e.key===
      'sonayell_v2'
    ){

      renderTreeNow();
    }
  }
);


setInterval(
  ()=>{

    if(
      isHomeVisible()
    ){

      renderTreeNow();
    }
  },
  800
);
</script>

</body>
</html>
