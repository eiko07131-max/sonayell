<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outerApp" src="./app.html?from=action2" title="そなYELL"></iframe><script>
const outer=document.getElementById('outerApp');function getInner(){try{const x=outer.contentDocument;return x?x.getElementById('appFrame'):null}catch(e){return null}}
function installPrepareV2(){try{const inner=getInner();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('prepareV2Logic'))return true;const logic=()=>{if(d.getElementById('prepareV2Logic'))return;const s=d.createElement('script');s.id='prepareV2Logic';s.src='./prepare-v2.js?v=4';d.body.appendChild(s)};if(d.getElementById('prepareV2Data')){logic();return true}const s=d.createElement('script');s.id='prepareV2Data';s.src='./prepare-v2-data.js?v=3';s.onload=logic;d.body.appendChild(s);return true}catch(e){return false}}
function installSearchEmphasis(d){if(d.getElementById('actionSearchEmphasis'))return;const p=d.createElement('script');p.id='actionSearchEmphasis';p.src='./action-search-emphasis.js?v=1';d.body.appendChild(p)}
function installAction(){try{const inner=getInner();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('actionLogic')){installSearchEmphasis(d);return true}const files=['action-earthquake-a.js','action-earthquake-b.js','action-tsunami.js','action-storm-a.js','action-storm-b.js','action-landslide.js','action-other-a.js','action-other-b.js'];let i=0;const next=()=>{if(i>=files.length){if(d.getElementById('actionLogic')){installSearchEmphasis(d);return}const s=d.createElement('script');s.id='actionLogic';s.src='./disaster-action.js?v=1';s.onload=()=>installSearchEmphasis(d);d.body.appendChild(s);return}const id='actionData'+i;if(d.getElementById(id)){i++;next();return}const s=d.createElement('script');s.id=id;s.src='./'+files[i]+'?v=1';s.onload=()=>{i++;next()};d.body.appendChild(s)};next();return true}catch(e){return false}}
function latestYell(){try{return Math.max(0,Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0)}catch(e){return 0}}
function syncYellNow(){try{const inner=getInner();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument,y=latestYell(),max=50;d.querySelectorAll('.yellCount').forEach(x=>x.textContent=y);const fy=d.getElementById('forestYell');if(fy)fy.textContent=y;const emoji=d.getElementById('myTreeEmoji');if(emoji)emoji.textContent=y>=50?'🌳':y>=25?'🌿':'🌱';const progress=d.getElementById('treeProgressText');if(progress)progress.textContent=Math.min(y,max)+' / '+max;const leaves=d.getElementById('treeLeaves');if(leaves){const on=leaves.querySelectorAll('.treeLeaf.on').length,tot=leaves.querySelectorAll('.treeLeaf').length;if(on!==Math.min(y,max)||tot!==max){leaves.innerHTML='';for(let i=0;i<max;i++){const s=d.createElement('span');s.className='treeLeaf'+(i<y?' on':'');s.textContent='🍃';leaves.appendChild(s)}}}const remain=d.getElementById('treeRemain');if(remain){const n=Math.max(max-y,0);remain.innerHTML=n===0?'🎉 大樹になったよ！<br><small>ここからさらに育てていこう。</small>':'大樹まであと <strong>'+n+'</strong> YELL！<br><small>一歩ずつ、木を育てよう。</small>'}return true}catch(e){return false}}
function installAll(){installPrepareV2();installAction();syncYellNow()}
function enterHome(){try{const inner=getInner();if(!inner)return false;const go=()=>{try{const w=inner.contentWindow;if(w&&typeof w.showScreen==='function'){w.showScreen('homeScreen');installAll();return true}const d=inner.contentDocument;if(d){d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const h=d.getElementById('homeScreen');if(h){h.classList.add('active');installAll();return true}}}catch(e){}return false};inner.addEventListener('load',()=>{setTimeout(go,50);setTimeout(go,250);setTimeout(go,700)},{once:true});return go()}catch(e){return false}}
outer.addEventListener('load',()=>{const inner=getInner();if(inner)inner.addEventListener('load',()=>{setTimeout(installAll,40);setTimeout(enterHome,80)},{once:true});setTimeout(installAll,180);setTimeout(installAll,650);setTimeout(enterHome,80);setTimeout(enterHome,300);setTimeout(enterHome,800);setTimeout(enterHome,1500)});window.addEventListener('storage',e=>{if(e.key==='sonayell_v2')syncYellNow()});setInterval(syncYellNow,250);setTimeout(enterHome,500);
</script></body></html>
