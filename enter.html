<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outerApp" title="そなYELL"></iframe><script>
const U='https://illnptsvaieyacjajlfm.supabase.co';
const K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';
const outer=document.getElementById('outerApp');

async function receiveGoogleLogin(){
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  const access=h.get('access_token'),refresh=h.get('refresh_token')||'',err=h.get('error_description')||h.get('error');
  if(err){alert('Googleログインでエラーが出ました。もう一度試してね。');history.replaceState(null,'',location.pathname);return false;}
  if(!access)return false;
  localStorage.setItem('sonayell_access_token',access);
  if(refresh)localStorage.setItem('sonayell_refresh_token',refresh);
  localStorage.setItem('sonayell_registered','1');
  history.replaceState(null,'',location.pathname+'?after_login=1');
  return true;
}

function goApprovedHome(){
  location.replace('./enter.html?v=11');
}

function watchLegacyHomeReturn(){
  let checks=0;
  const timer=setInterval(()=>{
    checks++;
    try{
      const appDoc=outer.contentDocument;
      const inner=appDoc&&appDoc.getElementById('appFrame');
      const d=inner&&inner.contentDocument;
      if(d){
        const home=d.getElementById('homeScreen');
        if(home&&home.classList.contains('active')){
          clearInterval(timer);
          goApprovedHome();
        }
      }
    }catch(e){}
    if(checks>1200)clearInterval(timer);
  },200);
}

function openTarget(target){
  outer.src='./app.html?v=11';
  let tries=0;
  const jump=()=>{
    tries++;
    try{
      const appDoc=outer.contentDocument;
      const inner=appDoc&&appDoc.getElementById('appFrame');
      if(inner&&inner.contentWindow&&inner.contentDocument){
        const w=inner.contentWindow;
        const d=inner.contentDocument;
        const screen=d.getElementById(target);
        if(screen){
          if(typeof w.showScreen==='function')w.showScreen(target);
          else{
            d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
            screen.classList.add('active');
          }
          if(target==='forestScreen'&&typeof w.renderMyTree==='function')try{w.renderMyTree()}catch(e){}
          setTimeout(watchLegacyHomeReturn,350);
          return true;
        }
      }
    }catch(e){}
    if(tries<40)setTimeout(jump,150);
    return false;
  };
  outer.addEventListener('load',()=>setTimeout(jump,100),{once:true});
  setTimeout(jump,250);
}

(async()=>{
  await receiveGoogleLogin();
  const q=new URLSearchParams(location.search);
  const target=q.get('target');
  if(target)openTarget(target);
  else outer.src='./home.html?v=11';
})();
</script></body></html>
