<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outerApp" src="./app.html?from=action5" title="そなYELL"></iframe><script>
const outer=document.getElementById('outerApp');
const shouldEnterHome=sessionStorage.getItem('sonayell_enter_home_once')==='1';
if(shouldEnterHome)sessionStorage.removeItem('sonayell_enter_home_once');
function getInner(){try{const x=outer.contentDocument;return x?x.getElementById('appFrame'):null}catch(e){return null}}
function installPrepareV2(){try{const inner=getInner();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('prepareV2Logic'))return true;const logic=()=>{if(d.getElementById('prepareV2Logic'))return;const s=d.createElement('script');s.id='prepareV2Logic';s.src='./prepare-v2.js?v=4';d.body.appendChild(s)};if(d.getElementById('prepareV2Data')){logic();return true}const s=d.createElement('script');s.id='prepareV2Data';s.src='./prepare-v2-data.js?v=3';s.onload=logic;d.body.appendChild(s);return true}catch(e){return false}}
function installSearchEmphasis(d){if(d.getElementById('actionSearchEmphasis'))return;const p=d.createElement('script');p.id='actionSearchEmphasis';p.src='./action-search-emphasis.js?v=2';d.body.appendChild(p)}
function installAction(){try{const inner=getInner();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument;if(d.getElementById('actionLogic')){installSearchEmphasis(d);return true}const files=['action-earthquake-a.js','action-earthquake-b.js','action-tsunami.js','action-storm-a.js','action-storm-b.js','action-landslide.js','action-other-a.js','action-other-b.js'];let i=0;const next=()=>{if(i>=files.length){if(d.getElementById('actionLogic')){installSearchEmphasis(d);return}const s=d.createElement('script');s.id='actionLogic';s.src='./disaster-action.js?v=5';s.onload=()=>installSearchEmphasis(d);d.body.appendChild(s);return}const id='actionData'+i;if(d.getElementById(id)){i++;next();return}const s=d.createElement('script');s.id=id;s.src='./'+files[i]+'?v=5';s.onload=()=>{i++;next()};d.body.appendChild(s)};next();return true}catch(e){return false}}
function latestYell(){try{return Math.max(0,Number(JSON.parse(localStorage.getItem('sonayell_v2')||'{}').yell)||0)}catch(e){return 0}}
function treeCycle(total){total=Math.max(0,Number(total)||0);if(total===0)return{step:0,grown:0};const rem=total%50;return{step:rem===0?50:rem,grown:Math.floor((total-1)/50)}}
function syncYellNow(){try{const inner=getInner();if(!inner||!inner.contentDocument)return false;const d=inner.contentDocument,y=latestYell(),max=50,t=treeCycle(y),step=t.step;let style=d.getElementById('enterTreeCycleStyle');if(!style){style=d.createElement('style');style.id='enterTreeCycleStyle';d.head.appendChild(style)}style.textContent='.yellBadge,.treeYell{display:none!important}';d.querySelectorAll('.yellBadge,.treeYell').forEach(x=>x.style.setProperty('display','none','important'));const emoji=d.getElementById('myTreeEmoji');if(emoji)emoji.textContent=step>=50?'🌳':step>=25?'🌿':'🌱';const progress=d.getElementById('treeProgressText');if(progress)progress.textContent=step+' / '+max;const leaves=d.getElementById('treeLeaves');if(leaves){const on=leaves.querySelectorAll('.treeLeaf.on').length,tot=leaves.querySelectorAll('.treeLeaf').length;if(on!==step||tot!==max){leaves.innerHTML='';for(let i=0;i<max;i++){const s=d.createElement('span');s.className='treeLeaf'+(i<step?' on':'');s.textContent='🍃';leaves.appendChild(s)}}}const remain=d.getElementById('treeRemain');if(remain){if(step===50)remain.innerHTML='🎉 大樹になったよ！<br><small>次の一歩から、新しい木を育てよう。</small>';else remain.innerHTML=(t.grown>0?'<small>🌳 育てた大樹 '+t.grown+'本</small><br>':'')+'次の大樹まであと <strong>'+(max-step)+'</strong> YELL！<br><small>一歩ずつ、木を育てよう。</small>'}return true}catch(e){return false}}
function installAll(){installPrepareV2();installAction();syncYellNow()}
function isHomeVisible(){try{const inner=getInner(),d=inner&&inner.contentDocument,h=d&&d.getElementById('homeScreen');return !!(h&&h.classList.contains('active'))}catch(e){return false}}
function enterHomeOnce(){if(!shouldEnterHome)return false;try{const inner=getInner();if(!inner)return false;const w=inner.contentWindow,d=inner.contentDocument;if(w&&typeof w.showScreen==='function'){w.showScreen('homeScreen');installAll();return true}if(d){d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const h=d.getElementById('homeScreen');if(h){h.classList.add('active');installAll();return true}}}catch(e){}return false}
outer.addEventListener('load',()=>{const inner=getInner();if(inner)inner.addEventListener('load',()=>{setTimeout(installAll,80);setTimeout(()=>{if(isHomeVisible())syncYellNow()},400);if(shouldEnterHome){setTimeout(enterHomeOnce,80);setTimeout(enterHomeOnce,350);setTimeout(enterHomeOnce,900)}},{once:true});setTimeout(installAll,250);setTimeout(installAll,800);if(shouldEnterHome){setTimeout(enterHomeOnce,250);setTimeout(enterHomeOnce,700);setTimeout(enterHomeOnce,1400)}});window.addEventListener('storage',e=>{if(e.key==='sonayell_v2')syncYellNow()});setInterval(()=>{if(isHomeVisible())syncYellNow()},500);
</script></body></html>
