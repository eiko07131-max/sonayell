lay:block;height:100%;width:0;background:linear-gradient(90deg,#0b9b48,#57c66a);border-radius:99px;transition:width .35s}.count{text-align:center;margin-top:9px;color:#08783a;font-size:17px;font-weight:900}.count strong{font-size:34px}.next{text-align:center;padding:10px 0 12px;border-bottom:1px solid #eee5db;font-size:13px;font-weight:900}.next strong{color:#08783a;font-size:19px;margin-left:6px}.grown{text-align:center;padding-top:10px;font-size:13px;font-weight:900}.grown strong{color:#08783a;font-size:27px;margin:0 5px}.sona{display:flex;align-items:flex-end;gap:8px;margin:13px 14px 7px}.sona img{width:82px;height:103px;object-fit:contain;flex:0 0 82px;mix-blend-mode:multiply}.bubble{position:relative;flex:1;min-height:92px;padding:12px 14px;border:1.5px solid #e8d7b9;border-radius:22px;background:#fffdf8}.bubble:before{content:"";position:absolute;left:-9px;bottom:23px;width:17px;height:17px;background:#fffdf8;border-left:1.5px solid #e8d7b9;border-bottom:1.5px solid #e8d7b9;transform:rotate(45deg)}.bubble b{position:relative;color:#08713a;font-size:15px}.bubble p{position:relative;margin:5px 0 0;font-size:13px;line-height:1.55}.testbox{display:none;margin:9px 13px 15px;padding:11px;border:1px dashed #d3a54c;border-radius:16px;background:#fff5d9}.testbox.on{display:block}.testbox>b{display:block;margin-bottom:8px;color:#77530b;font-size:12px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stages button,.tools button{border:0;border-radius:10px;padding:8px 3px;background:#08783a;color:#fff;font-size:11px;font-weight:900}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tools button{padding:8px 10px}.tools .pale{background:#6b7c70}.tip{margin:5px 15px 16px;padding:8px 10px;border:1px solid #d7e6bd;border-radius:999px;background:#eff7df;text-align:center;color:#4d7552;font-size:10.5px;font-weight:900}.nav{position:fixed;z-index:40;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:76px;padding:5px 2px max(5px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.98);border-top:1px solid #dfe8dc}.nav button{border:0;background:none;color:#4e5c51;padding:4px 1px}.nav span{display:block;font-size:21px}.nav small{display:block;margin-top:3px;font-size:7px;line-height:1.12;font-weight:900}.modalBack{display:none;position:fixed;z-index:90;inset:0;align-items:center;justify-content:center;padding:22px;background:rgba(20,47,27,.42)}.modalBack.on{display:flex}.modal{width:min(100%,360px);padding:20px 18px;background:#fff;border-radius:24px}.modal h3{margin:0 0 10px;color:#08743a}.modal p{font-size:14px;line-height:1.7}.modal button{width:100%;border:0;border-radius:14px;padding:11px;background:#08783a;color:#fff;font-weight:900}@media(max-width:390px){.top{height:56px}.title{font-size:20px}.hero{aspect-ratio:390/275}.treeWrap{width:132px;height:151px;bottom:40px}.treeSprite{transform:scale(.943);transform-origin:center bottom}.panel{margin-left:10px;margin-right:10px;padding:16px 17px}.sona img{width:76px;height:96px;flex-basis:76px}}

<body>
<main class="app">
<header class="top"><button class="back" onclick="location.href='./dev-home.html?v=20260903'">‹戻る</button><div class="title">私のYELLの木</div><button class="help" id="help">?</button></header>
<section class="hero"><img class="forest" src="./assets/yell-forest-dynamic-bg.webp?v=20260903b" alt="そなピーとYELLの森の仲間たち"><div class="treeWrap" id="treeWrap"><div class="treeSprite" id="treeSprite"></div></div><div class="caption" id="caption">小さな芽からスタート 🌱</div></section>
<section class="panel"><h2>成長中のYELLの木</h2><div class="meter"><i id="bar"></i></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div class="next" id="next"></div><div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div></section>

<div class="testbox" id="testbox"><b>🧪 成長段階をそのまま確認</b><div class="stages"><button data-y="3">3 YELL</button><button data-y="5">5 YELL</button><button data-y="7">7 YELL</button><button data-y="13">13 YELL</button><button data-y="28">28 YELL</button><button data-y="35">35 YELL</button><button data-y="45">45 YELL</button><button data-y="50">50 YELL</button></div><div class="tools"><button id="plus1">+1 YELL</button><button id="flower">🌼 花</button><button id="fruit">🍊 実</button><button id="both">🌼🍊 両方</button><button class="pale" id="live">実データに戻る</button></div></div>

<div class="modalBack" id="modal"><div class="modal"><h3>🌱 YELLの木って？</h3><p>備えや防災につながる行動でYELLがたまり、3・5・7・13・28・35・45・50YELLの節目で、決めた成長段階どおりに木の姿が変わります。50YELLで大樹1本が完成します。</p><button id="close">わかった！</button></div></div>
<script src="./yell-cycle.js?v=20260903"></script>
<script>
const $=id=>document.getElementById(id);
const CELL_W=140,CELL_H=160;
const stages={
  3:{c:0,r:0,msg:'小さな芽が出たよ！ 🌱',cheer:'小さな芽が出たね。ここから少しずつ育っていくよ。'},
  5:{c:1,r:0,msg:'少しずつ育ってきたよ！ 🌱',cheer:'いい感じ。少しずつ背が伸びてきたよ。'},
  7:{c:2,r:0,msg:'葉っぱが増えてきたよ！ 🍃',cheer:'いい感じ！YELLがちゃんと葉っぱになって増えてるよ。'},
  13:{c:3,r:0,msg:'小さな木になったよ！ 🌳',cheer:'小さな一歩が重なって、ちゃんと木になってきたよ。'},
  28:{c:0,r:1,msg:'ぐんぐん成長しているよ！ 🌿',cheer:'ぐんぐん成長中！その調子でYELLを続けよう。'},
  35:{c:1,r:1,msg:'もうすぐ大樹になりそう！ 🌳',cheer:'ここまで育ったね。大樹までもう少し！'},
  45:{c:2,r:1,msg:'立派な大樹が見えてきた！ 🌳',cheer:'立派になったね。あと少しで大樹完成だよ！'},
  50:{c:3,r:1,msg:'大樹に成長したよ！おめでとう！ 🎉',cheer:'大樹完成！積み重ねたYELLが大きな木になったよ。'},
  flower:{c:0,r:2,msg:'お花が咲いた特別なYELLの木！ 🌼',cheer:'保存10達成。YELLの木にお花が咲いたよ！'},
  fruit:{c:1,r:2,msg:'実がなった特別なYELLの木！ 🍊',cheer:'いいね20達成。YELLの木に実がなったよ！'},
  both:{c:2,r:2,msg:'お花も実もついた特別なYELLの木！ ✨',cheer:'保存10＋いいね20達成。特別なYELLの木になったよ！'}
};
let preview=null;
function keyFor(y,special){if(special&&y>=45)return special;if(y>=50)return 50;if(y>=45)return 45;if(y>=35)return 35;if(y>=28)return 28;if(y>=13)return 13;if(y>=7)return 7;if(y>=5)return 5;if(y>=3)return 3;return 0}
function view(){if(preview)return preview;const q=new URLSearchParams(location.search);if(q.has('demo'))return{y:Math.max(0,Math.min(50,Number(q.get('demo'))||0)),trees:Math.max(0,Number(q.get('trees'))||0),special:q.get('special')||''};const s=SonaYellCycle.get();return{y:Math.max(0,Math.min(49,Number(s.yell)||0)),trees:Math.max(0,Number(s.greatTrees)||0),special:''}}
function render(){const v=view(),k=keyFor(v.y,v.special),sp=$('treeSprite');$('current').textContent=v.y;$('grown').textContent=v.trees;$('bar').style.width=Math.min(100,v.y/50*100)+'%';$('next').innerHTML=v.y>=50?'大樹完成！ <strong>おめでとう！</strong>':'次の大樹になるまで <strong>あと '+(50-v.y)+'YELL！</strong>';if(!k){$('treeWrap').style.display='none';$('caption').textContent='小さな芽からスタート 🌱';$('cheer').textContent='最初の一歩から、YELLの木づくりは始まってるよ。';return}$('treeWrap').style.display='flex';const st=stages[k];sp.style.backgroundPosition=(-st.c*CELL_W)+'px '+(-st.r*CELL_H)+'px';$('caption').textContent=st.msg;$('cheer').textContent=st.cheer}
async function loadSona(){try{const r=await fetch('./assets/sonapi-official-b64.txt?v=20260903b',{cache:'no-store'});if(r.ok)$('sonaImg').src='data:image/webp;base64,'+(await r.text()).replace(/\s+/g,'')}catch(e){}}
const q=new URLSearchParams(location.search);if(q.has('test')){$('testbox').classList.add('on');document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{preview={y:Number(b.dataset.y),trees:SonaYellCycle.get().greatTrees||0,special:''};render()});$('plus1').onclick=()=>{preview=null;SonaYellCycle.add(1);render()};$('flower').onclick=()=>{preview={y:45,trees:SonaYellCycle.get().greatTrees||0,special:'flower'};render()};$('fruit').onclick=()=>{preview={y:45,trees:SonaYellCycle.get().greatTrees||0,special:'fruit'};render()};$('both').onclick=()=>{preview={y:45,trees:SonaYellCycle.get().greatTrees||0,special:'both'};render()};$('live').onclick=()=>{preview=null;history.replaceState(null,'',location.pathname+'?test=1');render()}}
$('help').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};loadSona();render();addEventListener('pageshow',render);addEventListener('focus',render);addEventListener('storage',render);
</script>
