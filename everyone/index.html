<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アナタの毎日頭のトレーニング</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf3;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#5b493c;text-align:center}.m{font-size:20px;font-weight:900;line-height:1.8}</style></head><body><div class="m" id="m">🎁🧠✨<br>毎日頭のトレーニングを<br>読み込んでいます…</div><script>(async()=>{try{let h=await fetch("../brain-training/index.html?share="+Date.now()).then(r=>{if(!r.ok)throw Error("base");return r.text()});let m=await fetch("../brain-training/final.html?mole="+Date.now()).then(r=>{if(!r.ok)throw Error("mole");return r.text()});let getMods=x=>JSON.parse(x.match(/const MODS=(\{.*?\});\nfunction/s)[1]),a=getMods(h),b=getMods(m);a.mole=b.mole;h=h.replace(/const MODS=\{.*?\};\nfunction/s,"const MODS="+JSON.stringify(a)+";\nfunction");const card='<button class="card" onclick="openGame(\'mole\',\'🔨 モグラ叩き\')"><span class="ico">🔨🐹</span><strong>モグラ叩き</strong><small>見つけてタップ！反応・集中・目と手の連携を楽しくトレーニング。</small><span class="tag">🎯 初級・中級・上級</span></button>';h=h.replace(/(<button class="card wide" onclick="openGame\('ball',[\s\S]*?<\/button>)/, "$1"+card);const add='(function(){function hook(){var f=document.getElementById("frame");if(!f||f.dataset.hooked)return;f.dataset.hooked="1";f.addEventListener("load",function(){var d=f.contentDocument;if(!d)return;var st=d.createElement("style");st.textContent=".resultTime .big{font-size:clamp(3.4rem,16vw,6.2rem)!important}.bestline{font-size:clamp(1.35rem,6vw,2rem)!important}.mfinish-score{font-size:clamp(34px,11vw,60px)!important}.mfinish-new{font-size:clamp(22px,6vw,32px)!important}";d.head.appendChild(st);d.defaultView.playUnifiedCorrectSound=function(){try{var C=d.defaultView.AudioContext||d.defaultView.webkitAudioContext,c=new C(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1320,t+.14);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.25)}catch(e){}};var oldNext=d.defaultView.next;if(oldNext){d.defaultView.next=function(){d.defaultView.playUnifiedCorrectSound();return oldNext()}};new MutationObserver(function(){if(!(d.body.innerText||"").includes("10問クリア！")||d.getElementById("ballBestReset"))return;var r=[].slice.call(d.querySelectorAll("button")).find(function(x){return x.textContent.includes("もう一回挑戦")});if(!r)return;var q=d.createElement("button");q.id="ballBestReset";q.textContent="ベストタイムをリセット";q.style.cssText="width:100%;margin-top:10px;padding:14px;border-radius:16px;border:2px solid #d7cec3;background:#fff;color:#665247;font-size:17px;font-weight:900";q.onclick=function(){if(confirm("カラーボールのベストタイムをリセットしますか？")){d.defaultView.localStorage.removeItem("ballBest");d.defaultView.location.reload()}};r.after(q)}).observe(d.body,{childList:true,subtree:true})})}setInterval(hook,200)})();';h=h.replace("</body>","<scr"+"ipt>"+add+"</scr"+"ipt></body>");document.open();document.write(h);document.close()}catch(e){console.error(e);document.getElementById("m").innerHTML="読み込みに失敗しました。<br>もう一度タップしてね。"}})();</script></body></html>
