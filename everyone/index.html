<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アナタの毎日頭のトレーニング</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf3;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#5b493c;text-align:center}.m{font-size:20px;font-weight:900;line-height:1.8}</style></head><body><div class="m" id="m">🎁🧠✨<br>毎日頭のトレーニングを<br>読み込んでいます…</div><script>(async()=>{try{let h=await fetch("../brain-training/final.html?share="+Date.now()).then(r=>{if(!r.ok)throw Error("base");return r.text()});h=h.replace(/const ANOHI_MASTER_KEY="[^"]*";/,"const ANOHI_MASTER_KEY=\"anohi_master_questions_everyone_share_v1\";").replace(/const ANOHI_DB_NAME="[^"]*";/,"const ANOHI_DB_NAME=\"anohi_memory_quiz_db_everyone_share_v1\";");h=h.replace("</body>",`<script>
(function(){
 const STYLE=`.resultTime .big{font-size:clamp(3.4rem,16vw,6.2rem)!important;line-height:1.05!important}.bestline{font-size:clamp(1.35rem,6vw,2rem)!important;margin-top:14px!important}.resultTime .bestline,.resultBest{font-weight:1000!important}.mfinish-score{font-size:clamp(34px,11vw,60px)!important;line-height:1.1!important}.mfinish-new{font-size:clamp(22px,6vw,32px)!important;font-weight:1000!important}`;
 function enhanceFrame(){
  const f=document.getElementById('frame'); if(!f||f.dataset.timeEnhanced)return;
  f.dataset.timeEnhanced='1';
  f.addEventListener('load',()=>{
   const d=f.contentDocument;if(!d||d.getElementById('sharedTimeStyle'))return;
   const st=d.createElement('style');st.id='sharedTimeStyle';st.textContent=STYLE;d.head.appendChild(st);
   const improve=()=>{
    const text=d.body.innerText||'';
    if(!text.includes('10問クリア！')||d.getElementById('ballBestReset'))return;
    const retry=[...d.querySelectorAll('button')].find(b=>b.textContent.includes('もう一回挑戦'));
    if(!retry)return;
    const b=d.createElement('button');b.id='ballBestReset';b.type='button';b.textContent='ベストタイムをリセット';
    b.style.cssText='width:100%;margin-top:10px;padding:14px;border-radius:16px;border:2px solid #d7cec3;background:#fff;color:#665247;font-size:17px;font-weight:900';
    b.onclick=()=>{if(confirm('カラーボールのベストタイムをリセットしますか？')){d.defaultView.localStorage.removeItem('ballBest');d.defaultView.location.reload()}};
    retry.after(b);
   };
   new MutationObserver(improve).observe(d.body,{childList:true,subtree:true});improve();
  });
 }
 const watch=setInterval(()=>{enhanceFrame();if(document.getElementById('frame'))clearInterval(watch)},150);
})();
</script></body>`);document.open();document.write(h);document.close()}catch(e){console.error(e);document.getElementById("m").innerHTML="読み込みに失敗しました。<br>もう一度タップしてね。"}})();</script></body></html>
