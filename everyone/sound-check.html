<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正解音チェック</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf3;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#483a31;text-align:center}.box{padding:32px 20px;max-width:440px}.icon{font-size:4rem}.title{font-weight:900;font-size:clamp(1.6rem,7vw,2.25rem);margin:15px 0 8px}.note{font-size:1.05rem;line-height:1.7}.play{margin-top:26px;width:100%;border:0;border-radius:24px;padding:24px 14px;background:linear-gradient(135deg,#f59e35,#ee765a);color:#fff;font-weight:900;font-size:1.5rem;box-shadow:0 7px 0 #c55d43;touch-action:manipulation}.play:active{transform:translateY(5px);box-shadow:0 2px 0 #c55d43}.status{min-height:28px;margin-top:24px;font-weight:800;color:#b54f3d}</style></head><body><main class="box"><div class="icon">✨🔔✨</div><div class="title">正解〜！ 音チェック</div><p class="note">カラーボールを全部選び終えた時に<br>鳴らしたい音だけを確認します。</p><button class="play" id="play" disabled>音を準備中…</button><div class="status" id="status"></div></main><script>(async()=>{const btn=document.getElementById("play"),status=document.getElementById("status");try{const h=await fetch("../brain-training/index.html?audio="+Date.now()).then(r=>r.text()),mods=JSON.parse(h.match(/const MODS=(\{.*?\});\nfunction/s)[1]),ball=decodeURIComponent(escape(atob(mods.ball))),src=ball.match(/const CORRECT_SOUND_SRC\s*=\s*"([^"]+)"/)[1],sound=new Audio(src);sound.preload="auto";btn.disabled=false;btn.textContent="ティロリッ♪ を鳴らす";btn.onclick=async()=>{try{sound.pause();sound.currentTime=0;await sound.play();status.textContent="✨ 正解〜！"}catch(e){status.textContent="音が再生できませんでした"}}}catch(e){status.textContent="音の準備に失敗しました"}})();</script></body></html>
