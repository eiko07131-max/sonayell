<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>災害別 防災アクション｜そなYELL</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f5faef;color:#36563b}.top{position:sticky;top:0;z-index:5;background:#fff;padding:12px;border-bottom:1px solid #dce9d7;display:flex;align-items:center}.back{border:1px solid #cce2c4;background:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;color:#23833e}.top b{margin-left:10px;font-size:19px;color:#087d45}.wrap{max-width:650px;margin:auto;padding:18px 14px 35px}.hero{background:linear-gradient(135deg,#dff4d4,#fff2b7);border-radius:22px;padding:18px}.hero h1{margin:0 0 7px;font-size:23px}.hero p{margin:0;line-height:1.7;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.card{border:0;background:#fff;border-radius:20px;padding:16px 12px;text-align:left;min-height:135px;box-shadow:0 3px 12px #234a2914;cursor:pointer}.ico{font-size:38px}.card strong{display:block;font-size:17px;color:#087d45;margin-top:5px}.card small{display:block;margin-top:5px;line-height:1.5;color:#6f7a6e}.detail,.stepDetail{display:none}.show{display:block}.hide{display:none!important}.title{text-align:center;font-size:22px;color:#087d45;margin:4px 0 14px}.action{width:100%;border:0;background:#fff;border-radius:17px;margin:9px 0;padding:15px;text-align:left;border-left:6px solid #58ad61;box-shadow:0 2px 8px #234a2910;cursor:pointer}.action strong{display:block;font-size:16px;color:#315d37}.action p{font-size:12px;line-height:1.6;margin:5px 0 0;color:#687267}.action .more{display:block;text-align:right;color:#299c50;font-size:12px;font-weight:900;margin-top:7px}.now{background:#fff3bd;border-left-color:#e6a72c}.note{background:#e8f6e4;border-radius:17px;padding:13px;margin-top:13px;font-size:12px;line-height:1.7}.btn{width:100%;border:0;background:#259d50;color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:16px;margin-top:14px}.stepBox{background:#fff;border-radius:22px;padding:20px;box-shadow:0 4px 16px #234a2914}.stepNo{text-align:center;font-size:42px}.stepBox h2{text-align:center;color:#087d45;margin:5px 0 15px}.lead{font-size:16px;font-weight:900;line-height:1.7;background:#fff3bd;border-radius:15px;padding:13px}.points{margin-top:14px}.point{background:#f3faef;border-radius:14px;padding:12px;margin:8px 0;font-size:13px;line-height:1.6}.point b{color:#087d45}.warn{background:#fff0ed;border-radius:14px;padding:12px;margin-top:12px;font-size:12px;line-height:1.6;color:#85463d}@media(max-width:430px){.grid{grid-template-columns:1fr}.card{min-height:110px}}</style></head><body><header class="top"><button class="back" onclick="back()">←</button><b>📖 災害別 防災アクション</b></header><main class="wrap"><section id="hero" class="hero"><h1>「あれっ、どうする？」を少しずつ知ろう。</h1><p>災害によって、とるべき行動は変わります。<br>気になる災害を選んで、いざという時の動きを確認しよう。</p></section><section id="grid" class="grid"></section><section id="detail" class="detail"><h1 id="title" class="title"></h1><div id="actions"></div><div class="note">🌱 3つの枠は押せます。気になる場面をタップして、もう一段詳しく確認しよう。</div><button class="btn" onclick="showGrid()">災害一覧へ戻る</button></section><section id="stepDetail" class="stepDetail"><div class="stepBox"><div id="stepNo" class="stepNo"></div><h2 id="stepTitle"></h2><div id="stepLead" class="lead"></div><div id="points" class="points"></div><div id="warn" class="warn"></div></div><button class="btn" onclick="backToActions()">← 3つの行動へ戻る</button></section></main><script>const ds=[['earth','🫨','地震','揺れを感じたらどうする？',[['今すぐやること','まず身の安全を確保。頭を守り、倒れそうな家具や窓から離れる。',['机など丈夫な物の下に入り、頭と首を守る','家具・テレビ・窓ガラスから離れる','揺れている最中に無理に火を消しに行かない'],'慌てて外へ飛び出すと、瓦やガラスなどの落下物でけがをする危険があります。'],['揺れがおさまったら','火元を確認し、出口を確保。慌てて外へ飛び出さない。',['家族のけがを確認する','ドアや窓を開けて避難口を確保する','火災が起きていないか安全に確認する'],'余震が来ることがあります。倒れかけた家具や割れたガラスに注意。'],['避難するとき','ブレーカーや火元を確認し、落下物やブロック塀に注意する。',['靴を履いて足を守る','可能ならブレーカーを切り、火元を確認する','ブロック塀・自動販売機・切れた電線から離れる'],'危険が迫っている場合は、持ち物より避難を優先してください。']]],['rain','🌧️','大雨・洪水','雨が強くなる前に',[['今すぐ確認すること','気象情報と避難情報を確認。川や用水路を見に行かない。',['スマホやテレビで最新情報を確認する','ハザードマップで自宅周辺の浸水リスクを見る','家族と避難先・連絡方法を確認する'],'川や用水路の様子を見に行くのは非常に危険です。'],['危険が近づいたら','浸水する前に安全な場所へ。夜間になる前の避難を意識する。',['避難情報を待ちすぎず早めに動く','高齢者や子どもがいる家庭は特に早めに避難する','冠水した道路を無理に歩かない'],'水が膝付近まで来ているなど屋外避難が危険な場合は無理をしないでください。'],['逃げ遅れたら','無理に屋外へ出ず、建物のより高い階など安全な場所へ移動する。',['できるだけ高い階へ移動する','崖や川から遠い側の部屋へ移動する','救助を求められるようスマホやライトを手元に置く'],'状況によって最善の行動は変わります。自治体・消防等の情報を確認してください。']]],['typhoon','🌀','台風・暴風','風が強くなる前に',[['接近前にやること','飛ばされそうな物を屋内へ。雨戸・窓・充電・停電対策を確認する。',['植木鉢や物干し竿を片づける','スマホ・モバイルバッテリーを充電する','水・食料・ライトを手元に準備する'],'風が強くなってから屋外作業をするのは危険です。'],['暴風中にやること','外へ出ない。窓から離れ、カーテンを閉めて安全な部屋で過ごす。',['窓から離れる','雨戸やカーテンを閉める','停電時は懐中電灯を使う'],'窓や雨戸の補強を暴風中に行わないでください。'],['通過したあと','切れた電線や倒木に近づかず、周囲の安全を確認する。',['自治体の情報を確認する','切れた電線には絶対近づかない','冠水や倒木のある道路を避ける'],'台風通過後も河川増水や土砂災害が続くことがあります。']]],['fire','🔥','火災','火や煙に気づいたら',[['最初にやること','大声で周囲に知らせ、119番通報。危険なら消火より避難を優先する。',['「火事だ！」と周囲に知らせる','安全な場所から119番通報する','初期消火が危険ならすぐ逃げる'],'炎が大きい、煙が多いなど危険を感じたら消火に固執しないでください。'],['煙があるとき','姿勢を低くし、煙を吸わないよう口元を覆って逃げる。',['できるだけ低い姿勢になる','煙の少ない方向へ避難する','エレベーターを使わない'],'煙は命に関わります。荷物を取りに戻らないでください。'],['避難したあと','絶対に建物へ戻らない。消防の指示に従う。',['安全な場所で人数確認する','消防に取り残された人の情報を伝える','再び建物へ入らない'],'大切な物が残っていても、自分で取りに戻らないでください。']]],['snow','❄️','大雪','雪がひどくなる前に',[['事前にやること','食料・水・暖房・停電対策を確認。不要不急の外出を控える。',['数日分の食料と水を確認する','暖房器具と燃料を確認する','スマホや予備電源を充電する'],'大雪予報が出てから無理に買い出しへ行かないよう早めに準備。'],['外出するとき','路面凍結や屋根からの落雪に注意。無理な車移動を避ける。',['滑りにくい靴を履く','屋根の真下を避ける','車には冬装備と防寒用品を準備する'],'見た目では分かりにくい路面凍結にも注意してください。'],['車で立ち往生したら','マフラー周辺の雪を除き、一酸化炭素中毒に注意する。',['救助要請と現在地の共有をする','マフラー周辺をこまめに除雪する','防寒しながら体力を温存する'],'排気口が雪で塞がると一酸化炭素中毒の危険があります。']]],['land','⛰️','土砂災害','崖や斜面が心配なとき',[['雨の前から確認','ハザードマップで危険区域と避難先を確認する。',['自宅が土砂災害警戒区域か確認する','避難場所までの道を確認する','夜になる前の早めの避難を考える'],'大雨になってから危険箇所を見に行かないでください。'],['前兆に気づいたら','地鳴り、湧き水の変化、崖の亀裂などを感じたらすぐ離れる。',['崖から小石が落ちる','急に水が濁る・湧き水が変化する','地鳴りや異常な音がする'],'前兆がなく突然発生する場合もあります。警報・避難情報を優先してください。'],['避難するとき','崖や沢から離れる方向へ。危険が迫る前に早めに避難する。',['崖・谷・沢から離れる','指定避難場所など安全な場所へ移動する','外へ出る方が危険なら建物内の安全な場所へ'],'土砂の流れる方向に沿って逃げないよう注意してください。']]],['heat','☀️','猛暑・熱中症','暑さが危険なとき',[['日頃からやること','水分・塩分を取り、室温を確認してエアコンを我慢しない。',['のどが渇く前に水分補給する','室温を確認し冷房を使う','高齢者や子どもの様子をこまめに見る'],'暑さを我慢することを防災にしない。室内でも熱中症になります。'],['体調が変だと思ったら','めまい・頭痛・吐き気などがあれば涼しい場所へ移動し体を冷やす。',['涼しい場所へ移動する','衣服をゆるめ首・脇・足の付け根などを冷やす','飲める状態なら水分・塩分を補給する'],'症状が改善しない場合は医療機関への相談を考えてください。'],['重い症状なら','意識がおかしい、自力で水が飲めない場合は救急要請を考える。',['意識状態を確認する','自力で水が飲めない人に無理に飲ませない','救急要請しながら体を冷やす'],'意識障害など重い症状は緊急性があります。']]],['tsunami','🌊','津波','強い揺れ・警報があったら',[['すぐにやること','海岸や川の近くでは、情報を待ちすぎず高い場所へ避難する。',['強い揺れや長い揺れを感じたら避難を始める','高台や津波避難場所を目指す','海や川の様子を見に行かない'],'津波は川を遡上することがあります。海岸だけでなく河川周辺も注意。'],['避難しているとき','車に頼りすぎず、可能なら徒歩で高台や津波避難場所へ。',['より高い場所を目指す','渋滞の危険があるため状況に応じ徒歩で避難する','家族を探しに危険区域へ戻らない'],'自分の安全を確保することが、家族の安全にもつながります。'],['避難したあと','警報・注意報が解除されるまで海や川へ戻らない。',['安全な場所にとどまる','公式情報を確認する','第一波の後も警戒を続ける'],'津波は繰り返し来ることがあります。自己判断で戻らないでください。']]]];let cur=null,step=null;const grid=document.getElementById('grid');function render(){grid.innerHTML='';ds.forEach(d=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="ico">'+d[1]+'</span><strong>'+d[2]+'</strong><small>'+d[3]+'</small>';b.onclick=()=>openD(d[0]);grid.appendChild(b)})}function openD(id){cur=ds.find(x=>x[0]===id);step=null;document.getElementById('hero').classList.add('hide');grid.classList.add('hide');document.getElementById('stepDetail').classList.remove('show');document.getElementById('detail').classList.add('show');document.getElementById('title').textContent=cur[1]+' '+cur[2];let a=document.getElementById('actions');a.innerHTML='';cur[4].forEach((x,i)=>{let e=document.createElement('button');e.className='action '+(i===0?'now':'');e.innerHTML='<strong>'+(i+1)+'．'+x[0]+'</strong><p>'+x[1]+'</p><span class="more">詳しく見る →</span>';e.onclick=()=>openStep(i);a.appendChild(e)});scrollTo(0,0)}function openStep(i){step=i;let x=cur[4][i];document.getElementById('detail').classList.remove('show');document.getElementById('stepDetail').classList.add('show');document.getElementById('stepNo').textContent=cur[1];document.getElementById('stepTitle').textContent=x[0];document.getElementById('stepLead').textContent=x[1];let p=document.getElementById('points');p.innerHTML='';x[2].forEach((v,j)=>{let d=document.createElement('div');d.className='point';d.innerHTML='<b>✓ '+(j+1)+'</b>　'+v;p.appendChild(d)});document.getElementById('warn').innerHTML='⚠️ <b>気をつけて</b><br>'+x[3];scrollTo(0,0)}function backToActions(){step=null;document.getElementById('stepDetail').classList.remove('show');document.getElementById('detail').classList.add('show');scrollTo(0,0)}function showGrid(){cur=null;step=null;document.getElementById('detail').classList.remove('show');document.getElementById('stepDetail').classList.remove('show');document.getElementById('hero').classList.remove('hide');grid.classList.remove('hide');scrollTo(0,0)}function back(){if(step!==null)backToActions();else if(cur)showGrid();else location.href='./home.html?v=22'}render();</script></body></html>
