<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>災害別!! 防災アクション｜そなYELL</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#fffdf6;color:#333}.top{position:sticky;top:0;z-index:5;background:#fff;padding:12px;border-bottom:1px solid #e5eadc;display:flex;align-items:center}.back{border:0;background:#eef7e8;border-radius:50%;width:38px;height:38px;font-size:20px}.top b{margin-left:9px;color:#087d45;font-size:19px}.yell{margin-left:auto;background:#fff0a8;border-radius:99px;padding:7px 10px;font-weight:900}.wrap{max-width:650px;margin:auto;padding:16px 13px 35px}.intro{display:flex;gap:10px;align-items:center}.sona{font-size:50px}.intro p{margin:0;background:#fff;border:1px solid #e7e3d2;border-radius:17px;padding:11px;line-height:1.6;font-size:13px}.modebar{display:flex;gap:8px;margin:14px 0}.mode{flex:1;border:2px solid;border-radius:14px;padding:11px 6px;font-weight:900}.em{background:#fff0ed;border-color:#e84b37;color:#c93628}.learn{background:#edf8e9;border-color:#419b4e;color:#21783a}.mode.active.em{background:#e94431;color:#fff}.mode.active.learn{background:#329647;color:#fff}.search{display:flex;background:#f1f5f6;border-radius:13px;padding:10px;margin:12px 0}.search input{border:0;background:transparent;outline:0;width:100%;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{border:1px solid #e6dfca;background:#fff;border-radius:16px;padding:13px 5px;text-align:center;font-weight:900;min-height:91px}.card span{display:block;font-size:33px;margin-bottom:5px}.hint{font-weight:900;margin:12px 0 9px}.scene{display:none}.scene.show,.detail.show,.complete.show{display:block}.hide{display:none!important}.sceneBtn{width:100%;border:1px solid #e5e2d5;background:#fff;border-radius:15px;padding:14px;margin:7px 0;text-align:left;font-weight:900;font-size:14px}.sceneBtn small{display:block;color:#777;margin-top:4px}.title{text-align:center;color:#087d45}.urgent{background:#fff0ed;border:2px solid #ef5b4a;border-radius:18px;padding:13px;margin:10px 0}.do,.dont,.learnbox{border-radius:17px;padding:13px;margin:10px 0}.do{background:#edf9e9;border:2px solid #55a85c}.dont{background:#fff0ed;border:2px solid #ef7668}.do b,.dont b{display:block;margin-bottom:8px}.row{margin:7px 0;line-height:1.55}.more{width:100%;border:1px solid #86a7cf;background:#f4f8ff;border-radius:13px;padding:12px;font-weight:900}.learnbox{background:#f5fbef;border:1px solid #9bc790;line-height:1.8}.check{width:100%;border:2px solid #2e9346;background:#fff;color:#21783a;border-radius:15px;padding:13px;font-weight:900;font-size:16px}.check.done{background:#e6f5df;color:#777}.progress{background:#fff;border-radius:16px;padding:12px;border:1px solid #e6dfca;margin:10px 0}.bar{height:9px;background:#e7eee4;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#2f9c50}.btn{width:100%;border:0;background:#299b4c;color:#fff;border-radius:14px;padding:14px;font-weight:900;margin-top:12px}.complete{text-align:center;background:#fff;border-radius:22px;padding:25px 15px}.complete .big{font-size:55px}.plus{font-size:28px;font-weight:900;color:#23823d;background:#fff1b9;border-radius:17px;padding:15px;margin:15px 0}.leaf{position:fixed;top:-40px;font-size:28px;z-index:20;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:.1}}@media(max-width:430px){.grid{grid-template-columns:repeat(3,1fr)}.card{font-size:12px}}</style></head><body><header class="top"><button class="back" onclick="back()">←</button><b>災害別!! 防災アクション</b><span class="yell">🌿 <span id="yell">0</span></span></header><main class="wrap"><section id="menu"><div class="intro"><div class="sona">🌱</div><p>発災時は「今すぐ知りたいことを最短で」。<br>平時は「学んで備える」ことができるよ。</p></div><div class="modebar"><button id="emBtn" class="mode em active" onclick="setMode('em')">🚨 発災時<br><small>すぐに知りたい</small></button><button id="learnBtn" class="mode learn" onclick="setMode('learn')">🌿 平時<br><small>ゆったり学びたい</small></button></div><div class="search">🔎 <input id="q" placeholder="例：エレベーター、避難、車…" oninput="renderGrid()"></div><div class="hint">災害を選ぶ</div><div id="grid" class="grid"></div></section><section id="scene" class="scene"><h2 id="disTitle" class="title"></h2><div id="progress" class="progress"></div><div class="search">🔎 <input id="sq" placeholder="この災害の場面を検索" oninput="renderScenes()"></div><div class="hint">今の状況に合った場面を選ぶ</div><div id="scenes"></div></section><section id="detail" class="detail"><h2 id="sceneTitle" class="title"></h2><div class="modebar"><button id="dem" class="mode em" onclick="setDetailMode('em')">🚨 発災時</button><button id="dlearn" class="mode learn" onclick="setDetailMode('learn')">🌿 平時</button></div><div id="urgent"></div><div id="learning"></div></section><section id="complete" class="complete"><div class="big">🌱🎉</div><h2>学習完了！</h2><p id="completeText"></p><div class="plus">🌿 ＋10 YELL</div><p>YELLの木が成長しました！</p><button class="btn" onclick="location.href='./home.html?v=23'">ホームへ戻る</button></section></main><script>const disasters=[['earth','🫨','地震'],['tsunami','🌊','津波'],['typhoon','🌀','台風・大雨'],['land','⛰️','土砂災害'],['flood','🌧️','洪水'],['surge','🌊','高潮'],['snow','⛄','大雪'],['fire','🔥','火災'],['volcano','🌋','火山噴火']];const data={earth:[['エレベーターの中で揺れた！','エレベーター', ['すべての階のボタンを押す','最初に停止した階で降りる','閉じ込められた場合は非常ボタンやインターホンで外部と連絡する'],['無理に扉をこじ開ける','自力で脱出しようとする','非常装置をむやみに動かす'],'エレベーターは停電すると非常電源で最寄り階に停止する仕組みになっている場合があります。安全な場所へ移動し、周囲の被害状況を確認しましょう。'],['家の中で揺れた！','家 家具 机',['丈夫な机などの下で頭を守る','家具や窓から離れる','揺れが収まってから出口を確保する'],['慌てて外へ飛び出す','揺れている最中に無理に火を消しに行く'],'日頃から家具の固定や、寝る場所の周囲に倒れる物を置かない工夫をしましょう。'],['寝ている時に揺れた！','寝室 ベッド',['布団や枕で頭を守る','倒れそうな家具から離れる','揺れが収まってから靴を履く'],['暗い中を裸足で歩く','慌てて階段へ走る'],'寝室には懐中電灯と履物を手の届く場所に置いておくと安心です。'],['外を歩いている時に揺れた！','外 道路',['かばん等で頭を守る','ブロック塀や看板から離れる','広く安全な場所へ移動する'],['塀ぎわに留まる','切れた電線に近づく'],'普段歩く道でも、落下物や倒壊の危険がある場所を確認しておきましょう。'],['スーパー・駅など人の多い場所で揺れた！','店 駅 人混み',['頭を守る','係員の指示を聞く','出口へ一斉に走らない'],['人を押して出口へ殺到する','棚やガラスの近くに留まる'],'非常口の場所を普段から意識するだけでも、いざという時の助けになります。'],['学校・職場にいる時に揺れた！','学校 職場',['机の下などで頭を守る','窓や棚から離れる','校内・館内放送や担当者の指示に従う'],['勝手に建物外へ飛び出す','エレベーターを使う'],'職場や学校の避難経路と集合場所を確認しておきましょう。'],['車を運転中に揺れた！','車 運転',['急ブレーキを避けゆっくり左側に停車する','揺れが収まるまで車内で情報を確認する','避難時は緊急車両の妨げにならないようにする'],['急ハンドル・急ブレーキ','道路中央に車を放置する'],'車には水、ライト、携帯トイレなど最低限の防災用品を備えておくと役立ちます。']]],tsunami:[['海や川の近くで強い揺れを感じた！','海 川',['海岸・川から離れ高い場所へ避難する','津波避難場所・高台を目指す','警報解除まで戻らない'],['海を見に行く','荷物を取りに戻る'],'津波は繰り返し来ることがあります。避難場所を平時に確認しましょう。']]],typhoon:[['暴風が強くなってきた！','風 台風',['屋内に入り窓から離れる','カーテン等を閉める','公式情報を確認する'],['外へ様子を見に行く','暴風中に屋外の物を片づける'],'接近前に飛ばされる物を片づけ、充電や停電対策を済ませましょう。']]],land:[['大雨で崖や斜面が心配！','崖 土砂',['避難情報を確認する','崖や沢から離れる','危険が迫る前に安全な場所へ移動する'],['崖の様子を見に行く','危険区域に留まる'],'ハザードマップで土砂災害警戒区域と避難先を確認しましょう。']]],flood:[['道路や周囲が浸水してきた！','洪水 浸水',['川や用水路から離れる','早めに安全な場所へ避難する','屋外避難が危険なら建物の高い場所へ移動する'],['冠水した道を無理に進む','川を見に行く'],'自宅の浸水リスクと避難先をハザードマップで確認しましょう。']]],surge:[['台風で海面上昇が心配！','高潮 海',['海岸から離れる','避難情報に従い早めに避難する','高い安全な場所へ移動する'],['海岸へ確認に行く','警報中に戻る'],'沿岸部では高潮ハザードマップや避難場所を平時に確認しましょう。']]],snow:[['大雪で外出・車移動が危険！','雪 車',['不要不急の外出を控える','最新の気象・道路情報を確認する','立ち往生時はマフラー周辺の雪を除く'],['無理に車で出かける','排気口を雪で塞いだままエンジンをかけ続ける'],'食料・水・暖房・停電対策を雪の前に確認しましょう。']]],fire:[['家や建物で火・煙に気づいた！','煙 119',['周囲に火事を知らせる','安全な場所から119番する','危険なら消火より避難を優先する'],['煙の中へ戻る','荷物を取りに戻る'],'住宅用火災警報器や消火器、避難経路を平時に確認しましょう。']]],volcano:[['噴火・噴火警報を知った！','噴火 火山',['気象庁や自治体の情報を確認する','立入規制や避難指示に従う','噴石や火山灰から身を守る'],['規制区域へ入る','噴火の様子を見に行く'],'登山や火山周辺への外出前は噴火警戒レベルや避難場所を確認しましょう。']]};const KEY='sonayell_disaster_v23';let st={checked:{},awarded:{}};try{st={...st,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let mode='em',cur=null,curScene=null;function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function save(){localStorage.setItem(KEY,JSON.stringify(st))}function saveApp(s){localStorage.setItem('sonayell_v2',JSON.stringify(s))}function renderY(){document.getElementById('yell').textContent=Number(app().yell)||0}function setMode(m){mode=m;document.getElementById('emBtn').classList.toggle('active',m==='em');document.getElementById('learnBtn').classList.toggle('active',m==='learn')}function renderGrid(){let q=document.getElementById('q').value.trim().toLowerCase(),g=document.getElementById('grid');g.innerHTML='';disasters.forEach(d=>{let hay=(d[2]+' '+(data[d[0]]||[]).flat(2).join(' ')).toLowerCase();if(q&&!hay.includes(q))return;let b=document.createElement('button');b.className='card';b.innerHTML='<span>'+d[1]+'</span>'+d[2];b.onclick=()=>openDis(d[0]);g.appendChild(b)})}function openDis(id){cur=id;document.getElementById('menu').classList.add('hide');document.getElementById('scene').classList.add('show');let d=disasters.find(x=>x[0]===id);document.getElementById('disTitle').textContent=d[1]+' '+d[2];document.getElementById('sq').value='';renderScenes();scrollTo(0,0)}function renderProgress(){let a=data[cur]||[],n=a.filter((_,i)=>st.checked[cur+'-'+i]).length;document.getElementById('progress').innerHTML='<b>学習の進み具合　'+n+' / '+a.length+'</b><div class="bar"><span style="width:'+(a.length?n/a.length*100:0)+'%"></span></div>'}function renderScenes(){renderProgress();let q=document.getElementById('sq').value.trim().toLowerCase(),box=document.getElementById('scenes');box.innerHTML='';(data[cur]||[]).forEach((x,i)=>{let hay=x.flat(2).join(' ').toLowerCase();if(q&&!hay.includes(q))return;let b=document.createElement('button');b.className='sceneBtn';b.innerHTML=(st.checked[cur+'-'+i]?'✅ ':'')+x[0]+' ›<small>'+x[1]+'</small>';b.onclick=()=>openScene(i);box.appendChild(b)})}function openScene(i){curScene=i;document.getElementById('scene').classList.remove('show');document.getElementById('detail').classList.add('show');let x=data[cur][i];document.getElementById('sceneTitle').textContent=x[0];setDetailMode(mode);scrollTo(0,0)}function setDetailMode(m){mode=m;document.getElementById('dem').classList.toggle('active',m==='em');document.getElementById('dlearn').classList.toggle('active',m==='learn');renderDetail()}function renderDetail(){let x=data[cur][curScene],u=document.getElementById('urgent'),l=document.getElementById('learning');if(mode==='em'){u.innerHTML='<div class="urgent"><b>🚨 今の状況</b><div class="row">'+x[0]+'</div></div><div class="do"><b>✅ するべきこと</b>'+x[2].map(v=>'<div class="row">☑ '+v+'</div>').join('')+'</div><div class="dont"><b>❌ やってはいけないこと</b>'+x[3].map(v=>'<div class="row">✕ '+v+'</div>').join('')+'</div><button class="more" onclick="setDetailMode(\'learn\')">もっと詳しく学ぶ（平時モードへ）⌄</button>';l.innerHTML=''}else{u.innerHTML='';let done=!!st.checked[cur+'-'+curScene];l.innerHTML='<div class="learnbox"><h3>🌿 なぜこうするの？</h3><p>'+x[4]+'</p><h3>その後どうする？</h3><p>安全な場所へ移動し、周囲の状況を確認しながら、気象庁・内閣府・消防庁・自治体などの公式情報を確認しましょう。</p><h3>豆知識</h3><p>同じ災害でも、いる場所や周囲の状況で取るべき行動は変わります。平時に自分の生活場面へ置き換えて考えておくことが大切です。</p></div><button class="check '+(done?'done':'')+'" onclick="learnCheck()">'+(done?'✓ 確認しました':'○ 確認しました')+'</button>'}}function leaves(){for(let i=0;i<28;i++){let e=document.createElement('span');e.className='leaf';e.textContent='🍃';e.style.left=Math.random()*96+'vw';e.style.animationDelay=Math.random()*.7+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3300)}}function learnCheck(){let k=cur+'-'+curScene;if(st.checked[k])return;st.checked[k]=true;save();let s=app();s.yell=(Number(s.yell)||0)+1;s.leaves=(Number(s.leaves)||0)+1;s.tree_growth=(Number(s.tree_growth)||0)+1;saveApp(s);renderY();leaves();renderDetail();checkComplete()}function checkComplete(){let a=data[cur]||[];if(!a.length||!a.every((_,i)=>st.checked[cur+'-'+i])||st.awarded[cur])return;st.awarded[cur]=true;save();let s=app();s.yell=(Number(s.yell)||0)+10;s.leaves=(Number(s.leaves)||0)+10;s.tree_growth=(Number(s.tree_growth)||0)+10;saveApp(s);renderY();leaves();let d=disasters.find(x=>x[0]===cur);document.getElementById('detail').classList.remove('show');document.getElementById('complete').classList.add('show');document.getElementById('completeText').textContent=d[2]+'の防災アクションをすべて学びました！'}function back(){if(document.getElementById('complete').classList.contains('show')){document.getElementById('complete').classList.remove('show');openDis(cur)}else if(document.getElementById('detail').classList.contains('show')){document.getElementById('detail').classList.remove('show');document.getElementById('scene').classList.add('show');renderScenes()}else if(document.getElementById('scene').classList.contains('show')){document.getElementById('scene').classList.remove('show');document.getElementById('menu').classList.remove('hide')}else location.href='./home.html?v=23'}renderY();renderGrid();</script></body></html>
