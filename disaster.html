<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>災害別 防災アクション｜そなYELL</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f5faef;color:#36563b}.top{position:sticky;top:0;z-index:5;background:#fff;padding:12px;border-bottom:1px solid #dce9d7;display:flex;align-items:center}.back{border:1px solid #cce2c4;background:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;color:#23833e}.top b{margin-left:10px;font-size:19px;color:#087d45}.wrap{max-width:650px;margin:auto;padding:18px 14px 35px}.hero{background:linear-gradient(135deg,#dff4d4,#fff2b7);border-radius:22px;padding:18px}.hero h1{margin:0 0 7px;font-size:23px}.hero p{margin:0;line-height:1.7;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.card{border:0;background:#fff;border-radius:20px;padding:16px 12px;text-align:left;min-height:135px;box-shadow:0 3px 12px #234a2914}.ico{font-size:38px}.card strong{display:block;font-size:17px;color:#087d45;margin-top:5px}.card small{display:block;margin-top:5px;line-height:1.5;color:#6f7a6e}.detail{display:none}.detail.show{display:block}.hide{display:none!important}.title{text-align:center;font-size:22px;color:#087d45;margin:4px 0 14px}.action{background:#fff;border-radius:17px;margin:9px 0;padding:14px;border-left:6px solid #58ad61}.action strong{display:block;font-size:15px}.action p{font-size:12px;line-height:1.6;margin:5px 0 0;color:#687267}.now{background:#fff3bd;border-left-color:#e6a72c}.note{background:#e8f6e4;border-radius:17px;padding:13px;margin-top:13px;font-size:12px;line-height:1.7}.btn{width:100%;border:0;background:#259d50;color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:16px;margin-top:14px}@media(max-width:430px){.grid{grid-template-columns:1fr}.card{min-height:110px}}</style></head><body><header class="top"><button class="back" onclick="back()">←</button><b>📖 災害別 防災アクション</b></header><main class="wrap"><section id="hero" class="hero"><h1>「あれっ、どうする？」を少しずつ知ろう。</h1><p>災害によって、とるべき行動は変わります。<br>気になる災害を選んで、いざという時の動きを確認しよう。</p></section><section id="grid" class="grid"></section><section id="detail" class="detail"><h1 id="title" class="title"></h1><div id="actions"></div><div class="note">🌱 一度に全部覚えなくて大丈夫。まずは「最初に何をするか」を家族で共有しておこう。</div><button class="btn" onclick="showGrid()">災害一覧へ戻る</button></section></main><script>const ds=[['earth','🫨','地震','揺れを感じたらどうする？',[['今すぐ','まず身の安全を確保。頭を守り、倒れそうな家具や窓から離れる。'],['揺れがおさまったら','火元を確認し、出口を確保。慌てて外へ飛び出さない。'],['避難するとき','ブレーカーや火元を確認し、落下物やブロック塀に注意する。']]],['rain','🌧️','大雨・洪水','雨が強くなる前に',[['早めに','気象情報と避難情報を確認。川や用水路を見に行かない。'],['危険が近いとき','浸水する前に安全な場所へ。夜間になる前の避難を意識する。'],['逃げ遅れたら','無理に屋外へ出ず、建物のより高い階など安全な場所へ移動する。']]],['typhoon','🌀','台風・暴風','風が強くなる前に',[['接近前','飛ばされそうな物を屋内へ。雨戸・窓・充電・停電対策を確認する。'],['暴風中','外へ出ない。窓から離れ、カーテンを閉めて安全な部屋で過ごす。'],['通過後','切れた電線や倒木に近づかず、周囲の安全を確認する。']]],['fire','🔥','火災','火や煙に気づいたら',[['最初に','大声で周囲に知らせ、119番通報。危険なら消火より避難を優先する。'],['煙があるとき','姿勢を低くし、煙を吸わないよう口元を覆って逃げる。'],['避難したら','絶対に建物へ戻らない。消防の指示に従う。']]],['snow','❄️','大雪','雪がひどくなる前に',[['事前に','食料・水・暖房・停電対策を確認。不要不急の外出を控える。'],['外出時','路面凍結や屋根からの落雪に注意。無理な車移動を避ける。'],['車で立ち往生','マフラー周辺の雪を除き、一酸化炭素中毒に注意する。']]],['land','⛰️','土砂災害','崖や斜面が心配なとき',[['雨の前から','ハザードマップで危険区域と避難先を確認する。'],['前兆に気づいたら','地鳴り、湧き水の変化、崖の亀裂などを感じたらすぐ離れる。'],['避難','崖や沢から離れる方向へ。危険が迫る前に早めに避難する。']]],['heat','☀️','猛暑・熱中症','暑さが危険なとき',[['日頃から','水分・塩分を取り、室温を確認してエアコンを我慢しない。'],['体調変化','めまい・頭痛・吐き気などがあれば涼しい場所へ移動し体を冷やす。'],['重い症状','意識がおかしい、自力で水が飲めない場合は救急要請を考える。']]],['tsunami','🌊','津波','強い揺れ・警報があったら',[['すぐに','海岸や川の近くでは、情報を待ちすぎず高い場所へ避難する。'],['避難中','車に頼りすぎず、可能なら徒歩で高台や津波避難場所へ。'],['避難後','警報・注意報が解除されるまで海や川へ戻らない。']]]];let cur=null;const grid=document.getElementById('grid');function render(){grid.innerHTML='';ds.forEach(d=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="ico">'+d[1]+'</span><strong>'+d[2]+'</strong><small>'+d[3]+'</small>';b.onclick=()=>openD(d[0]);grid.appendChild(b)})}function openD(id){cur=ds.find(x=>x[0]===id);document.getElementById('hero').classList.add('hide');grid.classList.add('hide');document.getElementById('detail').classList.add('show');document.getElementById('title').textContent=cur[1]+' '+cur[2];let a=document.getElementById('actions');a.innerHTML='';cur[4].forEach((x,i)=>{let e=document.createElement('div');e.className='action '+(i===0?'now':'');e.innerHTML='<strong>'+x[0]+'</strong><p>'+x[1]+'</p>';a.appendChild(e)});scrollTo(0,0)}function showGrid(){cur=null;document.getElementById('detail').classList.remove('show');document.getElementById('hero').classList.remove('hide');grid.classList.remove('hide');scrollTo(0,0)}function back(){if(cur)showGrid();else location.href='./home.html?v=21'}render();</script></body></html>
