<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>そなYELL ホーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#dff7ef;font-family:"Yu Gothic",Meiryo,sans-serif}.stage{width:min(100vw,430px);margin:auto;position:relative;overflow:hidden;background:#dff7ef;min-height:100vh}.approved{display:block;width:100%;height:auto;image-rendering:auto}.hot{position:absolute;border:0;background:transparent;padding:0;z-index:10;cursor:pointer}.hot:active{background:rgba(255,255,255,.16);border-radius:18px}.profile-hot:active{border-radius:50%}.load{min-height:100vh;padding:45px 20px;text-align:center;color:#39724b;font-weight:800}</style></head><body><main class="stage" id="stage"><div class="load" id="load">そなYELLホームを準備中…🌱</div><img id="approved" class="approved" alt="そなYELL ホーム"><button class="hot profile-hot" data-go="./enter.html?target=profileScreen&v=31" style="left:2.0%;top:4.4%;width:12.8%;height:7.1%" aria-label="マイページ"></button><button class="hot" data-go="tree.html?v=30" style="left:2.5%;top:43.0%;width:95%;height:10.1%" aria-label="私のYELLの木"></button><button class="hot" data-go="posts.html?v=30" style="left:2.5%;top:53.1%;width:95%;height:12.4%" aria-label="みんなの防災投稿"></button><button class="hot" data-go="quiz-2026-08-v4.html?v=8" style="left:2%;top:65.8%;width:96%;height:14.0%" aria-label="8月の防災クイズ"></button><button class="hot" data-go="prepare.html?v=24" style="left:2.5%;top:80.4%;width:95%;height:10.2%" aria-label="我が家の備えチェック"></button><button class="hot" data-go="disaster-v26.html?v=27" style="left:2.5%;top:90.8%;width:95%;height:8.9%" aria-label="災害別防災アクション"></button></main><script>const parts=['assets/home-approved-b64-1.txt','assets/home-approved-b64-2.txt','assets/home-approved-b64-3.txt'];Promise.all(parts.map(p=>fetch(p+'?v=3').then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(xs=>{const img=document.getElementById('approved');img.src='data:image/webp;base64,'+xs.join('').replace(/\s/g,'');img.onload=()=>{const l=document.getElementById('load');if(l)l.remove()}}).catch(()=>{const l=document.getElementById('load');l.textContent='ホーム画像を読み込めませんでした。再読み込みしてね。'});document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>location.href=b.dataset.go));</script></body></html>
