="マイページ">👤</button><div class="brandPlate"><div class="brand">そなYELL</div></div><button class="round bell" id="bell" aria-label="お知らせ">🔔<i class="dot"></i></button></header><section class="hero"><div class="sign"><div class="head">🌿 今日のひとこと 🌿</div><div class="msg">小さな備えが、<br>あなたと大切な人の<br>未来を守ります。<br>できることから、<br>一緒に始めよう！</div><i class="leg l"></i><i class="leg r"></i></div><div class="sonaArea"><div class="sonaNatural"><img id="sona" alt="そなピー"></div></div></section><section class="imakoko"><div class="imakokoTop"><span>📍</span><span class="iktitle">イマココ</span><span class="iksub">地域の情報をやり取りできる入口を準備しています</span><span class="pending">準備中</span></div><div class="ikmini"><span>🛒<br>スーパー</span><span>⛽<br>ガソリンスタンド</span><span>🏠<br>避難所</span><span>💬<br>掲示板</span></div></section><section class="cards"><button class="card" onclick="location.href='tree.html?v=49'"><span class="ico">🌳</span><span class="copy"><b>私のYELLの木</b><small>小さなYELLを重ねて、木を育てよう！</small></span><span class="go">›</span></button><button class="card posts" onclick="location.href='posts.html?v=49'"><span class="ico">📣</span><span class="copy"><b>みんなの防災投稿</b><small>あなたの工夫や備えをシェアしよう！</small></span><span class="go">›</span></button><button class="card quiz" onclick="location.href='quiz-2026-08-v4.html?v=49'"><span class="ico">🎓</span><span class="copy"><span class="badges"><i class="tag new">NEW</i><i class="tag">今月のテーマ</i></span><b>8月の防災クイズ</b><small>「台風・豪雨・雷」防災について楽しく学ぼう‼️</small></span><span class="count"><span id="quizDone">0</span>/10問</span></button><button class="card prepare" onclick="location.href='prepare-enhanced.html?v=49'"><span class="ico">📋</span><span class="copy"><b>我が家の備えチェック</b><small>ひとつずつチェックして、わが家の安心を育てよう！</small></span><span class="go">›</span></button><button class="card disaster" onclick="location.href='disaster-enhanced.html?v=49'"><span class="ico">📘</span><span class="copy"><b>災害別!! 防災アクション</b><small>災害の知識と、いざという時の行動を学ぼう！</small></span><span class="go">›</span></button></section><div class="footer"></div></main><script>async function loadSona(){try{const b64=(await fetch('assets/sonapi-official-b64.txt?v=1').then(r=>r.text())).trim();const src='data:image/webp;base64,'+b64;const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data,w=c.width,h=c.height,seen=new Uint8Array(w*h),q=new Int32Array(w*h),isBg=i=>{const k=i*4,r=p[k],g=p[k+1],b=p[k+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);return r>218&&g>218&&b>218&&(mx-mn)<34};let a=0,z=0;function push(i){if(i>=0&&i<w*h&&!seen[i]&&isBg(i)){seen[i]=1;q[z++]=i}}for(let xx=0;xx<w;xx++){push(xx);push((h-1)*w+xx)}for(let yy=0;yy<h;yy++){push(yy*w);push(yy*w+w-1)}while(a<z){const i=q[a++],yy=(i/w)|0,xx=i-yy*w;p[i*4+3]=0;if(xx>0)push(i-1);if(xx<w-1)push(i+1);if(yy>0)push(i-w);if(yy<h-1)push(i+w)}x.putImageData(d,0,0);document.getElementById('sona').src=c.toDataURL('image/png')}catch(e){document.getElementById('sona').src=src}};im.onerror=()=>{};im.src=src}catch(e){}}loadSona();try{const q=JSON.parse(localStorage.getItem('sonayell_quiz_2026_08_v5')||'{}');document.getElementById('quizDone').textContent=Object.keys(q.rewarded||{}).length}catch(e){}document.getElementById('bell').onclick=()=>alert('🔔 お知らせ機能は準備中だよ。')</script></body></html>
