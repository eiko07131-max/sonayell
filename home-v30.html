go="posts.html?v=30" style="left:2.5%;top:50.1%;width:95%;height:10.9%" aria-label="みんなの防災投稿"></button><button class="hot" data-go="quiz-2026-08-v4.html?v=8" style="left:2%;top:61.7%;width:96%;height:12.9%" aria-label="8月の防災クイズ"></button><button class="hot" data-go="prepare.html?v=24" style="left:2.5%;top:75.4%;width:95%;height:8.8%" aria-label="我が家の備えチェック"></button><button class="hot" data-go="disaster-v26.html?v=27" style="left:2.5%;top:85.1%;width:95%;height:8.1%" aria-label="災害別防災アクション"></button></main><script>const parts=['assets/home-approved-b64-1.txt','assets/home-approved-b64-2.txt','assets/home-approved-b64-3.txt'];Promise.all(parts.map(p=>fetch(p+'?v=2').then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(xs=>{let b64=xs.join('').replace(/\s/g,'');const img=document.getElementById('approved');img.src='data:image/webp;base64,'+b64;img.onload=()=>{const l=document.getElementById('load');if(l)l.remove()}}).catch(()=>{document.getElementById('load').textContent='ホーム画像を読み込めませんでした。再読み込みしてね。'});document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>location.href=b.dataset.go));</script></body></html>
