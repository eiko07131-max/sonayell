<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c9f2ff"><title>そなYELL ホーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#174d31;background:#dff7e8}button{font:inherit}.app{width:min(100%,430px);min-height:100vh;margin:auto;overflow:hidden;padding:0 12px 34px;background:linear-gradient(180deg,#c9f3ff 0 34%,#f0fbd7 54%,#e0f2b8 100%);position:relative}.topVisual{position:relative;z-index:3;margin:0 -12px 8px;background:#c9f3ff;aspect-ratio:430/328;overflow:hidden}.topVisual img{display:block;width:100%;height:100%;object-fit:cover}.topLoading{position:absolute;inset:0;display:grid;place-items:center;color:#4e8b5d;font-weight:800;font-size:14px;background:linear-gradient(#c9f3ff,#eefbd0)}.hotspot{position:absolute;border:0;padding:0;cursor:pointer;z-index:8}.profileHot{left:3.4%;top:4.1%;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:27px;color:#174d31;box-shadow:0 2px 8px rgba(25,80,46,.18);overflow:hidden}.profileHot img{width:100%;height:100%;object-fit:cover;border-radius:50%}.bellHot{right:1.5%;top:1.5%;width:17%;height:20%;background:transparent}.imakoko{margin:8px 0 11px;padding:9px 10px 10px;border-radius:17px;border:1px solid #d8e6cf;background:#ffffffd8;box-shadow:0 4px 10px #234b2c10;position:relative;z-index:3}.imakokoTop{display:flex;align-items:center;gap:7px;margin-bottom:7px}.iktitle{font-size:13px;font-weight:900;color:#6e816f}.pending{margin-left:auto;font-size:9px;font-weight:900;color:#89958a;background:#f1f5ee;border-radius:999px;padding:4px 7px}.iksub{font-size:9.5px;color:#7f8f82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.ikmini{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.ikmini span{font-size:8px;line-height:1.25;text-align:center;padding:6px 2px;background:#fbfcf5;border:1px solid #e3e7d8;border-radius:10px}.cards{display:grid;gap:9px;position:relative;z-index:2}.card{width:100%;min-height:82px;border:1px solid #d9e5ce;border-radius:20px;padding:11px 14px;background:#fff;box-shadow:0 6px 14px #24582d1c;display:flex;align-items:center;gap:12px;text-align:left;color:#174d31;cursor:pointer;transition:.13s}.card:active{transform:scale(.986)}.ico{width:52px;height:52px;flex:0 0 52px;border-radius:17px;background:#eff9e8;display:grid;place-items:center;font-size:31px}.copy{flex:1;min-width:0}.copy b{display:block;font-size:17px;margin-bottom:4px}.copy small{display:block;color:#66766c;font-size:10.5px;line-height:1.4}.go{font-size:27px;font-weight:900;color:#16854a}.posts{background:#fff4fb}.posts .ico{background:#ffe6f1}.posts b,.posts .go{color:#b52970}.quiz{min-height:103px;background:linear-gradient(135deg,#fffbe4,#effbd8);border:2px solid #86bf5e}.quiz .ico{background:#fff4c9}.quiz b{color:#177a3f}.badges{display:flex;gap:4px;margin-bottom:3px}.tag{font-style:normal;font-size:8.5px;border-radius:999px;padding:3px 7px;background:#13974a;color:#fff;font-weight:900}.new{background:#ff523b}.count{background:#fff;border:1.5px solid #8bc468;border-radius:999px;padding:7px 8px;font-size:11px;font-weight:900;white-space:nowrap}.prepare{background:#fffaf0}.prepare b,.prepare .go{color:#b86612}.disaster{background:#eef8ff}.disaster b,.disaster .go{color:#126baa}.footer{height:66px;margin:15px -12px -34px;background:linear-gradient(#e6f7b9,#cee99d);position:relative}.footer:before{content:"🌳　🌱　🌳　🌱　🌳";position:absolute;left:0;right:0;top:18px;text-align:center;opacity:.55;font-size:13px}@media(max-width:390px){.card{padding:10px;gap:9px}.copy b{font-size:15px}.copy small{font-size:9.5px}.ikmini span{font-size:7.5px}.profileHot{width:44px;height:44px;font-size:25px}}</style></head><body><main class="app"><section class="topVisual"><div class="topLoading" id="topLoading">そなYELLを表示中…🌱</div><img id="topArt" alt="そなYELL 今日のひとこととそなピー" hidden><button class="hotspot profileHot" id="profileHot" onclick="location.href='./profile.html?v=83'" aria-label="マイページ"><span id="profileAvatar">👤</span></button><button class="hotspot bellHot" id="bell" aria-label="お知らせ"></button></section><section class="imakoko"><div class="imakokoTop"><span>📍</span><span class="iktitle">イマココ</span><span class="iksub">災害時、地域のコミュニティの入口になるよ</span><span class="pending">準備中</span></div><div class="ikmini"><span>🛒<br>スーパー</span><span>⛽<br>ガソリンスタンド</span><span>🏠<br>避難所</span><span>💬<br>掲示板</span></div></section><section class="cards"><button class="card" onclick="location.href='tree.html?v=83'"><span class="ico">🌳</span><span class="copy"><b>私のYELLの木</b><small>小さなYELLを重ねて、木を育てよう！</small></span><span class="go">›</span></button><button class="card posts" onclick="location.href='posts.html?v=83'"><span class="ico">📣</span><span class="copy"><b>みんなの防災投稿</b><small>あなたの工夫や備えをシェアしよう！</small></span><span class="go">›</span></button><button class="card quiz" onclick="location.href='quiz-2026-08-v4.html?v=83'"><span class="ico">🎓</span><span class="copy"><span class="badges"><i class="tag new">NEW</i><i class="tag">今月のテーマ</i></span><b>8月の防災クイズ</b><small>「台風・豪雨・雷」防災について楽しく学ぼう‼️</small></span><span class="count"><span id="quizDone">0</span>/10問</span></button><button class="card prepare" onclick="location.href='prepare-enhanced.html?v=83'"><span class="ico">📋</span><span class="copy"><b>我が家の備えチェック</b><small>ひとつずつチェックして、わが家の安心を育てよう！</small></span><span class="go">›</span></button><button class="card disaster" onclick="location.href='disaster-enhanced.html?v=83'"><span class="ico">📘</span><span class="copy"><b>災害別!! 防災アクション</b><small>災害の知識と、いざという時の行動を学ぼう！</small></span><span class="go">›</span></button></section><div class="footer"></div></main><script>async function loadApprovedTop(){try{const urls=[0,1,2,3].map(i=>`assets/v62c${i}.txt?v=83`);const parts=[];for(const u of urls){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+': '+r.status);const t=(await r.text()).replace(/\s+/g,'');if(!t)throw new Error(u+': empty');parts.push(t)}const src='data:image/webp;base64,'+parts.join('');const img=document.getElementById('topArt');img.onload=()=>{img.hidden=false;document.getElementById('topLoading').style.display='none'};img.onerror=()=>{document.getElementById('topLoading').textContent='画像の読み込みに失敗しました'};img.src=src}catch(e){document.getElementById('topLoading').textContent='画像の読み込みに失敗しました'}}async function loadProfileAvatar(){const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',token=localStorage.getItem('sonayell_access_token')||'',guest=localStorage.getItem('sonayell_guest_token')||'';let avatar='👤';try{let name,body;if(token){name='sona_get_my_account';body={}}else if(guest){name='sona_get_guest_profile';body={p_guest_token:guest}}else{throw new Error('no profile')}const h={apikey:K,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:h,body:JSON.stringify(body),cache:'no-store'});if(!r.ok)throw new Error(await r.text());const rows=await r.json();if(rows&&rows[0])avatar=rows[0].avatar_key||rows[0].avatar||'👤'}catch(e){try{avatar=localStorage.getItem('sonayell_profile_avatar')||'👤'}catch(_){}}const box=document.getElementById('profileHot'),span=document.getElementById('profileAvatar');if(/^https?:|^data:image\//.test(avatar)){span.remove();const im=document.createElement('img');im.src=avatar;im.alt='プロフィール';box.appendChild(im)}else{span.textContent=avatar}try{localStorage.setItem('sonayell_profile_avatar',avatar)}catch(e){}}loadApprovedTop();loadProfileAvatar();try{const q=JSON.parse(localStorage.getItem('sonayell_quiz_2026_08_v5')||'{}');document.getElementById('quizDone').textContent=Object.keys(q.rewarded||{}).length}catch(e){}document.getElementById('bell').onclick=()=>alert('🔔 お知らせ機能は準備中だよ。');addEventListener('pageshow',loadProfileAvatar)</script></body></html>
