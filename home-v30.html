px;text-align:center;color:#39724b;font-weight:800}.err{padding:20px;color:#a33;background:#fff0f0}</style></head><body><main class="stage" id="stage"><div class="load" id="load">そなYELLホームを準備中…🌱</div><img id="approved" class="approved" alt="そなYELL ホーム"><button id="profile" class="profile" aria-label="マイページ">👤</button><button class="hot" data-go="tree.html?v=30" style="left:4.5%;top:34.0%;width:91%;height:10.5%" aria-label="私のYELLの木"></button><div class="patch postsPatch"><span class="emoji">📣</span><span><b>みんなの防災投稿</b><small>あなたの工夫や備えをシェアしよう！</small></span><span style="margin-left:auto;font-size:26px">›</span></div><button class="hot" data-go="posts.html?v=30" style="left:4.5%;top:46.0%;width:91%;height:10.8%;z-index:7" aria-label="みんなの防災投稿"></button><div class="patch quizPatch"><span class="emoji">🎓🌱</span><span><span class="badge">NEW　今月のテーマ</span><b>8月の防災クイズ</b><small>「台風・豪雨・雷」防災について楽しく学ぼう‼️</small></span><span class="quizMeta"><span id="quizDone">0</span>/10問<br>挑戦！</span></div><button class="hot" data-go="quiz-2026-08-v4.html?v=8" style="left:4.5%;top:57.7%;width:91%;height:9.5%;z-index:7" aria-label="8月の防災クイズ"></button><button class="hot" data-go="prepare.html?v=24" style="left:4.5%;top:68.4%;width:91%;height:10.5%" aria-label="我が家の備えチェック"></button><button class="hot" data-go="disaster-v26.html?v=27" style="left:4.5%;top:80.0%;width:91%;height:10.5%" aria-label="災害別防災アクション"></button><div class="coverBottom"></div></main><script>const parts=['assets/home-approved-b64-1.txt','assets/home-approved-b64-2.txt','assets/home-approved-b64-3.txt'];Promise.all(parts.map(p=>fetch(p+'?v=1').then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(xs=>{const img=document.getElementById('approved');img.src='data:image/webp;base64,'+xs.join('').replace(/\s/g,'');img.onload=()=>document.getElementById('load').remove()}).catch(()=>{document.getElementById('load').className='err';document.getElementById('load').textContent='ホーム画像を読み込めませんでした。再読み込みしてね。'});document.querySele
