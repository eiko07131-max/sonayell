ck}.note{text-align:center;margin-top:12px;font-size:10px;color:#758077}.dev{display:inline-block;background:#164f31;color:#fff;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}</style></head><body><main class="stage"><section class="card"><button class="back" onclick="history.back()">← 戻る</button><div class="brand"><img id="sona" alt="そなピー"><div><span class="dev">開発版</span><h1>そなYELL</h1><p>登録・ログインしてホームへ進みます。</p></div></div><button id="guest" class="guest">🌱 ゲストで続ける</button><div class="or">またはメールアドレスで</div><div class="tabs"><button id="signupTab" class="tab on">新規登録</button><button id="loginTab" class="tab">ログイン</button></div><label class="label">メールアドレス</label><input id="email" class="field" type="email" autocomplete="email"><label class="label">パスワード</label><input id="password" class="field" type="password" minlength="6" autocomplete="current-password" placeholder="6文字以上"><button id="submit" class="submit">登録する</button><div id="msg" class="msg"></div><div class="note">※この画面は友達に渡している試作版とは別の開発版です。</div></section></main><script>fetch('./assets/sonapi-official-b64.txt?v=1',{cache:'no-store'}).then(r=>r.text()).then(b=>sona.src='data:image/webp;base64,'+b.trim()).catch(()=>{});const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',$=id=>document.getElementById(id);let mode='signup';function setMode(m){mode=m;$('signupTab').classList.toggle('on',m==='signup');$('loginTab').classList.toggle('on',m==='login');$('submit').textContent=m==='signup'?'登録する':'ログインする'}function msg(t,err=false){$('msg').textContent=t;$('msg').className='msg on';$('msg').style.color=err?'#9b2c2c':'#215c35'}$('signupTab').onclick=()=>setMode('signup');$('loginTab').onclick=()=>setMode('login');$('guest').onclick=()=>{localStorage.setItem('sonayell_trial_mode','1');if(!localStorage.getItem('sonayell_guest_token'))localStorage.setItem('sonayell_guest_token',crypto.randomUUID());location.replace('./dev-app.html?v=1')};$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){msg('メールアドレスと6文字以上のパスワードを入力してね',true);return}$('submit').disabled=true;try{const path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'処理できませんでした');if(d.access_token){localStorage.setItem('sonayell_access_token',d.access_token);if(d.refresh_token)localStorage.setItem('sonayell_refresh_token',d.refresh_token);localStorage.setItem('sonayell_registered','1');location.replace('./dev-app.html?v=1')}else msg('確認メールを送りました。メールを確認してね')}catch(e){msg('処理できませんでした：'+e.message,true)}finally{$('submit').disabled=false}};const q=new URLSearchParams(location.search);if(q.get('mode')==='guest'){$('guest').style.boxShadow='0 0 0 4px #d9f3d8';$('guest').scrollIntoView({block:'center'})}setMode(q.get('mode')==='login'?'login':'signup');</script></body></html>
