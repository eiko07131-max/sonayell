<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="そなYELL"><link rel="manifest" href="./manifest.json"><title>そなYELL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faef}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="appFrame" src="./index.html" title="そなYELL"></iframe><script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});}const frame=document.getElementById('appFrame');frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;
d.querySelectorAll('#homePosts').forEach(x=>x.remove());d.querySelectorAll('#homeScreen .homeCard').forEach(x=>{if((x.textContent||'').includes('みんなの防災投稿'))x.remove();});
const style=d.createElement('style');style.textContent=`#postsScreen,#hallScreen{display:none;min-height:100vh;flex-direction:column;background:#f5faef}#postsScreen.active,#hallScreen.active{display:flex}#homePostBars{margin:15px 0!important;display:grid!important;gap:10px!important;position:static!important;width:100%!important;height:auto!important;min-height:0!important;overflow:visible!important;background:transparent!important;border:0!important;padding:0!important;box-shadow:none!important;transform:none!important}#homePostBars .homePostBar{position:static!important;display:block!important;width:100%!important;height:auto!important;min-height:0!important;box-sizing:border-box!important;padding:16px 18px!important;border-radius:18px!important;background:#fff!important;color:#397a44!important;font-weight:bold!important;font-size:17px!important;text-align:left!important;box-shadow:0 4px 14px rgba(50,90,50,.08)!important;border:2px solid #e1ecd9!important;transform:none!important}#homePostBars .homePostBar.hallBar{background:linear-gradient(135deg,#fff8d8,#fffdf4)!important;border-color:#efd88a!important;color:#7a641f!important}.postCard{background:#fff;border-radius:20px;padding:16px;margin:9px 0;box-shadow:0 3px 12px rgba(50,90,50,.08)}.postMeta{font-size:11px;color:#78907a}.postBody{font-size:14px;line-height:1.7;margin:8px 0 12px;white-space:pre-wrap}.postActions{display:flex;gap:7px}.postActions button{flex:1;padding:10px;border-radius:12px;background:#edf7e9;color:#4b7651;font-weight:bold;font-size:12px}.postForm{background:linear-gradient(135deg,#dff5d8,#fff4b8);border-radius:22px;padding:16px;margin-bottom:14px}.postForm textarea{width:100%;min-height:100px;border:0;border-radius:14px;padding:12px;box-sizing:border-box;resize:vertical;font:inherit;outline:0}.postForm button{width:100%;margin-top:9px;padding:13px;border-radius:14px;background:#4e9956;color:#fff;font-weight:bold}.postEmpty{background:#fff;border-radius:18px;padding:22px;text-align:center;color:#66806a;line-height:1.8}.postBadge{display:inline-block;background:#fff1a6;color:#755c20;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:bold;margin-bottom:7px}.hallHero{background:linear-gradient(135deg,#fff4b8,#fffdf1);border-radius:22px;padding:18px;text-align:center;margin-bottom:14px}.hallHero h2{margin:0 0 6px;color:#7a641f}.hallHero p{margin:0;font-size:12px;line-height:1.7;color:#756a45}`;d.head.appendChild(style);
const homeMain=d.querySelector('#homeScreen .pageContent'),tree=d.getElementById('myTreeCard');if(homeMain&&tree&&!d.getElementById('homePostBars')){const bars=d.createElement('div');bars.id='homePostBars';bars.innerHTML='<button class="homePostBar hallBar" id="openHallBtn">👑 殿堂入り投稿 👑</button><button class="homePostBar" id="openPostsBtn">📣 みんなの投稿！</button>';homeMain.insertBefore(bars,tree);}
let postsScreen=d.getElementById('postsScreen');if(!postsScreen){postsScreen=d.createElement('section');postsScreen.id='postsScreen';postsScreen.className='screen';postsScreen.innerHTML='<header class="header"><div class="headerLogo">📣 みんなの投稿</div><div class="yellBadge">YELL 🌟 <span class="yellCount">0</span></div></header><main class="pageContent"><button class="backButton" id="postsBack">← ホームへ戻る</button><div class="postForm"><span class="postBadge">ゲストでも投稿OK</span><h2 class="pageTitle" style="margin-top:2px">あなたの小さな工夫、誰かの役に立つかも。</h2><textarea id="postText" placeholder="防災でやってみたこと・気づいたことを書いてみよう"></textarea><button id="postSubmit">投稿する</button></div><div id="postList"></div></main>';d.body.appendChild(postsScreen);}let hallScreen=d.getElementById('hallScreen');if(!hallScreen){hallScreen=d.createElement('section');hallScreen.id='hallScreen';hallScreen.className='screen';hallScreen.innerHTML='<header class="header"><div class="headerLogo">👑 殿堂入り投稿 👑</div><div class="yellBadge">YELL 🌟 <span class="yellCount">0</span></div></header><main class="pageContent"><button class="backButton" id="hallBack">← ホームへ戻る</button><div class="hallHero"><h2>👑 殿堂入り投稿 👑</h2><p>「いいね」と「保存」が多い、みんなに役立った投稿をここに集めるよ。</p></div><div id="hallList"></div></main>';d.body.appendChild(hallScreen);}const KEY='sonayell_posts_v1';let posts=[];try{posts=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}posts=posts.map(p=>({name:p.name||'ゲスト',text:p.text||'',date:p.date||'',likes:Number.isFinite(p.likes)?p.likes:(Number(p.yell)||0),saves:Number.isFinite(p.saves)?p.saves:(p.saved?1:0),liked:!!p.liked,saved:!!p.saved}));function savePosts(){localStorage.setItem(KEY,JSON.stringify(posts));}savePosts();function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function postHtml(p,i){return `<article class="postCard"><div class="postMeta">👤 ${esc(p.name)}　${esc(p.date)}</div><div class="postBody">${esc(p.text)}</div><div class="postActions"><button data-like="${i}">👍 いいね ${p.likes||0}${p.liked?' 済':''}</button><button data-save="${i}">🔖 保存 ${p.saves||0}${p.saved?' 済':''}</button></div></article>`;}function bind(box){box.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{const p=posts[+b.dataset.like];if(!p.liked){p.liked=true;p.likes=(p.likes||0)+1;savePosts();renderPosts();renderHall();}});box.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const p=posts[+b.dataset.save];if(p.saved){p.saved=false;p.saves=Math.max(0,(p.saves||0)-1)}else{p.saved=true;p.saves=(p.saves||0)+1}savePosts();renderPosts();renderHall();});}function renderPosts(){const box=d.getElementById('postList');if(!box)return;if(!posts.length){box.innerHTML='<div class="postEmpty">🌱 まだ投稿はないよ。<br>あなたの「今日の一歩」を最初の投稿にしてみよう！</div>';return;}box.innerHTML=posts.map((p,i)=>({p,i})).reverse().map(x=>postHtml(x.p,x.i)).join('');bind(box);}function renderHall(){const box=d.getElementById('hallList');if(!box)return;if(!posts.length){box.innerHTML='<div class="postEmpty">👑 まだ殿堂入り候補はないよ。<br>みんなの役に立つ投稿が増えるのを待とう！</div>';return;}const ranked=posts.map((p,i)=>({p,i,score:(p.likes||0)+(p.saves||0)})).sort((a,b)=>b.score-a.score).slice(0,10);box.innerHTML=ranked.map((x,n)=>`<div class="postBadge">${n===0?'👑 1位':n===1?'🥈 2位':n===2?'🥉 3位':'⭐ '+(n+1)+'位'}</div>${postHtml(x.p,x.i)}`).join('');bind(box);}function openScreen(s){d.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));s.classList.add('active');d.defaultView.scrollTo(0,0);}function syncYell(){let s={};try{s=JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){}d.querySelectorAll('.yellCount').forEach(x=>x.textContent=s.yell||0);}const op=d.getElementById('openPostsBtn'),oh=d.getElementById('openHallBtn');if(op)op.onclick=()=>{renderPosts();syncYell();openScreen(postsScreen)};if(oh)oh.onclick=()=>{renderHall();syncYell();openScreen(hallScreen)};d.getElementById('postsBack').onclick=()=>d.defaultView.showScreen('homeScreen');d.getElementById('hallBack').onclick=()=>d.defaultView.showScreen('homeScreen');d.getElementById('postSubmit').onclick=()=>{const ta=d.getElementById('postText'),text=ta.value.trim();if(!text)return;posts.push({name:'ゲスト',text,date:new Date().toLocaleDateString('ja-JP'),likes:0,saves:0,liked:false,saved:false});savePosts();ta.value='';let s={};try{s=JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){}s.yell=(s.yell||0)+1;localStorage.setItem('sonayell_v2',JSON.stringify(s));if(d.defaultView.leaf)d.defaultView.leaf();if(d.defaultView.update)d.defaultView.update();renderPosts();renderHall();syncYell();alert('🌱 投稿ありがとう！\n＋1 YELL');};renderPosts();renderHall();syncYell();});</script></body></html>
