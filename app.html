let profileScreen=d.getElementById('profileScreen');if(!profileScreen){profileScreen=d.createElement('section');profileScreen.id='profileScreen';profileScreen.className='screen';profileScreen.innerHTML='<header class="header"><div class="headerLogo">👤 マイページ</div><div class="yellBadge">YELL 🌟 <span class="yellCount">0</span></div></header><main class="pageContent"><button class="backButton" id="profileBack">← ホームへ戻る</button><div id="profileSummary" class="profileSummary"><div class="profileAvatarBig" id="profileAvatarBig">🌱</div><div><strong id="profileNameSummary">ゲスト</strong><span id="profileRegionSummary">地域は未登録</span></div></div><div class="profileCard"><h2>わたしのプロフィール</h2><p>投稿に表示するニックネームなどを設定できます。</p><label class="profileLabel">ニックネーム</label><input class="profileInput" id="profileNickname" maxlength="30" placeholder="例：えいこ"><label class="profileLabel">居住地域</label><input class="profileInput" id="profileRegion" maxlength="60" placeholder="例：さいたま市緑区"><p class="privacyNote">🔒 正確な住所や自宅位置は登録しません。市区町村・区くらいまでにしてね。</p><label class="profileLabel">投稿アイコン</label><div class="avatarChoices" id="avatarChoices"><button class="avatarChoice" data-avatar="🌱">🌱</button><button class="avatarChoice" data-avatar="😊">😊</button><button class="avatarChoice" data-avatar="🙂">🙂</button><button class="avatarChoice" data-avatar="😎">😎</button><button class="avatarChoice" data-avatar="🐶">🐶</button><button class="avatarChoice" data-avatar="🌼">🌼</button></div><button class="profileSave" id="profileSave">保存する</button><button class="logoutButton" id="logoutBtn" type="button">🚪 ログアウト</button></div></main>';d.body.appendChild(profileScreen);}

async function rpc(name,body={}){const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(body)});if(res.status===401&&accessToken){accessToken='';localStorage.removeItem('sonayell_access_token');localStorage.removeItem('sonayell_refresh_token');}if(!res.ok)throw new Error(await res.text());const t=await res.text();return t?JSON.parse(t):null;}
