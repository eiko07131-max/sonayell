<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8月の防災クイズ｜そなYELL</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#eaf8ff,#f4ffe9);color:#273b2d}.top{position:sticky;top:0;z-index:5;background:#fff;padding:11px 14px;border-bottom:1px solid #dbe7d5;display:flex;align-items:center}.top button{border:0;background:#eef7e8;border-radius:50%;width:38px;height:38px;font-size:20px}.top b{margin-left:9px;color:#087d45}.yell{margin-left:auto;background:#fff0a8;border-radius:30px;padding:7px 11px;font-weight:900}.wrap{max-width:690px;margin:auto;padding:15px}.hero{background:#fff;border:1px solid #d9e9d0;border-radius:24px;padding:16px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;box-shadow:0 8px 24px #6d9b7a20}.sona{width:102px;height:102px;border-radius:50%;background:#7bc85b;position:relative;margin:auto}.face{position:absolute;inset:16px 13px 12px;background:#fff;border-radius:50%}.eye{position:absolute;width:18px;height:24px;background:#111;border-radius:50%;top:27px}.e1{left:24px}.e2{right:24px}.cheek{position:absolute;width:14px;height:8px;background:#ffc3c3;border-radius:50%;top:55px}.c1{left:14px}.c2{right:14px}.mouth{position:absolute;left:43px;top:53px;color:#ef8b45}.glasses{position:absolute;left:10px;top:20px;width:82px;height:35px;border-top:3px solid #333}.glasses:before,.glasses:after{content:"";position:absolute;width:32px;height:32px;border:3px solid #333;border-radius:50%;top:-5px}.glasses:before{left:0}.glasses:after{right:0}.cap{position:absolute;top:-16px;left:22px;font-size:43px}.sprout{position:absolute;top:-32px;left:37px;font-size:31px}.hero h1{margin:0;color:#157843;font-size:25px}.hero p{margin:6px 0 0;line-height:1.55}.tags{font-size:13px;color:#49705b}.panel{margin-top:14px;background:#fff;border-radius:22px;padding:17px;border:1px solid #dbe8d4}.progress{display:flex;justify-content:space-between;font-weight:900;color:#187d45}.bar{height:10px;background:#e5eee2;border-radius:30px;overflow:hidden;margin:9px 0 15px}.bar span{display:block;height:100%;background:#39a85a}.qno{display:inline-block;background:#2f9c50;color:#fff;border-radius:30px;padding:6px 11px;font-weight:900}.question{font-size:20px;font-weight:900;line-height:1.55;margin:12px 0}.answers{display:grid;gap:9px}.ans{width:100%;padding:13px;border:2px solid #dfe7dc;background:#fff;border-radius:15px;text-align:left;font-weight:800;font-size:15px}.ans.sel{border-color:#2f9c50;background:#eef9ea}.ans.ok{border-color:#e65c66;background:#fff2f2}.ans:disabled{color:#333}.explain{display:none;background:#f4faed;border:1px solid #a8cf99;border-radius:16px;padding:14px;margin-top:14px;line-height:1.65}.explain.show{display:block}.reward{width:100%;border:0;background:#2c9b4c;color:#fff;border-radius:15px;padding:14px;font-weight:900;font-size:16px;margin-top:10px}.reward:disabled{background:#b9c9b8}.nav{display:flex;gap:9px;margin-top:13px}.nav button{flex:1;padding:12px;border-radius:14px;border:1px solid #8eb49a;background:#fff;color:#246d3a;font-weight:900}.donebox{display:none;text-align:center;background:#fff7c8;border:2px solid #efd664;border-radius:20px;padding:18px;margin-top:15px}.donebox.show{display:block}.leaf{position:fixed;top:-30px;font-size:27px;z-index:20;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(480deg);opacity:.1}}@media(max-width:520px){.hero{grid-template-columns:88px 1fr}.sona{width:82px;height:82px;transform:scale(.8);transform-origin:center}.hero h1{font-size:21px}.question{font-size:18px}}</style></head><body><header class="top"><button onclick="location.href='./home.html?v=28'">←</button><b>8月の防災クイズ</b><span class="yell">🌿 <span id="yell">0</span></span></header><main class="wrap"><section class="hero"><div class="sona"><span class="sprout">🌱</span><span class="cap">🎓</span><div class="face"><span class="eye e1"></span><span class="eye e2"></span><span class="cheek c1"></span><span class="cheek c2"></span><span class="mouth">▼</span><span class="glasses"></span></div></div><div><h1>そなピー、クイズ博士にへんしん！</h1><p>よ〜く考えて、いっしょに学ぼう！</p><p class="tags">台風・ゲリラ豪雨・雷・線状降水帯・内水氾濫</p></div></section><section class="panel"><div class="progress"><span>今月の進み具合</span><span id="pc">0 / 10</span></div><div class="bar"><span id="bar" style="width:0%"></span></div><span id="qno" class="qno">第1問 / 全10問</span><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="explain" class="explain"></div><button id="reward" class="reward" disabled>解説を確認して ＋1 YELL</button><div class="nav"><button id="prev">← 前の問題</button><button id="next">次の問題 →</button></div><div id="donebox" class="donebox"><h2>🎉 8月の防災クイズ COMPLETE！</h2><p>10問の解説まで確認したよ！<br><b>最大10YELL獲得 🌿</b></p><button class="reward" onclick="location.href='./home.html?v=28'">ホームへ戻る</button></div></section></main><script>const Q=[{q:'台風が近づき、これから風雨が強まる予報。ベランダの植木鉢や物干し竿を片づけるなら？',a:['風雨が強くなる前','暴風警報が出てから','雨が最も強い時','台風が通過している最中'],c:0,e:'飛ばされそうな物の片づけは、風雨が強まる前の安全なうちに行うことが大切です。'},{q:'突然の激しい雨で道路が冠水。徒歩で移動するとき最も安全な判断は？',a:['水深が分からない冠水路には入らない','長靴なら冠水路を進む','前の人が歩けたら同じ道を進む','水が膝より下なら必ず進む'],c:0,e:'冠水すると側溝やマンホールが見えなくなります。水深や流れが分からない道には入らないのが基本です。'},{q:'屋外で雷鳴が聞こえた。身を守るために適切なのは？',a:['丈夫な建物や自動車の中へ避難する','大きな木のすぐ下へ入る','開けた場所で雨がやむのを待つ','傘だけ閉じてその場にいる'],c:0,e:'雷が近いときは、丈夫な建物や自動車など安全性の高い場所へ速やかに避難します。'},{q:'線状降水帯が発生すると、どんな危険が高まりやすい？',a:['同じ地域で大雨が続き災害危険度が急激に高まる','雨が短時間で必ず完全に止む','海岸だけで大雨になる','強風だけが発生して大雨にはならない'],c:0,e:'発達した雨雲が列をなし、数時間ほぼ同じ場所を通過・停滞して強い雨が続くため、災害危険度が急激に高まることがあります。'},{q:'「内水氾濫」とはどんな現象？',a:['排水しきれない雨水などで市街地が浸水する','海から津波が押し寄せる','川の堤防が決壊した場合だけを指す','強風で屋根が飛ばされる'],c:0,e:'大雨で下水道や排水施設の能力を超えるなどして雨水を排水しきれず、市街地などが浸水する現象です。'},{q:'大雨のとき地下街や地下室にいる。特に大切な行動は？',a:['浸水する前に地上の安全な場所へ移動する','地下の一番低い場所へ移動する','水が入ってから避難方法を考える','エレベーターだけを避難手段にする'],c:0,e:'地下空間は水が流れ込むと避難が難しくなるため、浸水前の早い段階で安全な場所へ移動することが重要です。'},{q:'夜に大雨が強まる予報。避難について基本的に大切なのは？',a:['危険が高まる前に早めに判断する','家の前が浸水するまで待つ','川を見に行ってから決める','必ず深夜になってから避難する'],c:0,e:'暗くなったり道路が冠水したりすると避難が難しくなります。危険が高まる前の早めの判断が重要です。'},{q:'台風のとき川の水位が気になる。最も適切なのは？',a:['公的な河川・防災情報を確認する','橋の上から直接確認する','河原まで行って写真を撮る','近所の人と一緒に見に行く'],c:0,e:'増水した川へ近づかず、自治体や河川管理者などの公的な防災情報で状況を確認します。'},{q:'雷が鳴っているとき、家の中なら何をしても安全？',a:['家の中でも電気設備などへの注意が必要','窓を開けて外を観察するのが最も安全','屋根の上へ移動する','ベランダへ出ればさらに安全'],c:0,e:'建物内は屋外より安全ですが、落雷時には電気設備などを通じた影響にも注意します。'},{q:'猛烈な雨で自宅周辺の道路がすでに冠水。外へ避難する方が危険な状況なら？',a:['建物内のより高く安全な場所で身を守る','必ず冠水道路を歩いて避難所へ行く','地下室へ荷物を取りに行く','車で冠水路へ入り水深を確かめる'],c:0,e:'屋外移動がかえって危険な場合は、建物内のより高く安全な場所などで命を守る行動をとります。'}];const K='sonayell_quiz_2026_08';let S={rewarded:{},answered:{}};try{S={...S,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}let i=0,selected=null;const $=x=>document.getElementById(x);function app(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function save(){localStorage.setItem(K,JSON.stringify(S))}function saveApp(s){localStorage.setItem('sonayell_v2',JSON.stringify(s))}function count(){return Object.values(S.rewarded).filter(Boolean).length}function progress(){const n=count();$('pc').textContent=n+' / 10';$('bar').style.width=(n*10)+'%';$('yell').textContent=Number(app().yell)||0;$('donebox').classList.toggle('show',n===10)}function render(){selected=S.answered[i]??null;$('qno').textContent='第'+(i+1)+'問 / 全10問';$('question').textContent=Q[i].q;const b=$('answers');b.innerHTML='';Q[i].a.forEach((x,j)=>{const bt=document.createElement('button');bt.className='ans';bt.textContent=String.fromCharCode(65+j)+'　'+x;if(selected!==null){bt.disabled=true;if(j===selected)bt.classList.add('sel');if(j===Q[i].c)bt.classList.add('ok')}bt.onclick=()=>answer(j);b.appendChild(bt)});if(selected!==null){$('explain').classList.add('show');$('explain').innerHTML='<b>'+(selected===Q[i].c?'✨ 正解！':'🌱 おしい！')+'</b><br>'+Q[i].e;$('reward').disabled=!!S.rewarded[i];$('reward').textContent=S.rewarded[i]?'✅ 解説確認済み・1YELL獲得':'解説を確認して ＋1 YELL'}else{$('explain').classList.remove('show');$('explain').innerHTML='';$('reward').disabled=true;$('reward').textContent='まず答えを選んでね'}$('prev').disabled=i===0;$('next').disabled=i===9;progress()}function answer(j){if(S.answered[i]!==undefined)return;S.answered[i]=j;save();render()}function leaves(){for(let n=0;n<18;n++){const e=document.createElement('i');e.className='leaf';e.textContent='🍃';e.style.left=Math.random()*96+'vw';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3300)}}$('reward').onclick=()=>{if(S.rewarded[i]||S.answered[i]===undefined)return;S.rewarded[i]=true;save();const s=app();s.yell=(Number(s.yell)||0)+1;s.leaves=(Number(s.leaves)||0)+1;s.tree_growth=(Number(s.tree_growth)||0)+1;saveApp(s);leaves();render()};$('prev').onclick=()=>{if(i>0){i--;render();scrollTo(0,0)}};$('next').onclick=()=>{if(i<9){i++;render();scrollTo(0,0)}};render();</script></body></html>
