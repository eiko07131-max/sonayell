<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5f31"><title>そなYELL 試作品</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#0b5f31;overflow:hidden}body{display:grid;place-items:center;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.poster{position:relative;width:min(100vw,66.6667vh);height:min(100vh,150vw);aspect-ratio:2/3;box-shadow:0 0 40px rgba(0,0,0,.22);background:#0b5f31;overflow:hidden}.posterImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.hotspot{position:absolute;left:17.5%;width:65%;border:0;background:transparent;cursor:pointer;border-radius:999px;color:transparent;font-size:0;outline:none;z-index:2}.hotspot:focus-visible{outline:4px solid rgba(255,255,255,.95);outline-offset:3px}#guestBtn{top:79.1%;height:7.9%}#registerBtn{top:88.7%;height:7.2%}.loading{position:absolute;inset:0;z-index:4;background:#0b5f31;color:white;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;padding:24px}@media(max-aspect-ratio:2/3){.poster{width:100vw;height:150vw}}@media(min-aspect-ratio:2/3){.poster{height:100vh;width:66.6667vh}}</style></head><body><main class="poster" aria-label="そなYELL。今日の一歩が、未来の安心につながる。"><img class="posterImg" id="posterImg" alt="そなYELL 立ち上げ画面"><button class="hotspot" id="guestBtn" aria-label="ゲストではじめる">ゲストではじめる</button><button class="hotspot" id="registerBtn" aria-label="登録してはじめる">登録してはじめる</button><div class="loading" id="loading">そなYELLを準備中…</div></main><script>(async()=>{const loading=document.getElementById('loading');try{const urls=['./assets/start-screen-b64-1.txt?v=1','./assets/start-screen-b64-2.txt?v=1','./assets/start-screen-b64-3.txt?v=1'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));return(await r.text()).trim()}));const img=document.getElementById('posterImg');img.onload=()=>{loading.style.display='none'};img.onerror=()=>{loading.textContent='合格画像の表示に失敗しました。'};img.src='data:image/webp;base64,'+parts.join('')}catch(e){loading.textContent='合格画像の読み込みに失敗しました。'}})();document.getElementById('guestBtn').onclick=()=>{localStorage.setItem('sonayell_trial_entry','guest');location.href='./enter.html?after_login=1&v=12'};document.getElementById('registerBtn').onclick=()=>{localStorage.setItem('sonayell_trial_entry','register');location.href='./login.html?from=trial&v=12'};</script></body></html>
