<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6d38">
<title>そなYELL 試作品</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#dff4ff;color:#243b2b}button{font:inherit;cursor:pointer}.page{min-height:100svh;overflow:hidden;position:relative;background:linear-gradient(180deg,#8dd6f6 0%,#dff6ff 32%,#eef8d9 63%,#78be62 100%)}.page:before,.page:after{content:"";position:absolute;bottom:-10%;width:70%;height:32%;border-radius:50%;background:#4f9f4f;opacity:.92}.page:before{left:-18%}.page:after{right:-18%;background:#2f8547}.wrap{position:relative;z-index:2;min-height:100svh;width:min(100%,760px);margin:auto;padding:18px 16px 24px;display:flex;flex-direction:column;align-items:center}.catch{font-size:clamp(18px,3.5vw,29px);font-weight:900;line-height:1.35;text-align:center;color:#312d25;text-shadow:0 2px 0 rgba(255,255,255,.86)}.logo{margin:4px 0 4px;font-size:clamp(50px,9vw,82px);font-weight:1000;letter-spacing:-3px;color:#075f31;text-shadow:0 3px 0 #fff,0 0 22px rgba(255,255,255,.85)}.logoMark{display:inline-block;vertical-align:8%;margin-right:4px}.logoMark svg{width:.72em;height:.72em}.subLinks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.subLinks button{border:1px solid rgba(16,101,50,.22);background:rgba(255,255,255,.82);color:#126536;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:900}.scene{position:relative;width:min(96vw,650px);height:clamp(410px,57svh,580px);margin-top:4px}.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.sign{position:absolute;z-index:5;left:50%;top:43%;transform:translate(-50%,-50%);width:min(63%,385px);padding:16px 18px;border:7px solid #97673a;border-radius:13px;background:linear-gradient(#fff8db,#f5e4b8);box-shadow:inset 0 0 0 2px #d9b47e,0 10px 24px rgba(70,50,28,.18);text-align:center;color:#493821;font-size:clamp(15px,2.8vw,22px);font-weight:900;line-height:1.55}.sign:before,.sign:after{content:"";position:absolute;width:42px;height:20px;background:#72a841;border-radius:80% 20% 80% 20%;top:-15px}.sign:before{left:-11px;transform:rotate(22deg)}.sign:after{right:-11px;transform:scaleX(-1) rotate(22deg)}.actions{position:relative;z-index:10;width:min(100%,500px);margin-top:-4px}.message{background:rgba(255,251,238,.96);border:2px solid #e4cc91;border-radius:17px;padding:10px 14px;text-align:center;font-weight:900;color:#4b432e;box-shadow:0 5px 14px rgba(67,52,27,.13)}.startBtn{display:block;width:100%;border-radius:999px;padding:15px 18px;margin:8px 0;font-size:18px;font-weight:900;border:2px solid rgba(255,255,255,.68)}.guest{background:linear-gradient(#24a151,#0a6b35);color:white;box-shadow:0 5px 0 #075229,0 8px 18px rgba(13,88,43,.22)}.register{background:#fffaf0;color:#0d6b36;border-color:#e7ddbf;box-shadow:0 5px 0 #d7cdaa}.tiny{text-align:center;font-size:11px;font-weight:700;color:#2b6139;margin-top:7px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(16,42,24,.48);z-index:30}.modal.on{display:flex}.card{width:min(100%,460px);background:#fffdf5;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.card h2{margin:0 0 10px;color:#0b6834}.card p{font-size:14px;line-height:1.8}.close{width:100%;border:0;border-radius:14px;background:#177d42;color:white;padding:12px;font-weight:900;margin-top:8px}
@media(max-width:540px){.wrap{padding-top:12px}.catch{font-size:17px}.logo{font-size:52px}.scene{height:420px}.sign{top:42%;width:68%;font-size:15px;padding:13px 12px}.actions{margin-top:-10px}.startBtn{padding:14px 16px}.tiny{font-size:10px}}
</style>
</head>
<body>
<main class="page"><section class="wrap">
<div class="catch">今日の一歩が、<br>未来の安心につながる。</div>

<div class="subLinks"><button id="aboutBtn">そなYELLって？</button><button id="friendsBtn">そなYELLのなかまたち</button></div>

<div class="sign">小さな備えが、<br>あなたと大切な人の<br>未来を守ります。<br>できることから、<br>一緒に始めよう！</div>
</div>
<div class="actions"><div class="message">小さな備えを、一つずつ。</div><button class="startBtn guest" id="guestBtn">ゲストではじめる</button><button class="startBtn register" id="registerBtn">登録してはじめる</button><div class="tiny">試作品：機能を残したまま、決定画面へ近づけています。</div></div>
</section></main>
<div class="modal" id="aboutModal"><div class="card"><h2>そなYELLって？</h2><p>普段から少しずつ備え、学び、みんなの工夫を共有しながら、防災を続けていくためのアプリです。小さな行動をYELLとして積み重ね、自分の木を育てていきます。</p><button class="close">閉じる</button></div></div>
<div class="modal" id="friendsModal"><div class="card"><h2>そなYELLのなかまたち</h2><p>葉っぱの帽子をかぶった「そなピー」を中心に、森の仲間たちが、毎日の小さな備えを応援します。</p><button class="close">閉じる</button></div></div>
<script>
const openModal=(buttonId,modalId)=>{const b=document.getElementById(buttonId),m=document.getElementById(modalId);b.onclick=()=>m.classList.add('on');m.querySelector('.close').onclick=()=>m.classList.remove('on');m.onclick=e=>{if(e.target===m)m.classList.remove('on')}};
openModal('aboutBtn','aboutModal');openModal('friendsBtn','friendsModal');
document.getElementById('guestBtn').onclick=()=>location.href='./enter.html?after_login=1&v=8';
document.getElementById('registerBtn').onclick=()=>location.href='./register.html';
</script>
</body>
</html>
