s="go">›</span></button></div></section><div class="devMark">🚧 そなYELL ブラッシュアップ開発版</div></main><script>

let lastDailyKey='';
function localDayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function setDailyYell(){const now=new Date(),key=localDayKey(now);if(key===lastDailyKey)return;lastDailyKey=key;const dayNumber=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/86400000);document.getElementById('dailyYell').textContent=DAILY_YELL[((dayNumber%DAILY_YELL.length)+DAILY_YELL.length)%DAILY_YELL.length]}
async function loadApprovedTop(){try{const urls=[0,1,2,3].map(i=>`../assets/v62c${i}.txt?v=99`),parts=[];for(const u of urls){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+': '+r.status);parts.push((await r.text()).replace(/\s+/g,''))}const img=document.getElementById('topArt');img.onload=()=>{img.hidden=false;document.getElementById('topLoading').style.display='none'};img.src='data:image/webp;base64,'+parts.join('')}catch(e){document.getElementById('topLoading').textContent='画像の読み込みに失敗しました'}}
setDailyYell();loadApprovedTop();setInterval(setDailyYell,60000);addEventListener('pageshow',setDailyYell);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setDailyYell()});document.getElementById('bell').onclick=()=>alert('🔔 お知らせ機能は準備中だよ。');
