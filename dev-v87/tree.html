<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#087a3d"><title>私のYELLの木｜そなYELL開発版</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f7f8f1;color:#284735;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.app{width:min(100%,430px);margin:auto;min-height:100vh;background:linear-gradient(#f8fbf2,#fffdf8);padding-bottom:74px;overflow:hidden}.top{height:66px;background:#087a3d;color:#fff;display:flex;align-items:center;padding:0 17px;position:relative;z-index:5}.top button{font:inherit}.back{border:0;background:none;color:#fff;font-weight:900;font-size:18px;padding:10px 0}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap}.help{margin-left:auto;width:43px;height:43px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:transparent;color:#fff;font-size:23px;font-weight:900}.world{height:350px;position:relative;overflow:hidden;background:linear-gradient(#86d9f7 0 55%,#8fd25b 55% 100%)}.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.92}.c1{width:95px;height:27px;top:45px;left:38px}.c2{width:82px;height:24px;top:66px;right:36px}.sideTree{position:absolute;top:-100px;width:210px;height:230px;border-radius:50%;background:#4aa43c}.sideTree.l{left:-120px}.sideTree.r{right:-120px}.ground{position:absolute;left:0;right:0;bottom:0;height:92px;background:#72bd45}.ring{position:absolute;left:50%;bottom:49px;transform:translateX(-50%);width:220px;height:37px;border:5px solid #c7a25b;border-radius:50%;background:#a9dc68}.decor{position:absolute;font-size:26px;z-index:2}.bird1{left:28px;top:110px}.bird2{right:28px;top:120px}.but1{left:105px;top:145px;font-size:20px}.but2{right:105px;top:145px;font-size:20px}.bear{left:1 da;border:1px solid #d7e6bc;border-radius:999px;padding:9px;text-align:center;color:#477049;font-size:11px;font-weight:800}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:67px;background:#fffffff7;border-top:1px solid #e4eadf;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#52665a;font-size:21px;padding:6px 2px 4px}.nav small{display:block;font-size:8px;font-weight:800}.nav .home{color:#087a3d}@media(max-width:390px){.world{height:330px}.treeSpot{width:225px;height:250px}.stage{min-width:250px;font-size:13.5px}.panel{margin-left:10px;margin-right:10px;padding:16px}}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='./index.html?v=99'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" id="help">?</button></header><section class="world"><i class="cloud c1"></i><i class="cloud c2"></i><i class="sideTree l"></i><i class="sideTree r"></i><div class="ground"></div><div class="ring"></div><span class="decor bird1">🐦</span><span class="decor bird2">🐦</span><span class="decor but1">🦋</span><span class="decor but2">🦋</span><span class="decor bear">🐻</span><span class="decor rabbit">🐰</span><span class="decor deer">🦌</span><span class="decor squirrel">🐿️</span><div id="treeSpot" class="treeSpot"></div><div id="stage" class="stage"></div></section><section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div></section><section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div></main><nav class="nav"><button class="home" onclick="location.href='./index.html?v=99'">🏠<small>ホーム</small></button><button onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav><script>async function txt(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p);return(await r.text()).replace(/\s+/g,'')}async function loadSona(){try{sonaImg.src='data:image/webp;base64,'+await txt('../assets/sonapi-official-b64.txt?v=1')}catch(e){}}function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function treeSVG(n){let scale=n<3?.45:n<10?.58:n<20?.72:n<35?.86:n<50?1:1.06;let flowers='',fruit='';let mode=localStorage.getItem('sonayell_tree_special')||'';if(n>=40&&mode==='flower')flowers='<g fill="#f7a9bd"><circle cx="78" cy="91" r="5"/><circle cx="164" cy="100" r="5"/><circle cx="112" cy="61" r="5"/><circle cx="143" cy="137" r="5"/></g>';if(n>=40&&mode==='fruit')fruit='<g fill="#ef6e50"><circle cx="84" cy="112" r="6"/><circle cx="153" cy="104" r="6"/><circle cx="135" cy="143" r="6"/></g>';return `<svg viewBox="0 0 240 270" style="transform:scale(${scale});transform-origin:50% 100%"><defs><linearGradient id="tr" x1="0" x2="1"><stop stop-color="#71431f"/><stop offset=".5" stop-color="#a76b30"/><stop offset="1" stop-color="#6d3e1d"/></linearGradient><linearGradient id="lf" y2="1"><stop stop-color="#8bd24a"/><stop offset="1" stop-color="#31933b"/></linearGradient></defs><g stroke="url(#tr)" stroke-linecap="round" fill="none"><path d="M120 250 C116 213 118 177 120 139 C121 116 121 101 120 85" stroke-width="25"/><path d="M119 176 C97 155 80 139 65 119" stroke-width="10"/><path d="M123 165 C144 145 161 129 178 105" stroke-width="10"/><path d="M119 142 C103 125 95 110 89 92" stroke-width="8"/><path d="M125 137 C141 119 150 103 157 84" stroke-width="8"/></g><path d="M42 133 C28 111 39 88 60 79 C57 52 79 36 103 42 C116 20 150 21 160 45 C187 42 203 63 197 86 C221 96 222 126 204 139 C211 165 187 181 166 176 C151 197 119 194 108 178 C85 190 59 179 59 158 C39 158 30 145 42 133Z" fill="url(#lf)" stroke="#247d36" stroke-width="4"/><path d="M57 109 C81 93 104 88 127 91" stroke="#a9e36a" stroke-width="5" stroke-linecap="round" opacity=".48"/>${flowers}${fruit}</svg>`}function label(n){return n>=50?'大樹に成長したよ！ 🌳':n>=35?'もうすぐ大樹になりそう！ 🌳':n>=20?'立派な木になってきたよ 🌿':n>=10?'小さな木に育ったよ 🌱':n>=3?'若い木が育ってきたよ 🌱':'小さな芽からスタート 🌱'}function render(){let y=Math.max(0,Number(state().yell)||0),g=Math.floor(y/50),c=y%50,shown=c===0&&y>0?50:c;grown.textContent=g;current.textContent=shown;bar.style.width=shown/50*100+'%';stage.textContent=label(shown);treeSpot.innerHTML=treeSVG(shown);next.innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';cheer.textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}loadSona();render();help.onclick=()=>alert('YELLが増えると、中央の木だけが少しずつ成長します。50YELLで大樹1本！');addEventListener('pageshow',render);addEventListener('focus',render);addEventListener('storage',render);</script></body></html>
