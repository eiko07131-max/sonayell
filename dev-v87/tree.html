<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta name="theme-color" content="#087a3d">
<title>私のYELLの木｜そなYELL開発版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f7f8f1;color:#284735;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
button{font:inherit}.app{width:min(100%,430px);margin:auto;min-height:100vh;background:linear-gradient(#f8fbf2,#fffdf8);padding-bottom:74px;overflow:hidden}
.top{height:66px;background:#087a3d;color:#fff;display:flex;align-items:center;padding:0 17px;position:relative;z-index:20}.back{border:0;background:none;color:#fff;font-weight:900;font-size:18px;padding:10px 0}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap}.help{margin-left:auto;width:43px;height:43px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:transparent;color:#fff;font-size:23px;font-weight:900}
.hero{height:322px;position:relative;overflow:hidden;background:linear-gradient(180deg,#6da868 0%,#5f9f58 42%,#77b859 70%,#7fbd55 100%)}
.hero:before{content:"";position:absolute;inset:-8px;background:radial-gradient(circle at 50% 4%,rgba(255,255,226,.98) 0 6%,rgba(246,255,191,.88) 13%,rgba(227,248,154,.40) 29%,transparent 49%),radial-gradient(circle at 50% 58%,rgba(248,255,191,.38),transparent 36%),linear-gradient(90deg,rgba(24,78,45,.64),transparent 18%,transparent 82%,rgba(24,78,45,.64));filter:blur(2px)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:98px;background:radial-gradient(ellipse at 50% 100%,rgba(108,160,65,.98) 0 39%,rgba(67,124,55,.65) 65%,transparent 66%)}
.trunkL,.trunkR{position:absolute;top:-4px;bottom:0;width:82px;background:linear-gradient(90deg,#245d38,#3d7949 40%,#215735);opacity:.82;filter:blur(1px);z-index:1}.trunkL{left:-29px;transform:rotate(3deg)}.trunkR{right:-28px;transform:rotate(-3deg)}
.foliage{position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 7% 11%,rgba(52,119,57,.96) 0 10%,transparent 11%),radial-gradient(circle at 19% 3%,rgba(70,137,63,.96) 0 13%,transparent 14%),radial-gradient(circle at 91% 10%,rgba(48,112,53,.95) 0 11%,transparent 12%),radial-gradient(circle at 78% 2%,rgba(68,135,61,.96) 0 13%,transparent 14%),radial-gradient(circle at 2% 37%,rgba(55,118,55,.72) 0 12%,transparent 13%),radial-gradient(circle at 99% 37%,rgba(55,118,55,.72) 0 12%,transparent 13%);filter:blur(2px)}
.ray{position:absolute;z-index:3;left:50%;top:-28px;width:214px;height:276px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,224,.56),rgba(245,255,179,.22) 62%,transparent);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);filter:blur(9px)}
.spark{position:absolute;z-index:6;width:6px;height:6px;border-radius:50%;background:#fffbd2;box-shadow:0 0 12px 3px rgba(255,248,178,.72);opacity:.84;animation:twinkle 2.8s ease-in-out infinite}.s1{left:22%;top:22%}.s2{left:72%;top:25%;animation-delay:.7s}.s3{left:32%;top:44%;animation-delay:1.4s}.s4{left:66%;top:48%;animation-delay:2s}.s5{left:50%;top:17%;animation-delay:1s}@keyframes twinkle{0%,100%{opacity:.28;transform:scale(.75)}50%{opacity:1;transform:scale(1.18)}}
.treeStage{position:absolute;z-index:8;left:50%;bottom:48px;width:188px;height:212px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center}
.leafOnly{font-size:50px;filter:drop-shadow(0 5px 7px rgba(35,90,42,.27));transform:translateY(-38px)}
.treeCss{position:relative;width:170px;height:205px;transform-origin:50% 100%;filter:drop-shadow(0 7px 8px rgba(26,73,37,.26))}.treeCss .trunk{position:absolute;left:50%;bottom:10px;width:27px;height:112px;transform:translateX(-50%);background:linear-gradient(90deg,#7b4d25,#a16b35 46%,#6d421f);border-radius:55% 55% 30% 30%;box-shadow:inset -5px 0 6px rgba(73,39,17,.22)}.treeCss .branch{position:absolute;bottom:93px;left:50%;width:63px;height:13px;background:#835126;border-radius:999px;transform-origin:0 50%}.treeCss .b1{transform:translateX(-2px) rotate(-33deg)}.treeCss .b2{transform:translateX(-1px) rotate(214deg)}.treeCss .b3{width:52px;bottom:115px;transform:translateX(-1px) rotate(-56deg)}.treeCss .b4{width:52px;bottom:114px;transform:translateX(-1px) rotate(236deg)}
.treeCss .c{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 28%,#9be051 0 12%,#63bd36 45%,#328d2e 100%);box-shadow:inset -9px -11px 17px rgba(29,113,32,.25),0 4px 9px rgba(41,101,40,.15)}.treeCss .c1{width:88px;height:88px;left:41px;top:26px}.treeCss .c2{width:75px;height:75px;left:10px;top:61px}.treeCss .c3{width:77px;height:77px;right:9px;top:62px}.treeCss .c4{width:73px;height:73px;left:49px;top:69px}.treeCss .c5{width:64px;height:64px;left:28px;top:33px}.treeCss .c6{width:64px;height:64px;right:27px;top:34px}
.stageMsg{position:absolute;z-index:12;left:50%;bottom:9px;transform:translateX(-50%);min-width:300px;text-align:center;background:rgba(255,255,255,.97);border-radius:999px;padding:11px 20px;color:#087a3d;font-weight:900;font-size:15px;box-shadow:0 5px 14px rgba(66,107,59,.16)}
.panel{margin:0 12px 12px;padding:18px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 9px 24px #2a4c261a;border:1px solid #eff0e9;border-top:0}.panel h2{margin:0 0 12px;color:#08773c;font-size:21px}.rule{text-align:center;background:#eff7e7;border-radius:13px;padding:9px;font-weight:900;color:#54715b;font-size:12px}.meter{height:13px;margin:11px 0 7px;border-radius:99px;background:linear-gradient(90deg,#e8eadf,#f5dfbd);overflow:hidden}.meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#078d40,#63bd63)}.count{text-align:center;color:#087a3d;font-weight:900;font-size:17px}.count strong{font-size:27px}.next{text-align:center;margin-top:7px;padding:8px 0 11px;border-bottom:1px solid #eee5d8;font-weight:800;font-size:14px}.next strong{color:#087a3d;font-size:20px;margin-left:8px}.grown{text-align:center;padding-top:11px;font-size:14px;font-weight:800}.grown strong{font-size:28px;color:#087a3d;margin:0 5px}.sona{display:flex;align-items:center;gap:9px;margin:9px 13px}.sona img{width:98px;height:116px;object-fit:contain}.bubble{flex:1;background:#fffdf9;border:1.5px solid #e7d7b8;border-radius:22px;padding:13px 14px}.bubble b{color:#087a3d;font-size:15px}.bubble p{margin:4px 0 0;line-height:1.55;font-size:12px}.tip{margin:8px 15px 10px;background:#edf6da;border:1px solid #d7e6bc;border-radius:999px;padding:9px;text-align:center;color:#477049;font-size:11px;font-weight:800}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:67px;background:#fffffff7;border-top:1px solid #e4eadf;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#52665a;font-size:21px;padding:6px 2px 4px}.nav small{display:block;font-size:8px;font-weight:800}.nav .home{color:#087a3d}
@media(max-width:390px){.hero{height:300px}.stageMsg{min-width:280px;font-size:13.5px}.panel{margin-left:10px;margin-right:10px;padding:16px}.treeStage{bottom:44px;transform:translateX(-50%) scale(.94)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="location.href='./index.html?v=101'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" id="help">?</button></header>
<section class="hero" aria-label="光が差し込むYELLの森"><div class="trunkL"></div><div class="trunkR"></div><div class="foliage"></div><div class="ray"></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><div id="treeStage" class="treeStage"></div><div id="stageMsg" class="stageMsg"></div></section>
<section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div></section>
<section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div>
</main>
<nav class="nav"><button class="home" onclick="location.href='./index.html?v=101'">🏠<small>ホーム</small></button><button onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav>
<script>
async function loadSona(){try{const r=await fetch('../assets/sonapi-official-b64.txt?v=1',{cache:'no-store'});if(!r.ok)throw Error(r.status);sonaImg.src='data:image/webp;base64,'+(await r.text()).replace(/\s+/g,'')}catch(e){console.error('sona',e)}}
function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}
function label(n){return n>=35?'もうすぐ大樹になりそう！ 🌳':n>=20?'立派な木になってきたよ 🌿':n>=10?'小さな木に育ったよ 🌱':n>=3?'若い木が育ってきたよ 🌱':'小さな芽からスタート 🌱'}
function treeMarkup(n){if(n<3)return '<div class="leafOnly">🍃</div>';const scale=n<10?.48:n<20?.64:n<35?.82:1;return '<div class="treeCss" style="transform:scale('+scale+')"><div class="trunk"></div><div class="branch b1"></div><div class="branch b2"></div><div class="branch b3"></div><div class="branch b4"></div><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><i class="c c5"></i><i class="c c6"></i></div>'}
function render(){const s=state();const c=Math.max(0,Math.min(49,Number(s.yell)||0));const g=Math.max(0,Number(s.bigTrees)||Number(s.big_trees)||0);grown.textContent=g;current.textContent=c;bar.style.width=(c/50*100)+'%';stageMsg.textContent=label(c);next.innerHTML='次の大樹になるまで <strong>あと '+(50-c)+'YELL！</strong>';cheer.textContent=c>=35?'あと少し！ここまで積み重ねたYELLが、しっかり木を育ててるよ！':c>=20?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';treeStage.innerHTML=treeMarkup(c)}
loadSona();render();help.onclick=()=>alert('YELLを50集めると大樹が1本完成し、また0YELLから次の木を育てます。');addEventListener('pageshow',()=>{scrollTo(0,0);render()});addEventListener('focus',render);addEventListener('storage',render);
</script>
</body></html>
