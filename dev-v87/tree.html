<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta name="theme-color" content="#087a3d"><title>私のYELLの木｜そなYELL開発版</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f7f8f1;color:#284735;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}button{font:inherit}.app{width:min(100%,430px);margin:auto;min-height:100vh;background:linear-gradient(#f8fbf2,#fffdf8);padding-bottom:74px;overflow:hidden}.top{height:66px;background:linear-gradient(90deg,#087338,#098342);color:#fff;display:flex;align-items:center;padding:0 17px;position:relative;z-index:5}.back{border:0;background:none;color:#fff;font-weight:900;font-size:18px;padding:10px 0}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap}.help{margin-left:auto;width:43px;height:43px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:transparent;color:#fff;font-size:23px;font-weight:900}.world{position:relative;height:350px;overflow:hidden;background:#cceff8}.forest{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;filter:saturate(1.08) contrast(1.06)}.treeSpot{position:absolute;left:50%;bottom:47px;transform:translateX(-50%);width:255px;height:265px;display:flex;align-items:flex-end;justify-content:center;z-index:3;filter:drop-shadow(0 7px 5px rgba(40,65,28,.16))}.treeSpot svg{width:100%;height:100%;overflow:visible}.stage{position:absolute;z-index:5;left:50%;bottom:11px;transform:translateX(-50%);min-width:276px;text-align:center;background:rgba(255,255,255,.97);border-radius:999px;padding:9px 18px;color:#087a3d;font-weight:900;font-size:15px;box-shadow:0 5px 14px rgba(40,80,40,.15)}.panel{margin:0 12px 12px;padding:18px 18px 16px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 9px 24px rgba(42,76,38,.10);border:1px solid #eff0e9;border-top:0}.panel h2{margin:0 0 12px;color:#08773c;font-size:21px}.rule{text-align:center;background:#eff7e7;border-radius:13px;padding:9px;font-weight:900;color:#54715b;font-size:12px}.meter{height:13px;margin:11px 0 7px;border-radius:99px;background:linear-gradient(90deg,#e8eadf,#f5dfbd);overflow:hidden}.meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#078d40,#63bd63);transition:width .35s}.count{text-align:center;color:#087a3d;font-weight:900;font-size:17px}.count strong{font-size:27px}.next{text-align:center;margin-top:7px;padding:8px 0 11px;border-bottom:1px solid #eee5d8;font-weight:800;font-size:14px}.next strong{color:#087a3d;font-size:20px;margin-left:8px}.grown{text-align:center;padding-top:11px;font-size:14px;font-weight:800}.grown strong{font-size:28px;color:#087a3d;margin:0 5px}.sona{display:flex;align-items:center;gap:9px;margin:9px 13px}.sona img{width:98px;height:116px;object-fit:contain}.bubble{position:relative;flex:1;background:#fffdf9;border:1.5px solid #e7d7b8;border-radius:22px;padding:13px 14px;box-shadow:0 3px 12px rgba(67,84,45,.05)}.bubble b{color:#087a3d;font-size:15px}.bubble p{margin:4px 0 0;line-height:1.55;font-size:12px}.tip{margin:8px 15px 10px;background:#edf6da;border:1px solid #d7e6bc;border-radius:999px;padding:9px;text-align:center;color:#477049;font-size:11px;font-weight:800}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:67px;background:rgba(255,255,255,.98);border-top:1px solid #e4eadf;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px rgba(31,72,39,.06)}.nav button{border:0;background:none;color:#52665a;font-size:21px;padding:6px 2px 4px}.nav small{display:block;font-size:8px;font-weight:800;margin-top:1px}.nav .home{color:#087a3d}@media(max-width:390px){.world{height:330px}.treeSpot{width:235px;height:245px}.stage{font-size:13.5px;min-width:250px}.panel{margin-left:10px;margin-right:10px;padding:16px}.sona img{width:90px;height:108px}}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='./index.html?v=98'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" id="help">?</button></header><section class="world"><img id="forest" class="forest" alt="森の仲間たち"><div id="treeSpot" class="treeSpot"></div><div id="stage" class="stage"></div></section><section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div></section><section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div></main><nav class="nav"><button class="home" onclick="location.href='./index.html?v=98'">🏠<small>ホーム</small></button><button onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav><script>async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}async function loadArt(){try{const[bg,sp]=await Promise.all([txt('../assets/tree-forest-v74.txt?v=98'),txt('../assets/sonapi-official-b64.txt?v=1')]);forest.src='data:image/jpeg;base64,'+bg;sonaImg.src='data:image/webp;base64,'+sp}catch(e){console.error(e)}}function getState(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}const D=`<defs><linearGradient id="w" x1="0" x2="1"><stop stop-color="#65401f"/><stop offset=".46" stop-color="#9c6530"/><stop offset="1" stop-color="#6c431f"/></linearGradient><linearGradient id="l1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9bd957"/><stop offset="1" stop-color="#3f9b36"/></linearGradient><linearGradient id="l2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75c745"/><stop offset="1" stop-color="#278632"/></linearGradient></defs>`;function crown(cx,cy,rx,ry,c){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${c})"/>`}function treeSVG(n){let s=.55;if(n>=3)s=.65;if(n>=10)s=.76;if(n>=20)s=.88;if(n>=35)s=1;if(n>=50)s=1.08;let leaves='';const pts=[[120,78,45,35,'l1'],[82,100,43,34,'l2'],[158,101,45,36,'l1'],[106,118,50,37,'l1'],[145,125,48,36,'l2'],[62,130,32,27,'l1'],[183,132,31,28,'l2'],[91,148,38,29,'l2'],[151,151,42,30,'l1']];pts.forEach(p=>leaves+=crown(...p));let specials='';const mode=localStorage.getItem('sonayell_tree_special')||'';if(n>=40&&mode==='flower')specials=`<g fill="#f5a6ba" stroke="#fff" stroke-width="1.5"><circle cx="80" cy="94" r="6"/><circle cx="146" cy="78" r="6"/><circle cx="174" cy="130" r="6"/><circle cx="110" cy="143" r="5"/></g>`;if(n>=40&&mode==='fruit')specials=`<g fill="#ef6e50" stroke="#c84c38" stroke-width="1.2"><circle cx="86" cy="111" r="7"/><circle cx="149" cy="104" r="7"/><circle cx="168" cy="142" r="6"/></g>`;let young=n<10?`<path d="M120 245 Q120 212 121 180" stroke="url(#w)" stroke-width="10" stroke-linecap="round"/><path d="M120 210 Q101 194 91 179" stroke="url(#w)" stroke-width="5" stroke-linecap="round"/>${crown(107,174,27,20,'l1')}${crown(137,163,28,21,'l2')}`:`<path d="M120 246 Q112 204 120 143 Q121 110 122 88" stroke="url(#w)" stroke-width="25" stroke-linecap="round"/><path d="M118 184 Q91 163 67 135" stroke="url(#w)" stroke-width="10" stroke-linecap="round"/><path d="M123 168 Q151 147 178 119" stroke="url(#w)" stroke-width="10" stroke-linecap="round"/><path d="M117 143 Q99 122 89 96" stroke="url(#w)" stroke-width="8" stroke-linecap="round"/><path d="M126 137 Q145 115 155 91" stroke="url(#w)" stroke-width="8" stroke-linecap="round"/>${leaves}${specials}`;return `<svg viewBox="0 0 240 270" style="transform:scale(${s});transform-origin:50% 100%">${D}${young}</svg>`}function label(n){if(n>=50)return'大樹に成長したよ！ 🌳';if(n>=35)return'もうすぐ大樹になりそう！ 🌳';if(n>=20)return'立派な木になってきたよ 🌿';if(n>=10)return'小さな木に育ったよ 🌱';if(n>=3)return'若い木が育ってきたよ 🌱';return'小さな芽からスタート 🌱'}function render(){const s=getState(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur;document.getElementById('grown').textContent=grown;document.getElementById('current').textContent=shown;document.getElementById('bar').style.width=(shown/50*100)+'%';document.getElementById('stage').textContent=label(shown);document.getElementById('treeSpot').innerHTML=treeSVG(shown);document.getElementById('next').innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}loadArt();render();document.getElementById('help').onclick=()=>alert('YELLが増えると、中央の木だけが少しずつ成長します。50YELLで大樹1本！');addEventListener('pageshow',render);addEventListener('focus',render);addEventListener('storage',render);</script></body></html>
