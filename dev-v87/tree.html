fficial-b64.txt?v=1')}catch(e){console.error(e)}}function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function label(n){return n>=50?'大樹に成長したよ！ 🌳':n>=35?'もうすぐ大樹になりそう！ 🌳':n>=20?'立派な木になってきたよ 🌿':n>=10?'小さな木に育ったよ 🌱':n>=3?'若い木が育ってきたよ 🌱':'小さな芽からスタート 🌱'}function render(){let y=Math.max(0,Number(state().yell)||0),g=Math.floor(y/50),c=y%50,shown=c===0&&y>0?50:c;grown.textContent=g;current.textContent=shown;bar.style.width=shown/50*100+'%';stage.textContent=label(shown);next.innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';cheer.textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}loadSona();render();help.onclick=()=>alert('いまは固定背景だけを確認する開発版です。中央の成長する木は一旦外しています。');addEventListener('pageshow',render);addEventListener('focus',render);addEventListener('storage',render);</script></body></html>
