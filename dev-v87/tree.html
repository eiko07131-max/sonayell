<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#087a3d"><title>私のYELLの木｜そなYELL開発版</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f7f8f1;color:#284735;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.app{width:min(100%,430px);margin:auto;min-height:100vh;background:linear-gradient(#f8fbf2,#fffdf8);padding-bottom:74px;overflow:hidden}.top{height:66px;background:#087a3d;color:#fff;display:flex;align-items:center;padding:0 17px;position:relative;z-index:5}.back{border:0;background:none;color:#fff;font-weight:900;font-size:18px;padding:10px 0}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap}.help{margin-left:auto;width:43px;height:43px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:transparent;color:#fff;font-size:23px;font-weight:900}.world{height:322px;position:relative;overflow:hidden;background:linear-gradient(180deg,#dff3c5,#80b95b)}.forest-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .12s linear}.forest-bg.ready{opacity:1}.world:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,rgba(255,255,210,.10),transparent 62%);pointer-events:none}.stage{position:absolute;z-index:7;left:50%;bottom:9px;transform:translateX(-50%);min-width:300px;text-align:center;background:rgba(255,255,255,.97);border-radius:999px;padding:11px 20px;color:#087a3d;font-weight:900;font-size:15px;box-shadow:0 5px 14px #426b3b24}.panel{margin:0 12px 12px;padding:18px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 9px 24px #2a4c261a;border:1px solid #eff0e9;border-top:0}.panel h2{margin:0 0 12px;color:#08773c;font-size:21px}.rule{text-align:center;background:#eff7e7;border-radius:13px;padding:9px;font-weight:900;color:#54715b;font-size:12px}.meter{height:13px;margin:11px 0 7px;border-radius:99px;background:linear-gradient(90deg,#e8eadf,#f5dfbd);overflow:hidden}.meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#078d40,#63bd63)}.count{text-align:center;color:#087a3d;font-weight:900;font-size:17px}.count strong{font-size:27px}.next{text-align:center;margin-top:7px;padding:8px 0 11px;border-bottom:1px solid #eee5d8;font-weight:800;font-size:14px}.next strong{color:#087a3d;font-size:20px;margin-left:8px}.grown{text-align:center;padding-top:11px;font-size:14px;font-weight:800}.grown strong{font-size:28px;color:#087a3d;margin:0 5px}.sona{display:flex;align-items:center;gap:9px;margin:9px 13px}.sona img{width:98px;height:116px;object-fit:contain}.bubble{flex:1;background:#fffdf9;border:1.5px solid #e7d7b8;border-radius:22px;padding:13px 14px}.bubble b{color:#087a3d;font-size:15px}.bubble p{margin:4px 0 0;line-height:1.55;font-size:12px}.tip{margin:8px 15px 10px;background:#edf6da;border:1px solid #d7e6bc;border-radius:999px;padding:9px;text-align:center;color:#477049;font-size:11px;font-weight:800}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:67px;background:#fffffff7;border-top:1px solid #e4eadf;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#52665a;font-size:21px;padding:6px 2px 4px}.nav small{display:block;font-size:8px;font-weight:800}.nav .home{color:#087a3d}@media(max-width:390px){.world{height:300px}.stage{min-width:280px;font-size:13.5px}.panel{margin-left:10px;margin-right:10px;padding:16px}}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='./index.html?v=116'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" id="help">?</button></header><section class="world"><img id="forestBg" class="forest-bg" alt=""><div id="stage" class="stage"></div></section><section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div></section><section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div></main><nav class="nav"><button class="home" onclick="location.href='./index.html?v=116'">🏠<small>ホーム</small></button><button onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav><script>async function loadForest(){try{const r=await fetch('./assets/yell-forest-bg-q85.txt?v=116',{cache:'no-store'});if(!r.ok)throw Error(r.status);const b=(await r.text()).replace(/\s+/g,'');await new Promise((ok,ng)=>{forestBg.onload=ok;forestBg.onerror=ng;forestBg.src='data:image/jpeg;base64,'+b});forestBg.classList.add('ready')}catch(e){console.error('forest',e)}}async function loadSona(){try{const r=await fetch('../assets/sonapi-official-b64.txt?v=1',{cache:'no-store'});if(!r.ok)throw Error(r.status);sonaImg.src='data:image/webp;base64,'+(await r.text()).replace(/\s+/g,'')}catch(e){console.error('sona',e)}}function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function label(n){return n>=35?'もうすぐ大樹になりそう！ 🌳':n>=20?'立派な木になってきたよ 🌿':n>=10?'小さな木に育ったよ 🌱':n>=3?'若い木が育ってきたよ 🌱':'小さな芽からスタート 🌱'}function render(){const s=state();let c=Math.max(0,Math.min(49,Number(s.yell)||0)),g=Math.max(0,Number(s.bigTrees)||Number(s.big_trees)||0);grown.textContent=g;current.textContent=c;bar.style.width=c/50*100+'%';stage.textContent=label(c);next.innerHTML='次の大樹になるまで <strong>あと '+(50-c)+'YELL！</strong>';cheer.textContent=c>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}loadForest();loadSona();render();help.onclick=()=>alert('YELLを50集めると大樹が1本完成し、また0YELLから次の木を育てます。');addEventListener('pageshow',()=>{scrollTo(0,0);render()});addEventListener('focus',render);addEventListener('storage',render);</script></body></html>
