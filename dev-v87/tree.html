unk.right{right:-13px;transform:rotate(-7deg)}.beam{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:250px;height:280px;background:linear-gradient(180deg,rgba(255,255,224,.95),rgba(245,255,188,.45) 48%,rgba(255,255,255,0));clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);filter:blur(8px);z-index:1}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fffbd7;box-shadow:0 0 12px 5px rgba(255,248,172,.6);z-index:2}.s1{left:22%;top:27%}.s2{left:31%;top:45%}.s3{right:24%;top:31%}.s4{right:31%;top:52%}.s5{left:46%;top:20%}.tree-wrap{position:absolute;left:50%;bottom:44px;width:214px;height:220px;transform:translateX(-50%);z-index:4;filter:drop-shadow(0 8px 10px rgba(31,87,44,.25))}.tree-img{position:absolute;inset:-84px -120px auto -120px;width:454px;height:312px;object-fit:cover;object-position:center center;clip-path:ellipse(28% 45% at 50% 53%);transform-origin:50% 72%;transition:transform .35s ease,opacity .25s ease}.leaf-start{position:absolute;inset:0;display:grid;place-items:center;font-size:60px;filter:drop-shadow(0 6px 8px rgba(79,125,53,.25));transition:opacity .25s ease}.stage{position:absolute;z-index:7;left:50%;bottom:8px;transform:translateX(-50%);min-width:290px;text-align:center;background:#fff;border-radius:999px;padding:9px 20px;color:#087a3d;font-weight:900;font-size:15px;box-shadow:0 5px 14px #426b3b24}.panel{margin:0 12px 12px;padding:18px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 9px 24px #2a4c261a;border:1px solid #eff0e9;border-top:0}.panel h2{margin:0 0 12px;color:#08773c;font-size:21px}.rule{text-align:center;background:#eff7e7;border-radius:13px;padding:9px;font-weight:900;color:#54715b;font-size:12px}.meter{height:13px;margin:11px 0 7px;border-radius:99px;background:linear-gradient(90deg,#e8eadf,#f5dfbd);overflow:hidden}.meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#078d40,#63bd63)}.count{text-align:center;color:#087a3d;font-weight:900;font-size:17px}.count strong{font-size:27px}.next{text-align:center;margin-top:7px;padding:8px 0 11px;border-bottom:1px solid #eee5d8;font-weight:800;font-size:14px}.next strong{color:#087a3d;font-size:20px;margin-left:8px}.grown{text-align:center;padding-top:11px;font-size:14px;font-weight:800}.grown strong{font-size:28px;color:#087a3d;margin:0 5px}.sona{display:flex;align-items:center;gap:9px;margin:9px 13px}.sona img{width:98px;height:116px;object-fit:contain}.bubble{flex:1;background:#fffdf9;border:1.5px solid #e7d7b8;border-radius:22px;padding:13px 14px}.bubble b{color:#087a3d;font-size:15px}.bubble p{margin:4px 0 0;line-height:1.55;font-size:12px}.tip{margin:8px 15px 10px;background:#edf6da;border:1px solid #d7e6bc;border-radius:999px;padding:9px;text-align:center;color:#477049;font-size:11px;font-weight:800}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:67px;background:#fffffff7;border-top:1px solid #e4eadf;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#52665a;font-size:21px;padding:6px 2px 4px}.nav small{display:block;font-size:8px;font-weight:800}.nav .home{color:#087a3d}@media(max-width:390px){.world{height:280px}.stage{min-width:265px;font-size:13.5px}.panel{margin-left:10px;margin-right:10px;padding:16px}}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='./index.html?v=113'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" id="help">?</button></header><section class="world"><div class="trunk left"></div><div class="trunk right"></div><div class="beam"></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><div class="tree-wrap"><img id="treeImg" class="tree-img" alt=""><div id="leafStart" class="leaf-start">🍃</div></div><div id="stage" class="stage"></div></section><section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div></section><section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div></main><nav class="nav"><button class="home" onclick="location.href='./index.html?v=113'">🏠<small>ホーム</small></button><button onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav><script>async function loadTree(){try{const r=await fetch('./assets/yell-q20-full.txt?v=113',{cache:'no-store'});if(!r.ok)throw Error(r.status);treeImg.src='data:image/jpeg;base64,'+(await r.text()).replace(/\s+/g,'')}catch(e){console.error('tree',e)}}async function loadSona(){try{const r=await fetch('../assets/sonapi-official-b64.txt?v=1',{cache:'no-store'});if(!r.ok)throw Error(r.status);sonaImg.src='data:image/webp;base64,'+(await r.text()).replace(/\s+/g,'')}catch(e){console.error('sona',e)}}function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function label(n){return n>=35?'もうすぐ大樹になりそう！ 🌳':n>=20?'立派な木になってきたよ 🌿':n>=10?'小さな木に育ったよ 🌱':n>=3?'若い木が育ってきたよ 🌱':'小さな芽からスタート 🌱'}function render(){const s=state();let c=Math.max(0,Math.min(49,Number(s.yell)||0)),g=Math.max(0,Number(s.bigTrees)||Number(s.big_trees)||0);grown.textContent=g;current.textContent=c;bar.style.width=c/50*100+'%';stage.textContent=label(c);next.innerHTML='次の大樹になるまで <strong>あと '+(50-c)+'YELL！</strong>';cheer.textContent=c>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';if(c<3){leafStart.style.opacity='1';treeImg.style.opacity='0'}else{leafStart.style.opacity='0';treeImg.style.opacity='1';const sc=c<10?.50:c<20?.68:c<35?.86:1;treeImg.style.transform='scale('+sc+')'}}loadTree();loadSona();render();help.onclick=()=>alert('YELLを50集めると大樹が1本完成し、また0YELLから次の木を育てます。');addEventListener('pageshow',()=>{scrollTo(0,0);render()});addEventListener('focus',render);addEventListener('storage',render);</script></body></html>
