y=`<path d="M120 244 C116 207 120 169 122 139" stroke="url(#wood)" stroke-width="16" stroke-linecap="round"/><path d="M120 197 C96 178 84 163 73 148" stroke="url(#wood)" stroke-width="7" stroke-linecap="round"/><path d="M124 185 C147 168 160 153 174 136" stroke="url(#wood)" stroke-width="7" stroke-linecap="round"/><path d="M57 148 C48 121 67 100 91 101 C95 80 116 69 134 81 C150 65 177 77 179 100 C202 101 214 121 204 140 C216 160 201 181 179 179 C168 198 144 203 125 191 C106 205 79 195 75 178 C55 177 44 162 57 148Z" fill="url(#green)" stroke="#287f30" stroke-width="3"/>`}else if(n<35){body=`<path d="M120 245 C113 200 119 151 121 111" stroke="url(#wood)" stroke-width="22" stroke-linecap="round"/><path d="M119 186 C89 164 78 147 61 128" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/><path d="M124 170 C151 149 168 132 185 111" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/><path d="M118 150 C103 132 96 115 92 98" stroke="url(#wood)" stroke-width="7" stroke-linecap="round"/><path d="M41 128 C27 94 51 67 81 68 C84 42 108 27 131 40 C149 19 181 34 185 61 C214 62 229 87 216 110 C232 134 213 161 184 159 C173 185 143 191 121 176 C98 194 65 181 61 157 C34 157 22 141 41 128Z" fill="url(#green)" stroke="#257b2e" stroke-width="3"/>`}else{body=`<path d="M120 246 C108 194 116 139 120 88" stroke="url(#wood)" stroke-width="28" stroke-linecap="round"/><path d="M117 181 C84 155 70 136 51 111" stroke="url(#wood)" stroke-width="11" stroke-linecap="round"/><path d="M124 164 C157 140 177 119 196 94" stroke="url(#wood)" stroke-width="11" stroke-linecap="round"/><path d="M117 137 C97 116 89 97 84 75" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/><path d="M126 132 C145 110 153 90 158 69" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/><path d="M31 115 C16 79 42 49 75 50 C78 20 105 4 132 21 C151 -1 188 13 193 46 C225 47 243 76 229 102 C247 129 225 160 193 158 C181 190 145 198 120 179 C95 201 57 186 52 157 C22 157 8 132 31 115Z" fill="url(#green)" stroke="#23772b" stroke-width="3"/>`;}let extras='';const mode=localStorage.getItem('sonayell_tree_special')||'';if(n>=40&&mode==='flower')extras=`<g fill="#f5a6ba" stroke="#fff" stroke-width="1"><circle cx="78" cy="86" r="6"/><circle cx="155" cy="67" r="6"/><circle cx="186" cy="116" r="6"/><circle cx="102" cy="139" r="5"/></g>`;if(n>=40&&mode==='fruit')extras=`<g fill="#ef7052" stroke="#c84c38" stroke-width="1"><circle cx="88" cy="105" r="7"/><circle cx="151" cy="93" r="7"/><circle cx="177" cy="132" r="6"/></g>`;return `<svg viewBox="0 0 240 270" aria-label="YELLの木">${defs}${body}${extras}</svg>`}function label(n){if(n>=50)return'大樹に成長したよ！ 🌳';if(n>=35)return'もうすぐ大樹になりそう！ 🌳';if(n>=20)return'立派な木になってきたよ 🌿';if(n>=10)return'小さな木に育ったよ 🌱';if(n>=3)return'若い木が育ってきたよ 🌱';return'小さな芽からスタート 🌱'}function render(){const s=getState(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur;grownEl.textContent=grown;current.textContent=shown;bar.style.width=(shown/50*100)+'%';stage.textContent=label(shown);treeSpot.innerHTML=treeSVG(shown);next.innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';cheer.textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。'}const grownEl=document.getElementById('grown');help.onclick=()=>alert('YELLが増えると木そのものが段階的に成長するよ。50YELLで大樹1本！');loadArt();render();addEventListener('pageshow',render);addEventListener('focus',render);addEventListener('storage',render);</script></body></html>
