<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#087a3d"><title>私のYELLの木｜そなYELL開発版</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f7f8f1;color:#284735;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}button{font:inherit}.app{width:min(100%,430px);margin:auto;min-height:100vh;background:linear-gradient(#f8fbf2,#fffdf8);padding-bottom:76px;overflow:hidden}.top{height:66px;background:#087a3d;color:#fff;display:flex;align-items:center;padding:0 17px;position:relative}.back{border:0;background:none;color:#fff;font-weight:900;font-size:18px;padding:10px 0}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap}.help{margin-left:auto;width:43px;height:43px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:900}.world{position:relative;height:330px;overflow:hidden;background:#bde8f6}.forest{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.16) contrast(1.08);transform:scale(1.01)}.treeSpot{position:absolute;left:50%;bottom:43px;width:230px;height:255px;transform:translateX(-50%);display:grid;place-items:end center;filter:drop-shadow(0 6px 4px rgba(45,70,30,.18))}.treeSpot svg{width:100%;height:100%;overflow:visible}.stage{position:absolute;z-index:4;left:50%;bottom:12px;transform:translateX(-50%);min-width:270px;text-align:center;background:rgba(255,255,255,.96);border-radius:999px;padding:9px 18px;color:#087a3d;font-weight:900;font-size:15px;box-shadow:0 4px 12px rgba(40,80,40,.14)}.panel{margin:0 12px 12px;padding:18px 18px 16px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(42,76,38,.10)}.panel h2{margin:0 0 12px;color:#08773c;font-size:21px}.rule{text-align:center;background:#eff7e7;border-radius:13px;padding:9px;font-weight:900;color:#54715b;font-size:12px}.meter{height:13px;margin:11px 0 7px;border-radius:99px;background:#f3e2c5;overflow:hidden}.meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#078d40,#63bd63)}.count{text-align:center;color:#087a3d;font-weight:900;font-size:17px}.count strong{font-size:26px}.next{text-align:center;margin-top:7px;padding:8px 0 11px;border-bottom:1px solid #eee5d8;font-weight:800;font-size:14px}.next strong{color:#087a3d;font-size:19px;margin-left:8px}.grown{text-align:center;padding-top:11px;font-size:14px;font-weight:800}.grown strong{font-size:27px;color:#087a3d;margin:0 5px}.sona{display:flex;align-items:center;gap:9px;margin:9px 13px}.sona img{width:92px;height:110px;object-fit:contain}.bubble{position:relative;flex:1;background:#fffdf9;border:1.5px solid #e7d7b8;border-radius:21px;padding:13px 14px}.bubble b{color:#087a3d;font-size:15px}.bubble p{margin:4px 0 0;line-height:1.55;font-size:12px}.tip{margin:8px 15px 10px;background:#edf6da;border:1px solid #d7e6bc;border-radius:999px;padding:9px;text-align:center;color:#477049;font-size:11px;font-weight:800}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:67px;background:rgba(255,255,255,.97);border-top:1px solid #e4eadf;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#52665a;font-size:21px;padding:6px 2px 4px}.nav small{display:block;font-size:8px;font-weight:800;margin-top:1px}.nav .home{color:#087a3d}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='./index.html?v=88'">‹ 戻る</button><div class="title">私のYELLの木</div><div class="help">?</div></header><section class="world"><img id="forest" class="forest" alt="森の仲間たち"><div class="treeSpot"><svg id="treeSvg" viewBox="0 0 240 270" aria-label="成長するYELLの木"><defs><linearGradient id="trunk" x1="0" x2="1"><stop stop-color="#7a4c25"/><stop offset=".52" stop-color="#a36b32"/><stop offset="1" stop-color="#6b421f"/></linearGradient><linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83c83e"/><stop offset="1" stop-color="#2f932f"/></linearGradient></defs><g id="branches" fill="none" stroke="url(#trunk)" stroke-linecap="round"><path d="M120 240 C116 194 119 151 121 112" stroke-width="26"/><path d="M120 176 C98 154 82 142 65 130" stroke-width="13"/><path d="M124 164 C146 143 161 131 177 117" stroke-width="13"/><path d="M119 145 C108 125 101 111 96 94" stroke-width="10"/></g><g id="crown" fill="url(#leaf)" stroke="#27852b" stroke-width="3"><path d="M42 121 C30 91 51 64 80 63 C83 34 107 20 131 32 C149 12 181 27 183 53 C212 54 225 81 211 105 C228 128 210 156 183 156 C172 180 142 187 121 171 C98 190 67 177 63 154 C38 154 25 136 42 121Z"/></g><g id="flowers" style="display:none" fill="#f7a8bd"><circle cx="78" cy="92" r="6"/><circle cx="157" cy="73" r="6"/><circle cx="184" cy="124" r="6"/></g><g id="fruits" style="display:none" fill="#ef6b52"><circle cx="91" cy="113" r="8"/><circle cx="151" cy="105" r="8"/></g></svg></div><div id="stage" class="stage">もうすぐ大樹になりそう！ 🌳</div></section><section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数 <strong id="grown">0</strong>本</div></section><section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div></main><nav class="nav"><button class="home" onclick="location.href='./index.html?v=88'">🏠<small>ホーム</small></button><button onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav><script>async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}async function loadArt(){try{const[bg,sp]=await Promise.all([txt('../assets/tree-forest-v74.txt?v=88'),txt('../assets/sonapi-official-b64.txt?v=1')]);forest.src='data:image/jpeg;base64,'+bg;sonaImg.src='data:image/webp;base64,'+sp}catch(e){console.error(e)}}function getState(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}function label(n){if(n>=50)return'大樹に成長したよ！ 🌳';if(n>=35)return'もうすぐ大樹になりそう！ 🌳';if(n>=20)return'立派な木になってきたよ 🌿';if(n>=10)return'小さな木に育ったよ 🌱';if(n>=3)return'小さな芽が育ってきたよ 🌱';return'ここから育てていこう 🌱'}function render(){const s=getState(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,p=Math.min(1,shown/50);document.getElementById('grown').textContent=grown;document.getElementById('current').textContent=shown;document.getElementById('bar').style.width=(shown/50*100)+'%';document.getElementById('stage').textContent=label(shown);document.getElementById('next').innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';const scale=.48+.52*p;treeSvg.style.transform='scale('+scale+')';treeSvg.style.transformOrigin='50% 100%';document.getElementById('flowers').style.display=(shown>=40?'block':'none');document.getElementById('fruits').style.display=(shown>=46?'block':'none')}loadArt();render();addEventListener('pageshow',render);addEventListener('focus',render);addEventListener('storage',render);</script></body></html>
