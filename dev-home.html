ni span{font-size:8px;line-height:1.25;text-align:center;padding:6px 2px;background:#fbfcf5;border:1px solid #e3e7d8;border-radius:10px}.sos{width:100%;margin:0 0 11px;border:3px solid #ef2b2b;border-radius:18px;background:#fff;color:#d92323;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 4px 11px #d9232317;cursor:pointer}.sos .warn{font-size:34px;line-height:1}.sos b{display:block;font-size:14px;line-height:1.35}.sos strong{display:block;font-size:17px;line-height:1.35;margin-top:2px}.sos .arrow{margin-left:auto;font-size:26px;font-weight:900}.cards{display:grid;gap:9px;position:relative;z-index:2}.card{width:100%;min-height:82px;border:1px solid #d9e5ce;border-radius:20px;padding:11px 14px;background:#fff;box-shadow:0 6px 14px #24582d1c;display:flex;align-items:center;gap:12px;text-align:left;color:#174d31;cursor:pointer;transition:.13s}.card:active{transform:scale(.986)}.ico{width:52px;height:52px;flex:0 0 52px;border-radius:17px;background:#eff9e8;display:grid;place-items:center;font-size:31px}.copy{flex:1;min-width:0}.copy b{display:block;font-size:17px;margin-bottom:4px}.copy small{display:block;color:#66766c;font-size:10.5px;line-height:1.4}.go{font-size:27px;font-weight:900;color:#16854a}.posts{background:#fff4fb}.posts .ico{background:#ffe6f1}.posts b,.posts .go{color:#b52970}.quiz{min-height:103px;background:linear-gradient(135deg,#fffbe4,#effbd8);border:2px solid #86bf5e}.quiz .ico{background:#fff4c9}.quiz b{color:#177a3f}.badges{display:flex;gap:4px;margin-bottom:3px}.tag{font-style:normal;font-size:8.5px;border-radius:999px;padding:3px 7px;background:#13974a;color:#fff;font-weight:900}.new{background:#ff523b}.count{background:#fff;border:1.5px solid #8bc468;border-radius:999px;padding:7px 8px;font-size:11px;font-weight:900;white-space:nowrap}.prepare{background:#fffaf0}.prepare b,.prepare .go{color:#b86612}.disaster{background:#eef8ff}.disaster b,.disaster .go{color:#126baa}.footer{height:66px;margin:15px -12px -34px;background:linear-gradient(#e6f7b9,#cee99d);position:relative}.footer:before{content:"🌱　🌿　🌱　🌿　🌱";position:absolute;left:0;right:0;top:18px;text-align:center;opacity:.55;font-size:13px}.devmark{position:absolute;right:5px;top:5px;z-index:12;background:#164f31df;color:#fff;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:900}@media(max-width:390px){.card{padding:10px;gap:9px}.copy b{font-size:15px}.copy small{font-size:9.5px}.ikmini span{font-size:7.5px}.sos strong{font-size:15px}.sos b{font-size:13px}}</style></head><body><main class="app"><section class="topVisual"><div class="topLoading" id="topLoading">そなYELLを表示中…🌱</div><img id="topArt" alt="そなYELLとそなピー" hidden><div class="noHitokoto" aria-hidden="true"></div><button class="hotspot profileHot" onclick="location.href='./dev-screen.html?screen=profile&v=20260828f'" aria-label="マイページ"></button><button class="hotspot bellHot" id="bell" aria-label="お知らせ"></button><span class="devmark">開発版</span></section><section class="imakoko"><div class="imakokoTop"><span>📍</span><span class="iktitle">イマココ</span><span class="iksub">災害時、地域のコミュニティの入口になるよ</span><span class="pending">準備中</span></div><div class="ikmini"><span>🛒<br>スーパー</span><span>⛽<br>ガソリンスタンド</span><span>🏠<br>避難所</span><span>💬<br>掲示板</span></div></section><button class="sos" onclick="location.href='./dev-screen.html?screen=water&v=20260828f'"><span class="warn">⚠️</span><span><b>車で水没してしまった時は…</b><strong>命を守る脱出手順を確認</strong></span><span class="arrow">›</span></button><section class="cards"><button class="card posts" onclick="location.href='./dev-screen.html?screen=posts&v=20260828f'"><span class="ico">📣</span><span class="copy"><b>みんなの防災投稿</b><small>あなたの工夫や備えをシェアしよう！</small></span><span class="go">›</span></button><button class="card quiz" onclick="location.href='./dev-screen.html?screen=quiz&v=20260828f'"><span class="ico">🎓</span><span class="copy"><span class="badges"><i class="tag new">NEW</i><i class="tag">今月のテーマ</i></span><b>8月の防災クイズ</b><small>「台風
