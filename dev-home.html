iz{min-height:103px;background:linear-gradient(135deg,#fffbe4,#effbd8);border:2px solid #86bf5e}.quiz .ico{background:#fff4c9}.quiz b{color:#177a3f}.badges{display:flex;gap:4px;margin-bottom:3px}.tag{font-style:normal;font-size:8.5px;border-radius:999px;padding:3px 7px;background:#13974a;color:#fff;font-weight:900}.new{background:#ff523b}.count{background:#fff;border:1.5px solid #8bc468;border-radius:999px;padding:7px 8px;font-size:11px;font-weight:900;white-space:nowrap}.prepare{background:#fffaf0}.prepare b,.prepare .go{color:#b86612}.disaster{background:#eef8ff}.disaster b,.disaster .go{color:#126baa}.tamaponProposal{margin:16px 0 8px;border-radius:24px;background:#fff;padding:9px;box-shadow:0 7px 18px #2c673326;border:1px solid #d7e9c9}.tamaponHead{display:flex;align-items:center;gap:8px;padding:5px 5px 9px}.tamaponHead b{font-size:15px;color:#117841}.tamaponHead span{margin-left:auto;font-size:9px;font-weight:900;color:#8a6d2b;background:#fff2b9;border-radius:999px;padding:4px 7px}.tamaponFrame{border-radius:19px;overflow:hidden;background:#eff8e8;position:relative}.tamaponFrame img{display:block;width:100%;height:auto}.tamaLoading{padding:26px 10px;text-align:center;font-size:12px;color:#59835f;font-weight:900}.tamaNote{text-align:center;color:#718074;font-size:9px;padding:8px 4px 2px}.footer{height:66px;margin:15px -12px -34px;background:linear-gradient(#e6f7b9,#cee99d);position:relative}.footer:before{content:"🌱　🌿　🌱　🌿　🌱";position:absolute;left:0;right:0;top:18px;text-align:center;opacity:.55;font-size:13px}.devmark{position:absolute;right:5px;top:5px;z-index:12;background:#164f31df;color:#fff;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:900}@media(max-width:390px){.card{padding:10px;gap:9px}.copy b{font-size:15px}.copy small{font-size:9.5px}.ikmini span{font-size:7.5px}.sos strong{font-size:15px}.sos b{font-size:13px}.profileBadge{font-size:27px}}</style></head><body><main class="app"><section class="topVisual"><div class="topLoading" id="to /span><span class="go">›</span></button></section><section class="tamaponProposal"><div class="tamaponHead"><b>🐉 さいたま市連携・たまポン提案</b><span>イメージ</span></div><div class="tamaponFrame"><div id="tamaLoading" class="tamaLoading">たまポンカウンターを表示中…</div><img id="tamaArt" alt="ヌゥのたまポンカウンター提案イメージ" hidden></div><div class="tamaNote">※現在はさいたま市への連携提案用・固定イメージです</div></section><div class="footer"></div></main><script>async function loadTop(){try{const parts=[];for(let i=0;i<4;i++){const r=await fetch('./assets/v62c'+i+'.txt?v=20260828g',{cache:'no-store'});if(!r.ok)throw new Error('画像 '+i);parts.push((await r.text()).replace(/\s+/g,''))}const img=document.getElementById('topArt');img.onload=()=>{img.hidden=false;document.getElementById('topLoading').style.display='none'};img.src='data:image/webp;base64,'+parts.join('')}catch(e){document.getElementById('topLoading').textContent='画像を読み込めませんでした'}}async function loadTamapon(){try{const r=await fetch('./assets/tamapon-counter-nuu.b64.txt?v=20260828g',{cache:'no-store'});if(!r.ok)throw new Error('tama');const b=(await r.text()).replace(/\s+/g,'');const img=document.getElementById('tamaArt');img.onload=()=>{img.hidden=false;document.getElementById('tamaLoading').style.display='none'};img.src='data:image/webp;base64,'+b}catch(e){document.getElementById('tamaLoading').textContent='提案画面を読み込めませんでした'}}async function loadProfileAvatar(){const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx';let token=localStorage.getItem('sonayell_access_token')||'',guest=localStorage.getItem('sonayell_guest_token')||'';try{if(!guest){guest=crypto.randomUUID();localStorage.setItem('sonayell_guest_token',guest)}const h={apikey:K,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const name=token?'sona_get_my_account':'sona_get_guest_profile',body=token?{}:{p_guest_token:guest};const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:h,body:JSON.stringify(body),cache:'no-store'});if(!r.
