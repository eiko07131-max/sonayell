ight:1.8}.leg{display:flex;align-items:center;gap:7px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.blue{background:#2e78d2}.yellow{background:#e6a713}.gray{background:#8a8f8b}.red{background:#d7443f}.help{padding:10px 14px;color:#5f6f64;font-size:11px;line-height:1.55}.help b{color:#1e6538}.fuelpin{width:40px;height:40px;border-radius:50% 50% 50% 9px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 10px #233a2c55}.fuelpin span{transform:rotate(45deg);font-size:19px}.userdot{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid #1c6fca;box-shadow:0 0 0 4px #2d7bd133}.leaflet-popup-content-wrapper{border-radius:15px}.leaflet-popup-content{margin:10px 12px;min-width:220px}.pinname{font-size:16px;font-weight:900;line-height:1.4}.pinaddr{margin-top:3px;font-size:10px;color:#68766d;line-height:1.4}.pinstate{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;font-weight:900}.pinstate i{width:11px;height:11px;border-radius:50%}.pinbtn{width:100%;margin-top:9px;border:0;border-radius:10px;padding:10px;background:#1f7842;color:#fff;font-weight:900}.sheetback{position:fixed;inset:0;z-index:950;background:#16352270;display:none;align-items:flex-end;justify-content:center}.sheetback.show{display:flex}.sheet{width:min(100%,560px);max-height:88vh;overflow:auto;background:#f7faf6;border-radius:24px 24px 0 0;padding:0 14px 26px}.sheethead{position:sticky;top:0;z-index:3;background:#f7faf6;padding:13px 0 10px;border-bottom:1px solid #dfe7dc;display:flex;align-items:center;gap:9px}.stationicon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff}.stationtitle{flex:1;min-width:0}.stationtitle b{display:block;font-size:18px;line-height:1.3}.stationtitle small{font-size:10px;color:#68776d}.close{width:38px;height:38px;border:0;border-radius:50%;background:#e8f0e6;font-size:22px;color:#28573a}.addresscard,.current{margin-top:11px;border-radius:15px;padding:12px;background:#fff;border:1px solid #dde5da}.addresscard b,.currenttitle{display:block;color:#245b37;font-size:15px;font-weight:900;margin-bottom:5px}.addressnote{margin-top:5px;font-size:9px;color:#7b857f}.current.danger{background:#fff0ef;border:2px solid #d7443f;box-shadow:0 0 0 2px #ffe4e2 inset}.current.danger .currenttitle{color:#b62d29}.currentmsg{margin-top:7px;font-size:12px;line-height:1.55;color:#516257}.statebadge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.statebadge.info{background:#e8f2ff;color:#1d62a7}.statebadge.changed{background:#fff3ce;color:#875c00}.statebadge.none{background:#eff1ef;color:#666d68}.statebadge.danger{background:#d7443f;color:#fff}.sectiontitle{margin:15px 2px 8px;font-size:15px;font-weight:900;color:#1e6338}.empty{padding:17px 12px;border-radius:14px;background:#fff;color:#76827a;text-align:center;font-size:12px;border:1px solid #e2e8e0}.post{margin-top:9px;border:1px solid #dde6da;border-radius:15px;background:#fff;padding:11px}.postmsg{font-size:14px;line-height:1.55;white-space:pre-wrap}.postmeta{margin-top:7px;font-size:10px;color:#718078;line-height:1.5}.counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;font-size:10px;font-weight:900}.count{border-radius:999px;padding:5px 7px;background:#eef5eb;color:#32643e}.count.warn{background:#fff0ca;color:#8a5b00}.postactions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.act{border:1px solid #cfe0cc;border-radius:11px;padding:9px 5px;background:#f7fcf6;color:#2b6f3d;font-size:11px;font-weight:900}.act.changed{background:#fff8e8;border-color:#e6cf94;color:#855f08}.replytoggle{width:100%;margin-top:8px;border:0;border-radius:11px;padding:9px;background:#f2f5f2;color:#3b6348;font-size:11px;font-weight:900}.thread{display:none;margin-top:8px;padding-top:7px;border-top:1px dashed #d2dcd0}.thread.open{display:block}.replies{display:flex;flex-direction:column;gap:8px}.rrow{display:flex;flex-direction:column;max-width:84%}.rrow.other{align-self:flex-start}.rrow.mine{align-self:flex-end;align-items:flex-end}.rmeta{font-size:9px;color:#748078;margin:0 5px 3px}.you{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;background:#d8ebff;color:#266caf;font-size:8px;font-weight:900}.bubble{padding:9px 11px;border-radius:15px;font-size:12px;line-height:1.5;white-space:pre-wrap}.rrow.other .bubble{background:#fff;border:1px solid #dde5da}.rrow.mine .bubble{background:#e5f2ff;border:1px solid #a9cdeb;color:#24567d}.replyform{margin-top:10px;border:2px solid #7fb5e6;background:#eef7ff;border-radius:14px;padding:10px}.replyform h4{margin:0 0 7px;color:#246aa7;font-size:13px}.field{display:block;margin-top:9px;font-size:11px;font-weight:900;color:#345c42}.input,.textarea{width:100%;margin-top:5px;border:1.5px solid #b7cee1;border-radius:11px;padding:10px;background:#fff}.textarea{min-height:75px}.send{width:100%;margin-top:8px;border:0;border-radius:11px;padding:10px;background:#2c78bd;color:#fff;font-weight:900}.postform{margin-top:9px;border:1px solid #cfe0cc;background:#f2f8ef;border-radius:15px;padding:11px}.quick{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.chip{border:1px solid #bcd4b9;border-radius:999px;padding:6px 8px;background:#fff;color:#346643;font-size:10px;font-weight:900}.postbtn{width:100%;margin-top:9px;border:0;border-radius:12px;padding:11px;background:#1e7c43;color:#fff;font-weight:900}.smallnote{margin-top:7px;color:#748078;font-size:9px;line-height:1.45}.toast{position:fixed;left:50%;top:70px;z-index:1100;transform:translate(-50%,-10px);opacity:0;background:#1f7b3d;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<main class="app">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="title">イマココ 地図テスト</div><div class="mode">🧪 TEST OPEN</div></header>
<section class="hero"><div class="query"><span class="glass">🔎</span><div><b>近くのガソリンスタンド</b><div class="sub">行政区をまたいで、現在地周辺から探します。</div></div></div><div class="controls"><button id="locate" class="locbtn">📍 現在地から探す</button><select id="radius" class="radius"><option value="3000" selected>3km</option><option value="5000">5km</option><option value="8000">8km</option></select></div><div class="privacy">🔒 現在地は周辺検索にだけ使い、そなYELLには保存しません。店舗検索が一時失敗しても、前回取得した地図は残します。</div></section>
<section class="mapwrap"><div id="mapstatus" class="mapstatus">地図を準備しています…</div><div id="map"></div><div class="legend"><div class="leg"><span class="dot blue"></span>情報あり</div><div class="leg"><span class="dot yellow"></span>状況変更あり</div><div class="leg"><span class="dot gray"></span>情報なし</div><div class="leg"><span class="dot red"></span>危険（赤は危険専用）</div></div></section>
<div class="help"><b>ピンをタップ</b> → 店名・状態を確認 → <b>詳細を見る</b>で住所・投稿・返信へ進みます。</div>
</main>
<div id="sheetback" class="sheetback"><section id="sheet" class="sheet"><div class="sheethead"><div id="stationicon" class="stationicon">⛽</div><div class="stationtitle"><b id="stationname"></b><small>ガソリンスタンド詳細</small></div><button id="closeSheet" class="close">×</button></div><div id="addresscard" class="addresscard"></div><div id="current" class="current"></div><div class="sectiontitle">💬 この場所のイマココ情報</div><div id="postlist"></div><div class="sectiontitle">✏️ この場所の今を投稿する</div><div class="postform"><label class="field">あなたの表示名（ニックネーム）<input id="postname" class="input" maxlength="30" placeholder="例：えーさん"></label><div class="quick"><button class="chip" data-text="営業中で、給油できました。">営業中・給油可</button><button class="chip" data-text="今は少し並んでいます。">少し並んでいる</button><button class="chip" data-text="かなり並んでいます。">かなり混雑</button><button class="chip" data-text="今は給油できないようです。">給油できない</button></div><label class="field">今の状況<textarea id="postmsg" class="textarea" maxlength="280"></textarea></label><button id="postbtn" class="postbtn">この内容で投稿する</button><div class="smallnote">⚠️ 地域投稿・未確認。ガソリン情報は4時間で自動終了します。</div></div></section></div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',REGION='saitama-map-test',CACHE='imakoko_gas_stations_v2';
let token=localStorage.getItem('imakoko_test_guest');if(!token){token=crypto.randomUUID();localStorage.setItem('imakoko_test_guest',token)}
const $=id=>document.getElementById(id);let center=[35.871,139.683],stations=[],posts=[],replies=[],selected=null,markers=[],userMarker=null;const openThreads=new Set();
const map=L.map('map',{zoomControl:true}).setView(center,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}function status(m,hide=false){$('mapstatus').textContent=m;$('mapstatus').classList.toggle('hide',hide)}
async function rpc(name,body){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body||{}),cache:'no-store'});const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
function jpTime(iso){const d=new Date(iso),p=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),g=x=>p.find(v=>v.type===x)?.value||'';return`${+g('month')}月${+g('day')}日 ${g('hour')}時${g('minute')}分`}
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,A=r(c-a),B=r(d-b),q=Math.sin(A/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function stationPosts(s){return posts.filter(p=>p.category==='gas'&&p.place_key===s.key)}function dangerNear(s){return posts.filter(p=>p.category==='road'&&p.latitude!=null&&p.longitude!=null&&dist(s.lat,s.lon,p.latitude,p.longitude)<=150)}function stateOf(s){const ps=stationPosts(s),dg=dangerNear(s);if(dg.length)return{key:'danger',label:'危険情報あり',color:'#d7443f',ico:'🔴'};if(ps.some(p=>+p.change_count>0))return{key:'changed',label:'状況変更あり',color:'#e6a713',ico:'🟡'};if(ps.length)return{key:'info',label:'情報あり',color:'#2e78d2',ico:'🔵'};return{key:'none',label:'情報なし',color:'#8a8f8b',ico:'⚪'}}
async function loadData(){try{[posts,replies]=await Promise.all([rpc('imakoko_test_list_map_posts',{p_region_key:REGION,p_guest_token:token}),rpc('imakoko_test_list_replies_v2',{p_region_key:REGION,p_guest_token:token})]);posts=posts||[];replies=replies||[]}catch(e){posts=[];replies=[]}}
function norm(s){return String(s||'').normalize('NFKC').trim().toLowerCase()}function same(a,b){return norm(a)===norm(b)}
function cleanName(t){const brand=t['brand:ja']||t.brand||'',official=t['official_name:ja']||t.official_name||'',branch=t.branch||'',ja=t['name:ja']||'',name=t.name||'',op=t.operator||'';let base=official||ja||name||branch||brand||op||'ガソリンスタンド';if(brand&&same(base,brand))return brand;if(brand&&base&&!norm(base).includes(norm(brand)))return brand+' '+base;return base}
function addressTags(t){if(t['addr:full'])return t['addr:full'];return[t['addr:province'],t['addr:city'],t['addr:ward'],t['addr:suburb'],t['addr:quarter'],t['addr:neighbourhood'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join('')}
function localityTags(t){return t['addr:suburb']||t['addr:quarter']||t['addr:neighbourhood']||t['addr:ward']||''}
function parse(data){return(data.elements||[]).map(e=>{const t=e.tags||{},lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;if(lat==null||lon==null)return null;return{key:`osm:${e.type}/${e.id}`,name:cleanName(t),brand:t['brand:ja']||t.brand||'',address:addressTags(t),locality:localityTags(t),lat,lon,enriched:false}}).filter(Boolean).slice(0,100)}
function shown(s){if(s.name&&(!s.brand||!same(s.name,s.brand)))return s.name;if(s.brand&&s.locality)return`${s.brand}（${s.locality}周辺）`;return s.name||s.brand||'ガソリンスタンド'}
function addrFrom(a){return[a.state||a.province,a.city||a.town||a.village||a.municipality,a.city_district||a.borough,a.suburb||a.quarter||a.neighbourhood,a.road,a.house_number].filter(Boolean).join('')}
async function enrich(s){if(s.enriched)return s;try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${s.lat}&lon=${s.lon}&zoom=18&addressdetails=1&namedetails=1&accept-language=ja`);if(r.ok){const j=await r.json(),a=j.address||{},n=j.namedetails||{},candidate=n['name:ja']||n.name||j.name||'';s.address=s.address||addrFrom(a)||j.display_name||'';s.locality=s.locality||a.suburb||a.quarter||a.neighbourhood||a.city_district||'';if(candidate&&!same(candidate,s.brand)&&!same(candidate,s.name)){s.name=s.brand&&!norm(candidate).includes(norm(s.brand))?`${s.brand} ${candidate}`:candidate}}}catch(e){}s.enriched=true;return s}
async function overpass(lat,lon,radius){const q=`[out:json][timeout:18];(node[\"amenity\"=\"fuel\"](around:${radius},${lat},${lon});way[\"amenity\"=\"fuel\"](around:${radius},${lat},${lon});relation[\"amenity\"=\"fuel\"](around:${radius},${lat},${lon}););out center tags;`,eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];let last;for(const ep of eps){try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw Error(r.status);return await r.json()}catch(e){last=e}}throw last}
function icon(st){return L.divIcon({className:'',iconSize:[42,42],iconAnchor:[20,40],html:`<div class="fuelpin" style="background:${st.color}"><span>⛽</span></div>`})}function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function popup(s){const st=stateOf(s);return`<div class="pinname">${esc(shown(s))}</div>${s.address?`<div class="pinaddr">${esc(s.address)}</div>`:''}<div class="pinstate"><i style="background:${st.color}"></i>${st.ico} ${st.label}</div><button class="pinbtn" onclick="openDetail('${s.key}')">詳細を見る ＞</button>`}
function draw(){clearMarkers();stations.forEach(s=>{const m=L.marker([s.lat,s.lon],{icon:icon(stateOf(s))}).addTo(map);m.bindPopup(popup(s),{offset:[0,-28]});m.on('popupopen',async()=>{await enrich(s);m.setPopupContent(popup(s))});markers.push(m)})}
function saveCache(lat,lon,r){try{localStorage.setItem(CACHE,JSON.stringify({at:Date.now(),lat,lon,r,stations}))}catch(e){}}function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c&&Array.isArray(c.stations)&&c.stations.length)return c}catch(e){}return null}
async function doSearch(lat,lon,retry=true){center=[lat,lon];status('周辺のガソリンスタンドを探しています…');await loadData();try{const d=await overpass(lat,lon,+$('radius').value);stations=parse(d);saveCache(lat,lon,+$('radius').value);draw();if(stations.length)map.fitBounds(L.latLngBounds(stations.map(s=>[s.lat,s.lon])).pad(.08),{maxZoom:14});status(`${stations.length}件を表示しています`,false);setTimeout(()=>status('',true),1800)}catch(e){if(retry){status('店舗情報の取得に時間がかかっています。自動で再試行します…');await new Promise(r=>setTimeout(r,1800));return doSearch(lat,lon,false)}const c=loadCache();if(c){stations=c.stations;draw();map.setView([c.lat,c.lon],13);status('店舗情報の再取得に失敗したため、前回取得した地図を表示しています。',false)}else status('店舗情報を取得できませんでした。少し待って「現在地から探す」を押してね。',false)}}
function showUser(lat,lon){if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([lat,lon],{icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:'<div class="userdot"></div>'})}).addTo(map)}
$('locate').onclick=()=>{if(!navigator.geolocation){toast('この端末ではGPSを使えません');return}status('GPSで現在地を確認しています…');navigator.geolocation.getCurrentPosition(p=>{showUser(p.coords.latitude,p.coords.longitude);doSearch(p.coords.latitude,p.coords.longitude)},err=>{status('GPSで現在地を取得できませんでした。前回の地図はそのまま残しています。');toast('位置情報の許可や電波状態を確認してね')},{enableHighAccuracy:true,timeout:9000,maximumAge:60000})};$('radius').onchange=()=>doSearch(center[0],center[1]);
function repliesFor(id){return replies.filter(r=>r.post_id===id)}function renderHeader(){const st=stateOf(selected);$('stationicon').style.background=st.color;$('stationname').textContent=shown(selected);$('addresscard').innerHTML=`<b>📍 住所</b>${selected.address?esc(selected.address):'住所を確認できませんでした。地図上の位置を確認してください。'}<div class="addressnote">※正式店舗名が地図データにある場合は店舗名まで表示。無い場合はブランド名＋周辺地域で表示します。</div>`}
function renderCurrent(){const st=stateOf(selected),gas=stationPosts(selected),dg=dangerNear(selected),box=$('current');box.className='current '+(st.key==='danger'?'danger':'');let msg='';if(st.key==='danger')msg=dg.map(p=>`⚠️ ${esc(p.message)}（${jpTime(p.created_at)}）`).join('<br>')||'⚠️ この付近に危険情報があります。';else if(gas.length){const p=[...gas].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];msg=`${esc(p.message)}<br><small>${jpTime(p.created_at)}・現地確認 ${+p.confirm_count||0}人</small>`}else msg='この場所には、まだ公開中のイマココ投稿がありません。';box.innerHTML=`<div class="currenttitle">${st.key==='danger'?'⚠️ 現在の共有（注意）':'現在の共有'}</div><span class="statebadge ${st.key}">${st.ico} ${st.label}</span><div class="currentmsg">${msg}</div>`}
function replyHtml(p){const rs=repliesFor(p.id),open=openThreads.has(p.id);return`<button class="replytoggle" data-thread="${p.id}">💬 返信を見る・書く（${rs.length}件）</button><div class="thread ${open?'open':''}"><div class="replies">${rs.map(r=>`<div class="rrow ${r.owned_by_me?'mine':'other'}"><div class="rmeta"><b>${esc(r.nickname)}</b>${r.owned_by_me?'<span class="you">あなた</span>':''} ${jpTime(r.created_at)}</div><div class="bubble">${esc(r.message)}</div></div>`).join('')||'<div class="empty">まだ返信はありません。</div>'}</div><div class="replyform"><h4>✏️ この投稿に返信する</h4><label class="field">あなたの表示名<input id="rn-${p.id}" class="input" value="${esc(localStorage.getItem('imakoko_test_nickname')||'')}"></label><label class="field">返信内容<textarea id="rm-${p.id}" class="textarea"></textarea></label><button class="send" data-reply="${p.id}">この内容で返信する</button></div></div>`}
function renderPosts(){const ps=stationPosts(selected).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('postlist').innerHTML=ps.length?ps.map(p=>`<article class="post"><div class="postmsg">${esc(p.message)}</div><div class="postmeta">🕒 ${jpTime(p.created_at)}　投稿者：${esc(p.nickname)}</div><div class="counts"><span class="count">👥 現地確認 ${+p.confirm_count||0}人</span>${+p.change_count?`<span class="count warn">🔄 状況変更 ${+p.change_count}人</span>`:''}</div><div class="postactions"><button class="act" data-confirm="${p.id}" ${p.confirmed_by_me?'disabled':''}>${p.confirmed_by_me?'✓ 確認済み':'👍 まだ同じ状況'}</button><button class="act changed" data-change="${p.id}" ${p.changed_by_me?'disabled':''}>${p.changed_by_me?'✓ 変更連絡済み':'🔄 状況が変わった'}</button></div>${replyHtml(p)}</article>`).join(''):'<div class="empty">まだ投稿はありません。</div>';bind()}
function renderSheet(){renderHeader();renderCurrent();renderPosts();$('postname').value=localStorage.getItem('imakoko_test_nickname')||'';$('postmsg').value=''}window.openDetail=async key=>{const s=stations.find(x=>x.key===key);if(!s)return;await enrich(s);selected=s;map.closePopup();renderSheet();$('sheetback').classList.add('show');requestAnimationFrame(()=>$('sheet').scrollTop=0)};$('closeSheet').onclick=()=>$('sheetback').classList.remove('show');$('sheetback').onclick=e=>{if(e.target===$('sheetback'))$('sheetback').classList.remove('show')};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>$('postmsg').value=b.dataset.text)
async function refresh(){await loadData();draw();if(selected)renderSheet()}function bind(){document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{openThreads.has(b.dataset.thread)?openThreads.delete(b.dataset.thread):openThreads.add(b.dataset.thread);renderPosts()});document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=async()=>{await rpc('imakoko_test_confirm_post',{p_post_id:b.dataset.confirm,p_guest_token:token});toast('✅ 現地確認に反映しました');await refresh()});document.querySelectorAll('[data-change]').forEach(b=>b.onclick=async()=>{if(!confirm('状況が変わったことを共有しますか？'))return;await rpc('imakoko_test_change_post',{p_post_id:b.dataset.change,p_guest_token:token});toast('🔄 状況変更に反映しました');await refresh()});document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=async()=>{const id=b.dataset.reply,n=$('rn-'+id).value.trim(),m=$('rm-'+id).value.trim();if(!n||!m)return toast('表示名と返信を入力してね');await rpc('imakoko_test_add_reply',{p_post_id:id,p_guest_token:token,p_nickname:n,p_message:m});localStorage.setItem('imakoko_test_nickname',n);openThreads.add(id);toast('✅ 返信しました！');await refresh()})}
$('postbtn').onclick=async()=>{if(!selected)return;const n=$('postname').value.trim(),m=$('postmsg').value.trim();if(!n||!m)return toast('表示名と状況を入力してね');$('postbtn').disabled=true;try{await rpc('imakoko_test_add_map_post',{p_guest_token:token,p_nickname:n,p_category:'gas',p_place:shown(selected),p_message:m,p_place_key:selected.key,p_latitude:selected.lat,p_longitude:selected.lon,p_region_key:REGION});localStorage.setItem('imakoko_test_nickname',n);toast('✅ 投稿しました！');await refresh();$('postmsg').value=''}finally{$('postbtn').disabled=false}};
(async()=>{const c=loadCache();if(c){stations=c.stations;draw();map.setView([c.lat,c.lon],13);status('前回取得した地図を表示中。最新情報を取得しています…')}await doSearch(center[0],center[1])})();
</script>
</body></html>
