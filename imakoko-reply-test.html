<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16853f">
<title>イマココ｜公開返信テスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f4f8f3;color:#24382a}
button,input,textarea{font:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;background:#fff;padding-bottom:28px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #e4ece1}.back{width:42px;height:42px;border:0;border-radius:50%;background:#eef6eb;font-size:24px;color:#22663a}.title{font-size:20px;font-weight:900;color:#194d2e}.sub{padding:14px 16px 8px}.note{background:#fff6d9;border:1px solid #e6ca77;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.55}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}.bar h2{font-size:18px;margin:0;color:#1e6037}.refresh{border:0;border-radius:999px;background:#edf6e9;color:#2b7041;padding:8px 12px;font-weight:900}.list{display:grid;gap:10px;padding:0 16px}.card{border:1px solid #dce5d9;border-radius:17px;padding:13px;background:#fff;box-shadow:0 5px 14px #234d2b10}.place{font-weight:900;font-size:17px}.msg{margin-top:6px;line-height:1.55;font-size:14px;white-space:pre-wrap}.time{margin-top:10px;border-left:4px solid #6ea958;background:#f3f9ef;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:900;color:#235d35}.meta{margin-top:6px;color:#6f7d73;font-size:11px}.resolved{margin-top:9px;background:#e4f7e8;border:1px solid #89c492;border-radius:12px;padding:8px;text-align:center;color:#176b32;font-weight:900}.threadbtn{width:100%;margin-top:10px;border:1px solid #bed6bd;border-radius:13px;background:#f2faf0;color:#20643a;padding:12px;font-weight:900}.empty{text-align:center;margin:0 16px;padding:28px 12px;border-radius:16px;background:#f7faf6;color:#7b887f}.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:#173522a8}.modal.show{display:flex}.sheet{width:min(100%,520px);max-height:94vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:16px 16px 28px}.sheettop{position:sticky;top:-16px;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#fff;padding:8px 0 10px;border-bottom:1px solid #edf1eb}.sheettop h2{margin:0;font-size:19px;color:#1c5f36}.x{width:38px;height:38px;border:0;border-radius:50%;background:#eef5eb;font-size:22px}.origin{margin-top:12px;background:#f7faf6;border:1px solid #dfe8dd;border-radius:14px;padding:11px}.origin b{display:block}.origin p{margin:5px 0 0;font-size:13px;line-height:1.5}.replies{display:grid;gap:8px;margin-top:12px}.reply{border:1px solid #e0e8dd;background:#f9fbf8;border-radius:13px;padding:10px}.replyhead{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#718078}.replyname{font-weight:900;color:#2b633c}.replymsg{margin-top:5px;font-size:13px;line-height:1.5;white-space:pre-wrap}.noreply{text-align:center;color:#7d8a81;font-size:12px;padding:14px}.form{margin-top:14px;background:#f4f9f2;border-radius:15px;padding:12px}.label{display:block;font-size:13px;font-weight:900;color:#355e41;margin-top:10px}.label:first-child{margin-top:0}.help{display:block;margin-top:3px;color:#7a877d;font-size:11px;line-height:1.4}.input,.textarea{width:100%;margin-top:6px;border:2px solid #d6e3d3;border-radius:12px;padding:11px;background:#fff;outline:0}.textarea{min-height:92px;resize:vertical}.send{width:100%;margin-top:12px;border:0;border-radius:13px;background:#238048;color:#fff;padding:12px;font-weight:900}.privacy{margin-top:8px;color:#7a877d;font-size:10px;line-height:1.45}.resolve{width:100%;margin-top:10px;border:2px solid #73b27c;border-radius:13px;background:#e8f8e9;color:#176b32;padding:11px;font-weight:900}.status{min-height:18px;text-align:center;margin-top:7px;color:#5d7464;font-size:12px}.toast{position:fixed;left:50%;top:72px;z-index:100;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:#1f7b3d;color:#fff;border-radius:999px;padding:10px 15px;font-weight:900;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="title">💬 聞きたい・伝えたい｜返信テスト</div></header>
<section class="sub"><div class="note">🧪 返信機能だけを切り離した実用テストです。入力中に一覧が更新されないので、返信文が勝手に消えない構造になっています。</div></section>
<div class="bar"><h2>公開相談</h2><button id="refresh" class="refresh">↻ 更新</button></div>
<section id="list" class="list"><div class="empty">読み込み中…</div></section>
</main>
<div id="threadModal" class="modal"><div class="sheet">
<div class="sheettop"><h2>💬 公開返信</h2><button id="closeThread" class="x">×</button></div>
<div id="origin" class="origin"></div>
<div id="threadReplies" class="replies"></div>
<div id="replyForm" class="form">
<label class="label">あなたの表示名（ニックネーム）<span class="help">本名じゃなくてOK。返信の横に他の人へ表示される名前です。</span><input id="replyName" class="input" maxlength="30" placeholder="例：えーさん"></label>
<label class="label">返信内容<span class="help">相手に伝えたい内容を書いてね。</span><textarea id="replyMessage" class="textarea" maxlength="200" placeholder="例：○○公民館でスマホを充電できますよ"></textarea></label>
<button id="sendReply" class="send">この内容で返信する</button>
<div class="privacy">※公開返信です。電話番号・自宅の詳しい住所など個人情報は書かないでね。</div>
<div id="replyStatus" class="status"></div>
</div>
<button id="resolveBtn" class="resolve" style="display:none">✅ 解決しました</button>
</div></div>
<div id="toast" class="toast"></div>
<script>
const U='https://illnptsvaieyacjajlfm.supabase.co',K='sb_publishable_QfSUIWFyzrr0v9t941s8dg_-GPvjwzx',REGION='saitama-midori';
let token=localStorage.getItem('imakoko_test_guest');if(!token){token=crypto.randomUUID();localStorage.setItem('imakoko_test_guest',token)}
let posts=[],replies=[],current=null;const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function rpc(name,body){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body||{}),cache:'no-store'});const t=await r.text();if(!r.ok)throw Error(t||r.status);return t?JSON.parse(t):null}
function jpTime(iso,suffix='投稿'){const d=new Date(iso),p=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),g=t=>p.find(x=>x.type===t)?.value||'';return `${Number(g('month'))}月${Number(g('day'))}日 ${g('hour')}時${g('minute')}分 ${suffix}`}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
function renderList(){if(!posts.length){$('list').innerHTML='<div class="empty">現在、公開中の「聞きたい・伝えたい」はありません。</div>';return}$('list').innerHTML=posts.map(p=>`<article class="card"><div class="place">${esc(p.place)}</div><div class="msg">${esc(p.message)}</div><div class="time">🕒 ${jpTime(p.created_at)}</div><div class="meta">投稿者：${esc(p.nickname)} ・ 返信 ${Number(p.reply_count)||0}件</div>${p.resolved_at?'<div class="resolved">✅ 解決済み</div>':''}<button class="threadbtn" data-id="${p.id}">💬 返信を見る・書く</button></article>`).join('');document.querySelectorAll('.threadbtn').forEach(b=>b.onclick=()=>openThread(b.dataset.id))}
async function loadList(){try{posts=await rpc('imakoko_test_list_posts_v4',{p_region_key:REGION,p_category:'other',p_guest_token:token})||[];renderList()}catch(e){$('list').innerHTML='<div class="empty">読み込みに失敗しました。</div>'}}
function renderReplies(){const rs=replies.filter(r=>r.post_id===current?.id);$('threadReplies').innerHTML=rs.length?rs.map(r=>`<div class="reply"><div class="replyhead"><span class="replyname">${esc(r.nickname)}</span><span>${jpTime(r.created_at,'返信')}</span></div><div class="replymsg">${esc(r.message)}</div></div>`).join(''):'<div class="noreply">まだ返信はありません。</div>'}
async function refreshRepliesOnly(){replies=await rpc('imakoko_test_list_replies',{p_region_key:REGION})||[];renderReplies()}
async function openThread(id){current=posts.find(p=>p.id===id);if(!current)return;$('origin').innerHTML=`<b>${esc(current.place)}</b><p>${esc(current.message)}</p><div class="meta">${jpTime(current.created_at)} ・ 投稿者：${esc(current.nickname)}</div>`;$('replyName').value=localStorage.getItem('imakoko_test_nickname')||'';$('replyMessage').value=localStorage.getItem('imakoko_reply_draft_'+id)||'';$('replyStatus').textContent='';$('replyForm').style.display=current.resolved_at?'none':'block';$('resolveBtn').style.display=current.owned_by_me&&!current.resolved_at?'block':'none';$('threadModal').classList.add('show');await refreshRepliesOnly()}
$('replyMessage').addEventListener('input',()=>{if(current)localStorage.setItem('imakoko_reply_draft_'+current.id,$('replyMessage').value)});
$('replyName').addEventListener('input',()=>localStorage.setItem('imakoko_test_nickname',$('replyName').value));
$('sendReply').onclick=async()=>{if(!current)return;const n=$('replyName').value.trim(),m=$('replyMessage').value.trim();if(!n||!m){$('replyStatus').textContent='ニックネームと返信内容を入力してね。';return}$('sendReply').disabled=true;$('replyStatus').textContent='返信中…';try{await rpc('imakoko_test_add_reply',{p_post_id:current.id,p_guest_token:token,p_nickname:n,p_message:m});localStorage.setItem('imakoko_test_nickname',n);localStorage.removeItem('imakoko_reply_draft_'+current.id);$('replyMessage').value='';$('replyStatus').textContent='返信しました ✓';toast('💬 返信しました');await refreshRepliesOnly();const p=posts.find(x=>x.id===current.id);if(p)p.reply_count=Number(p.reply_count||0)+1;renderList()}catch(e){$('replyStatus').textContent='返信できませんでした。'}finally{$('sendReply').disabled=false}};
$('resolveBtn').onclick=async()=>{if(!current)return;if(!confirm('この相談を「解決済み」にしますか？\n解決後も1時間は返信内容と一緒に残ります。'))return;try{await rpc('imakoko_test_resolve_post',{p_post_id:current.id,p_guest_token:token});toast('✅ 解決済みにしました');$('threadModal').classList.remove('show');await loadList()}catch(e){toast('解決済みにできませんでした')}};
$('closeThread').onclick=()=>$('threadModal').classList.remove('show');$('threadModal').onclick=e=>{if(e.target===$('threadModal'))$('threadModal').classList.remove('show')};$('refresh').onclick=loadList;
loadList();
</script>
</body>
</html>
