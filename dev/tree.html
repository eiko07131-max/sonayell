rgba(41,81,43,.14)}
.panel{margin:0 12px;background:#fff;border-radius:24px;padding:17px 18px 16px;box-shadow:0 8px 24px rgba(42,76,38,.11);border:1px solid #efeee8}.panel h2{margin:0 0 11px;font-size:21px;color:#08773c}.rule{text-align:center;font-size:12px;font-weight:900;color:#50705a;background:#eff7e6;border-radius:13px;padding:8px;margin-bottom:11px}.meter{height:14px;background:linear-gradient(90deg,#e7eadc,#f7e3c6);border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#07893c,#63bd62);border-radius:99px}.count{text-align:center;margin:8px 0 0;font-size:18px;font-weight:900;color:#08773c}.count strong{font-size:25px}.next{text-align:center;padding:9px 0 11px;border-bottom:1px solid #eee2d5;font-size:14px;font-weight:800}.next strong{color:#07813a;font-size:19px;margin-left:7px}.grown{text-align:center;padding:10px 0 0;font-size:14px;font-weight:800}.grown strong{font-size:27px;color:#07813a;margin:0 4px}.sona{display:flex;gap:9px;align-items:center;margin:12px 14px 0}.sona img{width:88px;height:110px;object-fit:contain;flex:0 0 88px}.bubble{position:relative;flex:1;background:#fffdf9;border:1.5px solid #eadbbd;border-radius:22px;padding:12px 13px}.bubble:before{content:"";position:absolute;left:-12px;top:44%;width:20px;height:20px;background:#fffdf9;border-left:1.5px solid #eadbbd;border-bottom:1.5px solid #eadbbd;transform:rotate(45deg)}.bubble b,.bubble p{position:relative;z-index:1}.bubble b{color:#176c39;font-size:15px}.bubble p{margin:4px 0 0;font-size:12px;line-height:1.55;color:#2f4233}.tip{margin:10px 14px 0;padding:10px 12px;border-radius:999px;background:#edf6da;text-align:center;color:#426a43;font-weight:800;font-size:11px;border:1px solid #d8e7bd}.devMark{text-align:center;color:#879687;font-size:9px;padding:10px 0 2px}.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:70px;background:rgba(255,255,255,.98);border-top:1px solid #dce7d4;display:grid;grid-template-columns:repeat(5,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -5px 16px rgba(31,72,39,.08)}.navBtn{border:0;background:none;color:#5d6d61;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;font-weight:800;cursor:pointer}.navBtn small{font-size:8px;white-space:nowrap}.navBtn:active{background:#f1faec;color:#0b8c43}@media(max-width:390px){.title{font-size:19px}.world{height:232px}.panel{margin-left:10px;margin-right:10px;padding:16px}.sona{margin-left:10px;margin-right:10px}.stageLabel{font-size:13px;padding:7px 14px}.treeWrap{width:145px;height:164px;bottom:34px}.navBtn{font-size:17px}.navBtn small{font-size:7.5px}}

<body>
<main class="app">
<header class="top"><button class="back" onclick="history.length>1?history.back():location.href='./index.html?v=91'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" onclick="alert('YELLを重ねると木が少しずつ成長するよ。50YELLで大樹1本！')">?</button></header>
<section class="world" aria-label="YELLの木の成長エリア"><div class="sunGlow"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="branch left"></div><div class="branch right"></div><div class="canopy left"></div><div class="canopy right"></div><div class="birdhouse"></div><div class="bird r">🐦</div><div class="butter b1">🦋</div><div class="butter b2">🦋</div><div class="flowerbed"></div><div class="animal bear">🐻</div><div class="animal rabbit">🐰</div><div class="animal deer">🦌</div><div class="animal squirrel">🐿️</div><div class="ground"></div><div class="treeWrap"><div id="treeArt" class="treeArt"><div class="trunk"></div><div class="branchL"></div><div class="branchR"></div><div class="crown cr1"></div><div class="crown cr2"></div><div class="crown cr3"></div><div class="crown cr4"></div><div class="sproutStem"></div><div class="sproutLeaf leafL"></div><div class="sproutLeaf leafR"></div><div id="special" class="special"></div></div></div><div id="stage" class="stageLabel">もうすぐ大樹になりそう！ 🌳</div></section>
<section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数　<strong id="grown">0</strong>本</div></section>
<section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div><div class="devMark">🚧 そなYELL ブラッシュアップ開発版</div>
</main>
<nav class="bottomNav" aria-label="主要画面ナビゲーション"><button class="navBtn" onclick="location.href='./index.html?v=91'">🏠<small>ホーム</small></button><button class="navBtn" onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button class="navBtn" onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button class="navBtn" onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button class="navBtn" onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav>
<script>
async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}
async function loadSona(){try{const sp=await txt('../assets/sonapi-official-b64.txt?v=1');document.getElementById('sonaImg').src='data:image/webp;base64,'+sp}catch(e){}}
function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}
function stageInfo(n){if(n>=50)return{scale:1.05,label:'大樹に成長したよ！ 🌳',mode:'tree'};if(n>=35)return{scale:.96,label:'もうすぐ大樹になりそう！ 🌳',mode:'tree'};if(n>=28)return{scale:.86,label:'ぐんぐん成長しているよ！ 🍃',mode:'tree'};if(n>=13)return{scale:.70,label:'小さな木になったよ！ 🌱',mode:'tree'};if(n>=7)return{scale:.52,label:'葉っぱが増えてきたよ！ 🍃',mode:'sprout'};if(n>=3)return{scale:.38,label:'小さな芽が出たよ！ 🌱',mode:'sprout'};return{scale:.24,label:'これから芽が出るよ 🌱',mode:'sprout'}}
function render(){const s=state(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,info=stageInfo(shown);document.getElementById('grown').textContent=grown;document.getElementById('current').textContent=shown;document.getElementById('bar').style.width=(shown/50*100)+'%';document.getElementById('stage').textContent=info.label;document.getElementById('treeArt').style.transform='scale('+info.scale+')';document.querySelectorAll('.crown,.trunk,.branchL,.branchR').forEach(el=>el.style.display=info.mode==='tree'?'block':'none');document.querySelectorAll('.sproutLeaf,.sproutStem').forEach(el=>el.style.display=info.mode==='sprout'?'block':'none');const remain=shown===50?0:50-shown;document.getElementById('next').innerHTML='次の大樹になるまで <strong>あと '+remain+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';const mode=localStorage.getItem('sonayell_tree_special')||'';document.getElementById('special').textContent=shown>=45&&mode==='flower'?'🌸　🌼　🌸':shown>=45&&mode==='fruit'?'🍎　🍊　🍎':''}
loadSona();render();addEventListener('storage',render);addEventListener('pageshow',render);addEventListener('focus',render)
</script>
