olumns:repeat(5,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -5px 16px rgba(31,72,39,.08)}.navBtn{border:0;background:none;color:#5d6d61;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;font-weight:800}.navBtn small{font-size:8px;white-space:nowrap}@media(max-width:390px){.title{font-size:19px}.panel{margin-left:10px;margin-right:10px;padding:16px}.sona{margin-left:10px;margin-right:10px}.stageLabel{font-size:13px}.navBtn{font-size:17px}.navBtn small{font-size:7.5px}}
</style></head><body><main class="app">
<header class="top"><button class="back" onclick="history.length>1?history.back():location.href='./index.html?v=93'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" onclick="alert('YELLを重ねると木が少しずつ成長するよ。50YELLで大樹1本！')">?</button></header>

<section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数　<strong id="grown">0</strong>本</div></section>

<script>
async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}
async function loadArt(){try{const[bg,tr,sp]=await Promise.all([txt('../assets/tree-forest-v74.txt?v=93'),txt('../assets/yell-tree-cute-b64.txt?v=93'),txt('../assets/sonapi-official-b64.txt?v=1')]);forest.src='data:image/jpeg;base64,'+bg;treeImg.src='data:image/webp;base64,'+tr;sonaImg.src='data:image/webp;base64,'+sp}catch(e){console.error(e)}}
function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}
function stageInfo(n){if(n>=50)return{w:58,h:72,label:'大樹に成長したよ！ 🌳'};if(n>=45)return{w:55,h:69,label:'もうすぐ大樹になりそう！ 🌳'};if(n>=35)return{w:51,h:65,label:'もうすぐ大樹になりそう！ 🌳'};if(n>=28)return{w:47,h:60,label:'ぐんぐん成長しているよ！ 🍃'};if(n>=13)return{w:42,h:53,label:'小さな木になったよ！ 🌱'};if(n>=7)return{w:31,h:41,label:'葉っぱが増えてきたよ！ 🍃'};if(n>=3)return{w:23,h:31,label:'小さな芽が出たよ！ 🌱'};return{w:15,h:23,label:'これから芽が出るよ 🌱'}}
function render(){const s=state(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,info=stageInfo(shown);document.getElementById('grown').textContent=grown;document.getElementById('current').textContent=shown;document.getElementById('bar').style.width=(shown/50*100)+'%';document.getElementById('stage').textContent=info.label;document.getElementById('treeHolder').style.width=info.w+'%';document.getElementById('treeHolder').style.height=info.h+'%';document.getElementById('next').innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';const mode=localStorage.getItem('sonayell_tree_special')||'';document.getElementById('special').textContent=shown>=45&&mode==='flower'?'🌸　🌼　🌸':shown>=45&&mode==='fruit'?'🍎　🍊　🍎':''}
loadArt();render();addEventListener('storage',render);addEventListener('pageshow',render);addEventListener('focus',render)
</script></body></html>
