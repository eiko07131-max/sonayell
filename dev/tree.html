<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08773c">
<title>私のYELLの木｜そなYELL 開発版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#eef5e8;color:#24492e}
button{font:inherit}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:linear-gradient(180deg,#f8fbf4,#fffdf8);padding-bottom:82px;overflow:hidden}
.top{height:66px;background:linear-gradient(90deg,#08763c,#0a8c46);color:#fff;display:flex;align-items:center;padding:0 16px;position:relative;box-shadow:0 2px 8px rgba(0,76,36,.13)}
.back{border:0;background:none;color:#fff;font-weight:900;font-size:18px;padding:10px 0;cursor:pointer}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:21px;font-weight:900;white-space:nowrap;letter-spacing:.01em}.help{margin-left:auto;width:42px;height:42px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;background:transparent;color:#fff;cursor:pointer}
.world{position:relative;height:340px;overflow:hidden;background:linear-gradient(#aee8ff,#dff5b0 65%,#78bd58);border-bottom:1px solid #d6e5c7}
.forest{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;filter:saturate(1.05) contrast(1.04)}
.world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 45%,rgba(26,104,45,.05));pointer-events:none;z-index:1}
.treeStage{position:absolute;left:50%;bottom:39px;transform:translateX(-50%);width:220px;height:235px;z-index:3;display:flex;align-items:flex-end;justify-content:center}
.tree{position:relative;width:190px;height:215px;transform-origin:50% 100%;transition:transform .45s ease,opacity .3s ease;filter:drop-shadow(0 7px 5px rgba(54,74,35,.18))}
.trunk{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:34px;height:104px;border-radius:18px 18px 12px 12px;background:linear-gradient(90deg,#855126 0%,#ad6f32 48%,#7a4821 100%)}
.branch{position:absolute;bottom:84px;width:68px;height:15px;border-radius:20px;background:#875126}.branch.l{left:44px;transform:rotate(-31deg)}.branch.r{right:44px;transform:rotate(31deg)}
.crown{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 28%,#75d23a 0 28%,#3eb42c 52%,#15933b 100%);box-shadow:inset 0 -5px 0 rgba(0,91,34,.08)}
.c1{width:112px;height:100px;left:39px;top:19px}.c2{width:96px;height:90px;left:6px;top:62px}.c3{width:96px;height:90px;right:6px;top:62px}.c4{width:114px;height:94px;left:38px;top:86px}.c5{width:84px;height:78px;left:53px;top:48px}
.sproutStem{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:11px;height:62px;border-radius:10px;background:#8a592e}.leaf{position:absolute;width:54px;height:31px;background:linear-gradient(145deg,#71cf43,#2ca93a);border-radius:60% 40% 60% 20%}.leaf.l{left:46px;bottom:45px;transform:rotate(23deg)}.leaf.r{right:46px;bottom:45px;transform:scaleX(-1) rotate(23deg)}
.special{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:5;pointer-events:none;font-size:24px;white-space:nowrap}
.stageLabel{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:8;background:rgba(255,255,255,.97);border-radius:999px;padding:9px 20px;color:#087a3d;font-weight:900;font-size:15px;white-space:nowrap;box-shadow:0 5px 16px rgba(42,82,43,.16);border:1px solid rgba(223,235,215,.95)}
.panel{margin:0 12px;background:#fff;border-radius:26px;padding:19px 18px 17px;box-shadow:0 9px 24px rgba(42,76,38,.10);border:1px solid #edf0e8}.panel h2{margin:0 0 12px;font-size:21px;color:#08773c}.rule{text-align:center;font-size:12px;font-weight:900;color:#50705a;background:linear-gradient(90deg,#eef8e7,#f4f9ec);border-radius:14px;padding:9px;margin-bottom:12px}.meter{height:15px;background:linear-gradient(90deg,#e6eadc,#f6e2c5);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(52,76,45,.08)}.meter span{display:block;height:100%;background:linear-gradient(90deg,#07893c,#67bd62);border-radius:99px;transition:width .45s ease}.count{text-align:center;margin:9px 0 0;font-size:18px;font-weight:900;color:#08773c}.count strong{font-size:26px}.next{text-align:center;padding:10px 0 12px;border-bottom:1px solid #eee7dc;font-size:14px;font-weight:800}.next strong{color:#07813a;font-size:19px;margin-left:7px}.grown{text-align:center;padding:11px 0 0;font-size:14px;font-weight:800}.grown strong{font-size:27px;color:#07813a;margin:0 4px}.sona{display:flex;gap:10px;align-items:center;margin:13px 14px 0}.sona img{width:88px;height:106px;object-fit:contain;flex:0 0 88px}.bubble{position:relative;flex:1;background:#fffdf9;border:1.5px solid #eadbbd;border-radius:22px;padding:12px 13px;box-shadow:0 4px 12px rgba(95,75,45,.05)}.bubble:before{content:"";position:absolute;left:-11px;top:44%;width:19px;height:19px;background:#fffdf9;border-left:1.5px solid #eadbbd;border-bottom:1.5px solid #eadbbd;transform:rotate(45deg)}.bubble b,.bubble p{position:relative;z-index:1}.bubble b{color:#176c39;font-size:15px}.bubble p{margin:4px 0 0;font-size:12px;line-height:1.55;color:#2f4233}.tip{margin:10px 14px 0;padding:10px 12px;border-radius:999px;background:#edf6da;text-align:center;color:#426a43;font-weight:800;font-size:11px;border:1px solid #d8e7bd}.devMark{text-align:center;color:#879687;font-size:9px;padding:10px 0 2px}
.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:70px;background:rgba(255,255,255,.985);border-top:1px solid #dce7d4;display:grid;grid-template-columns:repeat(5,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -5px 16px rgba(31,72,39,.08)}.navBtn{border:0;background:none;color:#5d6d61;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;font-weight:800;cursor:pointer}.navBtn small{font-size:8px;white-space:nowrap}.navBtn:active{background:#f2faed;color:#0b8c43}
@media(max-width:390px){.title{font-size:19px}.world{height:318px}.panel{margin-left:10px;margin-right:10px;padding:17px}.stageLabel{font-size:13px;padding:8px 15px}.treeStage{bottom:35px;transform:translateX(-50%) scale(.93)}.sona{margin-left:10px;margin-right:10px}.navBtn{font-size:17px}.navBtn small{font-size:7.5px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="history.length>1?history.back():location.href='./index.html?v=94'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" onclick="alert('YELLを重ねると木が少しずつ成長するよ。50YELLで大樹1本！')">?</button></header>
<section class="world" aria-label="YELLの木の成長エリア"><img id="forest" class="forest" alt="森の仲間たち"><div class="treeStage"><div id="tree" class="tree"><div class="trunk treePart"></div><div class="branch l treePart"></div><div class="branch r treePart"></div><div class="crown c1 treePart"></div><div class="crown c2 treePart"></div><div class="crown c3 treePart"></div><div class="crown c4 treePart"></div><div class="crown c5 treePart"></div><div class="sproutStem sproutPart"></div><div class="leaf l sproutPart"></div><div class="leaf r sproutPart"></div></div></div><div id="special" class="special"></div><div id="stage" class="stageLabel">ゆっくり育っているよ 🌱</div></section>
<section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数　<strong id="grown">0</strong>本</div></section>
<section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div><div class="devMark">🚧 そなYELL ブラッシュアップ開発版</div>
</main>
<nav class="bottomNav" aria-label="主要画面ナビゲーション"><button class="navBtn" onclick="location.href='./index.html?v=94'">🏠<small>ホーム</small></button><button class="navBtn" onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button class="navBtn" onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button class="navBtn" onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button class="navBtn" onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav>
<script>
async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}
async function loadFixedArt(){try{const[bg,sp]=await Promise.all([txt('../assets/forest-friends-b64.txt?v=94'),txt('../assets/sonapi-official-b64.txt?v=1')]);forest.src='data:image/webp;base64,'+bg;sonaImg.src='data:image/webp;base64,'+sp}catch(e){console.error(e)}}
function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}
function stageInfo(n){if(n>=50)return{scale:1.03,label:'大樹に成長したよ！ 🌳',tree:true};if(n>=45)return{scale:.98,label:'もうすぐ大樹になりそう！ 🌳',tree:true};if(n>=35)return{scale:.90,label:'もうすぐ大樹になりそう！ 🌳',tree:true};if(n>=28)return{scale:.80,label:'ぐんぐん成長しているよ！ 🍃',tree:true};if(n>=13)return{scale:.64,label:'小さな木になったよ！ 🌱',tree:true};if(n>=7)return{scale:.50,label:'葉っぱが増えてきたよ！ 🍃',tree:false};if(n>=3)return{scale:.38,label:'小さな芽が出たよ！ 🌱',tree:false};return{scale:.28,label:'これから芽が出るよ 🌱',tree:false}}
function render(){const s=state(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,info=stageInfo(shown);document.getElementById('grown').textContent=grown;document.getElementById('current').textContent=shown;document.getElementById('bar').style.width=(shown/50*100)+'%';document.getElementById('stage').textContent=info.label;document.getElementById('tree').style.transform='scale('+info.scale+')';document.querySelectorAll('.treePart').forEach(el=>el.style.display=info.tree?'block':'none');document.querySelectorAll('.sproutPart').forEach(el=>el.style.display=info.tree?'none':'block');document.getElementById('next').innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';const mode=localStorage.getItem('sonayell_tree_special')||'';document.getElementById('special').textContent=shown>=45&&mode==='flower'?'🌸　🌼　🌸':shown>=45&&mode==='fruit'?'🍎　🍊　🍎':''}
loadFixedArt();render();addEventListener('storage',render);addEventListener('pageshow',render);addEventListener('focus',render)
</script>
</body></html>
