<script>
async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}
async function loadArt(){try{const[tr,sp]=await Promise.all([txt('../assets/yell-tree-cute-b64.txt?v=92'),txt('../assets/sonapi-official-b64.txt?v=1')]);treeImg.src='data:image/webp;base64,'+tr;sonaImg.src='data:image/webp;base64,'+sp}catch(e){console.error(e)}}
function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}
function stageInfo(n){if(n>=50)return{w:68,h:78,label:'大樹に成長したよ！ 🌳'};if(n>=45)return{w:64,h:75,label:'もうすぐ大樹になりそう！ 🌳'};if(n>=35)return{w:58,h:70,label:'もうすぐ大樹になりそう！ 🌳'};if(n>=28)return{w:52,h:64,label:'ぐんぐん成長しているよ！ 🍃'};if(n>=13)return{w:42,h:54,label:'小さな木になったよ！ 🌱'};if(n>=7)return{w:31,h:40,label:'葉っぱが増えてきたよ！ 🍃'};if(n>=3)return{w:22,h:30,label:'小さな芽が出たよ！ 🌱'};return{w:15,h:22,label:'これから芽が出るよ 🌱'}}
function render(){const s=state(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,info=stageInfo(shown);grownEl.textContent=grown;current.textContent=shown;bar.style.width=(shown/50*100)+'%';stage.textContent=info.label;treeHolder.style.width=info.w+'%';treeHolder.style.height=info.h+'%';next.innerHTML='次の大樹になるまで <strong>あと '+(shown===50?0:50-shown)+'YELL！</strong>';cheer.textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';const mode=localStorage.getItem('sonayell_tree_special')||'';special.textContent=shown>=45&&mode==='flower'?'🌸　🌼　🌸':shown>=45&&mode==='fruit'?'🍎　🍊　🍎':''}
