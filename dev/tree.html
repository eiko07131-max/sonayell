<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08773c">
<title>私のYELLの木｜そなYELL 開発版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f7f9ef;color:#24492e}
button{font:inherit}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:linear-gradient(#f7fbf1,#fffdf8);padding-bottom:84px;overflow:hidden}
.top{height:64px;background:linear-gradient(90deg,#08753a,#069047);color:#fff;display:flex;align-items:center;padding:0 14px;position:relative}.back{border:0;background:none;color:#fff;font-weight:900;font-size:18px;padding:10px 0;cursor:pointer}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:21px;font-weight:900;white-space:nowrap}.help{margin-left:auto;width:40px;height:40px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:21px;background:transparent;color:#fff}
.world{position:relative;height:330px;overflow:hidden;background:linear-gradient(#9fe3ff 0 56%,#dff5a4 56% 74%,#83cb57 74%);border-bottom:1px solid #d7e8bd}.skyGlow{position:absolute;left:35px;top:28px;width:105px;height:105px;border-radius:50%;background:rgba(255,255,210,.65);filter:blur(5px)}.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92}.c1{width:92px;height:29px;left:54px;top:55px}.c2{width:74px;height:24px;right:42px;top:62px}.frameLeaf{position:absolute;top:-24px;width:165px;height:92px;background:#4c9c35;border-radius:50%;opacity:.95}.fl{left:-40px;transform:rotate(-11deg)}.fr{right:-40px;transform:rotate(11deg)}.ground{position:absolute;left:50%;bottom:36px;width:200px;height:42px;transform:translateX(-50%);border:5px solid #c48e50;border-radius:50%;background:#b9e77f;box-shadow:inset 0 0 0 4px rgba(255,235,165,.7)}
.animal{position:absolute;filter:none}.bear{left:18px;bottom:25px;font-size:47px}.rabbit{left:88px;bottom:21px;font-size:40px}.deer{right:50px;bottom:25px;font-size:48px}.squirrel{right:9px;bottom:17px;font-size:38px}.bird1{left:24px;top:86px;font-size:28px}.bird2{right:18px;top:98px;font-size:27px}.butter1{left:110px;top:124px;font-size:24px}.butter2{right:112px;top:108px;font-size:24px}.flowers{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:20px;letter-spacing:4px}
.treeWrap{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:180px;height:210px;display:flex;align-items:flex-end;justify-content:center}.treeArt{position:relative;width:100%;height:100%;transform-origin:50% 100%;transition:transform .35s ease}.trunk{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:34px;height:104px;border-radius:18px 18px 12px 12px;background:linear-gradient(90deg,#8c5b2b,#b67b3b,#7f4f23)}.branchL,.branchR{position:absolute;bottom:88px;width:72px;height:18px;background:#8f5928;border-radius:20px}.branchL{left:35px;transform:rotate(-32deg)}.branchR{right:35px;transform:rotate(32deg)}.crown{position:absolute;border-radius:50%;background:linear-gradient(145deg,#62c92e,#19963e);box-shadow:0 4px 0 rgba(0,108,52,.12)}.cr1{width:115px;height:100px;left:32px;top:28px}.cr2{width:100px;height:92px;left:2px;top:62px}.cr3{width:100px;height:92px;right:2px;top:62px}.cr4{width:110px;height:90px;left:35px;top:84px}.sproutLeaf{position:absolute;width:46px;height:28px;background:#51bd3f;border-radius:50% 50% 50% 10%;bottom:54px}.leafL{left:48px;transform:rotate(28deg)}.leafR{right:48px;transform:scaleX(-1) rotate(28deg)}.special{position:absolute;left:0;right:0;top:55px;text-align:center;font-size:24px;z-index:8}.stageLabel{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.96);border-radius:999px;padding:8px 18px;color:#087a3d;font-weight:900;font-size:15px;white-space:nowrap;box-shadow:0 4px 12px rgba(41,81,43,.14)}
.panel{margin:0 12px;background:#fff;border-radius:24px;padding:18px 18px 16px;box-shadow:0 8px 24px rgba(42,76,38,.11);border:1px solid #efeee8}.panel h2{margin:0 0 11px;font-size:21px;color:#08773c}.rule{text-align:center;font-size:12px;font-weight:900;color:#50705a;background:#eff7e6;border-radius:13px;padding:8px;margin-bottom:11px}.meter{height:14px;background:linear-gradient(90deg,#e7eadc,#f7e3c6);border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#07893c,#63bd62);border-radius:99px}.count{text-align:center;margin:8px 0 0;font-size:18px;font-weight:900;color:#08773c}.count strong{font-size:25px}.next{text-align:center;padding:9px 0 11px;border-bottom:1px solid #eee2d5;font-size:14px;font-weight:800}.next strong{color:#07813a;font-size:19px;margin-left:7px}.grown{text-align:center;padding:10px 0 0;font-size:14px;font-weight:800}.grown strong{font-size:27px;color:#07813a;margin:0 4px}.sona{display:flex;gap:9px;align-items:center;margin:12px 14px 0}.sona img{width:88px;height:110px;object-fit:contain;flex:0 0 88px}.bubble{position:relative;flex:1;background:#fffdf9;border:1.5px solid #eadbbd;border-radius:22px;padding:12px 13px}.bubble:before{content:"";position:absolute;left:-12px;top:44%;width:20px;height:20px;background:#fffdf9;border-left:1.5px solid #eadbbd;border-bottom:1.5px solid #eadbbd;transform:rotate(45deg)}.bubble b,.bubble p{position:relative;z-index:1}.bubble b{color:#176c39;font-size:15px}.bubble p{margin:4px 0 0;font-size:12px;line-height:1.55;color:#2f4233}.tip{margin:10px 14px 0;padding:10px 12px;border-radius:999px;background:#edf6da;text-align:center;color:#426a43;font-weight:800;font-size:11px;border:1px solid #d8e7bd}.devMark{text-align:center;color:#879687;font-size:9px;padding:10px 0 2px}
.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:70px;background:rgba(255,255,255,.98);border-top:1px solid #dce7d4;display:grid;grid-template-columns:repeat(5,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -5px 16px rgba(31,72,39,.08)}.navBtn{border:0;background:none;color:#5d6d61;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;font-weight:800;cursor:pointer}.navBtn small{font-size:8px;white-space:nowrap}.navBtn:active{background:#f1faec;color:#0b8c43}
@media(max-width:390px){.title{font-size:19px}.world{height:308px}.panel{margin-left:10px;margin-right:10px;padding:16px}.sona{margin-left:10px;margin-right:10px}.stageLabel{font-size:13px}.treeWrap{transform:translateX(-50%) scale(.9);bottom:42px}.navBtn{font-size:17px}.navBtn small{font-size:7.5px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="history.length>1?history.back():location.href='./index.html?v=90'">‹ 戻る</button><div class="title">私のYELLの木</div><button class="help" onclick="alert('YELLを重ねると木が少しずつ成長するよ。50YELLで大樹1本！')">?</button></header>
<section class="world" aria-label="YELLの木の成長エリア"><div class="skyGlow"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="frameLeaf fl"></div><div class="frameLeaf fr"></div><div class="animal bear">🐻</div><div class="animal rabbit">🐰</div><div class="animal deer">🦌</div><div class="animal squirrel">🐿️</div><div class="animal bird1">🐦</div><div class="animal bird2">🐦</div><div class="animal butter1">🦋</div><div class="animal butter2">🦋</div><div class="flowers">🌼 🌷 🌼 🌸 🌼 🌷</div><div class="ground"></div><div class="treeWrap"><div id="treeArt" class="treeArt"><div class="trunk"></div><div class="branchL"></div><div class="branchR"></div><div class="crown cr1"></div><div class="crown cr2"></div><div class="crown cr3"></div><div class="crown cr4"></div><div class="sproutLeaf leafL"></div><div class="sproutLeaf leafR"></div><div id="special" class="special"></div></div></div><div id="stage" class="stageLabel">ゆっくり育っているよ 🌱</div></section>
<section class="panel"><h2>成長中のYELLの木</h2><div class="rule">🌳 50YELLで大樹1本になります</div><div class="meter"><span id="bar"></span></div><div class="count"><strong id="current">0</strong> / 50 YELL</div><div id="next" class="next"></div><div class="grown">🌳 現在までの大樹の本数　<strong id="grown">0</strong>本</div></section>
<section class="sona"><img id="sonaImg" alt="そなピー"><div class="bubble"><b>そなピーからYELL！</b><p id="cheer"></p></div></section><div class="tip">🌱 小さな一歩を積み重ねて、明日の安心につなげよう。 🌱</div><div class="devMark">🚧 そなYELL ブラッシュアップ開発版</div>
</main>
<nav class="bottomNav" aria-label="主要画面ナビゲーション"><button class="navBtn" onclick="location.href='./index.html?v=90'">🏠<small>ホーム</small></button><button class="navBtn" onclick="location.href='../posts.html?v=83'">📣<small>防災投稿</small></button><button class="navBtn" onclick="location.href='../quiz-2026-08-v4.html?v=83'">🎓<small>防災クイズ</small></button><button class="navBtn" onclick="location.href='../prepare-enhanced.html?v=83'">📋<small>我が家の備え</small></button><button class="navBtn" onclick="location.href='../disaster-enhanced.html?v=83'">📘<small>災害別</small></button></nav>
<script>
async function txt(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return(await r.text()).replace(/\s+/g,'')}
async function loadSona(){try{const sp=await txt('../assets/sonapi-official-b64.txt?v=1');sonaImg.src='data:image/webp;base64,'+sp}catch(e){}}
function state(){try{return JSON.parse(localStorage.getItem('sonayell_v2')||'{}')}catch(e){return{}}}
function stageInfo(n){if(n>=50)return{scale:1.08,label:'大樹に成長したよ！ 🌳',mode:'tree'};if(n>=45)return{scale:1.02,label:'もうすぐ大樹になりそう！ 🌳',mode:'tree'};if(n>=35)return{scale:.93,label:'立派な木になってきたよ！ 🌿',mode:'tree'};if(n>=28)return{scale:.84,label:'ぐんぐん成長しているよ！ 🍃',mode:'tree'};if(n>=13)return{scale:.68,label:'小さな木になったよ！ 🌱',mode:'tree'};if(n>=7)return{scale:.48,label:'葉っぱが増えてきたよ！ 🍃',mode:'sprout'};if(n>=3)return{scale:.34,label:'小さな芽が出たよ！ 🌱',mode:'sprout'};return{scale:.22,label:'これから芽が出るよ 🌱',mode:'sprout'}}
function render(){const s=state(),y=Math.max(0,Number(s.yell)||0),grown=Math.floor(y/50),cur=y%50,shown=cur===0&&y>0?50:cur,info=stageInfo(shown);document.getElementById('grown').textContent=grown;document.getElementById('current').textContent=shown;document.getElementById('bar').style.width=(shown/50*100)+'%';document.getElementById('stage').textContent=info.label;document.getElementById('treeArt').style.transform='scale('+info.scale+')';document.querySelectorAll('.crown,.trunk,.branchL,.branchR').forEach(el=>el.style.display=info.mode==='tree'?'block':'none');document.querySelectorAll('.sproutLeaf').forEach(el=>el.style.display=info.mode==='sprout'?'block':'none');const remain=shown===50?0:50-shown;document.getElementById('next').innerHTML='次の大樹になるまで <strong>あと '+remain+'YELL！</strong>';document.getElementById('cheer').textContent=shown>=28?'いいペースだよ！その調子でコツコツYELLを続けていこう！':'今日の一歩も、ちゃんと木の力になってるよ。';const mode=localStorage.getItem('sonayell_tree_special')||'';document.getElementById('special').textContent=shown>=45&&mode==='flower'?'🌸　🌼　🌸':shown>=45&&mode==='fruit'?'🍎　🍊　🍎':''}
loadSona();render();addEventListener('storage',render);addEventListener('pageshow',render);addEventListener('focus',render)
</script>
</body>
</html>
