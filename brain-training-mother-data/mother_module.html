<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>あの日、あの時クイズ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e9;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#292722}
.app{max-width:680px;margin:auto;padding:12px}.card{background:#fff;min-height:94vh;border-radius:25px;padding:16px;box-shadow:0 8px 25px #0001}
.head{font-size:1.25rem;font-weight:1000}.prog{text-align:center;font-weight:900;color:#777;margin:14px 0 8px}
.photos{display:grid;gap:7px}.photos.two{grid-template-columns:1fr 1fr}.pic{width:100%;max-height:340px;object-fit:contain;background:#f1ede6;border-radius:18px;margin:4px 0 10px}
.photos.two .pic{height:210px;object-fit:cover}.q{font-size:1.22rem;font-weight:950;line-height:1.55;background:#fff5d8;padding:16px;border-radius:18px}
.opts{display:grid;gap:10px;margin-top:13px}.opt{border:2px solid #e8e0d5;background:#fff;border-radius:17px;padding:15px;font-size:1.06rem;font-weight:900;text-align:left}
.opt.bad{opacity:.35;text-decoration:line-through}.msg{text-align:center;background:#f5f3ef;border-radius:15px;padding:12px;margin-top:12px;font-weight:900}
.start{width:100%;border:0;background:#ef9444;color:#fff;border-radius:18px;padding:18px;font-size:1.15rem;font-weight:1000;margin-top:18px}
.home{text-align:center;padding:45px 5px}.emoji{font-size:4rem}.home h1{font-size:1.8rem}.home p{line-height:1.7;color:#6d685f}
.ov{position:fixed;inset:0;background:#fffaf3f4;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.big{font-size:clamp(3rem,15vw,7rem);font-weight:1000}.ans{font-size:1.4rem;font-weight:1000;margin:14px 20px}
</style></head><body><div class="app"><div class="card"><div class="head">✨ あの日、あの時クイズ ✨</div><div id="s"></div></div></div>
<script>
const MOTHER_CHUNK_COUNT=3;
let MOTHER_IMGS={};
const motherImagesReady=Promise.all(Array.from({length:MOTHER_CHUNK_COUNT},(_,i)=>fetch('/sonayell/mother-assets/chunk'+String(i).padStart(2,'0')+'.txt?v=7').then(r=>{if(!r.ok)throw new Error('image chunk '+i);return r.text();}))).then(parts=>{MOTHER_IMGS=JSON.parse(parts.join(''));});
</script><script>
const Q=[{"q":"この日、栃木県のとある牧場に来ました。なんという牧場でしょうか？","a":"南ヶ丘牧場","o":["南ヶ丘牧場","千本松牧場","成田ゆめ牧場"],"imgs":["img01"]},{"q":"南ヶ丘牧場でお昼ごはんを食べました✨️ 何を食べたでしょうか？","a":"ジンギスカン","o":["ジンギスカン","カレーライス","おそば"],"imgs":["img02"]},{"q":"2026年7月下旬、映子と岩槻の城址公園へ行きました。この橋の下に咲いていた植物は？","a":"蓮の花","o":["蓮の花","あじさい","ひまわり"],"imgs":["img03"]},{"q":"2025年夏、映子と2人でロコモコプレートを食べた、おしゃれなカフェは？","a":"コナズカフェ","o":["コナズカフェ","コメダ珈琲店","星乃珈琲店"],"imgs":["img04","img05"]},{"q":"若かりし頃の隆さん、ミチコさんが仲人を務めました。どなたの仲人だったでしょう？","a":"大石さん","o":["大石さん","加藤さん","田中さん"],"imgs":["img06"]},{"q":"これは、あるお祝いのために実家で用意した食事です。何のお祝い？","a":"正月","o":["正月","誕生日","敬老の日"],"imgs":["img07"]},{"q":"父の日のお祝いで武蔵浦和の木曽路へ。黒く隠れている人は誰でしょう？","a":"進","o":["進","隆","映子"],"imgs":["img08"]},{"q":"私はだーれ？ 🐶","a":"梅君","o":["梅君","らっくん","シンバ君"],"imgs":["img09"]},{"q":"昔の家族写真。後ろに並ぶ3人の娘の配置はどれ？","a":"左：映子　真ん中：博子　右：郁代","o":["左：映子　真ん中：博子　右：郁代","左：博子　真ん中：郁代　右：映子","左：郁代　真ん中：映子　右：博子"],"imgs":["img10"]},{"q":"緑のお洋服の赤ちゃんと、抱っこしている女の子は誰？","a":"赤ちゃん＝シンバ君　女の子＝結花ちゃん","o":["赤ちゃん＝シンバ君　女の子＝結花ちゃん","赤ちゃん＝梅君　女の子＝映子","赤ちゃん＝らっくん　女の子＝博子"],"imgs":["img11"]},{"q":"私はだーれ？ 🐶","a":"らっくん","o":["らっくん","梅君","シンバ君"],"imgs":["img12"]},{"q":"親子で日帰り旅行に行きました。どこに行ったでしょう？","a":"長瀞","o":["長瀞","川越","高尾山"],"imgs":["img13"]},{"q":"ここはどこでしょう？　ヒント：高校生の頃、よく通った場所です。","a":"飛鳥山公園","o":["飛鳥山公園","上野公園","見沼自然公園"],"imgs":["img14"]},{"q":"十界のうち、地獄界・餓鬼界・畜生界・〇〇界・人界・〇界・声聞界・縁覚界・菩薩界・仏界。抜けている二界は？","a":"修羅界・天界","o":["修羅界・天界","菩薩界・仏界","餓鬼界・人界"],"imgs":[]},{"q":"小春日和の日、映子とお父さんと3人で行ったこの場所は？","a":"見沼自然公園","o":["見沼自然公園","大宮公園","別所沼公園"],"imgs":["img15"]},{"q":"昭和49年10月3日生まれの子供は誰？","a":"進（息子）","o":["進（息子）","映子","博子"],"imgs":[]},{"q":"小学校時代、数ヶ月だけ山形の小学校に通っていました。その時の担任の先生は？","a":"加藤先生","o":["加藤先生","佐藤先生","高橋先生"],"imgs":[]},{"q":"戸田城聖先生が横浜・三ツ沢競技場で原水爆禁止宣言を発表したのは、昭和32年の何月何日？","a":"9月8日","o":["9月8日","7月16日","4月28日"],"imgs":[]},{"q":"日蓮大聖人クイズ。建長5年4月28日は何があった日？","a":"立宗宣言","o":["立宗宣言","立正安国論の提出","原水爆禁止宣言"],"imgs":[]},{"q":"日蓮大聖人が北条時頼に『立正安国論』を提出されたのは、文応元年の何月何日？","a":"7月16日","o":["7月16日","9月8日","4月28日"],"imgs":[]}];let order=[],i=0,ctx=null;const s=document.getElementById('s');
function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}
function tone(ok){try{let A=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(ok?650:240,t);o.frequency.exponentialRampToValueAtTime(ok?900:170,t+.15);g.gain.setValueAtTime(ok?.08:.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start();o.stop(t+.22)}catch(e){}}
function home(){s.innerHTML=`<div class="home"><div class="emoji">🎞️✨</div><h1>あの日、あの時クイズ</h1><p>20問は毎回完全シャッフル。<br>写真がある問題は、写真付き📸</p><button class="start" onclick="start()">20問スタート！</button></div>`}
async function start(){try{await motherImagesReady}catch(e){console.error(e);alert('写真の読み込みに失敗しました。通信を確認してもう一度押してね。');return}try{let A=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new A();ctx.resume()}catch(e){} order=sh([...Array(Q.length).keys()]);i=0;draw()}
function draw(){let q=Q[order[i]],o=sh(q.o),imgs=q.imgs.filter(Boolean);let photoHtml=imgs.length?`<div class="photos ${imgs.length>1?'two':''}">${imgs.map(x=>`<img class="pic" src="${MOTHER_IMGS[x]||x}">`).join('')}</div>`:'';s.innerHTML=`<div class="prog">第 ${i+1} 問 / 20</div>${photoHtml}<div class="q">${q.q}</div><div class="opts">${o.map((x,n)=>`<button class="opt" data-i="${n}">${x}</button>`).join('')}</div><div class="msg" id="m">さて、思い出せるかな？😊</div>`;document.querySelectorAll('.opt').forEach((b,n)=>b.onclick=()=>pick(o[n],b))}
function pick(v,b){let q=Q[order[i]];if(v===q.a){tone(true);show(q.a)}else{tone(false);b.disabled=true;b.classList.add('bad');document.getElementById('m').textContent='おしい😊 もう一回！'}}
function show(a){let d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="big">正解〜！！</div><div style="font-size:3rem">✨👏✨</div><div class="ans">${a}</div>`;document.body.appendChild(d);setTimeout(()=>{d.remove();i++;i<Q.length?draw():finish()},900)}
function finish(){s.innerHTML=`<div class="home"><div class="emoji">🎉✨</div><h1>20問クリア〜！</h1><p>次回は順番がまた全部変わります🤣</p><button class="start" onclick="start()">もう一回！</button></div>`}
home();
</script></body></html>
