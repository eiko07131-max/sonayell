oading.style.display='none'};img.onerror=()=>{loading.textContent='立ち上がり画像を表示できませんでした'};img.src='data:image/webp;base64,'+parts.join('')}catch(e){loading.textContent='立ち上がり画像を読み込めませんでした'}})();</script></body></html>
