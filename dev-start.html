<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3a"><title>そなYELL 開発版</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#dff2d7;color:#174d31}body{min-height:100svh;overflow:hidden}.screen{position:relative;margin:auto;width:min(100vw,500px);height:100svh;min-height:620px;overflow:hidden;background:linear-gradient(180deg,#bfe8d4 0%,#dff2cf 46%,#9dd077 100%);isolation:isolate}.sun{position:absolute;width:210px;height:210px;border-radius:50%;top:-90px;right:-80px;background:rgba(255,244,167,.65);filter:blur(2px)}.hill,.hill2{position:absolute;left:-15%;width:130%;border-radius:50% 50% 0 0}.hill{height:31%;bottom:-12%;background:#5da85d}.hill2{height:23%;bottom:-8%;left:-35%;background:#76bb68;transform:rotate(5deg)}.cloud{position:absolute;color:rgba(255,255,255,.75);font-size:55px;line-height:1}.c1{top:18%;left:2%}.c2{top:25%;right:1%;transform:scale(.7)}.brand{position:absolute;z-index:4;top:7.5%;left:5%;right:5%;text-align:center}.title{margin:0;color:#0d773d;font-size:clamp(42px,13vw,68px);font-weight:1000;letter-spacing:.015em;line-height:1;text-shadow:0 2px 0 rgba(255,255,255,.8)}.title .yell{color:#f1b900;text-shadow:0 2px 0 rgba(255,255,255,.9)}.tag{margin:14px auto 0;font-size:clamp(17px,4.8vw,24px);font-weight:900;line-height:1.55;color:#276641;text-shadow:0 1px 0 rgba(255,255,255,.8)}.sonaWrap{position:absolute;z-index:3;top:31%;left:50%;transform:translateX(-50%);width:min(47vw,225px);height:min(36vh,290px);display:flex;align-items:center;justify-content:center}.sona{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 7px 6px rgba(35,85,44,.18))}.buttons{position:absolute;z-index:5;left:9%;right:9%;bottom:max(4.5%,env(safe-area-inset-bottom));display:grid;gap:12px}.btn{width:100%;min-height:58px;border-radius:999px;font:900 clamp(17px,4.7vw,22px)/1 inherit;letter-spacing:.02em;box-shadow:0 5px 13px rgba(37,91,48,.18);cursor:pointer}.guest{background:#fff;color:#176b3a;border:2px solid #4f9d62}.register{background:#f6d75d;color:#315b2f;border:2px solid #d9b93e}.btn:active{transform:translateY(1px) scale(.995)}.note{text-align:center;font-size:12px;font-weight:700;color:#487454;margin-top:0}.loading{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#dff2d7;color:#276641;font-weight:900}.loading.hide{display:none}@media(max-height:680px){.brand{top:5%}.sonaWrap{top:28%;height:250px}.buttons{bottom:3%}.btn{min-height:52px}}</style></head><body><main class="screen" aria-label="そなYELL 立ち上がり画面"><div class="sun"></div><div class="cloud c1">☁</div><div class="cloud c2">☁</div><section class="brand"><h1 class="title">そな<span class="yell">YELL</span></h1><p class="tag">今日の一歩が、<br>未来の安心につながる。</p></section><div class="sonaWrap"><img id="sona" class="sona" alt="そなピー"></div><div class="hill"></div><div class="hill2"></div><section class="buttons"><button id="guestBtn" class="btn guest">ゲストではじめる</button><button id="registerBtn" class="btn register">登録してはじめる</button><div class="note">防災を、今日から少しずつ。🌱</div></section><div id="loading" class="loading">そなYELLを準備中…</div></main><script>const TRIAL_RESET_KEY='sonayell_trial_reset_v14';function prepareFreshTrial(){localStorage.setItem('sonayell_trial_mode','1');if(localStorage.getItem(TRIAL_RESET_KEY)==='1')return;localStorage.setItem('sonayell_v2',JSON.stringify({yell:0,completed:{},checks:{}}));localStorage.setItem(TRIAL_RESET_KEY,'1')}fetch('./assets/sonapi-official-b64.txt?v=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(b=>{const img=document.getElementById('sona');img.onload=()=>document.getElementById('loading').classList.add('hide');img.onerror=()=>document.getElementById('loading').textContent='そなピーの表示に失敗しました。';img.src='data:image/webp;base64,'+b.trim()}).catch(()=>document.getElementById('loading').textContent='そなピーを読み込めませんでした。');document.getElementById('guestBtn').onclick=()=>{prepareFreshTrial();localStorage.setItem('sonayell_trial_entry','guest');location.href='./enter.html?after_login=1&v=14'};document.getElementById('registerBtn').onclick=()=>{prepareFreshTrial();localStorage.setItem('sonayell_trial_entry','register');location.href='./login.html?from=trial&v=14'};</script></body></html>
