<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5f31"><title>そなYELL 開発版・立ち上がり画面</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#0b5f31;overflow:hidden}body{display:grid;place-items:center;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.poster{position:relative;width:min(100vw,66.6667vh);height:min(100vh,150vw);aspect-ratio:2/3;box-shadow:0 0 40px rgba(0,0,0,.22);background:#0b5f31;overflow:hidden;isolation:isolate}.posterImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;filter:contrast(1.08) saturate(1.03) brightness(1.01);transform:translateZ(0)}.poster::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(to bottom,rgba(255,255,255,.015),rgba(255,255,255,0) 30%,rgba(0,0,0,.015))}.crispTitle{position:absolute;z-index:2;top:11.8%;left:7%;right:7%;text-align:center;color:#fff;font-weight:900;font-size:clamp(31px,10vw,56px);letter-spacing:.02em;line-height:1;text-shadow:0 2px 2px rgba(0,0,0,.14),0 0 1px rgba(0,0,0,.22)}.crispTitle .yell{color:#ffd85c}.tagline{position:absolute;z-index:2;top:22.8%;left:8%;right:8%;text-align:center;color:#fff;font-size:clamp(15px,4.4vw,24px);font-weight:800;line-height:1.55;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.18)}.hotspot{position:absolute;left:17.5%;width:65%;border:0;cursor:pointer;border-radius:999px;outline:none;z-index:3;touch-action:manipulation;font-family:inherit;font-weight:900;font-size:clamp(16px,4.6vw,24px);letter-spacing:.02em;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}.hotspot:active{transform:translateY(1px) scale(.995)}.hotspot:focus-visible{outline:4px solid rgba(255,255,255,.95);outline-offset:3px}#guestBtn{top:79.1%;height:7.9%;background:#fff;color:#176b3a;border:2px solid rgba(255,255,255,.96)}#registerBtn{top:88.7%;height:7.2%;background:#f7d858;color:#315b2f;border:2px solid rgba(255,255,255,.5)}.loading{position:absolute;inset:0;z-index:4;background:#0b5f31;color:white;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;padding:24px}@media(max-aspect-ratio:2/3){.poster{width:100vw;height:150vw}}@media(min-aspect-ratio:2/3){.poster{height:100vh;width:66.6667vh}}</style></head><body><main class="poster" aria-label="そなYELL。今日の一歩が、未来の安心につながる。"><img class="posterImg" id="posterImg" alt="そなYELL 立ち上げ画面"><div class="crispTitle" aria-hidden="true">そな<span class="yell">YELL</span></div><div class="tagline" aria-hidden="true">今日の一歩が、<br>未来の安心につながる。</div><button class="hotspot" id="guestBtn" aria-label="ゲストではじめる">ゲストではじめる</button><button class="hotspot" id="registerBtn" aria-label="登録してはじめる">登録してはじめる</button><div class="loading" id="loading">そなYELL開発版を準備中…</div></main><script>
const TRIAL_RESET_KEY='sonayell_trial_reset_v14';
function prepareFreshTrial(){localStorage.setItem('sonayell_trial_mode','1');if(localStorage.getItem(TRIAL_RESET_KEY)==='1') return;localStorage.setItem('sonayell_v2',JSON.stringify({yell:0,completed:{},checks:{}}));localStorage.setItem(TRIAL_RESET_KEY,'1');}
(async()=>{const loading=document.getElementById('loading');try{const urls=['./assets/start-screen-b64-1.txt?v=2','./assets/start-screen-b64-2.txt?v=2','./assets/start-screen-b64-3.txt?v=2'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));return(await r.text()).trim()}));const img=document.getElementById('posterImg');img.onload=()=>{loading.style.display='none'};img.onerror=()=>{loading.textContent='合格画像の表示に失敗しました。'};img.src='data:image/webp;base64,'+parts.join('')}catch(e){loading.textContent='合格画像の読み込みに失敗しました。'}})();
document.getElementById('guestBtn').onclick=()=>{prepareFreshTrial();localStorage.setItem('sonayell_trial_entry','guest');location.href='./enter.html?after_login=1&v=14'};
document.getElementById('registerBtn').onclick=()=>{prepareFreshTrial();localStorage.setItem('sonayell_trial_entry','register');location.href='./login.html?from=trial&v=14'};
</script></body></html>
