<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b7b3e"><title>そなYELL 開発版</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9f7e7;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.app{width:min(100%,500px);height:100dvh;margin:auto;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 24px #0001}.frame{width:100%;height:100%;border:0;display:block;background:#fff}.bottom{position:absolute;left:0;right:0;bottom:0;height:72px;padding:6px 4px max(6px,env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid #d9e6d6;display:grid;grid-template-columns:repeat(5,1fr);z-index:50;box-shadow:0 -4px 14px #234d2e12}.bottom.hide{display:none}.nav{border:0;background:transparent;color:#657268;font-size:9px;font-weight:900;display:grid;place-items:center;align-content:center;gap:2px;border-radius:12px}.nav .ico{font-size:23px;line-height:1}.nav.on{color:#08743b;background:#edf8e9}.devmark{position:absolute;right:6px;top:6px;z-index:60;background:#164f31dd;color:#fff;font-size:8px;font-weight:900;border-radius:999px;padding:3px 6px;pointer-events:none}</style></head><body><main class="app"><iframe id="frame" class="frame" title="そなYELL開発版"></iframe><nav id="bottom" class="bottom hide" aria-label="共通ナビゲーション"><button class="nav" data-page="dev-home.html"><span class="ico">🏠</span><span>ホーム</span></button><button class="nav" data-page="posts.html"><span class="ico">📣</span><span>投稿</span></button><button class="nav" data-page="quiz-2026-08-v4.html"><span class="ico">🎓</span><span>クイズ</span></button><button class="nav" data-page="prepare-enhanced.html"><span class="ico">📋</span><span>備え</span></button><button class="nav" data-page="disaster-enhanced.html"><span class="ico">📘</span><span>防災</span></button></nav><div class="devmark">開発版</div></main><script>const f=document.getElementById('frame'),bottom=document.getElementById('bottom');const pages=['dev-home.html','posts.html','quiz-2026-08-v4.html','prepare-enhanced.html','disaster-enhanced.html','profile.html','dev-car-water.html'];function pageName(){try{return f.contentWindow.location.pathname.split('/').pop()||'dev-home.html'}catch(e){return''}}function openPage(p){f.src='./'+p+'?devshell=1&v=20260828'}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>openPage(b.dataset.page));function cleanText(root){const walker=root.createTreeWalker(root.body||root,NodeFilter.SHOW_TEXT);const arr=[];while(walker.nextNode())arr.push(walker.currentNode);for(const n of arr){let s=n.nodeValue;if(!s||!s.includes('YELL'))continue;s=s.replace(/最大10YELL獲得\s*🌿/g,'10問すべて達成 🌿').replace(/この問題はYELL獲得済み\s*🌿/g,'この問題は確認済み 🌿').replace(/解説を読んだ！\s*＋1\s*YELL\s*🌿/g,'解説を読んだ！ 🌿').replace(/＋1\s*YELL/g,'').replace(/YELL獲得済み/g,'確認済み');n.nodeValue=s}}function sanitize(){let d,w;try{d=f.contentDocument;w=f.contentWindow;if(!d||!d.body)return}catch(e){return}const p=pageName();if(p==='home-v30.html'||p==='home.html'||p==='home-v31.html'){openPage('dev-home.html');return}if(p==='tree.html'){openPage('dev-home.html');return}const isHome=p==='dev-home.html';bottom.classList.toggle('hide',isHome);f.style.height=isHome?'100%':'calc(100% - 72px)';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',p===b.dataset.page));d.querySelectorAll('.yell,[class*="yellCount"],#yellCount').forEach(x=>x.style.display='none');d.querySelectorAll('a,button').forEach(x=>{const href=x.getAttribute('href')||'',txt=(x.textContent||'').trim();if(href.includes('tree.html')||txt.includes('私のYELLの木'))x.style.display='none'});cleanText(d);try{const old=w.alert.bind(w);w.alert=(msg)=>old(String(msg).replace(/\s*＋1\s*YELL/g,'').replace(/YELL獲得/g,'達成'))}catch(e){}try{new MutationObserver(()=>cleanText(d)).observe(d.body,{subtree:true,childList:true,characterData:true})}catch(e){}}f.onload=()=>{sanitize();setTimeout(sanitize,250);setTimeout(sanitize,900)};const q=new URLSearchParams(location.search),start=q.get('page');openPage(start&&pages.includes(start)?start:'dev-home.html');</script></body></html>
