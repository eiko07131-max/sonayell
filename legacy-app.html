<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#4e9956"><title>そなYELL internal</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#36563b;background:#eef8e9}body{overflow-x:hidden}button{font:inherit;border:0;cursor:pointer}.screen{display:none;min-height:100vh}.screen.active{display:flex}.header{width:100%;padding:14px 17px;background:#fff;border-bottom:1px solid #dbe9d8;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}.headerLogo{font-size:22px;font-weight:bold;color:#3d8849}.yellBadge{background:#fff1a6;color:#755c20;border-radius:20px;padding:7px 12px;font-weight:bold;font-size:14px}.pageContent{width:100%;max-width:900px;margin:0 auto;padding:20px 18px 35px}.backButton{padding:9px 14px;margin-bottom:12px;border-radius:14px;background:#fff;color:#4b7651}#startScreen{display:none!important}#homeScreen{display:none!important}</style></head><body><section id="startScreen" class="screen"></section><section id="homeScreen" class="screen"></section><script>const KEY='sonayell_v2';let state=load();function load(){try{return Object.assign({yell:0,completed:{},checks:{}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {yell:0,completed:{},checks:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function update(){document.querySelectorAll('.yellCount').forEach(x=>x.textContent=state.yell||0)}function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');scrollTo(0,0);update()}function renderMyTree(){}window.showScreen=showScreen;window.update=update;window.save=save;</script></body></html>
