<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ead6">
<title>NINE PATCH</title>
<style>
:root{--paper:#faf7ef;--ink:#172028;--line:#26333a;--thin:#aeb6b8;--orange:#ef6b26;--soft:#edf1ef;--select:#dfeceb;--peer:#f2f5f3;--user:#315e60}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}body{min-height:100dvh;overflow-x:hidden}button{font:inherit;color:inherit}.screen{display:none;min-height:100dvh;width:100%}.screen.active{display:flex}
#launch{position:relative;align-items:center;justify-content:center;background:#eee3ca;overflow:hidden}.launch-art{display:block;width:100%;height:100dvh;object-fit:contain;object-position:center top}.start-btn{position:fixed;z-index:20;left:7vw;right:7vw;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));height:74px;border:0;border-radius:24px;background:var(--orange);color:#fff;font-size:clamp(28px,7vw,38px);font-weight:950;box-shadow:0 10px 0 #b94d1b;cursor:pointer}.start-btn:active{transform:translateY(5px);box-shadow:0 5px 0 #b94d1b}
.page{width:min(100%,720px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}.topline{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;margin-bottom:16px}.back,.gear{border:0;background:transparent;min-width:48px;min-height:48px;cursor:pointer}.back{font-size:46px;font-weight:800;line-height:1}.gear{font-size:30px}.brand{text-align:center;font-weight:950;font-size:clamp(29px,7vw,43px);letter-spacing:.03em}.subbrand{text-align:center;color:#657073;font-size:14px}.title{text-align:center;font-weight:950;font-size:clamp(28px,7vw,42px);margin:20px 0}.levels{display:grid;gap:14px}.level{border:2px solid #d8ddd9;border-radius:22px;background:#fff;padding:20px;text-align:left;box-shadow:0 5px 0 rgba(30,40,42,.08);cursor:pointer}.level strong{display:block;font-size:29px}.level span{display:block;margin-top:4px;font-size:17px;color:#536266}.level small{display:block;margin-top:7px;color:#986440;font-weight:800}.prototype{text-align:center;margin-top:24px;color:#7d6d5f;font-size:14px}
#game{align-items:flex-start;justify-content:center}.game-wrap{width:min(100%,720px);margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom))}.game-head{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;min-height:82px}.game-center{text-align:center}.diff{font-size:clamp(28px,7vw,40px);font-weight:950;line-height:1}.count{font-size:clamp(18px,5vw,27px);color:#687275;margin-top:8px}.timer{font-size:clamp(25px,6.5vw,38px);font-weight:950;justify-self:end;white-space:nowrap}.board-shell{display:flex;justify-content:center;width:100%;margin:4px auto 12px}.board{width:min(94vw,610px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:4px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;touch-action:manipulation}.cell{position:relative;border:0;border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,6vw,41px);font-weight:800;cursor:pointer;padding:0;min-width:0;min-height:0}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell.bR{border-right:4px solid var(--line)}.cell.bB{border-bottom:4px solid var(--line)}.cell.given{font-weight:950}.cell.user{color:var(--user)}.cell.peer{background:var(--peer)}.cell.same{background:#e7efec}.cell.selected{background:var(--select);outline:3px solid #6b9795;outline-offset:-3px;z-index:2}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(8px,2.2vw,14px);font-weight:750;color:#5e7777}.notes span{display:flex;align-items:center;justify-content:center}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:min(94vw,610px);margin:0 auto 6px}.tool{border:0;background:transparent;min-height:62px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:850;font-size:clamp(14px,4vw,21px);border-radius:12px;cursor:pointer}.tool .ico{font-size:clamp(25px,7vw,36px);line-height:1}.tool.active{background:#e4eeeb}.tool:disabled{opacity:.35}.status{min-height:24px;text-align:center;font-size:14px;color:#687675;font-weight:750;margin:0 auto 5px;width:min(94vw,610px)}.numpad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(94vw,610px);margin:0 auto}.num{border:0;border-radius:13px;background:var(--soft);min-width:0;height:clamp(54px,14vw,72px);font-size:clamp(23px,6vw,38px);font-weight:950;cursor:pointer}.num:active{transform:scale(.95);background:#d9e5e2}.modal{position:fixed;inset:0;background:rgba(12,18,20,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}.modal.open{display:flex}.card{width:min(92vw,520px);max-height:88dvh;overflow:auto;background:#fffdf7;border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.card h2{margin:0 0 14px;font-size:30px}.card p,.card li{font-size:17px;line-height:1.65}.close,.action{width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:18px;cursor:pointer}.close{background:var(--ink);color:#fff}.complete{text-align:center}.check{font-size:60px;color:#598d76}.complete h2{font-size:38px}.action{margin-top:10px}.primary{background:var(--orange);color:#fff}.secondary{background:#edf1ef}@media(max-height:740px){.game-head{min-height:68px}.board,.tools,.status,.numpad{width:min(88vw,500px)}.tool{min-height:52px}.num{height:52px}.game-wrap{padding-top:2px}}@media(max-width:360px){.game-wrap{padding-left:6px;padding-right:6px}.game-head{grid-template-columns:54px 1fr 80px}.board,.tools,.status,.numpad{width:96vw}.tools{gap:1px}.num{border-radius:9px}}
</style>
</head>
<body>
<section id="launch" class="screen active"><img class="launch-art" src="https://nine-patch-puzzle.eiko07131.chatgpt.site/assets/launch.png" alt="NINE PATCH"><button class="start-btn" id="startBtn">はじめる</button></section>
<section id="select" class="screen"><main class="page"><div class="topline"><span></span><div><div class="brand">NINE PATCH</div><div class="subbrand">1から9の数字パズル</div></div><button class="gear" id="settingsBtn">⚙</button></div><div class="title">難しさを選ぶ</div><div class="levels"><button class="level" data-level="easy"><strong>初級</strong><span>久しぶりでも気持ちよく解ける</span><small>全3問</small></button><button class="level" data-level="mid"><strong>中級</strong><span>メモを使ってじっくり</span><small>全3問</small></button><button class="level" data-level="hard"><strong>上級</strong><span>本気で考える</span><small>全3問</small></button></div><div class="prototype">試作版：遊びにくい所を遠慮なく教えてね</div></main></section>
<section id="game" class="screen"><main class="game-wrap"><div class="game-head"><button class="back" id="backBtn">‹</button><div class="game-center"><div class="diff" id="diffLabel">初級</div><div class="count" id="puzzleCount">1 / 3</div></div><div class="timer" id="timer">00:00</div></div><div class="board-shell"><div class="board" id="board"></div></div><div class="tools"><button class="tool" id="undoBtn"><span class="ico">↶</span><span>戻す</span></button><button class="tool" id="eraseBtn"><span class="ico">⌫</span><span>消す</span></button><button class="tool" id="memoBtn"><span class="ico">✎</span><span>メモ</span></button><button class="tool" id="hintBtn"><span class="ico">💡</span><span>ヒント</span></button></div><div class="status" id="status">マスを選んでから、数字を押してね</div><div class="numpad" id="numpad"></div></main></section>
<div class="modal" id="settingsModal"><div class="card"><h2>遊び方</h2><ol><li>横の一列に1〜9を1回ずつ。</li><li>縦の一列にも1〜9を1回ずつ。</li><li>太枠の3×3の中にも1〜9を1回ずつ。</li></ol><p><b>数字の入れ方：</b><br>入れたいマスを選ぶ → 下の数字を押す。</p><p>間違った数字も入れられます。自分で気づいて、消して、また修理できます。</p><button class="close" id="settingsClose">わかった！</button></div></div>
<div class="modal" id="completeModal"><div class="card complete"><div class="check">✓</div><div style="letter-spacing:.12em;font-weight:900">COMPLETE!</div><h2>完成！</h2><div id="completeTime" style="font-size:20px;font-weight:800"></div><button class="action primary" id="nextBtn">次の問題へ</button><button class="action secondary" id="chooseBtn">難しさを選ぶ</button></div></div>
<script>
const puzzles={easy:[['007060040406281700283904605000800026020000570074532980169020304702053190500149267','917365842456281739283974615395817426821496573674532981169728354742653198538149267'],['060480752200090030830701000300170960759006820086902473028017049003009007500030016','961483752274695138835721694342178965759346821186952473628517349413269587597834216'],['060020793000100000057030806010403200030896150000270008100009005928740630645300980','461528793389167542257934816816453279732896154594271368173689425928745631645312987']],mid:[['006300500075490008034080910000608403040753200800904700020049675097100000000000000','986371524175492368234586917752618493649753281813924756321849675497165832568237149'],['012050000084030009009060280095008036008072000340000820870000004921005060006000002','712859643684237519539164287295418736168372495347596821873621954921745368456983172'],['607095000000000006308004005079050100153000740000172009086010054090087000000000007','647895321925731486318624975279453168153968742864172539786319254492587613531246897']],hard:[['051800030409570001837600000025000000000010007000000600006030008002080000003256410','251849736469573821837621945325768194698412357174395682516934278942187563783256419'],['009004700000860000000201040203008500005400900091070000810002300902000001056000000','169354728524867139738291645273918564685423917491675283817542396942736851356189472'],['600000000050002001009840007000009506000080003100005020000000400000056810040017009','671593284458672931329841657783129546562784193194365728216938475937456812845217369']]};
const names={easy:'初級',mid:'中級',hard:'上級'};let level='easy',index=0,givens=[],values=[],notes=[],selected=-1,history=[],memo=false,startedAt=0,timerId=null,hintUsed=0;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function show(id){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo(0,0)}
$('#startBtn').onclick=()=>show('select');$('#settingsBtn').onclick=()=>$('#settingsModal').classList.add('open');$('#settingsClose').onclick=()=>$('#settingsModal').classList.remove('open');$('#settingsModal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')};$$('.level').forEach(b=>b.onclick=()=>{level=b.dataset.level;index=0;load()});$('#backBtn').onclick=()=>{stopTimer();show('select')};$('#chooseBtn').onclick=()=>{$('#completeModal').classList.remove('open');show('select')};$('#nextBtn').onclick=()=>{$('#completeModal').classList.remove('open');index=(index+1)%3;load()};
for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>input(n);$('#numpad').appendChild(b)}
function load(){stopTimer();const p=puzzles[level][index][0];givens=p.split('').map(Number);values=[...givens];notes=Array.from({length:81},()=>new Set());selected=-1;history=[];memo=false;hintUsed=0;$('#memoBtn').classList.remove('active');$('#diffLabel').textContent=names[level];$('#puzzleCount').textContent=`${index+1} / 3`;$('#status').textContent='マスを選んでから、数字を押してね';render();show('game');startedAt=Date.now();timerId=setInterval(updateTimer,250);updateTimer();updateTools()}
function render(){const b=$('#board');b.innerHTML='';for(let i=0;i<81;i++){const c=document.createElement('button');c.className='cell';c.dataset.i=i;if(i%9===2||i%9===5)c.classList.add('bR');if(Math.floor(i/9)===2||Math.floor(i/9)===5)c.classList.add('bB');if(givens[i])c.classList.add('given');else if(values[i])c.classList.add('user');if(values[i])c.textContent=values[i];else if(notes[i].size){const w=document.createElement('div');w.className='notes';for(let n=1;n<=9;n++){const s=document.createElement('span');if(notes[i].has(n))s.textContent=n;w.appendChild(s)}c.appendChild(w)}c.onclick=()=>select(i);b.appendChild(c)}paint()}
function select(i){selected=i;paint();$('#status').textContent=givens[i]?'この数字は最初から入っている数字です':'数字を選んでね';updateTools()}
function paint(){$$('#board .cell').forEach(c=>c.classList.remove('selected','peer','same'));if(selected<0)return;const sr=Math.floor(selected/9),sc=selected%9,sv=values[selected];$$('#board .cell').forEach((c,i)=>{const r=Math.floor(i/9),co=i%9;if(r===sr||co===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(co/3)===Math.floor(sc/3)))c.classList.add('peer');if(sv&&values[i]===sv)c.classList.add('same')});const el=$(`#board .cell[data-i="${selected}"]`);if(el)el.classList.add('selected')}
function snap(i){return{i,value:values[i],notes:[...notes[i]]}}
function input(n){if(selected<0){$('#status').textContent='先に入れたいマスを選んでね';return}if(givens[selected]){$('#status').textContent='最初から入っている数字は変えられません';return}history.push(snap(selected));if(memo){if(values[selected])values[selected]=0;notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n)}else{values[selected]=n;notes[selected].clear()}render();updateTools();$('#status').textContent=memo?'メモを入れました':'入力しました';check()}
function erase(){if(selected<0){$('#status').textContent='消したいマスを選んでね';return}if(givens[selected]){$('#status').textContent='最初から入っている数字は消せません';return}if(!values[selected]&&!notes[selected].size){$('#status').textContent='このマスは空です';return}history.push(snap(selected));values[selected]=0;notes[selected].clear();render();updateTools();$('#status').textContent='消しました'}
function undo(){const h=history.pop();if(!h)return;values[h.i]=h.value;notes[h.i]=new Set(h.notes);selected=h.i;render();updateTools();$('#status').textContent='ひとつ戻しました'}
function hint(){const sol=puzzles[level][index][1].split('').map(Number);const cand=[];for(let i=0;i<81;i++)if(!givens[i]&&values[i]!==sol[i])cand.push(i);if(!cand.length)return;const i=selected>=0&&cand.includes(selected)?selected:cand[Math.floor(Math.random()*cand.length)];history.push(snap(i));values[i]=sol[i];notes[i].clear();selected=i;hintUsed++;render();updateTools();$('#status').textContent='ヒントで1マス修理しました';check()}
function check(){if(values.some(v=>!v))return;const ok=values.join('')===puzzles[level][index][1];if(ok){stopTimer();const sec=Math.floor((Date.now()-startedAt)/1000);$('#completeTime').textContent=`${fmt(sec)}${hintUsed?` ・ ヒント ${hintUsed}回`:''}`;$('#completeModal').classList.add('open')}else{$('#status').textContent='まだ修理が終わっていないみたい。もう一度見てみよう'}}
function updateTools(){$('#undoBtn').disabled=!history.length;$('#eraseBtn').disabled=selected<0||!!givens[selected]||(!values[selected]&&!notes[selected].size)}
$('#undoBtn').onclick=undo;$('#eraseBtn').onclick=erase;$('#memoBtn').onclick=()=>{memo=!memo;$('#memoBtn').classList.toggle('active',memo);$('#status').textContent=memo?'メモON：候補の数字を入れられます':'メモOFF：数字を入れます'};$('#hintBtn').onclick=hint;
function fmt(sec){return`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function updateTimer(){if(startedAt)$('#timer').textContent=fmt(Math.floor((Date.now()-startedAt)/1000))}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
</script>
</body>
</html>
